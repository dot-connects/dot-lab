name = "dot-lab-travel-book"
main = "src/index.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# 「여행 책자」 AI relay: 512 px previews + local times + place names + notes -> Claude -> picks, captions, essay.
# Nothing is stored; logs carry status and token counts only.
# Secrets: ANTHROPIC_API_KEY (none = 503 off), APP_TOKEN (the app's x-app-token; none = every call 401).
[vars]
MODEL = "claude-sonnet-5-5"
# month ceiling in cents ("0" = AI off), books a day for everyone
MONTH_CENTS = "1000"
DAY_BOOKS = "20"

[[d1_databases]]
binding = "DB"
database_name = "dot-lab-travel-book"
database_id = "TO-BE-CREATED"

# 4 requests a minute per IP
[[ratelimits]]
name = "LIMIT"
namespace_id = "2613"
simple = { limit = 4, period = 60 }
