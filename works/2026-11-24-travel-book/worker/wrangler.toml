name = "dot-lab-travel-book"
main = "src/index.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# 「여행 책자」 AI relay: 512 px previews + local times + place names + notes -> GPT -> picks, captions, essay.
# Nothing is stored; logs carry status and token counts only.
# Secrets: OPENAI_KEY (none = 503 off), APP_TOKEN (the app's x-app-token; none = every call 401).
[vars]
MODEL = "gpt-5.4"
# month ceiling in cents ("0" = AI off), books a day for everyone
MONTH_CENTS = "1000"
DAY_BOOKS = "20"
WRITE_DAY = "60"
REWRITE_DAY = "200"

[[d1_databases]]
binding = "DB"
database_name = "dot-lab-travel-book"
database_id = "33bf654f-96be-4d9a-9a30-854daaacab6d"

# 4 requests a minute per IP
[[ratelimits]]
name = "LIMIT"
namespace_id = "2613"
simple = { limit = 4, period = 60 }

# theme guides for /layout (src/themes/*.md) are imported as strings
[[rules]]
type = "Text"
globs = ["**/*.md"]
fallthrough = true
