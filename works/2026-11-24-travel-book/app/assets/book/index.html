<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>여행 책자</title>
<style>
@font-face{font-family:"Pretendard";font-weight:45 920;src:url(fonts/PretendardVariable.ttf)}
@font-face{font-family:"Inter Tight";font-weight:100 900;src:url(fonts/InterTightwght.ttf)}
@font-face{font-family:"Instrument Serif";font-style:normal;src:url(fonts/InstrumentSerif-Regular.ttf)}
@font-face{font-family:"Instrument Serif";font-style:italic;src:url(fonts/InstrumentSerif-Italic.ttf)}
@font-face{font-family:"SUIT";font-weight:400;src:url(fonts/SUIT-Regular.woff2)}
@font-face{font-family:"SUIT";font-weight:500;src:url(fonts/SUIT-Medium.woff2)}
@font-face{font-family:"SUIT";font-weight:700;src:url(fonts/SUIT-Bold.woff2)}
@font-face{font-family:"SUIT";font-weight:800;src:url(fonts/SUIT-ExtraBold.woff2)}
@font-face{font-family:"Spoqa Han Sans Neo";font-weight:400;src:url(fonts/SpoqaHanSansNeo-Regular.woff2)}
@font-face{font-family:"Spoqa Han Sans Neo";font-weight:500;src:url(fonts/SpoqaHanSansNeo-Medium.woff2)}
@font-face{font-family:"Spoqa Han Sans Neo";font-weight:700;src:url(fonts/SpoqaHanSansNeo-Bold.woff2)}
/* every font here is cut to KS X 1001 hangul + Latin (tools: scratch shrinkfonts.py); a rarer syllable falls back to the system font
   다듬기 fonts: the handwriting ones run small, size-adjust brings them to the others' size */
@font-face{font-family:"Gowun Batang";font-weight:400;src:url(fonts/GowunBatang-Regular.woff2)}
@font-face{font-family:"Gowun Batang";font-weight:700;src:url(fonts/GowunBatang-Bold.woff2)}
@font-face{font-family:"Gaegu";font-weight:400;src:url(fonts/Gaegu-Regular.woff2);size-adjust:112%}
@font-face{font-family:"Nanum Pen Script";src:url(fonts/NanumPenScript-Regular.woff2);size-adjust:128%}
@font-face{font-family:"Gowun Dodum";src:url(fonts/GowunDodum-Regular.woff2)}
@font-face{font-family:"Hahmlet";font-weight:100 900;src:url(fonts/Hahmlet.woff2)}
@font-face{font-family:"Do Hyeon";src:url(fonts/DoHyeon-Regular.woff2)}
html,body{margin:0;height:100%;background:#1b1b1b;overscroll-behavior:none}
/* the book: one page per screen width, horizontal snap */
#book{display:flex;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
#book::-webkit-scrollbar{display:none}
.sheet{flex:0 0 100%;height:100%;display:flex;align-items:center;justify-content:center;scroll-snap-align:center}
/* page box: --ratio = height / width (phone 4/3, A5 1.414, square 1); fits the screen on both axes */
.pg{--ratio:1.3333;position:relative;overflow:hidden;width:min(100vw - 24px,(100vh - 24px) / var(--ratio));aspect-ratio:1/var(--ratio)}
.pg img{display:block;width:100%;height:100%;object-fit:cover}
.pg video{display:block;width:100%;height:100%;object-fit:cover}
.pg [data-text]:empty{visibility:hidden} /* keeps its box: grid auto-placement under the photos must not shift */
/* spread: two pages per screen, a soft fold between them */
body.spread .sheet.two{gap:0}
body.spread .sheet.two .pg{width:min((100vw - 32px) / 2,(100vh - 24px) / var(--ratio))}
body.spread .pg.left{box-shadow:inset -14px 0 18px -14px rgba(0,0,0,.28)}
body.spread .pg.right{box-shadow:inset 14px 0 18px -14px rgba(0,0,0,.22)}
body.spread .pg.blank{background:#ece6dc}
/* 다듬기: words typed in place, the selected photo outlined (drag moves what shows) */
.pg .editing{outline:1.5px dashed currentColor;outline-offset:3px;caret-color:currentColor;-webkit-user-select:text;user-select:text}
.pg .editing:focus{outline-style:solid}
.pg .selslot{touch-action:none;cursor:grab}
body.photoedit .pg [data-slot]{touch-action:none}
.pg .selslot::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 3px #fff,inset 0 0 0 6px #2f5bff;pointer-events:none;z-index:2}
.pg img.selslot{outline:4px solid #2f5bff;outline-offset:-4px}
/* 네 컷 (every theme): a photo-booth strip on the page's paper; a 3-photo series leaves the 4th cell as the booth's blank */
.pg.fourcut{display:flex;align-items:center;justify-content:center;background:var(--paper,#f4f1ea)}
.pg.fourcut .strip{position:relative;height:90%;aspect-ratio:1/3.05;background:#141414;padding:3.2% 3.2% 0;display:flex;flex-direction:column;gap:2.2%;transform:rotate(-1.6deg);box-shadow:0 1.2cqw 3cqw rgba(0,0,0,.28)}
/* themes place .ph / p absolutely: the strip resets that for its own cells */
.pg.fourcut .strip .ph{position:relative!important;inset:auto!important;left:auto!important;top:auto!important;right:auto!important;bottom:auto!important;width:auto!important;height:auto!important;margin:0!important;flex:1 1 0;min-height:0;overflow:hidden;background:#2a2a2a;border:0!important;box-shadow:none!important;transform:none!important;padding:0!important}
.pg.fourcut .strip .ph img{display:block;position:static!important;width:100%!important;height:100%!important;object-fit:cover}
.pg.fourcut .ph:has(img:not([src])),.pg.fourcut .ph:has(img[src=""]){background:#2a2a2a}
.pg.fourcut .strip .fc-cap{position:static!important;margin:0!important;flex:0 0 9%;display:flex;align-items:center;justify-content:center;color:#f2efe8;font:600 3.2cqw/1 var(--f,"Pretendard",sans-serif);letter-spacing:.08em}
/* 다닌 길 (every theme): the trip's line and numbered stops, no map tiles */
.pg.route{display:flex;flex-direction:column;background:var(--paper,#f4f1ea);color:var(--ink,#2b2621);padding:9cqw 8cqw 8cqw;box-sizing:border-box}
.pg.route .rt-title{position:static!important;margin:0 0 2cqw;font:700 6cqw/1.2 var(--f,"Pretendard",sans-serif)}
.pg.route svg{flex:1;width:100%;min-height:0;overflow:visible}
.pg.route .rt-cap{position:static!important;margin:2cqw 0 0;font:400 3.4cqw/1.5 var(--f,"Pretendard",sans-serif);opacity:.75}
/* export mode: one page fills the viewport exactly */
body.export #book{overflow:hidden}
body.export .sheet{flex-basis:100vw}
body.export .pg{width:100vw}
</style>
<link id="theme" rel="stylesheet">
</head>
<body>
<div id="book"></div>
<div id="tpl" hidden></div>
<script src="book.js"></script>
</body>
</html>
