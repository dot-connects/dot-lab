<!-- theme photo layouts (mockups/r5/photo.html): data-slot = photo index in PageSpec.ids. No text on inside pages. -->

<template id="photo/c1"><div class="pg c1">
  <div class="g full"><div><img data-slot="0" data-crop="62% 50%" alt=""></div></div>
  <div class="scrim"></div>
  <h3 class="ttl big" data-text="title"></h3>
  <p class="sub" data-text="period"></p>
</div></template>

<template id="photo/c3"><div class="pg c3">
  <h3 class="ttl big" data-text="title"></h3>
  <p class="sub" data-text="period"></p>
  <div class="g full"><div><img data-slot="0" alt=""></div></div>
</div></template>
