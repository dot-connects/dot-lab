<!-- theme diary 「일기」 r11d. Text on the top line 12cqw, margins 10.5; photos bleed or sit on the margin lines. -->

<template id="diary/c-window"><div class="pg c-window"><div class="ph"><img data-slot="0" alt=""></div><h3 class="ttl" data-text="title"></h3><p class="cp sub" data-text="period"></p></div></template>

<template id="diary/c-paper"><div class="pg c-paper"><h3 class="ttl" data-text="title"></h3><p class="cp sub" data-text="period"></p><div class="ph"><img data-slot="0" alt=""></div></div></template>

<template id="diary/c-over"><div class="pg c-over"><div class="ph"><img data-slot="0" alt=""></div><div class="shade"></div><h3 class="ttl on" data-text="title"></h3><p class="sub on" data-text="period"></p></div></template>

<template id="diary/op-photo"><div class="pg op-photo fo"><h3 class="hd" data-text="date"></h3><p class="pl" data-text="place"></p><div class="ph"><img data-slot="0" alt=""></div><p class="bd" data-text="body"></p></div></template>

<template id="diary/op-text"><div class="pg op-text"><h3 class="hd" data-text="date"></h3><p class="pl" data-text="place"></p><p class="bd" data-text="body"></p><div class="ph"><img data-slot="0" alt=""></div></div></template>

<template id="diary/op-bleed"><div class="pg op-bleed"><div class="ph"><img data-slot="0" alt=""></div><div class="shade"></div><h3 class="hd on" data-text="date"></h3><p class="pl on" data-text="place"></p></div></template>

<template id="diary/text"><div class="pg text fo"><p class="bd" data-text="body"></p></div></template>

<template id="diary/text-photo"><div class="pg text-photo"><p class="bd" data-text="body"></p><div class="ph"><img data-slot="0" alt=""></div></div></template>

<template id="diary/photo-text"><div class="pg photo-text fo"><div class="ph"><img data-slot="0" alt=""></div><p class="bd" data-text="body"></p></div></template>

<template id="diary/plate"><div class="pg plate fo"><div class="ph"><img data-slot="0" alt=""></div><p class="cp" data-text="cap"></p></div></template>

<template id="diary/bleed"><div class="pg bleed"><div class="ph"><img data-slot="0" alt=""></div></div></template>

<template id="diary/side"><div class="pg side fo"><div class="ph"><img data-slot="0" alt=""></div><p class="cp" data-text="cap"></p></div></template>

<template id="diary/stack"><div class="pg stack fo"><div class="ph p0"><img data-slot="0" alt=""></div><div class="ph p1"><img data-slot="1" alt=""></div><p class="cp" data-text="cap"></p></div></template>

<template id="diary/pair"><div class="pg pair fo"><div class="ph p0"><img data-slot="0" alt=""></div><div class="ph p1"><img data-slot="1" alt=""></div><p class="bd" data-text="body"></p></div></template>

<template id="diary/quote"><div class="pg quote"><p class="ln" data-text="line"></p><div class="ph"><img data-slot="0" alt=""></div></div></template>

<template id="diary/lead3"><div class="pg lead3 fo"><div class="ph p0"><img data-slot="0" alt=""></div><div class="ph s p1"><img data-slot="1" alt=""></div><div class="ph s p2"><img data-slot="2" alt=""></div><p class="bd" data-text="body"></p></div></template>

<template id="diary/strip3"><div class="pg strip3 fo"><div class="ph p0"><img data-slot="0" alt=""></div><div class="ph p1"><img data-slot="1" alt=""></div><div class="ph p2"><img data-slot="2" alt=""></div><p class="bd" data-text="body"></p></div></template>

<template id="diary/grid4"><div class="pg grid4 fo"><div class="ph p0"><img data-slot="0" alt=""></div><div class="ph p1"><img data-slot="1" alt=""></div><div class="ph p2"><img data-slot="2" alt=""></div><div class="ph p3"><img data-slot="3" alt=""></div><p class="bd" data-text="body"></p></div></template>

<template id="diary/memo"><div class="pg memo fo"><div class="ph"><img data-slot="0" alt=""></div><p class="cp" data-text="cap"></p><p class="bd" data-text="body"></p></div></template>

<template id="diary/notes"><div class="pg notes fo"><div class="ph"><img data-slot="0" alt=""></div><p class="lw w1" data-text="w1"></p><p class="bd b1" data-text="b1"></p><p class="lw w2" data-text="w2"></p><p class="bd b2" data-text="b2"></p></div></template>

<template id="diary/end"><div class="pg end"><p class="bd" data-text="last"></p><i class="rule"></i><p class="colt" data-text="coltitle"></p><p class="cp col" data-text="colophon"></p></div></template>

<template id="diary/vd"><div class="pg"><img data-slot="0" data-frame="0" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover"></div></template>

<template id="diary/fourcut"><div class="pg fourcut"><div class="strip"><div class="ph"><img data-slot="0" alt=""></div><div class="ph"><img data-slot="1" alt=""></div><div class="ph"><img data-slot="2" alt=""></div><div class="ph"><img data-slot="3" alt=""></div><p class="fc-cap" data-text="cap"></p></div></div></template>

<template id="diary/route"><div class="pg route"><p class="rt-title" data-text="title"></p><svg data-route viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet"></svg><p class="rt-cap" data-text="cap"></p></div></template>
