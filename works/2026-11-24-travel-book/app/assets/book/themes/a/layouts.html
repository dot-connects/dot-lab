<!-- theme a layouts: one mockup page (mockups/r5/a.html) = one template. data-slot = photo index in PageSpec.ids,
     data-crop on the img = default object-position, data-text = PageSpec.text key. Empty text keys hide their node. -->
<template id="a/c1"><div class="pg c1">
  <div class="ph full sh-t"><img data-slot="0" data-crop="66% 50%" alt=""></div>
  <p class="tx lb w a" data-text="period"></p>
  <p class="tx sm w b" data-text="nights"></p>
  <h3 class="tx big w t" data-text="title_latin"></h3>
</div></template>

<template id="a/c2"><div class="pg c2">
  <p class="tx lb a" data-text="period"></p>
  <p class="tx sm b" data-text="nights"></p>
  <h3 class="tx t" data-text="title"></h3>
  <div class="ph sh-b"><img data-slot="0" data-crop="50% 36%" alt=""></div>
  <p class="tx lb w c" data-text="tag"></p>
</div></template>

<template id="a/c3"><div class="pg c3">
  <div class="ph full"><img data-slot="0" alt=""></div>
  <h3 class="tx big thin w t1" data-text="first_day"></h3>
  <p class="tx sm w a" data-text="running"></p>
  <p class="tx lb w b" data-text="year"></p>
  <h3 class="tx big thin w t2" data-text="last_day"></h3>
</div></template>

<template id="a/op"><div class="pg op">
  <div class="ph full sh-b"><img data-slot="0" data-crop="42% 40%" alt=""></div>
  <p class="tx d r w"><span class="cp" data-text="day_name"></span>&ensp;<span class="sm" data-text="date"></span><br><span class="lb" data-text="time0"></span>&ensp;<span class="sm" data-text="place0"></span></p>
  <p class="tx big thin w n" data-text="day_no"></p>
  <p class="tx fo w"><span class="lb" data-text="folio"></span><span class="sm" data-text="running"></span></p>
</div></template>

<template id="a/sz"><div class="pg sz">
  <div class="ph p1 sh-b"><img data-slot="0" alt=""></div>
  <div class="ph p2"><img data-slot="1" data-crop="50% 70%" alt=""></div>
  <div class="tx cap stk c"><span class="lb" data-text="time0"></span><span class="cp" data-text="place0"></span><span class="cp sf" data-text="caption0"></span></div>
  <p class="tx fo w"><span class="lb" data-text="folio"></span><span class="sm" data-text="running"></span></p>
</div></template>

<template id="a/rd"><div class="pg rd">
  <div class="ph full sh-b"><img data-slot="0" alt=""></div>
  <p class="tx cap cb w"><span class="lb" data-text="time0"></span><span class="cp" data-text="place0"></span><span class="cp n sf" data-text="caption0"></span></p>
  <p class="tx fo w"><span class="lb" data-text="folio"></span><span class="sm" data-text="running"></span></p>
</div></template>

<template id="a/vd"><div class="pg vd">
  <div class="ph v1"><img data-slot="0" data-frame="0" data-crop="50% 30%" alt=""><div class="play"><span></span></div></div>
  <div class="ph v2"><img data-slot="0" data-frame="1" alt=""></div>
  <div class="ph v3"><img data-slot="0" data-frame="2" alt=""></div>
  <p class="tx cap c"><span class="lb" data-text="time0"></span><span class="cp" data-text="place0"></span><span class="cp n" data-text="dur"></span></p>
  <p class="tx fo"><span class="lb" data-text="folio"></span><span class="sm" data-text="running"></span></p>
</div></template>

<template id="a/dl"><div class="pg dl">

  <p class="tx cap c"><span class="lb" data-text="time0"></span><span class="cp" data-text="place0"></span><span class="cp n sf" data-text="caption0"></span></p>
  <p class="tx fo"><span class="lb" data-text="folio"></span><span class="sm" data-text="running"></span></p>
</div></template>

<template id="a/st"><div class="pg st">
  <div class="ph p1"><img data-slot="0" alt=""></div>
  <div class="ph p2"><img data-slot="1" alt=""></div>
  <p class="tx cap c1"><span class="lb" data-text="time0"></span><span class="cp" data-text="place0"></span><span class="cp n sf" data-text="caption0"></span></p>
  <p class="tx cap c2"><span class="lb" data-text="time1"></span><span class="cp" data-text="place1"></span></p>

<template id="a/pn"><div class="pg pn">

  <div class="ph s sa"><img data-slot="1" alt=""></div>

  <p class="tx fo"><span class="lb" data-text="folio"></span><span class="sm" data-text="running"></span></p>

<template id="a/en"><div class="pg en">
  <div class="ph"><img data-slot="0" data-crop="50% 58%" alt=""></div>
  <div class="tx s"><p class="cp">간 곳</p><span class="sm sf" data-text="n_photos"></span><span class="sm sf" data-text="n_videos"></span><span class="sm sf" data-text="n_places"></span><span class="sm sf" data-text="km"></span></div>
  <div class="tx ix" data-index></div>
  <p class="tx cp e" data-text="last_line"></p>
  <p class="tx fo"><span class="lb" data-text="folio"></span><span class="sm" data-text="running"></span></p>
</div></template>
