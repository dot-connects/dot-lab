<title>여행 책자 테마 시안</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;600;800&display=swap">
<!--FONTS-->
<style>
/* Shell: page chrome only. Each theme fragment styles its own pages under .t-<key>. */
:root{--bg:#eef0f2;--fg:#1c2126;--muted:#5d6670;--line:#d3d8dd;--chip:#ffffff;--f-ui:"Gothic A1",system-ui,sans-serif}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#16191c;--fg:#e8ebee;--muted:#9aa4ae;--line:#2d3339;--chip:#21262b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#16191c;--fg:#e8ebee;--muted:#9aa4ae;--line:#2d3339;--chip:#21262b;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:44px}
.top h1{font-size:22px;margin:0 0 6px;font-weight:800;text-wrap:balance}
.top p{margin:0;color:var(--muted);font-size:13px;line-height:1.6}
.toc{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.toc a{font:600 12px var(--f-ui);color:var(--fg);text-decoration:none;border:1px solid var(--line);background:var(--chip);border-radius:999px;padding:6px 11px}
section>.head{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:start}
section>.head h2{font:800 19px var(--f-ui);margin:0;color:var(--fg)}
section>.head .idea{grid-column:1;margin:0;color:var(--muted);font:400 13px/1.5 var(--f-ui)}
section>.head .shuffle{grid-column:2;grid-row:1/3;font:600 12px var(--f-ui);background:var(--chip);color:var(--fg);border:1px solid var(--line);border-radius:999px;padding:7px 12px;cursor:pointer}
section>.head .shuffle:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
section>.sub{font:700 13px var(--f-ui);color:var(--muted);margin:18px 0 0;letter-spacing:.02em}
.strip{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:12px 2px 10px}
.pg{flex:0 0 min(80vw,330px);aspect-ratio:3/4;max-width:100%;scroll-snap-align:center;position:relative;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.12),0 8px 24px rgba(0,0,0,.10);border-radius:3px}
.pg img{display:block;width:100%;height:100%;object-fit:cover}
.under{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font:400 12px/1.5 var(--f-ui)}
.under span:last-child{white-space:nowrap}
.play{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.play span{width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.9);display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.play span::before{content:"";border-left:15px solid #222;border-top:9px solid transparent;border-bottom:9px solid transparent;margin-left:4px}
section>.notes{margin-top:12px;border:1px solid var(--line);background:var(--chip);border-radius:10px;padding:10px 14px}
section>.notes summary{font:700 13px var(--f-ui);cursor:pointer;color:var(--fg)}
section>.notes ul{margin:8px 0 2px;padding-left:18px;color:var(--fg);font:400 12.5px/1.7 var(--f-ui)}
.credit{font:400 11px/1.6 var(--f-ui);color:var(--muted)}
</style>
<div class="wrap">
<div class="top">
  <h1>여행 책자 · 테마 시안 5차</h1>
  <p>"아재 같다"는 말에 요즘 독립출판 진·포토북 레퍼런스 68장을 모아 여섯 테마를 처음부터 다시 그렸어요. 테마마다 <b>표지 후보 3개</b>와 <b>책 본문</b>을 옆으로 넘겨 보세요.<br>여행은 예시(제주 2026.06.12–14).</p>
  <!--TOC-->
</div>
<!--SECTIONS-->
<p class="credit">임시 사진: Unsplash (Unsplash License) 30장 — 실제 앱에서는 내 폰 사진이 들어갑니다. 사진 색은 테마별 "사진 톤 맞추기" 보정을 켠 모습. 지도는 제주 해안선 단순화, 날씨는 예시.</p>
</div>
<script>
document.querySelectorAll("section[data-palettes]").forEach(sec=>{
  let pals=[];try{pals=JSON.parse(sec.dataset.palettes)}catch(e){}
  let i=0;const b=sec.querySelector(".shuffle");if(!b||!pals.length)return;
  b.addEventListener("click",()=>{i=(i+1)%pals.length;for(const[k,v]of Object.entries(pals[i]))sec.style.setProperty(k,v)});
});
</script>
