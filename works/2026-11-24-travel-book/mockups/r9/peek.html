<!-- Picker peek demo: the new-book theme row; tapping a cover opens a sheet that flips through that theme's sample pages.
     It clones the pages from the theme sections below, so the peek always shows the same pages as the full mockup. -->
<style>
.peek{border:1px solid var(--line);background:var(--chip);border-radius:16px;padding:14px 12px 12px}
.peek h2{font:800 17px var(--f-ui);margin:0 0 4px}
.peek>p{margin:0 0 10px;color:var(--muted);font:400 12.5px/1.5 var(--f-ui)}
.pk-row{display:flex;gap:12px;overflow-x:auto;padding:8px 4px 6px}
.pk-t{flex:0 0 auto;display:grid;justify-items:center;gap:5px;background:none;border:0;padding:0;cursor:pointer;color:var(--fg);font:700 11.5px var(--f-ui)}
.pk-c{width:58px;height:77px;border-radius:2px;overflow:hidden;position:relative;box-shadow:0 0 0 1px #d8cdbc,2px 3px 8px rgba(70,45,20,.18)}
.pk-t[aria-pressed=true] .pk-c{box-shadow:0 0 0 2px var(--chip),0 0 0 4px var(--fg)}
.pk-c>div{position:absolute;left:0;top:0;transform-origin:0 0}
.pk-c .pg{box-shadow:none;border-radius:0}
.pk-sheet{margin-top:10px;border-top:1px solid var(--line);padding-top:10px;display:none}
.pk-sheet.on{display:block}
.pk-sheet .pk-h{display:flex;justify-content:space-between;align-items:baseline;font:700 13px var(--f-ui)}
.pk-sheet .pk-h span{font:400 12px var(--f-ui);color:var(--muted)}
.pk-strip{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:10px 2px 6px}
.pk-strip>div{flex:0 0 auto;scroll-snap-align:center}
.pk-strip .pg{flex:none;width:220px;max-width:none}
.pk-go{width:100%;margin-top:8px;border:0;border-radius:999px;background:var(--fg);color:var(--bg);font:700 13px var(--f-ui);padding:12px;cursor:pointer}
</style>
<section class="peek" id="peek">
<h2>테마 고를 때 살짝 보기</h2>
<p>새 책 3단계 테마 줄을 흉내 냈어요. 표지를 누르면 그 테마로 만든 책을 아래에서 바로 넘겨 볼 수 있어요(앱에서는 아래에서 올라오는 시트).</p>
<div class="pk-row" role="group" aria-label="테마"></div>
<div class="pk-sheet"><div class="pk-h"><b></b><span>옆으로 넘겨 보기</span></div><div class="pk-strip"></div><button class="pk-go" type="button">이 테마로 만들기</button></div>
</section>
<script>
addEventListener("load",()=>{
  const peek=document.getElementById("peek"),row=peek.querySelector(".pk-row"),sheet=peek.querySelector(".pk-sheet"),strip=peek.querySelector(".pk-strip");
  const secs=[...document.querySelectorAll("section[class^='t-']")];
  const wrap=(sec,pg,w)=>{ // keep the theme scope class + palette vars so the clone renders like the original
    const s=document.createElement("div");s.className=sec.className;s.style.cssText=sec.style.cssText;
    const c=pg.cloneNode(true);c.style.width=w+"px";c.style.flex="none";s.append(c);return s};
  secs.forEach((sec,i)=>{
    const name=sec.querySelector(".head h2")?.textContent||"";
    const strips=sec.querySelectorAll(".strip");if(strips.length<2)return;
    const cover=strips[0].querySelector(".pg"),pages=[...strips[1].querySelectorAll(".pg")];
    const b=document.createElement("button");b.className="pk-t";b.type="button";b.setAttribute("aria-pressed","false");
    const box=document.createElement("div");box.className="pk-c";const inner=wrap(sec,cover,300);inner.style.transform="scale("+(58/300)+")";box.append(inner);
    b.append(box,name);row.append(b);
    b.onclick=()=>{
      row.querySelectorAll(".pk-t").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));
      sheet.querySelector(".pk-h b").textContent=name+" · 표지 + 본문 "+pages.length+"쪽";
      strip.replaceChildren(wrap(sec,cover,220),...pages.map(p=>wrap(sec,p,220)));strip.scrollLeft=0;
      sheet.classList.add("on");
    };
  });
});
</script>
