<h1 style="font-size:20px;margin:0 0 8px">여행 한 권 — 11차 b: 디자이너 틀 + AI 편집</h1>
<p style="margin:0 0 8px">테마마다 디자이너가 만든 쪽 틀(23~25개)을 AI 에게 주고, AI 는 사진 30장·메모를 보고
<b>순서 · 쪽마다 틀 고르기 · 칸에 사진 넣기 · 글</b>만 했습니다. 틀 모양은 AI 가 못 바꿉니다. 세 권 모두 한 번에 기계 검사를 통과했습니다.</p>
<p style="margin:0 0 8px;color:#555">각 테마: 위 = AI 가 엮은 책(옆으로 넘기기), 아래 「틀 목록 보기」 = AI 에게 준 틀 전체(예시 사진). 
시험 사진은 여러 작가의 제주 사진이라 한 사람의 여행보다 색감이 들쭉날쭉합니다.</p></header>
