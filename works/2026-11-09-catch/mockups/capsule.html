<title>리얼뽑기 캡슐 시안</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gothic+A1:wght@400;600;800&display=swap">
<style>
/* layout: one phone stage on top, variant tabs + controls under the thumb, a short note per variant */
:root {
  --bg: #F3F6EE; --panel: #FFFDF6; --ink: #24331F; --muted: #5D6B57; --line: #D7DECF; --sun: #FFD84D;
  --display: "Jua", "Gothic A1", system-ui, sans-serif; --body: "Gothic A1", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #161A14; --panel: #20261D; --ink: #EEF3E8; --muted: #A9B5A2; --line: #334030; --sun: #FFD84D; color-scheme: dark } }
:root[data-theme="dark"] { --bg: #161A14; --panel: #20261D; --ink: #EEF3E8; --muted: #A9B5A2; --line: #334030; --sun: #FFD84D; color-scheme: dark }
body { background: var(--bg); color: var(--ink); font-family: var(--body); }
.wrap { max-width: 440px; margin: 0 auto; padding-block: 14px 28px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 12px; }
h1 { font-family: var(--display); font-weight: 400; font-size: 22px; margin: 0; text-wrap: balance; }
.sub { color: var(--muted); font-size: 13px; margin: 0; line-height: 1.5; }
.stage { width: 100%; aspect-ratio: 9 / 16; max-width: 100%; border-radius: 26px; overflow: hidden; background: #2b2622;
  box-shadow: 0 0 0 6px #10130f, 0 10px 30px rgba(0,0,0,.25); touch-action: manipulation; }
.stage svg { width: 100%; height: 100%; display: block; }
.tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.tabs button, .row button { font-family: var(--display); font-size: 16px; color: var(--ink); background: var(--panel);
  border: 2px solid var(--ink); border-radius: 14px; padding: 10px 6px; cursor: pointer; }
.tabs button[aria-pressed="true"] { background: var(--sun); color: #24331F; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.row button { flex: 1 1 auto; font-size: 14px; padding: 8px 10px; border-radius: 999px; }
.row button:disabled { opacity: .4; cursor: default; }
button:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }
.who { display: flex; gap: 6px; }
.who button { flex: 1; font-family: var(--body); font-size: 13px; font-weight: 600; padding: 6px; border-radius: 10px;
  border: 1.5px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; }
.who button[aria-pressed="true"] { border-color: var(--ink); }
.note { background: var(--panel); border: 1.5px solid var(--line); border-radius: 16px; padding: 12px 14px; }
.note h2 { font-family: var(--display); font-weight: 400; font-size: 18px; margin: 0 0 4px; }
.note p { margin: 0; font-size: 13.5px; line-height: 1.6; color: var(--ink); }
.note .meta { color: var(--muted); font-size: 12.5px; margin-top: 6px; }
.chips { display: flex; gap: 6px; align-items: center; font-size: 12.5px; color: var(--muted); }
.chips i { width: 16px; height: 16px; border-radius: 50%; display: inline-block; border: 1.5px solid var(--ink); }
</style>

<div class="wrap">
  <h1>뽑기 캡슐 시안 3개</h1>
  <p class="sub">집게가 녀석을 들어 올린 뒤부터 도감에 들어가기까지. 화면을 누르면 다시 재생합니다.</p>
  <div class="stage" id="stage" role="img" aria-label="캡슐 연출 미리보기"><svg id="svg" viewBox="0 0 360 640"></svg></div>
  <div class="tabs" role="group" aria-label="시안">
    <button id="tA" aria-pressed="true">A 투톤</button>
    <button id="tB" aria-pressed="false">B 뽀각</button>
    <button id="tC" aria-pressed="false">C 받침대</button>
  </div>
  <div class="who" role="group" aria-label="뽑은 녀석">
    <button id="w0" aria-pressed="true">밤톨</button><button id="w1" aria-pressed="false">미어</button><button id="w2" aria-pressed="false">펭솜</button>
  </div>
  <div class="row">
    <button id="replay">다시 보기</button>
    <button id="slow">느리게 0.5×</button>
    <button id="shuffle">색 조합 바꾸기</button>
    <button id="undo" disabled>되돌리기</button>
  </div>
  <div class="chips" id="chips"></div>
  <div class="note" id="note"></div>
</div>

const dexText = el("text", { x: 0, y: 6, "text-anchor": "middle", fill: "#24331F", "font-size": 16, "font-family": "Jua" }, dexG);
// claw button
const btn = el("g", { transform: "translate(180 588)" });
el("circle", { r: 34, fill: "#000", opacity: .3, cy: 4, filter: "url(#shadow)" }, btn);
el("circle", { r: 32, fill: "#FFD84D", stroke: "#24331F", "stroke-width": 3 }, btn);
el("text", { y: 7, "text-anchor": "middle", fill: "#24331F", "font-size": 18, "font-family": "Jua" }, btn).textContent = "집기";
const FLOOR = 532;

/* ---------- moving parts ---------- */
const clawG = el("g");
const cable = el("line", { x1: 180, y1: 64, x2: 180, y2: 120, stroke: "#c9ced8", "stroke-width": 3 }, clawG);
const hub = el("g", {}, clawG);
el("rect", { x: -16, y: -10, width: 32, height: 18, rx: 6, fill: "#9aa1ad", stroke: "#2c3038", "stroke-width": 2 }, hub);
const prongL = el("path", { d: "M-10 6 Q-30 26 -18 52", fill: "none", stroke: "#9aa1ad", "stroke-width": 5, "stroke-linecap": "round" }, hub);
const prongR = el("path", { d: "M10 6 Q30 26 18 52", fill: "none", stroke: "#9aa1ad", "stroke-width": 5, "stroke-linecap": "round" }, hub);

const shadowE = el("ellipse", { cx: 180, cy: FLOOR + 2, rx: 46, ry: 7, fill: "#000", opacity: 0, filter: "url(#shadow)" });
const rays = el("g", { opacity: 0 });
for (let i = 0; i < 14; i++) el("rect", { x: -4, y: -150, width: 8, height: 70, rx: 4, transform: `rotate(${i * 360 / 14})`, fill: "#fff" }, rays);
const world = el("g");          // capsule + catch, translated / rotated each frame
const plate = el("g", { opacity: 0 });
const toast = el("g", { opacity: 0, transform: "translate(180 120)" });
el("rect", { x: -110, y: -22, width: 220, height: 44, rx: 22, fill: "#FFFDF6", stroke: "#24331F", "stroke-width": 2.5 }, toast);
const toastText = el("text", { y: 7, "text-anchor": "middle", fill: "#24331F", "font-size": 19, "font-family": "Jua" }, toast);

/* build the capsule for the current variant into `world` */
let parts = {};
function build() {
  world.innerHTML = ""; plate.innerHTML = ""; parts = {};
  const c = pal[variant], img = IMG[who];
  dexText.textContent = "도감 12";
  toastText.textContent = (variant === "A" ? `${NAMES[who]}를 뽑았다!` : `새 친구! ${NAMES[who]}`);
  rays.querySelectorAll("rect").forEach(r => r.setAttribute("fill", shade(c, .55)));
  const catchG = el("g", {}, world);           // the catch, outside the capsule until it is wrapped
  parts.catchImg = el("image", { href: img, x: -46, y: -50, width: 92, height: 92 }, catchG);
  parts.catchG = catchG;
  const cap = el("g", { opacity: 0 }, world); parts.cap = cap;
  const top = el("g", {}, cap), bot = el("g", {}, cap); parts.top = top; parts.bot = bot;
  if (variant === "A") {
    // inside: the catch, seen through the clear top
    const inside = el("g", { "clip-path": "url(#ball)" }, cap); cap.insertBefore(inside, top);
    parts.inside = el("image", { href: img, x: -45, y: -56, width: 90, height: 90, preserveAspectRatio: "xMidYMid meet" }, inside);   // high: the colour hides its lower third
    el("path", { d: "M-56 0 A56 56 0 0 1 56 0 Z", fill: "url(#glassBody)" }, top);
    el("path", { d: "M-56 0 A56 56 0 0 1 56 0", fill: "none", stroke: "#fff", "stroke-opacity": .7, "stroke-width": 2 }, top);
    el("ellipse", { cx: -20, cy: -30, rx: 20, ry: 12, fill: "url(#hi)", transform: "rotate(-28 -20 -30)" }, top);
    const g = `g${variant}${who}${c.slice(1)}`;
    const grad = el("radialGradient", { id: g, cx: ".38", cy: ".2", r: ".9" }, defs);
    el("stop", { offset: "0", "stop-color": shade(c, .35) }, grad); el("stop", { offset: ".55", "stop-color": c }, grad); el("stop", { offset: "1", "stop-color": shade(c, -.32) }, grad);
    el("path", { d: "M-56 0 A56 56 0 0 0 56 0 Z", fill: `url(#${g})` }, bot);
    for (const [x, y] of [[-18, 30], [0, 36], [18, 30]]) el("ellipse", { cx: x, cy: y, rx: 3.2, ry: 2.4, fill: shade(c, -.45), opacity: .7 }, bot);
    el("rect", { x: -57, y: -4, width: 114, height: 9, rx: 4.5, fill: shade(c, .2), stroke: shade(c, -.25), "stroke-width": 1.2 }, bot);
    el("rect", { x: 50, y: -7, width: 12, height: 14, rx: 4, fill: shade(c, .1), stroke: shade(c, -.3), "stroke-width": 1.2 }, bot); // lid tab
  } else if (variant === "B") {
    const g = `g${variant}${who}${c.slice(1)}`;
    const grad = el("radialGradient", { id: g, cx: ".4", cy: ".3", r: ".8" }, defs);
    el("stop", { offset: "0", "stop-color": shade(c, .78), "stop-opacity": .78 }, grad); el("stop", { offset: "1", "stop-color": shade(c, .35), "stop-opacity": .9 }, grad);
    const inside = el("g", { "clip-path": "url(#ball)" }, cap); cap.insertBefore(inside, top);
    parts.inside = el("image", { href: img, x: -38, y: -42, width: 76, height: 76, filter: "url(#soft)", opacity: .75 }, inside);
    el("path", { d: "M-56 0 A56 56 0 0 1 56 0 Z", fill: `url(#${g})` }, top);
    el("path", { d: "M-56 0 A56 56 0 0 0 56 0 Z", fill: `url(#${g})` }, bot);
    el("line", { x1: -56, y1: 0, x2: 56, y2: 0, stroke: shade(c, -.2), "stroke-width": 2 }, bot);
    el("ellipse", { cx: -22, cy: -28, rx: 18, ry: 9, fill: "#fff", opacity: .35, transform: "rotate(-30 -22 -28)" }, top);
    const st = el("g", { transform: "translate(0 26) rotate(-6)" }, bot);
    el("rect", { x: -28, y: -11, width: 56, height: 22, rx: 6, fill: "#FFFDF6", stroke: "#24331F", "stroke-width": 1.5 }, st);
    el("text", { y: 5, "text-anchor": "middle", "font-size": 12, "font-family": "Jua", fill: "#24331F" }, st).textContent = `No.${NOS[who]}`;
  } else {
    const g = `g${variant}${who}${c.slice(1)}`;
    const grad = el("radialGradient", { id: g, cx: ".38", cy: ".2", r: ".9" }, defs);
    el("stop", { offset: "0", "stop-color": shade(c, .35) }, grad); el("stop", { offset: ".55", "stop-color": c }, grad); el("stop", { offset: "1", "stop-color": shade(c, -.32) }, grad);
    const gw = g + "w"; const gradW = el("radialGradient", { id: gw, cx: ".38", cy: ".3", r: ".9" }, defs);
    el("stop", { offset: "0", "stop-color": "#ffffff" }, gradW); el("stop", { offset: "1", "stop-color": "#d9dde3" }, gradW);
    el("path", { d: "M-56 0 A56 56 0 0 1 56 0 Z", fill: `url(#${gw})` }, top);
    el("ellipse", { cx: -20, cy: -30, rx: 18, ry: 10, fill: "#fff", opacity: .9, transform: "rotate(-28 -20 -30)" }, top);
    el("path", { d: "M-56 0 A56 56 0 0 0 56 0 Z", fill: `url(#${g})` }, bot);
    el("rect", { x: -57, y: -3, width: 114, height: 6, rx: 3, fill: shade(c, -.2) }, bot);
    // name plate on the stand (shown later)
    el("rect", { x: -44, y: -12, width: 88, height: 24, rx: 7, fill: "#FFFDF6", stroke: "#24331F", "stroke-width": 2 }, plate);
    el("text", { y: 6, "text-anchor": "middle", "font-size": 14, "font-family": "Jua", fill: "#24331F" }, plate).textContent = `No.${NOS[who]} ${NAMES[who]}`;
  }
  chips();
}

/* the shared drop: start at the claw, 3 bounces (same numbers as game/Capsule.kt) */
const START_Y = 176, R = 56;
const RR = () => variant === "A" ? 40 : R;   // A: the smaller capsule (app R 64 -> 46)
function drop(ms) {
  let y = START_Y, vy = 0, b = 0, t = 0, landT = null;
  while (t < ms) {
    const dt = 4; t += dt;
    if (b < 3) { vy += dt * 0.0042; y += vy * dt; if (y > FLOOR - RR()) { y = FLOOR - RR(); vy *= -0.45; b++; if (b === 3) landT = t; } }
  }
  return { y, done: b >= 3, landT };
}
const dropMs = {}; function DROP() { const k = RR(); if (!dropMs[k]) { let t = 0; while (!drop(t).done) t += 4; dropMs[k] = t; } return dropMs[k]; }

const ease = k => 1 - Math.pow(1 - Math.min(1, Math.max(0, k)), 3);
const clamp01 = k => Math.min(1, Math.max(0, k));

function frame(now) {
  const t = (now - t0) * speed;
  const WRAP = 520;
  let x = 180, y = START_Y, rot = 0, s = 1;
  // claw: holds, then opens and rises once the capsule leaves
  const open = clamp01((t - WRAP) / 160);
  hub.setAttribute("transform", `translate(180 ${START_Y - 72 - Math.max(0, t - WRAP - 200) * 0.25})`);
  cable.setAttribute("y2", START_Y - 72 - Math.max(0, t - WRAP - 200) * 0.25);
  prongL.setAttribute("transform", `rotate(${open * 22})`); prongR.setAttribute("transform", `rotate(${-open * 22})`);
  // wrap: the catch shrinks into the forming capsule
  const k = ease(t / 420);
  parts.cap.setAttribute("opacity", k);
  parts.cap.setAttribute("transform", `scale(${0.4 + 0.6 * k})`);
  parts.catchG.setAttribute("opacity", 1 - k);
  parts.catchG.setAttribute("transform", `scale(${1 - 0.25 * k})`);
  let dexN = 12, toastO = 0, rayO = 0, rayS = 1, plateO = 0;
  const td = t - WRAP;
  if (td > 0) {
    const d = drop(td); y = d.y;
    const after = td - DROP();           // ms since the third bounce
    if (variant === "A") {
      if (after > 0) {                    // roll off to the right, like now
        let vx = 0.22, xx = 180, r = 0;
        for (let q = 0; q < after; q += 4) { vx += 4 * 0.0006; xx += vx * 4; r += vx * 4 / RR(); }
        x = xx; rot = r * 180 / Math.PI;
        toastO = clamp01(after / 150) * (1 - clamp01((after - 1500) / 300));
        if (x - RR() > 360) dexN = 13;
      }
    } else if (variant === "B") {
      if (after > 0) {
        const SHAKE = 1300, POP = SHAKE + 250;
        if (after < SHAKE) {               // three wobbles, a beat between each
          const p = (after % 433) / 433;
          rot = p < .55 ? Math.sin(p / .55 * Math.PI * 2) * 16 : 0;
        }
        const pk = after - POP;
        if (pk > 0) {
          const o = ease(pk / 380);
          parts.top.setAttribute("transform", `translate(${-40 * o} ${-150 * o}) rotate(${-50 * o})`);
          parts.top.setAttribute("opacity", 1 - clamp01((pk - 200) / 300));
          parts.bot.setAttribute("opacity", 1 - clamp01((pk - 100) / 300));
          parts.inside.setAttribute("opacity", 0);
          rayO = (pk < 900 ? clamp01(pk / 120) : 1 - clamp01((pk - 900) / 400)) * .85; rayS = 0.6 + ease(pk / 700) * 0.7;
          // the catch hops out, big and sharp
          const hop = Math.sin(clamp01(pk / 520) * Math.PI) * 70;
          const big = 0.9 + 0.5 * ease(pk / 420);
          parts.catchG.setAttribute("opacity", 1);
          let cx = 0, cy = -hop - 30 * ease(pk / 420), cs = big;
          toastO = clamp01((pk - 300) / 200);
          const fly = pk - 2000;            // into the dex counter
          if (fly > 0) {
            const f = ease(fly / 520);
            cx = (306 - 180) * f; cy = cy + (36 - y - cy) * f; cs = big * (1 - 0.85 * f);
            toastO *= 1 - clamp01(fly / 200);
            if (fly > 520) { parts.catchG.setAttribute("opacity", 0); dexN = 13; }
          }
          parts.catchG.setAttribute("transform", `translate(${cx} ${cy}) scale(${cs})`);
        } else { parts.top.removeAttribute("transform"); parts.top.setAttribute("opacity", 1); parts.bot.setAttribute("opacity", 1); }
      }
    } else {
      if (after > 0) {
        const pk = after - 250;
        if (pk > 0) {
          const o = ease(pk / 420);
          parts.top.setAttribute("transform", `translate(${-120 * o} ${-90 * o + 400 * Math.max(0, o - .6)}) rotate(${-120 * o})`);
          parts.top.setAttribute("opacity", 1 - clamp01((pk - 300) / 200));
          // the bottom half settles into a flat stand
          const f = ease(pk / 360);
          parts.bot.setAttribute("transform", `translate(0 ${22 * f}) scale(${1 + .12 * f} ${1 - .5 * f})`);
          // the catch rises to stand on it
          const up = ease((pk - 150) / 420);
          parts.catchG.setAttribute("opacity", clamp01((pk - 120) / 120));
          let cx = 0, cy = -28 * up - 8, cs = 0.7 + 0.4 * up;
          plateO = clamp01((pk - 450) / 200);
          toastO = clamp01((pk - 500) / 200);
          rayO = (pk > 380 && pk < 1300) ? 0.35 * Math.sin(clamp01((pk - 380) / 900) * Math.PI) : 0; rayS = 0.8;
          const fly = pk - 2100;
          let gs = 1, gx = 0, gy = 0;
          if (fly > 0) {
            const q = ease(fly / 560);
            gx = (306 - 180) * q; gy = (36 - y) * q; gs = 1 - 0.85 * q;
            toastO *= 1 - clamp01(fly / 200);
            if (fly > 560) { world.setAttribute("opacity", 0); plateO = 0; dexN = 13; }
          }
          parts.catchG.setAttribute("transform", `translate(${cx} ${cy}) scale(${cs})`);
          world.setAttribute("data-fly", `${gx},${gy},${gs}`);
        } else { parts.top.removeAttribute("transform"); parts.bot.removeAttribute("transform"); parts.top.setAttribute("opacity", 1); }
      }
    }
  }
  if (variant === "A" && parts.inside) parts.inside.setAttribute("opacity", 1);
  const [fx, fy, fs] = (world.getAttribute("data-fly") || "0,0,1").split(",").map(Number);
  world.setAttribute("transform", `translate(${x + fx} ${y + fy}) rotate(${rot}) scale(${fs * (variant === "A" ? RR() / R : 1)})`);
  plate.setAttribute("transform", `translate(${x + fx} ${y + fy + 38 * fs}) scale(${fs})`);
  plate.setAttribute("opacity", plateO);
  rays.setAttribute("transform", `translate(${x} ${y - 20}) scale(${rayS})`); rays.setAttribute("opacity", rayO);
  const onFloor = td > 0 && Math.abs(y - (FLOOR - RR())) < 60 && x - RR() < 360 && world.getAttribute("opacity") !== "0";
  shadowE.setAttribute("cx", x); shadowE.setAttribute("opacity", onFloor ? .35 * (1 - (FLOOR - RR() - y) / 60) : 0);
  toast.setAttribute("opacity", toastO);
  dexText.textContent = "도감 " + dexN;
  dexG.setAttribute("transform", `translate(306 36) scale(${dexN === 13 ? 1.12 : 1})`);
  requestAnimationFrame(frame);
}

function restart() {
  if (variant === "A") { const pool = COLORS.filter(c => c !== pal.A); pal.A = pool[Math.floor(Math.random() * pool.length)]; }   // a new colour every catch
  world.removeAttribute("data-fly"); world.setAttribute("opacity", 1); build(); t0 = performance.now(); }
function chips() {
  const box = document.getElementById("chips"); box.innerHTML = "캡슐 색:";
  for (const v of ["A", "B", "C"]) { const s = document.createElement("span"); s.innerHTML = `<i style="background:${pal[v]}"></i> ${v}`; s.style.display = "inline-flex"; s.style.gap = "4px"; s.style.alignItems = "center"; box.appendChild(s); }
  const n = NOTES[variant];
  document.getElementById("note").innerHTML = `<h2>${n[0]}</h2><p>${n[1]}</p><p class="meta">${n[2]}</p>`;
}
for (const v of ["A", "B", "C"]) document.getElementById("t" + v).onclick = () => {
  variant = v; for (const u of ["A", "B", "C"]) document.getElementById("t" + u).setAttribute("aria-pressed", u === v); restart();
};
for (let i = 0; i < 3; i++) document.getElementById("w" + i).onclick = () => {
  who = i; for (let j = 0; j < 3; j++) document.getElementById("w" + j).setAttribute("aria-pressed", j === i); restart();
};
document.getElementById("replay").onclick = restart;
document.getElementById("stage").onclick = restart;
document.getElementById("slow").onclick = e => { speed = speed === 1 ? 0.5 : 1; e.target.textContent = speed === 1 ? "느리게 0.5×" : "보통 속도"; restart(); };
document.getElementById("shuffle").onclick = () => {
  hist.push({ ...pal });
  const pool = COLORS.slice().sort(() => Math.random() - .5);
  pal = { A: pool[0], B: pool[1], C: pool[2] };
  document.getElementById("undo").disabled = false; restart();
};
document.getElementById("undo").onclick = () => {
  if (hist.length) pal = hist.pop();
  document.getElementById("undo").disabled = hist.length === 0; restart();
};
build();
requestAnimationFrame(frame);
</script>
