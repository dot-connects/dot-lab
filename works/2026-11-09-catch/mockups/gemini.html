<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gemini 변환 비교</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap">
<style>
  /* Layout: one block per caught photo; inside, the two looks side by side, Codex vs Gemini. */
  :root {
    --bg: #eef1f4; --fg: #22262b; --sub: #5d6670; --card: #ffffff; --line: #d8dee5; --accent: #d9734a; --stage: #e6e0d8;
    --display: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    --body: system-ui, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #16191c; --fg: #eef0f2; --sub: #a3acb6; --card: #20242a; --line: #333a42; --accent: #f0956d; --stage: #3a3632; color-scheme: dark } }
  :root[data-theme="dark"] { --bg: #16191c; --fg: #eef0f2; --sub: #a3acb6; --card: #20242a; --line: #333a42; --accent: #f0956d; --stage: #3a3632; color-scheme: dark }
  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--fg); font: 16px/1.6 var(--body); }
  main { max-width: 760px; margin: 0 auto; padding-block: 22px 48px;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  h1 { font: 26px/1.3 var(--display); margin: 0 0 6px; text-wrap: balance; }
  .lead { color: var(--sub); margin: 0 0 18px; max-width: 62ch; }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 14px; margin-bottom: 16px; }
  .head { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
  .head img { width: 64px; height: 64px; object-fit: contain; background: var(--stage); border-radius: 10px; }
  h2 { font: 20px var(--display); margin: 0; } .head p { margin: 0; color: var(--sub); font-size: 14px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 10px; }
  .look { grid-column: 1 / -1; font: 700 14px var(--body); color: var(--sub); margin-top: 4px; }
  figure { margin: 0; min-width: 0; }
  figure img { width: 100%; aspect-ratio: 1; object-fit: contain; display: block; border-radius: 12px; background: var(--stage); }
  figcaption { font-size: 13.5px; text-align: center; margin-top: 3px; }
  figure.gem figcaption { color: var(--accent); font-weight: 700; }
  .facts { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 14.5px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
  .facts dt { color: var(--sub); } .facts dd { margin: 0; min-width: 0; }
</style>
<main>
  <h1>Gemini 로 바꿔 본 결과</h1>
  <p class="lead">게임에서 실제로 서버에 보내는 오려 낸 사진 3장을, 게임과 같은 지시문으로 Gemini 앱(운영자 계정)에서 뽑았습니다. 왼쪽은 지난번 Codex 샘플입니다. 초록 배경은 게임처럼 지웠습니다.</p>
  <div id="list"></div>
  <dl class="facts">
    <dt>걸린 시간</dt><dd>한 장에 약 20초</dd>
    <dt>실패</dt><dd>셀카 사진은 오려 낸 게 강아지가 아니라 사람이어서 "개가 아니라 사람"이라고 되물음. '사람'으로 다시 보내니 바로 그림</dd>
    <dt>앱 표시</dt><dd>앱에서 뽑은 그림엔 오른쪽 아래 작은 반짝이 표시가 붙음. 게임은 API 로 부르므로 이 표시가 없음</dd>
  </dl>
</main>
