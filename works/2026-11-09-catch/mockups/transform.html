<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>잡은 사진 변신 시안</title>
<style>
  :root { --bg: #f6f3ee; --fg: #2d2826; --sub: #6f6762; --card: #fff; --line: #e4ded6; --stage: #efe7dc; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #1d1b1a; --fg: #f1ece6; --sub: #aaa19a; --card: #2a2725; --line: #3a3634; } }
  :root[data-theme="dark"] { --bg: #1d1b1a; --fg: #f1ece6; --sub: #aaa19a; --card: #2a2725; --line: #3a3634; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.55 system-ui, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
  main { max-width: 520px; margin: 0 auto; padding: 20px 16px 48px; }
  h1 { font-size: 21px; margin: 0 0 4px; } p { color: var(--sub); margin: 0 0 16px; font-size: 14px; }
  .row { display: grid; grid-template-columns: 1fr 24px 1fr; align-items: center; gap: 6px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 10px; margin: 0 0 10px; }
  .row img { width: 100%; aspect-ratio: 1; object-fit: contain; background: var(--stage); border-radius: 10px; display: block; }
  .row .ar { text-align: center; color: var(--sub); }
  .sw { display: flex; gap: 4px; justify-content: center; margin-top: 6px; } .sw i { width: 16px; height: 16px; border-radius: 50%; border: 1px solid var(--line); }
  .cap { grid-column: 1 / -1; font-weight: 700; font-size: 14px; }
</style>
</head>
<body>
<main>
  <h1>잡은 사진 → 털뭉치 변신 (1번 방식)</h1>
  <p>오려 낸 사진에서 색 3개를 뽑아, 개는 멍솜·고양이는 냥솜·사람은 사람 털뭉치 틀에 입혔습니다. 폰 안에서 바로 만들어지고 사진은 밖으로 안 나갑니다.</p>
  <div id="list"></div>
</main>
<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js";
import { makeCreature } from "../site/js/creatures.js";
import { paletteOf, specFor } from "../site/js/fluffify.js";

const R = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
R.setPixelRatio(1); R.setSize(264, 264, false); R.outputColorSpace = THREE.SRGBColorSpace; R.setClearColor(0, 0);
function shot(spec) {
  const c = makeCreature(spec), scene = new THREE.Scene();
  scene.add(c.object3d); c.update(0.016);
  const box = new THREE.Box3().setFromObject(c.object3d), sz = box.getSize(new THREE.Vector3()), mid = box.getCenter(new THREE.Vector3());
  const cam = new THREE.PerspectiveCamera(30, 1, 0.01, 10), d = Math.max(sz.x, sz.y) * 0.6 / Math.tan(Math.PI / 12);
  cam.position.set(mid.x, mid.y + d * 0.12, mid.z + d); cam.lookAt(mid);
  R.render(scene, cam);
  return R.domElement.toDataURL("image/png");
}
const SET = [["black-cat", "cat", "고양이"], ["white-dog", "dog", "개"], ["selfie-dog", "person", "사람"]];
const L = document.getElementById("list");
const pals = await Promise.all(SET.map(async ([f]) => paletteOf(await (await fetch(`../out/s2/${f}-cut.png`)).blob())));
for (const [i, [f, kind, ko]] of SET.entries()) {
  const src = `../out/s2/${f}-cut.png`, pal = pals[i], spec = specFor(kind, pal, { id: f, name: ko });
  const el = document.createElement("div"); el.className = "row";
  el.innerHTML = `<div class="cap">${ko}</div><div><img alt="원래 사진" src="${src}"></div><div class="ar">→</div>
    <div><img alt="변신" src="${shot(spec)}"><div class="sw">${Object.values(pal).filter(c => typeof c === "string").map(c => `<i style="background:${c}"></i>`).join("")}</div></div>`;
  L.append(el);
}
window.__done = true;
</script>
</body>
</html>
