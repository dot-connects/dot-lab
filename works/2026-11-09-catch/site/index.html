<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>우리 집 몬스터 잡기</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;600&display=swap">
<style>
:root{--ink:#f6f3ec;--mute:#c9d2cf;--gold:#ffc83d;--good:#7ee2a8;--bad:#ff8a9b;--glass:rgba(10,12,14,.55)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0b0d0e;color:var(--ink);font-family:"IBM Plex Sans KR",system-ui,sans-serif;overscroll-behavior:none}
[hidden]{display:none!important}
#app{position:fixed;inset:0;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#gl,#fx{position:absolute;inset:0;width:100%;height:100%;display:block}
video{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.18)}
#top{position:absolute;top:calc(env(safe-area-inset-top) + 10px);left:10px;right:10px;display:flex;justify-content:space-between;align-items:center;gap:8px;pointer-events:none;z-index:7}
#top button{pointer-events:auto;font:inherit;font-size:13px;color:#fff;border-radius:18px;padding:7px 12px;cursor:pointer}
#top #count{font-family:"Do Hyeon",sans-serif;font-size:17px;border-radius:18px;padding:6px 12px;font-variant-numeric:tabular-nums;white-space:nowrap}
#note{position:absolute;top:calc(env(safe-area-inset-top) + 54px);left:12px;right:12px;text-align:center;font-size:12.5px;color:#fff;text-shadow:0 1px 4px #000;z-index:5;pointer-events:none}
#toast{position:absolute;left:16px;right:16px;top:22%;text-align:center;font-family:"Do Hyeon",sans-serif;font-size:38px;color:#fff;-webkit-text-stroke:1.5px rgba(18,22,34,.55);text-shadow:0 3px 12px rgba(0,0,0,.85);opacity:0;transform:translateY(10px) scale(.6);transition:opacity .18s,transform .42s cubic-bezier(.18,1.7,.4,1);pointer-events:none;z-index:4}
#toast.show{opacity:1;transform:none}
#toast small{display:block;font-family:"IBM Plex Sans KR",sans-serif;-webkit-text-stroke:0;font-weight:600;font-size:14px;margin-top:4px;color:#eef}
#name{position:absolute;transform:translate(-50%,-100%);font-family:"Do Hyeon",sans-serif;font-size:16px;color:#fff;padding:3px 10px;border-radius:12px;white-space:nowrap;pointer-events:none;z-index:3}
#start{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;gap:12px;padding:24px 22px calc(env(safe-area-inset-bottom) + 34px);background:linear-gradient(180deg,rgba(0,0,0,.15),rgba(0,0,0,.25) 40%,rgba(0,0,0,.82));z-index:6}
#start h1{font-family:"Do Hyeon",sans-serif;font-weight:400;font-size:44px;line-height:1.05;margin:0}
#start p{margin:0 0 10px;color:var(--mute);font-size:15px;line-height:1.5}
#start button{font:inherit;font-family:"Do Hyeon",sans-serif;font-size:22px;padding:15px;border-radius:16px;border:0;cursor:pointer}
#goCam{background:var(--gold);color:#251a00}
#goScreen{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.25)!important}
#back{position:absolute;top:calc(env(safe-area-inset-top) + 12px);left:12px;color:#fff;text-decoration:none;font-size:13px;padding:6px 11px;border-radius:16px}
#card{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:70px 22px 30px;background:rgba(4,6,8,.55);z-index:4}
#card.over{z-index:9}
#card .in{width:100%;max-width:360px;border-radius:22px;padding:18px 18px 16px;background:linear-gradient(170deg,#fffaf0,#f3ead6);color:#2a2418;box-shadow:0 18px 50px rgba(0,0,0,.5);text-align:center}
#card img{width:62%;aspect-ratio:1;object-fit:contain;filter:drop-shadow(0 8px 10px rgba(60,40,0,.25))}
#card .no{font-family:"Do Hyeon",sans-serif;font-size:15px;color:#9a7b33;letter-spacing:.05em}
#card h2{font-family:"Do Hyeon",sans-serif;font-weight:400;font-size:34px;margin:0}
#card .type{display:inline-block;margin:6px 0 8px;font-size:13px;padding:3px 10px;border-radius:10px;background:#2a2418;color:#fff3d6}
#card .line{font-size:15px;line-height:1.5;margin:0 0 10px}
#card .how{font-size:12px;color:#7a6c50;margin:0 0 12px}
#card button{width:100%;font:inherit;font-family:"Do Hyeon",sans-serif;font-size:21px;padding:13px;border:0;border-radius:14px;background:#2a2418;color:#fff;cursor:pointer}
#card #cShare{background:transparent;color:#2a2418;border:1.5px solid #2a2418;margin-bottom:8px;font-size:18px;padding:10px}
#dex{position:absolute;inset:0;z-index:8;background:#fffaf0;color:#2a2418;overflow-y:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 24px)}
#dex .bar{display:flex;align-items:center;gap:10px;margin-bottom:6px}
#dex .bar button,#dex .act button{font:inherit;font-size:14px;padding:7px 12px;border-radius:16px;border:1.5px solid #2a2418;background:#fff;color:#2a2418;cursor:pointer}
#dex h2{font-family:"Do Hyeon",sans-serif;font-weight:400;font-size:30px;margin:0;flex:1}
#dCount{font-family:"Do Hyeon",sans-serif;font-size:19px;color:#9a7b33}
#dNote{font-size:12.5px;color:#7a6c50;margin:4px 0 0}
#dGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px}
#dGrid .cell{display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 4px 9px;border-radius:16px;border:1.5px solid #e2d6bb;background:#fff;color:#2a2418;font:inherit;cursor:pointer;min-width:0}
#dGrid .cell img{width:100%;aspect-ratio:1;object-fit:contain}
#dGrid .cell b{font-family:"Do Hyeon",sans-serif;font-weight:400;font-size:17px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#dGrid .cno{font-family:"Do Hyeon",sans-serif;font-size:12px;color:#9a7b33}
#dGrid .cn{font-size:11.5px;color:#7a6c50}
#dGrid .empty{grid-column:1/-1;text-align:center;color:#7a6c50;margin:40px 0}
#dex .act{display:flex;gap:8px;margin-top:16px}
#dex .act button{flex:1;font-family:"Do Hyeon",sans-serif;font-size:18px;padding:12px;border-radius:14px}
#dex .act button.dark{background:#2a2418;color:#fff}
#dMsg{font-size:13px;color:#7a6c50;text-align:center;margin:10px 0 0;min-height:1em}
#xImg{display:block;width:58%;aspect-ratio:1;object-fit:contain;margin:4px auto 0;filter:drop-shadow(0 8px 10px rgba(60,40,0,.25))}
#dDetail .who{text-align:center}
#xNo{font-family:"Do Hyeon",sans-serif;font-size:15px;color:#9a7b33}
#xName{font-family:"Do Hyeon",sans-serif;font-weight:400;font-size:32px;margin:0}
#xType{display:inline-block;margin:4px 0;font-size:13px;padding:3px 10px;border-radius:10px;background:#2a2418;color:#fff3d6}
#xCount{font-size:14px;color:#7a6c50}
#dex h4{font-size:14px;margin:16px 0 8px}
#xSlots{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.slot{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;padding:5px 2px 6px;border-radius:12px;background:#fff;border:1.5px solid #e2d6bb}
.slot img{width:100%;aspect-ratio:1;object-fit:contain}
.slot.off{border-style:dashed;color:#9a8a66}
.slot.off img{filter:brightness(0);opacity:.16}
.slot i{position:absolute;top:22%;left:0;right:0;text-align:center;font-style:normal;font-family:"Do Hyeon",sans-serif;font-size:24px;color:#b8a77f}
#xMoves{display:flex;flex-wrap:wrap;gap:6px}
.mv{font-size:13px;padding:5px 10px;border-radius:14px;border:1.5px dashed #c9bb98;color:#9a8a66}
.mv.on{border:1.5px solid #c99100;background:#ffc83d;color:#251a00;font-weight:600}
#sheet{position:absolute;left:0;right:0;bottom:0;padding:16px 16px calc(env(safe-area-inset-bottom) + 18px);border-radius:22px 22px 0 0;background:#fffaf0;color:#2a2418;z-index:5;box-shadow:0 -12px 40px rgba(0,0,0,.45)}
#sheet img{display:block;height:120px;max-width:70%;margin:0 auto 6px;object-fit:contain;background:repeating-conic-gradient(#eee6d4 0 25%,#fffaf0 0 50%) 0 0/16px 16px;border-radius:12px}
#sheet h3{font-family:"Do Hyeon",sans-serif;font-weight:400;font-size:26px;margin:4px 0 10px;text-align:center}
#sKind,#sChips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:10px}
.chip{font:inherit;font-size:16px;padding:10px 14px;border-radius:20px;border:1.5px solid #2a2418;background:#fff;color:#2a2418;cursor:pointer}
.chip.on{background:#ffc83d;border-color:#c99100;font-weight:600}
.chip.new{border-style:dashed}
#sNew{display:flex;gap:8px}
#sNew input{user-select:text;-webkit-user-select:text;flex:1;min-width:0;font:inherit;font-size:17px;padding:10px 12px;border-radius:12px;border:1.5px solid #2a2418}
#sNew button{font:inherit;font-family:"Do Hyeon",sans-serif;font-size:18px;padding:10px 14px;border:0;border-radius:12px;background:#2a2418;color:#fff}
</style>
</head>
<body>
<div id="app">
  <video id="video" playsinline muted></video>
  <canvas id="gl"></canvas>
  <canvas id="fx"></canvas>
  <div id="name" class="glass" hidden></div>
  <div id="toast"></div>
  <div id="top">
    <button id="mode" class="glass" hidden>카메라로</button>
    <span></span>
    <button id="count" class="glass" aria-label="도감 열기">0마리 · 모습 0개</button>
  </div>
  <div id="note" hidden></div>
  <div id="card" hidden>
    <div class="in">
      <div class="no" id="cNo">No.001</div>
      <img id="cImg" alt="">
      <h2 id="cName"></h2>
      <div class="type" id="cType"></div>
      <p class="line" id="cLine"></p>
      <p class="how" id="cHow"></p>
      <button id="cShare">카드 저장·공유</button>
      <button id="cGo">계속 잡기</button>
    </div>
  </div>
  <div id="sheet" hidden>
    <img id="sImg" alt="">
    <h3 id="sTitle">누구야?</h3>
    <div id="sKind"></div>
    <div id="sChips"></div>
    <div id="sNew" hidden><input id="sName" maxlength="12" aria-label="이름"><button id="sOk">이 이름으로</button></div>
  </div>
  <div id="dex" hidden>
    <div class="bar"><h2>도감</h2><button id="dClose">닫기</button></div>
    <div id="dHead"><div id="dCount"></div><p id="dNote" hidden></p></div>
    <div id="dGrid"></div>
    <div class="act"><button id="dAll" class="dark" hidden>모두 내보내기 (.dotpet)</button></div>
    <div id="dDetail" hidden>
      <div class="bar"><button id="xBack">‹ 도감</button></div>
      <div class="who">
        <img id="xImg" alt="">
        <div id="xNo"></div>
        <h3 id="xName"></h3>
        <div id="xType"></div>
        <div id="xCount"></div>
      </div>
      <h4>모습 — 빈 칸을 잡으면 펫이 할 줄 아는 게 늘어요</h4>
      <div id="xSlots"></div>
      <h4>플로팅 펫이 할 줄 아는 것</h4>
      <div id="xMoves"></div>
      <div class="act"><button id="xCard" class="dark">카드 만들기</button><button id="xExport">이 녀석 내보내기</button></div>
    </div>
    <p id="dMsg"></p>
  </div>
  <div id="start">
    <a id="back" class="glass" href="../../../">‹ 시켜본 것들</a>
    <h1>우리 집<br>몬스터 잡기</h1>
    <p>방 안에 나타난 녀석에게 엄지로 공을 던져요.<br>링이 작을 때 맞힐수록 잘 잡혀요. 빙글 돌리고 던지면 커브볼.</p>
    <button id="goCam">카메라로 잡기</button>
    <button id="goScreen">화면으로 잡기</button>
  </div>
</div>
<script type="module" src="js/ui.js"></script>
</body>
</html>
