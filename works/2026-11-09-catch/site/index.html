<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>우리 집 몬스터 잡기</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;600&display=swap">
<style>
:root{--ink:#f6f3ec;--mute:#c9d2cf;--gold:#ffc83d;--good:#7ee2a8;--bad:#ff8a9b;--glass:rgba(10,12,14,.55)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0b0d0e;color:var(--ink);font-family:"IBM Plex Sans KR",system-ui,sans-serif;overscroll-behavior:none}
[hidden]{display:none!important}
#app{position:fixed;inset:0;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#gl,#fx{position:absolute;inset:0;width:100%;height:100%;display:block}
video{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.18)}
#top{position:absolute;top:calc(env(safe-area-inset-top) + 10px);left:10px;right:10px;display:flex;justify-content:space-between;align-items:center;gap:8px;pointer-events:none;z-index:5}
#top button{pointer-events:auto;font:inherit;font-size:13px;color:#fff;border-radius:18px;padding:7px 12px;cursor:pointer}
#count{font-family:"Do Hyeon",sans-serif;font-size:17px;border-radius:18px;padding:6px 12px;font-variant-numeric:tabular-nums;white-space:nowrap}
#note{position:absolute;top:calc(env(safe-area-inset-top) + 54px);left:12px;right:12px;text-align:center;font-size:12.5px;color:#fff;text-shadow:0 1px 4px #000;z-index:5;pointer-events:none}
#toast{position:absolute;left:16px;right:16px;top:22%;text-align:center;font-family:"Do Hyeon",sans-serif;font-size:32px;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.85);opacity:0;transform:translateY(8px);transition:opacity .2s,transform .2s;pointer-events:none;z-index:4}
#toast.show{opacity:1;transform:none}
#toast small{display:block;font-family:"IBM Plex Sans KR",sans-serif;font-size:13px;margin-top:4px;color:#eef}
#name{position:absolute;transform:translate(-50%,-100%);font-family:"Do Hyeon",sans-serif;font-size:16px;color:#fff;padding:3px 10px;border-radius:12px;white-space:nowrap;pointer-events:none;z-index:3}
#start{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;gap:12px;padding:24px 22px calc(env(safe-area-inset-bottom) + 34px);background:linear-gradient(180deg,rgba(0,0,0,.15),rgba(0,0,0,.25) 40%,rgba(0,0,0,.82));z-index:6}
#start h1{font-family:"Do Hyeon",sans-serif;font-weight:400;font-size:44px;line-height:1.05;margin:0}
#start p{margin:0 0 10px;color:var(--mute);font-size:15px;line-height:1.5}
#start button{font:inherit;font-family:"Do Hyeon",sans-serif;font-size:22px;padding:15px;border-radius:16px;border:0;cursor:pointer}
#goCam{background:var(--gold);color:#251a00}
#goScreen{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.25)!important}
#back{position:absolute;top:calc(env(safe-area-inset-top) + 12px);left:12px;color:#fff;text-decoration:none;font-size:13px;padding:6px 11px;border-radius:16px}
#card{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:70px 22px 30px;background:rgba(4,6,8,.55);z-index:4}
#card .in{width:100%;max-width:360px;border-radius:22px;padding:18px 18px 16px;background:linear-gradient(170deg,#fffaf0,#f3ead6);color:#2a2418;box-shadow:0 18px 50px rgba(0,0,0,.5);text-align:center}
#card img{width:62%;aspect-ratio:1;object-fit:contain;filter:drop-shadow(0 8px 10px rgba(60,40,0,.25))}
#card .no{font-family:"Do Hyeon",sans-serif;font-size:15px;color:#9a7b33;letter-spacing:.05em}
#card h2{font-family:"Do Hyeon",sans-serif;font-weight:400;font-size:34px;margin:0}
#card .type{display:inline-block;margin:6px 0 8px;font-size:13px;padding:3px 10px;border-radius:10px;background:#2a2418;color:#fff3d6}
#card .line{font-size:15px;line-height:1.5;margin:0 0 10px}
#card .how{font-size:12px;color:#7a6c50;margin:0 0 12px}
#card button{width:100%;font:inherit;font-family:"Do Hyeon",sans-serif;font-size:21px;padding:13px;border:0;border-radius:14px;background:#2a2418;color:#fff;cursor:pointer}
</style>
</head>
<body>
<div id="app">
  <video id="video" playsinline muted></video>
  <canvas id="gl"></canvas>
  <canvas id="fx"></canvas>
  <div id="name" class="glass" hidden></div>
  <div id="toast"></div>
  <div id="top">
    <button id="mode" class="glass" hidden>카메라로</button>
    <span></span>
    <div id="count" class="glass">0마리 · 모습 0개</div>
  </div>
  <div id="note" hidden></div>
  <div id="card" hidden>
    <div class="in">
      <div class="no" id="cNo">No.001</div>
      <img id="cImg" alt="">
      <h2 id="cName"></h2>
      <div class="type" id="cType"></div>
      <p class="line" id="cLine"></p>
      <p class="how" id="cHow"></p>
      <button id="cGo">계속 잡기</button>
    </div>
  </div>
  <div id="start">
    <a id="back" class="glass" href="../../../">‹ 시켜본 것들</a>
    <h1>우리 집<br>몬스터 잡기</h1>
    <p>방 안에 나타난 녀석에게 엄지로 공을 던져요.<br>링이 작을 때 맞힐수록 잘 잡혀요. 빙글 돌리고 던지면 커브볼.</p>
    <button id="goCam">카메라로 잡기</button>
    <button id="goScreen">화면으로 잡기</button>
  </div>
</div>
<script type="module" src="js/ui.js"></script>
</body>
</html>
