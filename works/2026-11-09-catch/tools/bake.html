<!doctype html><meta charset="utf-8"><body><script type="module">
// Bakes the 16 critters into PNGs for the Android app (plan Task 6 / R4): 8 view directions for catching and
// the 12 pet cells. Driven by tools/bake-critters.mjs; results land in window.__out = { id: { name: dataURL } }.
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js";
import { makeCreature, SPECS } from "../site/js/creatures.js";

const ids = new URLSearchParams(location.search).get("ids").split(",");
const R = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
R.setPixelRatio(1); R.setSize(256, 256, false); R.outputColorSpace = THREE.SRGBColorSpace; R.setClearColor(0x000000, 0);

function shot(spec, { yaw = 0, pose = "idle", roll = 0, sx = 1, sy = 1, frame }) {
  const c = makeCreature(spec), scene = new THREE.Scene(), holder = new THREE.Group();
  holder.add(c.object3d); scene.add(holder);
  // the creature's own contact shadow disc would bake into the picture (walls, AR): hide it like creature.js does
  c.object3d.children.forEach(o => { if (o.isMesh && o.renderOrder === -1) o.visible = false; });
  c.setPose(pose); for (let i = 0; i < (pose === "hop" ? 9 : 2); i++) c.update(0.016);
  c.object3d.rotation.y = yaw * Math.PI / 180;
  holder.rotation.z = roll * Math.PI / 180; holder.scale.set(sx, sy, sx);
  const cam = new THREE.PerspectiveCamera(30, 1, 0.01, 10);
  cam.position.set(frame.mid.x, frame.mid.y + frame.d * 0.12, frame.mid.z + frame.d); cam.lookAt(frame.mid);
  R.render(scene, cam);
  const url = R.domElement.toDataURL("image/png");
  c.object3d.traverse(o => { o.geometry?.dispose?.(); if (o.material) [].concat(o.material).forEach(m => { m.map?.dispose?.(); m.dispose?.(); }); });
  return url;
}

// A step for a fur ball (operator 11-15: "crossing, not kangaroo hops"): the two feet split front/back and the paws
// swing the other way. Feet = mirrored blobs placed by c low on the body; paws = mirrored blobs on a body below its
// middle. A mirrored part is unfolded into its left and right copy so each can move on its own (k = +1 / -1 / 0).
function stride(spec, k) {
  if (!k) return spec;
  const parts = [];
  for (const e of spec.parts || []) {
    const foot = e.kind === "blob" && e.mirror && e.c && e.c[1] < -0.15;
    const paw = e.kind === "blob" && e.mirror && e.on && !e.wob && e.on_at[1] < 0 && e.on_at[1] > -0.8;
    if (!foot && !paw) { parts.push(e); continue; }
    for (const s of [-1, 1]) {
      const rot = (e.rot || [0, 0, 0]).map((v, i) => i ? v * s : v);
      if (foot) { const d = Math.max(e.r[2], e.r[0]) * 1.1 * k * s; parts.push({ ...e, mirror: false, rot, c: [s * e.c[0], e.c[1] + (d > 0 ? 0.03 : 0), e.c[2] + d] }); }
      else { const y = Math.abs(e.on_at[0]) - 0.35 * k * s; parts.push({ ...e, mirror: false, rot, on_at: [s * Math.max(0.05, y), e.on_at[1]] }); }
    }
  }
  return { ...spec, parts };
}

const out = {};
for (const id of ids) {
  const spec = SPECS.find(s => s.id === id);
  // one framing per critter (from its front view, with room for the lying pose) so every picture has the same scale
  const probe = makeCreature(spec); probe.update(0.016);
  const box = new THREE.Box3().setFromObject(probe.object3d), sz = box.getSize(new THREE.Vector3()), mid = box.getCenter(new THREE.Vector3());
  const frame = { mid, d: Math.max(sz.x, sz.y) * 0.56 / Math.tan(Math.PI / 12) };
  const o = {};
  for (let k = 0; k < 8; k++) o["dir" + k] = shot(spec, { yaw: k * 45, frame });
  o.front = o.dir0;
  o.smile = shot(spec, { pose: "caught", frame });
  o.walkA = shot(spec, { yaw: 90, frame });
  o.walkB = shot(spec, { yaw: 90, pose: "hop", frame });
  o.sleep = shot(spec, { yaw: 90, pose: "caught", sx: 1.2, sy: 0.72, frame });
  o.curl = shot(spec, { pose: "caught", sx: 1.15, sy: 0.7, frame });
  // 12-cell pet (operator 11-15): a 4-step walk with the feet crossing (stride), 
  // held = stretched and swinging, dropped = a pancake, then sitting up tilted and dazed
  o.walk1 = shot(stride(spec, 1), { yaw: 90, roll: -4, sx: 1.02, sy: 0.96, frame });   // contact: one foot ahead
  o.walk2 = shot(spec, { yaw: 90, sx: 0.98, sy: 1.04, frame });                          // passing: feet together, up
  o.walk3 = shot(stride(spec, -1), { yaw: 90, roll: -4, sx: 1.02, sy: 0.96, frame });  // contact: the other foot
  o.walk4 = shot(spec, { yaw: 90, sx: 0.98, sy: 1.04, frame });
  o.holdA = shot(spec, { roll: 12, sx: 0.9, sy: 1.08, frame });
  o.holdB = shot(spec, { roll: -12, sx: 0.9, sy: 1.08, frame });
  o.fall = shot(spec, { sx: 1.32, sy: 0.6, frame });
  o.dazed = shot(spec, { roll: 13, sx: 1.04, sy: 0.92, frame });
  out[id] = o;
  window.__p = (window.__p || 0) + 1;
}
window.__out = out;
</script>
