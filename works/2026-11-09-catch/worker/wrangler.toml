name = "dot-lab-catch"
main = "src/index.js"
compatibility_date = "2026-10-01"

# Photo transform for 「우리 집 몬스터 잡기」 (OpenAI images/edits). Secrets: `npx wrangler@4 secret put OPENAI_KEY`
# (without it every AI route answers 503 and the game keeps its on-device fluff picture) and DEBUG_PURCHASE
# (the /sheet token until real billing; unset or empty = /sheet answers 402).
# MONTH_CENTS = the month's money ceiling over /transform + /sheet ("0" = AI off).
[vars]
DEVICE_DAY = "5"
ALL_DAY = "30"
MONTH_CENTS = "500"

[[d1_databases]]
binding = "DB"
database_name = "dot-lab-catch"
database_id = "02666d84-fbb2-4e62-b5f7-c8d43e9edfe0"

# 10 requests a minute per IP on top of the day counters
[[ratelimits]]
name = "LIMIT"
namespace_id = "2612"
simple = { limit = 10, period = 60 }
