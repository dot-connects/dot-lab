name = "dot-lab-catch"
main = "src/index.js"
compatibility_date = "2026-10-01"

# Photo transform for 「우리 집 몬스터 잡기」. Secret GEMINI_KEY: `npx wrangler@4 secret put GEMINI_KEY`
# (without it /transform answers 503 and the game keeps its on-device fluff picture).
[vars]
DEVICE_DAY = "5"
ALL_DAY = "100"

[[d1_databases]]
binding = "DB"
database_name = "dot-lab-catch"
database_id = "02666d84-fbb2-4e62-b5f7-c8d43e9edfe0"

# 10 requests a minute per IP on top of the day counters
[[ratelimits]]
name = "LIMIT"
namespace_id = "2612"
simple = { limit = 10, period = 60 }
