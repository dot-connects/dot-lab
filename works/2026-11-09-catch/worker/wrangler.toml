name = "dot-lab-catch"
main = "src/index.js"
compatibility_date = "2026-10-01"

# Photo transform for 「우리 집 몬스터 잡기」 (OpenAI images/edits). Secrets: `npx wrangler@4 secret put OPENAI_KEY`
# (without it every AI route answers 503 and the game keeps its on-device fluff picture) and DEBUG_PURCHASE
# (the /sheet token until real billing; unset or empty = /sheet answers 402).
# MONTH_CENTS = the public month's money ceiling over /transform + /sheet ("0" = AI off, dev included).
[vars]
# operator 11-18: free previews per device in all, free pet sheets per device (test period)
PREVIEW_FREE = "10"
ALL_DAY = "150"   # 12 testers x 10 previews fit in one day (review 11-19 L8)
MONTH_CENTS = "2000"
# the dev app (operator's DEBUG_PURCHASE token) has no day/entry limits and its own month ceiling
DEV_MONTH_CENTS = "2000"
PKG = "kr.dot.catchpet"
FREE_SHEETS = "5"
# free sheets a day per network and for everyone (device ids are app-made); bought sheets' own month guard
FREE_IP_DAY = "6"
FREE_ALL_DAY = "60"
PAID_MONTH_CENTS = "5000"
# /card (AI card line, 1 cent reserved a call): a day per device, per network and for everyone, and its own
# month ceiling (MONTH_CENTS "0" still stops it)
CARD_DAY = "40"
CARD_IP_DAY = "60"
CARD_ALL_DAY = "300"
CARD_MONTH_CENTS = "300"
CERT_SHA256 = "C1:FC:F5:DC:B6:0F:73:0D:92:52:F2:8C:92:A4:ED:15:CB:09:5F:DE:D5:01:A4:C0:92:04:A5:D9:32:00:85:1C"

[[d1_databases]]
binding = "DB"
database_name = "dot-lab-catch"
database_id = "02666d84-fbb2-4e62-b5f7-c8d43e9edfe0"

# 10 requests a minute per IP on top of the day counters
[[ratelimits]]
name = "LIMIT"
namespace_id = "2612"
simple = { limit = 10, period = 60 }

# Play release (spec-release.md): package, test-period free sheets ("0" in production),
# the app-signing certificate SHA-256 from Play Console (App integrity > App signing; empty = no app passes integrity).
# Secret GOOGLE_SA = the service-account JSON (wizard menu 7); without it non-dev AI calls answer 503 off.

# paid sheets kept 30 days so a purchase token never draws twice (bucket lifecycle rule: expire after 30 days)
[[r2_buckets]]
binding = "SHEETS"
bucket_name = "dot-lab-catch-sheets"
