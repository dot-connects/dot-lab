<!doctype html>
<meta charset="utf-8">
<title>catch scene render</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@700&display=block">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
<canvas id="cv" width="1080" height="1920"></canvas>
<script type="module">
// The app's catch screen (ui/CatchScreen.kt render(), ClawArt, CapsuleArt, ClawButton, game/Claw.kt, game/Capsule.kt,
// game/Life.kt Dangle) ported 1:1 to Canvas2D for the reel: same dp geometry, colours, speeds and state machine.
// The camera is a stock clip of the same cat (reel/render/<clip>/, default A09), the cut-out comes from the app's own magic_touch.tflite.
// Fake clock: the driver calls window.frame() once per 1/30 s; nothing reads wall time.
// Scripted input: drag the claw over the cat, press 집기; the roll is forced to win (the reel shows a catch).
import { FilesetResolver, InteractiveSegmenter } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

const Q = new URLSearchParams(location.search);
const CLIP = Q.get("clip") ?? "a09", START = +(Q.get("start") ?? 1);   // camera clip folder and first frame (1-based)
const KY = +(Q.get("ky") ?? 0.5);                // magic touch keypoint height (the app: the detector box centre)
const FADE = +(Q.get("fade") ?? 0), DIM = +(Q.get("dim") ?? 0);
// reel opening (Fable review 3, 11-17): the claw over the live cat from frame 1, the app's layers appear at UIAT ms;
// END=capsule holds the capsule in the claw once it is closed; from BLURAT the room blurs, the app's layers fade and
// the claw opens and leaves upward; CAPFIT=head shows the cat's face in the clear half; X0/AIM0/AIM1 move the aim
const UIAT = +(Q.get("uiAt") ?? 0), ENDCAP = Q.get("end") === "capsule", BLURAT = +(Q.get("blurAt") ?? 0), BLUR = +(Q.get("blur") ?? 24);
const CAPFIT = Q.get("capFit") === "head", X0 = +(Q.get("x0") ?? .1), AIM0 = +(Q.get("aim0") ?? 500), AIM1 = +(Q.get("aim1") ?? 1300);
const CAPHIDE = +(Q.get("capHide") ?? 0);   // cut 7: from this ms the capsule is not drawn, so the last frames are the clean plate transform.html?v=7 starts on
const capTrack = [];   // DIM: black over the camera (0..1)              // ms for the app layers to fade in (0 = shown at once)
const AIM_TO = +(Q.get("aim") ?? 0.4);       // where the finger drags the claw (0..1 of the width)
const NAME = Q.get("name") ?? "모찌", DEX = +(Q.get("dex") ?? 8), CAP = Q.get("cap") ?? "#FF6B6B";
const FPS = 30, DT = 1000 / FPS;
const cv = document.getElementById("cv"), g = cv.getContext("2d");
const D = 2.625, W = 1080 / D, H = 1920 / D, TOP = 28, BOT = 16, RAIL = TOP + 54;
const GW = 90, GH = 160;                          // the segmenter's mask grid (CutOut: one cell ~8 frame px)
const FW = 720, FH = 1280, VS = 1920 / FH / D;    // frame px -> dp (FILL_CENTER, exact 9:16)
const BTN_R = 23, PLATE_SIDE = 11, PLATE_FOOT = 25;
const btnX = W - 16 - PLATE_SIDE - BTN_R, btnY = H - BOT - 14 - PLATE_FOOT - BTN_R;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const rgba = (a, r, gg, b) => `rgba(${r},${gg},${b},${clamp(a, 0, 1)})`;
const hex = c => [parseInt(c.slice(1, 3), 16), parseInt(c.slice(3, 5), 16), parseInt(c.slice(5, 7), 16)];
const css = ([r, gg, b], a = 1) => `rgba(${r},${gg},${b},${a})`;
const shade = (c, k) => c.map(v => clamp(Math.trunc(k > 0 ? v + (255 - v) * k : v * (1 + k)), 0, 255));
const events = [];                                // sound cues for the edit: [ms, name, volume]
const sfx = (n, v) => events.push([Math.round(time), n, v]);

// ---------- camera frames ----------
const cache = new Map();
const frameImg = i => {
  i = clamp(i, 1, 360);
  if (!cache.has(i)) cache.set(i, new Promise(r => { const im = new Image(); im.onload = () => r(im); im.src = `${CLIP}/${String(i).padStart(4, "0")}.jpg`; }));
  return cache.get(i);
};

// ---------- the mask (magic touch, as Segmenter.kt) ----------
let seg;
async function maskOf(img, kx, ky) {
  const c = new OffscreenCanvas(FW, FH); c.getContext("2d").drawImage(img, 0, 0);
  const res = await new Promise(r => seg.segment(c, { keypoint: { x: kx, y: ky } }, out => {
    const m = out.confidenceMasks[0]; r({ data: new Float32Array(m.getAsFloat32Array()), w: m.width, h: m.height });
  }));
  // down to the grid, keep the 4-connected blob under the keypoint
  const on = new Uint8Array(GW * GH);
  for (let y = 0; y < GH; y++) for (let x = 0; x < GW; x++) {
    const sx = Math.floor((x + .5) / GW * res.w), sy = Math.floor((y + .5) / GH * res.h);
    on[y * GW + x] = res.data[sy * res.w + sx] > 0.5 ? 1 : 0;
  }
  const keep = new Uint8Array(GW * GH), st = [[Math.floor(kx * GW), Math.floor(ky * GH)]];
  while (st.length) {
    const [x, y] = st.pop(); if (x < 0 || y < 0 || x >= GW || y >= GH) continue;
    const i = y * GW + x; if (!on[i] || keep[i]) continue; keep[i] = 1;
    st.push([x + 1, y], [x - 1, y], [x, y + 1], [x, y - 1]);
  }
  let x0 = GW, y0 = GH, x1 = -1, y1 = -1;
  for (let y = 0; y < GH; y++) for (let x = 0; x < GW; x++) if (keep[y * GW + x]) { x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y); }
  const at = (x, y) => x >= 0 && y >= 0 && x < GW && y < GH && keep[y * GW + x] === 1;
  const firstRow = (col, half = 0) => { for (let y = 0; y < GH; y++) for (let x = col - half; x <= col + half; x++) if (at(x, y)) return y; return null; };
  return { at, firstRow, box: { x0, y0, x1, y1, w: x1 - x0 + 1 } };
}
const toGrid = (x, y) => [Math.floor(x / W * GW), Math.floor(y / H * GH)];

// CutOut.alpha / make / hole
function alphaCanvas(m) {
  const s = new OffscreenCanvas(GW, GH), sg = s.getContext("2d"), id = sg.createImageData(GW, GH);
  for (let y = 0; y < GH; y++) for (let x = 0; x < GW; x++) {
    let n = 0; for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) if (m.at(x + dx, y + dy)) n++;
    id.data[(y * GW + x) * 4 + 3] = Math.floor(n * 255 / 9);
  }
  sg.putImageData(id, 0, 0);
  const a = new OffscreenCanvas(FW, FH), ag = a.getContext("2d"); ag.imageSmoothingQuality = "high"; ag.drawImage(s, 0, 0, FW, FH);
  return a;
}
function makeCut(img, m) {
  const b = m.box, sx = FW / GW, sy = FH / GH, mx = b.w * sx * 0.08, my = (b.y1 - b.y0 + 1) * sy * 0.08;
  const src = { l: Math.max(0, Math.trunc(b.x0 * sx - mx)), t: Math.max(0, Math.trunc(b.y0 * sy - my)),
    r: Math.min(FW, Math.round((b.x1 + 1) * sx + mx)), b: Math.min(FH, Math.round((b.y1 + 1) * sy + my)) };
  const a = alphaCanvas(m), k = 512 / Math.max(src.r - src.l, src.b - src.t);
  const out = new OffscreenCanvas(Math.round((src.r - src.l) * k), Math.round((src.b - src.t) * k)), og = out.getContext("2d");
  og.scale(k, k); og.translate(-src.l, -src.t); og.drawImage(a, 0, 0);
  og.globalCompositeOperation = "source-in"; og.drawImage(img, 0, 0);
  // CutOut.hole (11-17): the hole takes the colours from outside the mask grown by one cell (Pixels.fill)
  const sw = FW / 12, sh = FH / 12 | 0, tiny = new OffscreenCanvas(sw, sh), tg = tiny.getContext("2d");
  tg.drawImage(img, 0, 0, sw, sh);
  const grown = { at: (x, y) => { for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) if (m.at(x + dx, y + dy)) return true; return false; } };
  const ga = alphaCanvas(grown), gs = new OffscreenCanvas(sw, sh), gsg = gs.getContext("2d"); gsg.drawImage(ga, 0, 0, sw, sh);
  const px = tg.getImageData(0, 0, sw, sh), ap = gsg.getImageData(0, 0, sw, sh).data, n = sw * sh;
  const known = new Float32Array(n), cr = new Float32Array(n), cgr = new Float32Array(n), cb = new Float32Array(n);
  for (let i = 0; i < n; i++) { known[i] = 1 - ap[i * 4 + 3] / 255; cr[i] = px.data[i * 4] * known[i]; cgr[i] = px.data[i * 4 + 1] * known[i]; cb[i] = px.data[i * 4 + 2] * known[i]; }
  const filled = known.map(k => k >= 1 ? 1 : 0), fr = new Float32Array(n), fgr = new Float32Array(n), fb = new Float32Array(n);
  for (let r = 1; filled.some(v => !v) && r <= Math.max(sw, sh); r *= 2) for (let y = 0; y < sh; y++) for (let x = 0; x < sw; x++) {
    const i = y * sw + x; if (filled[i]) continue; let a1 = 0, a2 = 0, a3 = 0, wt = 0;
    for (let yy = Math.max(0, y - r); yy <= Math.min(sh - 1, y + r); yy++) for (let xx = Math.max(0, x - r); xx <= Math.min(sw - 1, x + r); xx++) { const j = yy * sw + xx; a1 += cr[j]; a2 += cgr[j]; a3 += cb[j]; wt += known[j]; }
    if (wt > .5) { fr[i] = a1 / wt; fgr[i] = a2 / wt; fb[i] = a3 / wt; filled[i] = 1; }
  }
  for (let i = 0; i < n; i++) { const k = known[i]; if (k >= 1) continue; px.data[i * 4] = px.data[i * 4] * k + fr[i] * (1 - k); px.data[i * 4 + 1] = px.data[i * 4 + 1] * k + fgr[i] * (1 - k); px.data[i * 4 + 2] = px.data[i * 4 + 2] * k + fb[i] * (1 - k); px.data[i * 4 + 3] = 255; }
  tg.putImageData(px, 0, 0);
  const hole = new OffscreenCanvas(FW, FH), hg = hole.getContext("2d");
  hg.filter = "blur(8px)"; hg.drawImage(tiny, 0, 0, FW, FH); hg.filter = "none";   // the app scales bilinear; a touch of blur hides the 12 px steps on video hg.globalCompositeOperation = "destination-in"; hg.drawImage(a, 0, 0);
  return { bmp: out, src, hole };
}
const cutRect = cut => ({ l: cut.src.l * VS, t: cut.src.t * VS, r: cut.src.r * VS, b: cut.src.b * VS });

// ---------- ClawArt ----------
const idle = open => ({ s: 3 + open * 20, l: 50, mid: 40 });
function armsOn(body, open) {
  const a = Math.min(body.a, 64);
  const hugL = clamp(body.top + body.h * 0.6, 44, 120), openL = clamp(body.top + body.h * 0.42, 36, 120);
  const hugS = a * 0.86, openS = a + 12, o = clamp(open, 0, 1);
  return { s: hugS + (openS - hugS) * o, l: hugL + (openL - hugL) * o, mid: Math.max(40, Math.min(hugL - 14, body.top + body.h * 0.35)) };
}
const mix = (a, b, k) => ({ s: a.s + (b.s - a.s) * k, l: a.l + (b.l - a.l) * k, mid: a.mid + (b.mid - a.mid) * k });
function clawBack(hx, hy, railY, arms) {
  g.lineWidth = 1.6; g.strokeStyle = rgba(.9, 230, 233, 240); g.lineCap = "butt";
  g.beginPath(); g.moveTo(hx, railY); g.lineTo(hx, hy); g.stroke();
  g.lineCap = "round"; g.strokeStyle = rgba(.75, 200, 205, 214); g.lineWidth = 4;
  g.beginPath(); g.moveTo(hx, hy + 9); g.quadraticCurveTo(hx + 4, hy + arms.mid * 0.6, hx, hy + arms.mid); g.stroke();
  const lg = g.createLinearGradient(hx - 16, 0, hx + 16, 0);
  lg.addColorStop(0, "#80868F"); lg.addColorStop(.45, "#F6F7FA"); lg.addColorStop(1, "#6D727C");
  g.fillStyle = lg; g.beginPath(); g.roundRect(hx - 15, hy - 7, 30, 17, 6); g.fill();
  g.fillStyle = "#2B2F36"; g.fillRect(hx - 15, hy + 4, 30, 2);
}
function mirrorGrad(x, half, cols) {   // Shader.TileMode.MIRROR over [x - half, x + half]
  const n = 12, lg = g.createLinearGradient(x - half * n, 0, x + half * n, 0);
  for (let i = 0; i < n; i++) {
    const a = i / n, b = (i + 1) / n, seq = i % 2 ? [...cols].reverse() : cols;
    seq.forEach((c, j) => lg.addColorStop(a + (b - a) * (j / (seq.length - 1)) * 0.999 + (j ? 0 : 0.0005), c));
  }
  return lg;
}
function clawFront(hx, hy, arms) {
  g.lineCap = "round"; g.lineJoin = "round";
  const w = arms.l > 70 ? 6 : 5;
  for (const k of [-1, 1]) {
    const tipX = hx + k * arms.s, tipY = hy + arms.l;
    const ctrlX = hx + k * (arms.s + Math.max(10, arms.s * 0.32)), ctrlY = hy + 9 + (arms.l - 9) * 0.35;
    const p = new Path2D(); p.moveTo(hx + k * 8, hy + 9); p.quadraticCurveTo(ctrlX, ctrlY, tipX, tipY); p.lineTo(tipX - k * 7, tipY + 4);
    g.strokeStyle = rgba(.55, 30, 33, 40); g.lineWidth = w + 2.2; g.stroke(p);
    g.strokeStyle = mirrorGrad(tipX, 4, ["#8F95A0", "#FFFFFF", "#7F8590"]); g.lineWidth = w; g.stroke(p);
  }
  g.lineCap = "butt"; g.fillStyle = "#5C626C";
  for (const k of [-1, 1]) { g.beginPath(); g.arc(hx + k * 8, hy + 9, 2.6, 0, 7); g.fill(); }
}

// ---------- CapsuleArt ----------
function capsule(x, y, r, deg, col, inside) {
  const rad = deg * Math.PI / 180;
  g.save(); g.translate(x, y); g.rotate(rad);
  if (r > 4) { g.beginPath(); g.arc(0, 0, r, 0, Math.PI * 2); g.clip(); }
  inside();
  if (r > 4) {
    const rg = g.createRadialGradient(-r * .25, -r * .6, 0, -r * .25, -r * .6, r * 1.8);
    rg.addColorStop(0, css(shade(col, .35))); rg.addColorStop(.5, css(col)); rg.addColorStop(1, css(shade(col, -.32)));
    g.fillStyle = rg; g.beginPath(); g.moveTo(0, 0); g.arc(0, 0, r, 0, Math.PI); g.closePath(); g.fill();
    g.fillStyle = css(shade(col, -.45), 170 / 255);
    for (const hx of [-.32, 0, .32]) { const cy = r * (hx === 0 ? .64 : .54); g.beginPath(); g.ellipse(hx * r, cy, r * .06, r * .043, 0, 0, 7); g.fill(); }
  }
  g.restore();
  if (r <= 4) return;
  g.save(); g.translate(x, y);
  let rg = g.createRadialGradient(0, 0, 0, 0, 0, r);
  rg.addColorStop(0, rgba(.05, 255, 255, 255)); rg.addColorStop(.82, rgba(.07, 255, 255, 255)); rg.addColorStop(1, rgba(.5, 255, 255, 255));
  g.save(); g.rotate(rad); g.beginPath(); g.rect(-r, -r, 2 * r, r); g.clip(); g.fillStyle = rg; g.beginPath(); g.arc(0, 0, r, 0, 7); g.fill(); g.restore();
  rg = g.createRadialGradient(-r * .35, -r * .45, 0, -r * .35, -r * .45, r * .45);
  rg.addColorStop(0, rgba(.8, 255, 255, 255)); rg.addColorStop(.45, rgba(.15, 255, 255, 255)); rg.addColorStop(1, "rgba(0,0,0,0)");
  g.fillStyle = rg; g.beginPath(); g.arc(0, 0, r, 0, 7); g.fill();
  const line = Math.max(1.5, r * .033);
  g.strokeStyle = rgba(.7, 255, 255, 255); g.lineWidth = line; g.beginPath(); g.arc(0, 0, r, 0, 7); g.stroke();
  g.rotate(rad);
  const band = Math.max(3, r * .16);
  g.fillStyle = css(shade(col, .2)); g.beginPath(); g.roundRect(-r - 1, -band / 2, 2 * r + 2, band, band / 2); g.fill();
  g.strokeStyle = css(shade(col, -.25)); g.lineWidth = line * .8; g.stroke();
  g.fillStyle = css(shade(col, .1)); g.beginPath(); g.roundRect(r * .88, -band * .8, r * .22, band * 1.6, band * .45); g.fill();
  g.strokeStyle = css(shade(col, -.3)); g.stroke();
  g.restore();
}

// ---------- ClawButton ----------
function button(x, y, ready, pressed) {
  const k = BTN_R / 29; g.save(); g.translate(x, y); g.scale(k, k); g.translate(-x, -y);
  const r = 29, side = PLATE_SIDE / k, foot = PLATE_FOOT / k, l = x - r - side, t = y - r - side, rt = x + r + side, b = y + r + foot;
  g.fillStyle = rgba(.4, 0, 0, 0); g.beginPath(); g.roundRect(l + 1, t + 5, rt - l, b - t, 10); g.fill();
  let lg = g.createLinearGradient(l, t, rt, b); lg.addColorStop(0, "#EEF0F3"); lg.addColorStop(.55, "#A9AFB8"); lg.addColorStop(1, "#D6DAE0");
  g.fillStyle = lg; g.beginPath(); g.roundRect(l, t, rt - l, b - t, 10); g.fill();
  g.lineWidth = 1; g.strokeStyle = "#7D838F"; g.beginPath(); g.roundRect(l + .5, t + .5, rt - l - 1, b - t - 1, 10); g.stroke();
  g.strokeStyle = rgba(.9, 255, 255, 255); g.beginPath(); g.moveTo(l + 8, t + 1.5); g.lineTo(rt - 8, t + 1.5); g.stroke();
  for (const [sx, sy] of [[l + 8, t + 8], [rt - 8, t + 8], [l + 8, b - 8], [rt - 8, b - 8]]) {
    const rg = g.createRadialGradient(sx - 1, sy - 1, 0, sx - 1, sy - 1, 4); rg.addColorStop(0, "#FAFAFA"); rg.addColorStop(1, "#6B717A");
    g.fillStyle = rg; g.beginPath(); g.arc(sx, sy, 3.2, 0, 7); g.fill();
    g.strokeStyle = "#555A62"; g.lineWidth = .9; g.beginPath(); g.moveTo(sx - 2, sy + 1); g.lineTo(sx + 2, sy - 1); g.stroke();
  }
  g.font = "700 13px 'Noto Sans KR'"; g.textAlign = "center";
  g.fillStyle = "#FFFFFF"; g.fillText("집기", x, b - 8); g.fillStyle = "#4A505A"; g.fillText("집기", x, b - 9);
  const cg = g.createConicGradient(0, x, y);
  ["#8A9099", "#F7F8FA", "#AAB0B9", "#5F656E", "#D9DDE3", "#8A9099"].forEach((c, i) => cg.addColorStop(i / 5, c));
  g.fillStyle = cg; g.beginPath(); g.arc(x, y, r + 6, 0, 7); g.fill();
  g.fillStyle = "#2A070C"; g.beginPath(); g.arc(x, y, r + 1, 0, 7); g.fill();
  const sink = pressed && ready ? 2.5 : 0;
  if (sink === 0) { g.fillStyle = ready ? "#6A0510" : "#3C4046"; g.beginPath(); g.arc(x, y + 2.5, r - 1.5, 0, 7); g.fill(); }
  const dome = ready ? ["#FF7A80", "#E01B2C", "#A50D1B"] : ["#C4C8CE", "#8C9199", "#5E636A"], dy = sink - 1;
  const rg = g.createRadialGradient(x - .16 * r, y + dy - .4 * r, 0, x - .16 * r, y + dy - .4 * r, 1.3 * r);
  rg.addColorStop(0, dome[0]); rg.addColorStop(.45, dome[1]); rg.addColorStop(.8, dome[2]);
  g.fillStyle = rg; g.beginPath(); g.arc(x, y + dy, r - 1.5, 0, 7); g.fill();
  g.save(); g.translate(x - .12 * r, y + dy - .55 * r); g.rotate(-18 * Math.PI / 180); g.translate(-(x - .12 * r), -(y + dy - .55 * r));
  lg = g.createLinearGradient(0, y + dy - .8 * r, 0, y + dy - .3 * r); lg.addColorStop(0, rgba(.85, 255, 255, 255)); lg.addColorStop(1, rgba(0, 255, 255, 255));
  g.fillStyle = lg; g.beginPath(); g.ellipse(x - .12 * r, y + dy - .55 * r, .46 * r, .25 * r, 0, 0, 7); g.fill();
  g.restore(); g.restore();
}

// ---------- the game state (CatchGame.step + Claw.step + Capsule.step) ----------
const DOWN_SPEED = .26, UP_SPEED = .15, TIP = 44, HOME_X = .1, HOME_SPEED = .0008, DIG_MS = 140, CLOSE_MS = 380, GRIP_MS = 560;
const c = { st: "AIM", x: X0, aimed: false, y: RAIL + 28, open: 1, t: 0, carryDy: 0, bodyW: 0, bodyH: 0, minOpen: 0, dig: 0, contactY: 0, base: 0, restY: RAIL + 28 };
const dangle = { rot: 0, w: 0, prevRel: NaN, prevV: 0,
  reset() { this.rot = 0; this.w = 0; this.prevRel = NaN; this.prevV = 0; },
  step(dt, rel, cap) {
    const v = isNaN(this.prevRel) ? 0 : (rel - this.prevRel) / dt; this.prevRel = rel;
    this.w += -(v - this.prevV) * .25; this.prevV = v;
    const k = (2 * Math.PI / 1100) ** 2, cc = 2 * .12 * Math.sqrt(k);
    this.w += (-k * this.rot - cc * this.w) * dt; this.rot += this.w * dt;
    if (Math.abs(this.rot) > cap) { this.rot = clamp(this.rot, -cap, cap); this.w *= -.3; }
  } };
let time = 0, swing = 0, vsw = 0, lastX = HOME_X, pulse = 0, toast = null, hint = Q.get("hint") !== "0", pressed = false, saved = false;
let clawScale = 1, hugTop = 0, grabOff = 0, arms = idle(1), joltT = -1, railTickX = -1;
let mask = null, frozen = null, held = null, cap = null, capT = 0, dexShown = DEX - 1, motor = 0;
const col = hex(CAP);

// the finger: drag from home to the cat (0.5 s .. 1.3 s), press 1.55 s, let go 1.7 s
const PRESS = 1550, LETGO = 1700;
function input() {
  if (c.st !== "AIM" || held) return;
  if (time >= AIM0 && time <= AIM1) { const k = (time - AIM0) / (AIM1 - AIM0), e = 1 - (1 - k) ** 3; c.x = clamp(X0 + (AIM_TO - X0) * e, .06, .94); c.aimed = true; }
  pressed = time >= PRESS && time < LETGO && !cap;
  if (time >= LETGO && time < LETGO + DT && !cap) { c.st = "DOWN"; c.t = 0; hint = false; sfx("drop", .5); }
}

async function step(dt) {
  time += dt;
  input();
  const acc = (c.x - lastX) * W; lastX = c.x;
  vsw += (-swing * .012 + acc * .0009) * dt; vsw *= .992 ** dt; swing = clamp(swing + vsw * dt * .06, -.3, .3);
  pulse = Math.max(0, pulse - dt / 500);
  if (toast) { toast.t += dt; if (toast.t > 1400) toast = null; }
  const px = c.x * W;

    if (row != null) {

const camIndex = () => START + Math.floor(time / DT);

// ---------- drawing (CatchGame.render) ----------
async function render() {
  g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, 1080, 1920);
  const bk = BLURAT ? clamp((time - BLURAT) / 400, 0, 1) : 0;
  g.globalAlpha = 1; if (bk > 0) g.filter = `blur(${BLUR * bk}px)`;
  g.drawImage(await frameImg(camIndex()), 0, 0, 1080, 1920);
  g.scale(D, D);
  if (frozen && c.st !== "AIM") { g.drawImage(frozen, 0, 0, W, H); if (held && c.st !== "GRIP") g.drawImage(held.hole, 0, 0, W, H); }
  g.filter = "none";
  // the app's own layers (glass, rail, button, toast, status bar): faded in at FADE / after UIAT, out while blurring
  const uiA = (UIAT > 0 ? clamp((time - UIAT) / Math.max(1, FADE), 0, 1) : FADE > 0 ? Math.min(1, time / FADE) : 1) * (1 - bk);   // the cut is ready as the claw lifts (the model call takes the grip's time on a phone)
  if (DIM > 0) { const al = g.globalAlpha; g.globalAlpha = 1; g.fillStyle = rgba(DIM, 0, 0, 0); g.fillRect(0, 0, W, H); g.globalAlpha = al; }   // reel: the camera a little darker so the claw reads
  let lg = g.createLinearGradient(0, 0, W, H * .7); lg.addColorStop(0, rgba(.07, 255, 255, 255)); lg.addColorStop(.4, "rgba(255,255,255,0)");
  g.globalAlpha = uiA; g.fillStyle = lg; g.fillRect(0, 0, W, H); g.globalAlpha = 1;
  const cx = c.x * W;
  const jolt = joltT < 0 ? 0 : 4 * Math.PI / 180 * Math.sin(joltT / 1000 * 14 * 2 * Math.PI) * Math.max(0, 1 - joltT / 120);
  const sw = (c.st === "AIM" ? swing : swing * .6) + jolt;
  const hang = c.st === "UP" || c.st === "CARRY" ? dangle.rot * .35 : 0;
  const rad = sw + hang * Math.PI / 180;
  const rot = () => { g.translate(cx, RAIL); g.rotate(rad); g.translate(-cx, -RAIL); };
  const sc = () => { g.translate(cx, c.y); g.scale(clawScale, clawScale); g.translate(-cx, -c.y); };
  g.save(); rot(); g.save(); sc(); clawBack(cx, c.y, RAIL, arms); g.restore();
  const hanging = c.st === "UP" || c.st === "CARRY";
  if (hanging) drawCatch(); g.restore();

    if (!held) return;

    const s2 = 1 + ((cap.r > 0 ? Math.min(1, cap.r * 1.6 / Math.max(bw, bh)) : 1) - 1) * k;

    const k = (time % 1400) / 1400;
    g.strokeStyle = rgba(.8 * (1 - k), 255, 216, 77); g.lineWidth = 3; g.beginPath(); g.arc(btnX, btnY, BTN_R + 10 + 22 * k, 0, 7); g.stroke();
    g.font = "700 17px 'Noto Sans KR'"; g.textAlign = "center"; g.fillStyle = rgba(.92, 255, 255, 255);
    g.shadowColor = "#000"; g.shadowBlur = 8 * D; g.fillText("끌어서 맞추고 집기를 누르세요", W / 2, btnY - BTN_R - PLATE_SIDE - 16); g.shadowBlur = 0;
  }

}
function drawCatch() {

  const r = cutRect(held); g.drawImage(held.bmp, r.l, r.t + c.carryDy, r.r - r.l, r.b - r.t);

function topBar() {
  const r = RAIL;

  g.fillStyle = lg; g.fillRect(0, 0, W, r);

  g.fillStyle = lg; g.fillRect(0, r - 5, W, 6);

  g.save(); g.translate(50, r - 27);

  g.strokeStyle = "#fff"; g.lineWidth = 1.6;
  g.beginPath(); g.roundRect(-24, -6, 18, 13, 3); g.stroke(); g.beginPath(); g.arc(-15, .5, 3.4, 0, 7); g.stroke(); g.strokeRect(-19, -8.5, 6, 2.5);
  g.font = "700 15px 'Noto Sans KR'"; g.textAlign = "center"; g.fillStyle = "#fff"; g.fillText("끄기", 14, 5.5);

    outputConfidenceMasks: true, outputCategoryMask: false });
