<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>네컷 실험</title>
<style>
:root{--bg:#f6f4f1;--card:#fff;--ink:#1d1b22;--sub:#6a6572;--line:#e2ddd6;--ok:#178a55;--bad:#c8372d;--wait:#8a7a2a;--accent:#7b5cd6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif}
main{max-width:520px;margin:0 auto;padding:16px 16px 60px;display:flex;flex-direction:column;gap:14px}
h1{font-size:22px;margin:4px 0 0}
p{margin:0}
.sub{color:var(--sub);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.card h2{font-size:16px;margin:0}
button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:11px 14px;background:var(--accent);color:#fff}
button.alt{background:#fff;color:var(--ink);border:1px solid var(--line)}
button:disabled{opacity:.4}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1 1 auto}
.stage{position:relative;width:100%;aspect-ratio:3/4;border-radius:12px;overflow:hidden;
  background:repeating-conic-gradient(#ddd 0 25%,#fff 0 50%) 0 0/20px 20px}
.stage video,.stage canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#cam{transform:scaleX(-1)}
#out{display:none}
video.play{width:100%;border-radius:10px;background:#000}
img.shot{width:100%;border-radius:10px}
#log{display:flex;flex-direction:column;gap:6px;font-size:13px}
#log div{display:flex;gap:8px;align-items:baseline}
#log b{min-width:68px}
.s-ok{color:var(--ok)}.s-bad{color:var(--bad)}.s-wait{color:var(--wait)}
textarea{width:100%;height:150px;font:12px/1.4 ui-monospace,monospace;border:1px solid var(--line);border-radius:10px;padding:8px}
</style>
</head>
<body>
<main>
  <div>
    <h1>네컷 실험 페이지</h1>
    <p class="sub">이 폰·이 앱에서 카메라, 누끼, 2초 녹화, 저장이 되는지 봅니다. 위에서부터 차례로 눌러 주세요. 끝나면 맨 아래 결과를 캡처해서 보내 주세요.</p>
  </div>

  <div class="card">
    <h2>1. 카메라</h2>
    <div class="stage"><video id="cam" playsinline muted autoplay></video><canvas id="out"></canvas></div>
    <div class="row"><button id="bCam">카메라 켜기</button></div>
  </div>

  <div class="card">
    <h2>2. 실시간 누끼</h2>
    <p class="sub">켜면 위 화면이 사람만 남고 보라 배경으로 바뀝니다. 머리카락 가장자리를 봐 주세요.</p>
    <div class="row"><button id="bSeg" disabled>누끼 켜기</button><button id="bBg" class="alt" disabled>배경 바꾸기</button></div>
  </div>

  <div class="card">
    <h2>3. 2초 녹화</h2>
    <div class="row"><button id="bRecCam" disabled>카메라 그대로 2초</button><button id="bRecCut" class="alt" disabled>누끼 화면 2초</button></div>
    <video id="clip" class="play" controls playsinline hidden></video>
  </div>

  <div class="card">
    <h2>4. 저장</h2>
    <p class="sub">누른 뒤 사진첩(갤러리)에 실제로 들어갔는지 확인해 주세요.</p>
    <div class="row"><button id="bShotShare" disabled>사진 · 공유로 저장</button><button id="bShotDl" class="alt" disabled>사진 · 다운로드</button></div>
    <div class="row"><button id="bClipShare" disabled>영상 · 공유로 저장</button><button id="bClipDl" class="alt" disabled>영상 · 다운로드</button></div>
    <img id="shot" class="shot" alt="저장 테스트용 사진. 길게 눌러 저장도 해 보세요" hidden>
    <p class="sub" id="hold" hidden>위 사진을 길게 눌러 저장도 되는지 봐 주세요.</p>
  </div>

  <div class="card">
    <h2>결과</h2>
    <div id="log"></div>
    <textarea id="txt" readonly></textarea>
    <div class="row"><button id="bCopy" class="alt">결과 복사</button></div>
  </div>
</main>

<script type="module">
const MP = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";
const MODEL = "https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_segmenter/float16/latest/selfie_segmenter.tflite";
const $ = id => document.getElementById(id);
const cam = $("cam"), out = $("out");
const R = {};          // key -> [status, text]
const ORDER = ["env","cam","model","seg","recCam","recCut","shotShare","shotDl","clipShare","clipDl","hold"];
const NAMES = {env:"환경",cam:"카메라",model:"누끼 모델",seg:"누끼 속도",recCam:"녹화(원본)",recCut:"녹화(누끼)",
  shotShare:"사진 공유",shotDl:"사진 다운",clipShare:"영상 공유",clipDl:"영상 다운",hold:"길게 눌러"};

function set(k, st, text){ R[k] = [st, text]; render(); }
function render(){
  const icon = {ok:"✅", bad:"❌", wait:"⏳"};
  $("log").innerHTML = ORDER.filter(k => R[k]).map(k =>
    `<div><b>${NAMES[k]}</b><span class="s-${R[k][0]}">${icon[R[k][0]]} ${R[k][1]}</span></div>`).join("");
  $("txt").value = ORDER.filter(k => R[k]).map(k => `${NAMES[k]}: ${R[k][0]} ${R[k][1]}`).join("\n")
    + "\nUA: " + navigator.userAgent;
}
const ua = navigator.userAgent;
const app = /Instagram/.test(ua) ? "Instagram" : /Barcelona|Threads/i.test(ua) ? "Threads"
  : /KAKAOTALK/i.test(ua) ? "KakaoTalk" : /FBAN|FBAV/.test(ua) ? "Facebook" : "브라우저";
set("env", "ok", `${app} · ${/iPhone|iPad/.test(ua) ? "iOS" : /Android/.test(ua) ? "Android" : "PC"} · ${screen.width}x${screen.height}`);

// 1. camera
let stream;
$("bCam").onclick = async () => {
  set("cam", "wait", "권한 요청 중");
  const t0 = performance.now();
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user", width: { ideal: 720 }, height: { ideal: 960 } }, audio: false });
    cam.srcObject = stream;
    await cam.play();
    await new Promise(r => cam.readyState >= 2 ? r() : cam.onloadeddata = r);
    set("cam", "ok", `${cam.videoWidth}x${cam.videoHeight} · ${Math.round(performance.now() - t0)}ms`);
    for (const id of ["bSeg","bRecCam","bShotShare","bShotDl"]) $(id).disabled = false;
    $("bCam").disabled = true;
  } catch (e) { set("cam", "bad", `${e.name}: ${e.message}`); }
};

// 2. segmentation
let seg, segOn = false, flip = null, bgIdx = 0, times = [];
const BGS = ["#b9a6e6", "#f2d6c2", "#ffffff", "#cfe3dc"];
const cut = document.createElement("canvas"), mc = document.createElement("canvas");
const ctx = out.getContext("2d"), cctx = cut.getContext("2d"), mctx = mc.getContext("2d");

async function loadSeg(){
  set("model", "wait", "불러오는 중");
  const t0 = performance.now();
  const { FilesetResolver, ImageSegmenter } = await import(MP + "/vision_bundle.mjs");
  const files = await FilesetResolver.forVisionTasks(MP + "/wasm");
  let delegate = "GPU";
  const mk = d => ImageSegmenter.createFromOptions(files, { baseOptions: { modelAssetPath: MODEL, delegate: d },
    runningMode: "VIDEO", outputConfidenceMasks: true, outputCategoryMask: false });
  try { seg = await mk("GPU"); } catch (e) { delegate = "CPU"; seg = await mk("CPU"); }
  set("model", "ok", `${delegate} · ${Math.round(performance.now() - t0)}ms`);
}

function frame(){
  if (!segOn) return;
  const w = cam.videoWidth, h = cam.videoHeight;
  if (out.width !== w) { out.width = cut.width = w; out.height = cut.height = h; }
  const t0 = performance.now();
  seg.segmentForVideo(cam, t0, res => {
    const m = res.confidenceMasks[res.confidenceMasks.length - 1];
    const mw = m.width, mh = m.height, a = m.getAsFloat32Array();
    if (flip === null) {      // person should be in the centre: decide once which way the mask points
      const c = a[(mh >> 1) * mw + (mw >> 1)], k = a[0] + a[mw - 1];
      flip = c < k / 2;
    }
    if (mc.width !== mw) { mc.width = mw; mc.height = mh; }
    const img = mctx.createImageData(mw, mh);
    for (let i = 0; i < a.length; i++) img.data[i * 4 + 3] = 255 * (flip ? 1 - a[i] : a[i]);
    mctx.putImageData(img, 0, 0);
  });
  times.push(performance.now() - t0);
  cctx.globalCompositeOperation = "copy";
  cctx.save(); cctx.scale(-1, 1); cctx.drawImage(cam, -w, 0, w, h); cctx.restore();
  cctx.globalCompositeOperation = "destination-in";
  cctx.save(); cctx.scale(-1, 1); cctx.drawImage(mc, -w, 0, w, h); cctx.restore();
  ctx.fillStyle = BGS[bgIdx]; ctx.fillRect(0, 0, w, h);
  ctx.drawImage(cut, 0, 0);
  if (times.length === 60) {
    const avg = times.reduce((s, x) => s + x, 0) / times.length;
    set("seg", avg < 66 ? "ok" : "bad", `프레임당 ${avg.toFixed(0)}ms · 약 ${Math.min(60, 1000 / avg).toFixed(0)}fps`);
  }
  requestAnimationFrame(frame);
}

$("bSeg").onclick = async () => {
  $("bSeg").disabled = true;
  try {
    if (!seg) await loadSeg();
    segOn = true; times = []; out.style.display = "block"; cam.style.visibility = "hidden";
    set("seg", "wait", "측정 중");
    $("bBg").disabled = false; $("bRecCut").disabled = false;
    requestAnimationFrame(frame);
  } catch (e) { set("model", "bad", `${e.name}: ${e.message}`); }
};
$("bBg").onclick = () => { bgIdx = (bgIdx + 1) % BGS.length; };

// 3. 2-second recording
let clipBlob = null;
function pickMime(){
  for (const t of ["video/mp4;codecs=avc1", "video/mp4", "video/webm;codecs=vp9", "video/webm"])
    if (window.MediaRecorder && MediaRecorder.isTypeSupported(t)) return t;
  return "";
}
async function rec2(src, key){
  if (!window.MediaRecorder) { set(key, "bad", "MediaRecorder 없음"); return; }
  const mime = pickMime();
  set(key, "wait", "녹화 중");
  try {
    const r = new MediaRecorder(src, mime ? { mimeType: mime } : undefined), chunks = [];
    r.ondataavailable = e => e.data.size && chunks.push(e.data);
    const done = new Promise(res => r.onstop = res);
    r.start(250);
    await new Promise(res => setTimeout(res, 2000));
    r.stop();
    await Promise.race([done, new Promise((_, rej) => setTimeout(() => rej(new Error("onstop 안 옴")), 4000))]);
    clipBlob = new Blob(chunks, { type: (r.mimeType || mime || "video/webm").split(";")[0] });
    const v = $("clip"); v.hidden = false; v.src = URL.createObjectURL(clipBlob); v.play().catch(() => {});
    set(key, clipBlob.size > 0 ? "ok" : "bad", `${clipBlob.type} · ${(clipBlob.size / 1024).toFixed(0)}KB`);
    $("bClipShare").disabled = $("bClipDl").disabled = false;
  } catch (e) { set(key, "bad", `${e.name}: ${e.message}`); }
}
$("bRecCam").onclick = () => rec2(stream, "recCam");
$("bRecCut").onclick = () => {
  if (!out.captureStream) { set("recCut", "bad", "canvas.captureStream 없음"); return; }
  rec2(out.captureStream(30), "recCut");
};

// 4. saving
function snap(){
  return new Promise(res => {
    const c = document.createElement("canvas"), src = segOn ? out : cam;
    c.width = src.videoWidth || src.width; c.height = src.videoHeight || src.height;
    const x = c.getContext("2d");
    if (!segOn) { x.scale(-1, 1); x.drawImage(cam, -c.width, 0); } else x.drawImage(out, 0, 0);
    c.toBlob(b => res(b), "image/jpeg", 0.9);
  });
}
async function shareFile(blob, name, key){
  const f = new File([blob], name, { type: blob.type });
  if (!navigator.canShare || !navigator.canShare({ files: [f] })) { set(key, "bad", "파일 공유 미지원"); return; }
  try { await navigator.share({ files: [f] }); set(key, "ok", "공유 시트 완료 (사진첩에 들어갔는지 확인)"); }
  catch (e) { set(key, e.name === "AbortError" ? "wait" : "bad", `${e.name}: ${e.message}`); }
}
function download(blob, name, key){
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove();
  set(key, "wait", "링크 눌림 · 저장됐는지 직접 확인");
}
const ext = b => b.type.includes("mp4") ? "mp4" : "webm";
$("bShotShare").onclick = async () => shareFile(await snap(), "dot-lab-test.jpg", "shotShare");
$("bShotDl").onclick = async () => {
  const b = await snap(); download(b, "dot-lab-test.jpg", "shotDl");
  $("shot").src = URL.createObjectURL(b); $("shot").hidden = false; $("hold").hidden = false;
  set("hold", "wait", "사진 길게 눌러 저장되는지 확인");
};
$("bClipShare").onclick = () => clipBlob && shareFile(clipBlob, "dot-lab-test." + ext(clipBlob), "clipShare");
$("bClipDl").onclick = () => clipBlob && download(clipBlob, "dot-lab-test." + ext(clipBlob), "clipDl");

$("bCopy").onclick = async () => {
  try { await navigator.clipboard.writeText($("txt").value); $("bCopy").textContent = "복사됨"; }
  catch { $("txt").select(); $("bCopy").textContent = "선택됨 · 길게 눌러 복사"; }
};
</script>
</body>
</html>
