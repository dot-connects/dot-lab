<title>테마 고르기 화면</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&family=Space+Grotesk:wght@500;700&family=Dongle:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
/* 따로 같이 네컷 — screen 0 (A picks the theme), 3 layouts side by side. Page chrome follows the viewer's theme; the
   phone frames keep the app's own colours (they are pictures of the app). Frames are real 430x932 / 360x640 CSS px,
   zoomed down to fit a narrow screen. */
:root{--bg:#ecebef;--fg:#1d1b22;--sub:#4a4652;--card:#fff;--line:#cfccd6;--chip:#1d1b22;--chipfg:#fff;
  --F:#000;--Fw:#fff;--lime:#d6ff3d;--lav:#f6f1ff;--lav2:#efe6ff;--dot:#d9ccfb;--pink:#ff8fbd;--deep:#5a31ab;--ink:#2a2140;
  --sans:'Noto Sans KR',system-ui,sans-serif;--num:'Space Grotesk','Noto Sans KR',sans-serif;--cute:'Dongle','Gowun Dodum',sans-serif;--cuteb:'Gowun Dodum','Noto Sans KR',sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17161b;--fg:#ecebf0;--sub:#b3afbb;--card:#222128;--line:#3a3842;--chip:#ecebf0;--chipfg:#17161b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17161b;--fg:#ecebf0;--sub:#b3afbb;--card:#222128;--line:#3a3842;--chip:#ecebf0;--chipfg:#17161b;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font:15px/1.55 var(--sans);overflow-x:hidden}
.wrap{max-width:1500px;margin:0 auto;padding-block:22px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font:900 26px/1.25 var(--sans);letter-spacing:-.03em;text-wrap:balance}
.lead{color:var(--sub);margin-top:6px;max-width:720px}
.tgl{display:inline-flex;margin-top:14px;border:2px solid var(--fg);border-radius:99px;overflow:hidden}
.tgl button{appearance:none;border:0;background:none;color:var(--fg);font:700 14px var(--sans);padding:7px 16px;cursor:pointer;min-height:40px}
.tgl button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.tgl button:focus-visible{outline:3px solid var(--pink);outline-offset:-3px}
.row{display:flex;gap:26px;margin-top:22px;flex-wrap:wrap}
figure{width:calc(var(--W) * var(--z,1))}
.slot{zoom:var(--z,1)}
figcaption{margin-top:10px;font-size:14px;line-height:1.5;color:var(--sub)}
figcaption h2{font:900 19px/1.3 var(--sans);color:var(--fg);display:flex;gap:8px;align-items:baseline;letter-spacing:-.02em}
figcaption .no{font:700 14px var(--num);background:var(--chip);color:var(--chipfg);padding:1px 10px;border-radius:99px}
body{--W:430px;--H:932px}
body.sm{--W:360px;--H:640px}

/* ---------------- phone frame (app colours, both page themes) ---------------- */
.fr{width:var(--W);height:var(--H);position:relative;overflow:hidden;border-radius:26px;box-shadow:0 0 0 1px #0000001f,0 10px 28px #00000026;
  background:#fff;color:#0d0d0d;display:flex;flex-direction:column;word-break:keep-all;container-type:size}
.top{display:flex;justify-content:space-between;align-items:center;padding:18px 16px 0;font:700 13px var(--num);letter-spacing:.18em}
.top b{font:700 15px var(--sans);letter-spacing:0;text-decoration:none}
button{font:inherit;color:inherit}
.p{position:absolute;bottom:0}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

/* a strip cell: two people on a soft ground (wide = 552:382, tall = 3:4) */
.c{position:relative;overflow:hidden;aspect-ratio:552/382;background:#e9e3dc}
.c.t{aspect-ratio:3/4}
.c svg.pp{position:absolute;inset:0;width:100%;height:100%}
.c.k2{background:#dfe7ee}.c.k3{background:#efe2e6}.c.k4{background:#e4eadf}

/* ===== 1: two upright cards side by side, each shows the strip you get ===== */
.L1{padding:0 16px}
.L1 h3{font:900 30px/1.2 var(--sans);letter-spacing:-.04em;margin-top:26px;text-wrap:balance}
.L1 .sub{color:#3d3540;font-size:15px;margin-top:4px}
.L1 .two{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:22px 0 14px;min-height:0}
.L1 .card{position:relative;border-radius:20px;overflow:hidden;display:grid;grid-template-rows:minmax(0,1fr) auto auto;justify-items:center;padding:16px 14px 14px;gap:10px;min-height:0;cursor:pointer}
.L1 .card .strip{width:76%;min-height:0;display:flex;flex-direction:column;gap:5px;padding:7px 7px 0}
.L1 .card .strip .c{flex:1 1 0;min-height:0;aspect-ratio:auto}
.L1 .card .strip i{font:700 9px/1 var(--num);letter-spacing:.14em;text-align:center;font-style:normal;padding:4px 0 7px;white-space:nowrap}
.L1 .nm{font:900 22px/1 var(--sans);letter-spacing:-.03em;display:flex;align-items:center;gap:8px;white-space:nowrap}
.L1 .one{font-size:13px;line-height:1.35;text-align:center;min-height:2.7em}
.L1 .f{background:#000;color:#fff}
.L1 .f::before,.L1 .f::after{content:"";position:absolute;top:0;bottom:0;width:10px;background:repeating-linear-gradient(#000 0 6px,#fff 6px 14px,#000 14px 20px) 2px 0/6px 100%;animation:vspr 2.4s linear infinite}
.L1 .f::before{left:2px}.L1 .f::after{right:2px}
@keyframes vspr{to{background-position:2px 40px}}
.L1 .f .strip{background:#000;outline:3px solid var(--lime);outline-offset:3px}
.L1 .f .strip i{color:var(--lime)}
.L1 .f .one{color:#d0d0d0}
.L1 .f .nm i{width:16px;height:16px;background:var(--lime)}
.L1 .u{background:radial-gradient(circle at 1px 1px,var(--dot) 1px,transparent 1.6px) 0 0/16px 16px,linear-gradient(var(--lav),var(--lav2));color:var(--ink);box-shadow:inset 0 0 0 2px #e2d6fb}
.L1 .u .strip{background:#fff;border-radius:10px;box-shadow:0 5px 0 #d6c6f6,0 10px 18px #6b3fc42e;padding-top:20px;position:relative}
.L1 .u .strip::before{content:"";position:absolute;left:0;right:0;top:0;height:18px;border-radius:10px 10px 0 0;
  background:radial-gradient(circle at 50% 0,var(--pink) 5px,transparent 5.5px) 0 9px/10.4px 6px repeat-x,linear-gradient(var(--pink),var(--pink)) 0 4px/100% 5px no-repeat}
.L1 .u .strip .c{border-radius:5px}
.L1 .u .strip i{font:700 15px/1 var(--cute);letter-spacing:0;color:var(--ink);padding:3px 0 6px}
.L1 .u .nm{font:700 40px/.8 var(--cute);padding-top:6px}
.L1 .u .nm svg{width:22px;height:20px;fill:var(--pink)}
.L1 .u .one{font-family:var(--cuteb);color:#4a3f63}
.L1 .foot{text-align:center;color:#3d3540;font-size:14px;padding-bottom:22px}
.sm .L1 h3{font-size:24px;margin-top:16px}.sm .L1 .two{margin:14px 0 10px}.sm .L1 .one{display:none}.sm .L1 .foot{padding-bottom:14px}

/* ===== 2: one live preview of the camera screen + a switch + start ===== */
.L2{padding:0 16px}
.L2 h3{font:900 28px/1.2 var(--sans);letter-spacing:-.04em;margin-top:22px}
.L2 .pv{flex:1;min-height:0;margin:16px auto 14px;aspect-ratio:430/932;border-radius:22px;overflow:hidden;position:relative;box-shadow:0 0 0 3px #000,0 10px 24px #0003;display:flex;flex-direction:column;container-type:inline-size}
.L2 .sw{display:grid;grid-template-columns:1fr 1fr;background:#efeff2;border-radius:99px;padding:4px;gap:4px}
.L2 .sw button{appearance:none;border:0;background:none;border-radius:99px;min-height:46px;font:700 16px var(--sans);cursor:pointer}
.L2 .sw button[aria-pressed="true"]{background:#000;color:#fff}
.L2[data-t="cute"] .sw button[aria-pressed="true"]{background:var(--deep)}
.L2 .sw button:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
.L2 .go{margin:12px 0 20px;min-height:56px;display:grid;place-items:center;font:900 19px var(--sans);background:#000;color:#fff;position:relative}
.L2 .go::after{content:"";position:absolute;right:16px;top:50%;margin-top:-8px;width:16px;height:16px;background:var(--lime)}
.L2[data-t="cute"] .go{border-radius:99px;background:linear-gradient(#ffffff70,#ffffff00 55%),var(--pink);color:#3a1230;font:700 34px/1 var(--cute);padding-top:5px;box-shadow:0 5px 0 #d9578f}
.L2[data-t="cute"] .go::after{display:none}
.L2 .note{text-align:center;color:#3d3540;font-size:13px;margin-top:-6px}
.sm .L2 h3{font-size:22px;margin-top:12px}.sm .L2 .pv{margin:10px auto}.sm .L2 .go{margin:10px 0 12px;min-height:48px}.sm .L2 .note{display:none}
/* the mini camera screens (sizes in cqw of the preview) */
.cam{position:absolute;inset:0;display:flex;flex-direction:column;transition:opacity .25s}
.cam[hidden]{display:flex!important;opacity:0;pointer-events:none}
.cam.f{background:#000;color:#fff}
.cam .hd{display:flex;align-items:center;gap:3cqw;padding:5cqw 4cqw 3cqw}
.cam.f .hd b{font:700 5cqw/1 var(--num);background:var(--lime);color:#000;padding:1.6cqw 2.6cqw}
.cam.f .hd span{font:900 5.6cqw/1.2 var(--sans);letter-spacing:-.04em;white-space:nowrap}
.cam .cf{margin-top:auto;padding:3.4cqw 0}
.cam.f .cf{background:repeating-linear-gradient(90deg,#000 0 1.2cqw,#fff 1.2cqw 3.3cqw,#000 3.3cqw 4.4cqw) 0 .8cqw/100% 1.9cqw no-repeat,repeating-linear-gradient(90deg,#000 0 1.2cqw,#fff 1.2cqw 3.3cqw,#000 3.3cqw 4.4cqw) 0 calc(100% - .8cqw)/100% 1.9cqw no-repeat,#000;animation:hspr 1.4s linear infinite}
@keyframes hspr{to{background-position:4.4cqw .8cqw,4.4cqw calc(100% - .8cqw),0 0}}
.cam .cf .c{aspect-ratio:552/382}
.cam .pn{margin-top:auto;display:flex;justify-content:space-around;align-items:center;padding:6cqw 4cqw 9cqw}
.cam.f .pn{border-top:.5cqw solid #fff}
.cam .pn i{width:12cqw;height:12cqw;border-radius:50%;border:.6cqw solid currentColor;opacity:.8}
.cam .pn u{width:19cqw;height:19cqw;border-radius:50%;background:#fff;box-shadow:0 0 0 1.4cqw #000,0 0 0 2.2cqw #fff}
.cam.u{background:radial-gradient(circle at 1px 1px,var(--dot) 1px,transparent 1.6px) 0 0/16px 16px,linear-gradient(var(--lav),var(--lav2));color:var(--ink)}
.cam.u .hd svg{width:11cqw;height:11.7cqw;flex:none}
.cam.u .hd span{flex:1;background:#fff;border-radius:4cqw;padding:2.4cqw 3cqw 1.2cqw;font:700 8cqw/1 var(--cute);box-shadow:0 1cqw 3cqw #6b3fc426;white-space:nowrap}
.cam.u .hd span b{background:#e6dcff;border-radius:99px;padding:.6cqw 2.4cqw 0;margin-right:2cqw;font-weight:700}
.cam.u .cf{padding:5.1cqw 0 0;background:radial-gradient(circle at 50% 0,var(--pink) 1.6cqw,transparent 1.75cqw) 0 3cqw/3.4cqw 2cqw repeat-x,linear-gradient(var(--pink),var(--pink)) 0 1.4cqw/100% 1.7cqw no-repeat,linear-gradient(#fff,#fff) 0 0/100% 5.1cqw no-repeat}
.cam.u .cf .c{border-radius:0 0 4cqw 4cqw}
.cam.u .pn{background:#fff;border-radius:6cqw 6cqw 0 0;box-shadow:0 -1.2cqw 0 #e6dcff}
.cam.u .pn i{border-color:#d6c6f6;background:#f6f1ff;opacity:1}
.cam.u .pn u{background:var(--pink);box-shadow:0 1.4cqw 0 #d9578f,0 0 0 2cqw #fff,0 0 0 2.8cqw #ffd3e6}

/* ===== 3: the screen split in two halves, each half is the theme itself ===== */
.L3{padding:0}
.L3 .top{position:absolute;left:0;right:0;top:0;z-index:5;color:#fff}
.L3 .half{flex:none;height:50%;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;padding:0 20px 22px;cursor:pointer;min-height:0}
.L3 .hf{padding-bottom:50px}
.L3 .hf{background:#000;color:#fff;padding-top:60px}
.L3 .hf .rl{position:absolute;left:0;top:50%;transform:translateY(-62%);display:flex;gap:10px;animation:roll 12s linear infinite}
.L3 .hf .rl .c{width:46cqw;flex:none;opacity:.9}
@keyframes roll{to{transform:translate(calc(-4 * (46cqw + 10px)),-62%)}}
.L3 .hf::before,.L3 .hf::after{content:"";position:absolute;left:0;right:0;height:10px;background:repeating-linear-gradient(90deg,#000 0 6px,#fff 6px 16px,#000 16px 22px);animation:t0 2.6s linear infinite}
.L3 .hf::before{top:66px}.L3 .hf::after{top:calc(50% + 21cqw - 8px)}
@keyframes t0{to{background-position:-66px 0}}
.L3 .hf .gate{position:absolute;left:50%;top:50%;width:calc(46cqw + 8px);aspect-ratio:552/382;transform:translate(-50%,-62%);border:4px solid var(--lime);margin-top:-4px;z-index:2}
.L3 .hf .shade{position:absolute;left:0;right:0;bottom:0;height:42%;background:linear-gradient(#0000,#000 70%);z-index:3}
.L3 .nm{position:relative;z-index:4;display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.L3 .hf .nm b{font:900 34px/1 var(--sans);letter-spacing:-.04em;display:flex;align-items:center;gap:10px}
.L3 .hf .nm b i{width:20px;height:20px;background:var(--lime)}
.L3 .nm small{display:block;font:400 14px/1.4 var(--sans);margin-top:6px;opacity:.85}
.L3 .ar{width:50px;height:50px;flex:none;display:grid;place-items:center;font:900 28px/1 var(--sans)}
.L3 .hf .ar{background:var(--lime);color:#000}
.L3 .hu{background:radial-gradient(circle at 1px 1px,var(--dot) 1px,transparent 1.6px) 0 0/16px 16px,linear-gradient(var(--lav),var(--lav2));color:var(--ink)}
.L3 .hu .mas{position:absolute;right:9%;top:52px;width:33cqw;height:35cqw;animation:wob 2.4s ease-in-out infinite}
@keyframes wob{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg) translateY(-3px)}}
.L3 .hu .mini{position:absolute;left:20px;top:56px;width:30cqw;background:#fff;border-radius:9px;padding:14px 5px 0;display:flex;flex-direction:column;gap:4px;box-shadow:0 5px 0 #d6c6f6;transform:rotate(-6deg)}
.L3 .hu .mini::before{content:"";position:absolute;left:0;right:0;top:0;height:12px;border-radius:9px 9px 0 0;background:radial-gradient(circle at 50% 0,var(--pink) 4px,transparent 4.5px) 0 6px/8px 5px repeat-x,linear-gradient(var(--pink),var(--pink)) 0 2px/100% 4px no-repeat}
.L3 .hu .mini .c{border-radius:4px}
.L3 .hu .mini i{font:700 12px/1 var(--cute);text-align:center;padding:2px 0 4px;font-style:normal}
.L3 .hu .tw{position:absolute;width:24px;height:24px;animation:tw 2.4s ease-in-out infinite}
@keyframes tw{0%,100%{transform:scale(.8);opacity:.6}50%{transform:scale(1.15);opacity:1}}
.L3 .hu .nm b{font:700 62px/.8 var(--cute);display:flex;align-items:center;gap:6px;padding-top:6px}
.L3 .hu .nm b svg{width:28px;height:26px;fill:var(--pink)}
.L3 .hu .nm small{font-family:var(--cuteb);color:#4a3f63}
.L3 .hu .ar{background:var(--pink);color:#3a1230;border-radius:50%;box-shadow:0 4px 12px #c2587a40}
.L3 .ask{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:6;background:#fff;color:#0d0d0d;font:900 17px var(--sans);padding:9px 18px;border-radius:99px;box-shadow:0 0 0 3px #000,0 6px 16px #0004;white-space:nowrap;letter-spacing:-.02em}
.L3 .ask small{font:400 12px var(--sans);display:block;text-align:center;color:#3d3540;letter-spacing:0}
.sm .L3 .hu .mini{width:24cqw;top:44px}.sm .L3 .hu .mas{top:44px;width:26cqw;height:28cqw}.sm .L3 .hu .nm b{font-size:52px}.sm .L3 .hf .nm b{font-size:28px}.sm .L3 .nm small{display:none}
.sm .L3 .hf::before{top:58px}.sm .L3 .hf{padding-top:50px}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="pp" viewBox="0 0 100 70"><g><circle cx="33" cy="30" r="10" fill="#6b4a3a"/><path d="M14 70q2-24 19-24t19 24z" fill="#3f6e8c"/><circle cx="33" cy="31" r="8" fill="#e8c4a6"/>

<div class="wrap">
  <h1>처음 화면(테마 고르기) — 셋 중 하나만 골라 주세요</h1>
  <p class="lead">A가 맨 처음 보는 화면입니다. 여기서 고른 테마를 친구도 그대로 봅니다. 그림 속 버튼은 눌러 볼 수 있어요(2번의 필름 레일 | 말랑 부스 스위치).</p>
  <div class="tgl" role="group" aria-label="폰 크기"><button type="button" data-sz="big" aria-pressed="true">큰 폰 430×932</button><button type="button" data-sz="small" aria-pressed="false">작은 폰 360×640</button></div>

  <div class="row" id="row">
    <!-- 1 -->
    <figure>
      <div class="slot"><div class="fr L1">
        <div class="top"><b>‹ D:OT LAB</b><span>테마</span></div>
        <h3>어떤 네컷을 만들까?</h3>
        <p class="sub">눌러서 고르면 바로 시작해</p>
        <div class="two">
          <div class="card f" role="button" tabindex="0">
            <div class="strip"><div class="c"><svg class="pp"><use href="#pp"/></svg></div><div class="c k2"><svg class="pp"><use href="#pp"/></svg></div><div class="c k3"><svg class="pp"><use href="#pp"/></svg></div><div class="c k4"><svg class="pp"><use href="#pp"/></svg></div><i>따로 같이 네컷</i></div>
            <span class="nm"><i></i>필름 레일</span>
            <span class="one">검은 필름에 라임 프레임, 담백하게</span>
          </div>
          <div class="card u" role="button" tabindex="0">
            <div class="strip"><div class="c"><svg class="pp"><use href="#pp"/></svg></div><div class="c k2"><svg class="pp"><use href="#pp"/></svg></div><div class="c k3"><svg class="pp"><use href="#pp"/></svg></div><div class="c k4"><svg class="pp"><use href="#pp"/></svg></div><i>따로 같이 네컷</i></div>
            <span class="nm">말랑 부스<svg><use href="#heart"/></svg></span>
            <span class="one">분홍 커튼에 말랑한 마스코트</span>
          </div>
        </div>

<script>
// size toggle + zoom so a 430 px frame fits a phone; 2's switch swaps the preview and the start label
function fit(){var w=document.body.classList.contains('sm')?360:430;var z=Math.min(1,(document.querySelector('.wrap').clientWidth)/w);
  document.querySelectorAll('figure').forEach(function(f){f.style.setProperty('--z',z);});}
document.querySelectorAll('[data-sz]').forEach(function(b){b.onclick=function(){
  document.body.classList.toggle('sm',b.dataset.sz==='small');
  document.querySelectorAll('[data-sz]').forEach(function(x){x.setAttribute('aria-pressed',x===b);});fit();};});
var L2=document.querySelector('.L2');
L2.querySelectorAll('.sw button').forEach(function(b){b.onclick=function(){var t=b.dataset.t;L2.dataset.t=t;
  L2.querySelectorAll('.sw button').forEach(function(x){x.setAttribute('aria-pressed',x===b);});
  L2.querySelector('.cam.f').hidden=t!=='film';L2.querySelector('.cam.u').hidden=t!=='cute';
  L2.querySelector('.go').textContent=t==='film'?'필름 레일로 시작':'말랑 부스로 시작';};});
addEventListener('resize',fit);fit();
</script>
