<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>네컷 귀여운 테마 시안</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&family=Gaegu:wght@400;700&family=Dongle:wght@400;700&family=Noto+Sans+KR:wght@400;700;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:#fbf2f5;color:#2e2230;font:15px/1.5 'Gowun Dodum',system-ui,sans-serif;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.wrap{max-width:1420px;margin:0 auto;padding:24px 16px 60px}
.page-h h1{font:400 clamp(26px,5vw,34px)/1.2 'Jua',sans-serif}
.page-h p{color:#4f4250;margin-top:6px;font-size:15px;max-width:780px}
.sec-h{margin:26px 0 4px;font:400 21px 'Jua';display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.sec-h .no{font:700 13px 'Space Grotesk';background:#2e2230;color:#fff;padding:1px 9px;border-radius:99px}
.sec-h span.s{font:400 14px 'Gowun Dodum';color:#4f4250}
.ktabs{position:sticky;top:0;z-index:50;background:#fbf2f5;display:flex;gap:6px;padding:12px 0 10px;margin-top:22px;border-bottom:2px solid #f0d3df}
.ktabs button{flex:1;border-radius:16px;background:#fff;font:400 16px 'Jua';padding:8px 4px;line-height:1.2;box-shadow:0 3px 10px #c2587a1f}
.ktabs button small{display:block;font:700 11px 'Space Grotesk';color:#5e4f5c;letter-spacing:.04em}
.ktabs button[aria-pressed=true]{background:#c22d6c;color:#fff}
.ktabs button[aria-pressed=true] small{color:#fff}
.idea{margin:14px 0 4px;background:#fff;border-radius:16px;padding:10px 14px;font-size:15px;max-width:780px;box-shadow:0 3px 10px #c2587a14}
.idea b{font-family:'Jua';font-weight:400;color:#c22d6c}
.kset[hidden]{display:none}
.flow-h{margin:30px 0 4px;font:400 20px 'Jua';display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.flow-h .no{font:700 13px 'Space Grotesk';background:#2e2230;color:#fff;padding:1px 9px;border-radius:99px}
.flow-h span.s{font:400 14px 'Gowun Dodum';color:#4f4250}
.row{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:28px 22px;margin-top:12px}
figure{min-width:0}
figcaption{max-width:430px;margin:8px auto 0;font-size:14px;color:#3a2e39;line-height:1.45}
figcaption b{font:700 12px 'Space Grotesk';background:#2e2230;color:#fff;padding:1px 7px;border-radius:99px;margin-right:6px}

/* ===== phone ===== */
.phone{width:100%;max-width:430px;margin:0 auto;aspect-ratio:9/16;container-type:inline-size;position:relative;overflow:hidden;border-radius:30px;box-shadow:0 0 0 1px #00000014,0 10px 30px #c2587a2e;background:#fff}
.scr{position:absolute;inset:0;font-size:3.8cqw;line-height:1.35;background:var(--bg);color:var(--ink);font-family:var(--bf);word-break:keep-all;display:flex;flex-direction:column;padding:4.6cqw 5cqw 5cqw;overflow:hidden}
.scr svg{display:block}
.c1{--bg:#fff8f3;--paper:#fff;--ink:#2e2230;--sub:#5e4f5c;--acc:#ff7eb6;--acc-ink:#3b1530;--deep:#c22d6c;--soft:#ffe3ef;--t1:#ffe3ef;--t2:#efe7ff;--t3:#e2f5ec;--t4:#e2f0ff;--tf:'Jua',sans-serif;--bf:'Gowun Dodum',sans-serif;--rad:2.4cqw}
.c2{--bg:#fffdf4;--paper:#fff;--ink:#2e2a26;--sub:#5a5148;--acc:#ffd54a;--acc-ink:#2e2a26;--deep:#a8285c;--soft:#ffe6ee;--t1:#ffd3e2;--t2:#cdeedd;--t3:#fff0b3;--t4:#d6e8ff;--tf:'Gaegu',sans-serif;--bf:'Gowun Dodum',sans-serif;--rad:.6cqw}
.c3{--bg:#f4efff;--paper:#fff;--ink:#2a2140;--sub:#574c6e;--acc:#ff8fbd;--acc-ink:#3a1230;--deep:#5a31ab;--soft:#e6dcff;--t1:#ffe0ee;--t2:#e6dcff;--t3:#fff1c2;--t4:#dff3ff;--tf:'Dongle',sans-serif;--bf:'Gowun Dodum',sans-serif;--rad:3cqw}
.c2 .scr{background:linear-gradient(90deg,#00000000 calc(100% - 1px),#cfe0f1 0) 0 0/5cqw 5cqw,linear-gradient(#00000000 calc(100% - 1px),#cfe0f1 0) 0 0/5cqw 5cqw,var(--bg)}
.c3 .scr{background:radial-gradient(circle at 1px 1px,#d9ccfb 1px,transparent 1.6px) 0 0/4cqw 4cqw,linear-gradient(#f6f1ff,#efe6ff)}

.hl{font-family:var(--tf);font-weight:400;font-size:10.4cqw;line-height:1.1;margin:2.6cqw 0 1.6cqw;flex:none;letter-spacing:-.01em}
.h2{font-family:var(--tf);font-weight:400;font-size:7.2cqw;line-height:1.2;margin:2.6cqw 0 2.2cqw;flex:none}
.hl em,.h2 em{font-style:normal;color:var(--deep)}
.c2 .hl,.c2 .h2{font-weight:700}
.c2 :is(.hl,.h2,.cta>span:first-child,.chip,.tapes u,.km .d,.seg u,.seg span,.sl,.tabs u,.sheet h3,.mode b,.cnt,.tg,.pn,.foot,.stamp b,.mfoot,.doodle){letter-spacing:-.1em}
.c2 .hl em,.c2 .h2 em{color:var(--ink);background:linear-gradient(transparent 55%,#ffd54acc 55% 92%,transparent 92%)}
.c3 .hl{font-size:15cqw;line-height:.86;font-weight:700}
.c3 .h2{font-size:10.6cqw;line-height:.9;font-weight:700}
.sub{font-size:3.5cqw;color:var(--sub);flex:none}
.body{flex:1;min-height:0;position:relative;display:flex;flex-direction:column}

/* buttons */
.cta{flex:none;margin-top:3cqw;display:flex;justify-content:space-between;align-items:center;width:100%;background:var(--acc);color:var(--acc-ink);font:400 5.4cqw/1.2 var(--tf);padding:3.6cqw 5.4cqw;border-radius:99px;text-align:left}
.cta .r{font:400 3.3cqw var(--bf);display:flex;align-items:center;gap:1.4cqw}
.cta .r svg{width:3.6cqw;height:3.6cqw}
.cta.alt{background:var(--paper);color:var(--ink);margin-top:2.4cqw}
.c1 .cta{box-shadow:inset 0 -1cqw 0 #0000000f,0 2.2cqw 5cqw #ff7eb659}
.c1 .cta.alt{box-shadow:inset 0 0 0 .6cqw var(--acc),0 1cqw 3cqw #c2587a1f}
.c2 .cta{font-weight:700;font-size:6cqw;border-radius:3cqw;box-shadow:0 0 0 1.1cqw #fff,0 1.6cqw 2.6cqw .9cqw #5a3c2036;transform:rotate(-1deg);margin-top:4cqw}
.c2 .cta.alt{background:#cdeedd;transform:rotate(.8deg);margin-top:3.4cqw}
.c3 .cta{font-size:8cqw;font-weight:700;line-height:.9;padding:2.8cqw 5.4cqw 2.4cqw;background:linear-gradient(#ffffff70,#ffffff00 55%),var(--acc);box-shadow:0 1.2cqw 0 #d9578f,0 2.4cqw 3cqw #6b3fc433;margin-bottom:1.2cqw}
.c3 .cta.alt{background:linear-gradient(#ffffffaa,#ffffff00 55%),#fff;box-shadow:0 1.2cqw 0 #c9b8f0,0 2.4cqw 3cqw #6b3fc426}
.c3 .cta .r{font-size:3.3cqw}
.cta.lime{background:var(--acc)}
.tl{flex:none;margin-top:2.4cqw;align-self:center;font-size:3.6cqw;text-decoration:underline;text-underline-offset:.9cqw;color:var(--ink)}
.tl.sm{font-size:3.3cqw;color:var(--sub)}
.km{flex:none;margin-top:2.4cqw;display:flex;justify-content:space-between;align-items:center;gap:2cqw;font-size:3.5cqw}
.km .d{font:400 4.4cqw var(--tf);white-space:nowrap;background:var(--paper);border-radius:99px;padding:.6cqw 3cqw;box-shadow:0 .8cqw 2cqw #c2587a1f}
.km .d b{font-weight:400;color:var(--deep)}
.km .t{white-space:nowrap;color:var(--ink)}
.c2 .km .d{font-weight:700;border-radius:1cqw;transform:rotate(-1.5deg)}
.c3 .km .d{font-size:7cqw;line-height:1;padding:.8cqw 3cqw .2cqw}

/* ===== heads ===== */
.top{flex:none;display:flex;justify-content:space-between;align-items:center}
.chip{font:400 3.6cqw var(--tf);background:var(--paper);border-radius:99px;padding:.8cqw 3cqw;box-shadow:0 .8cqw 2.4cqw #c2587a24;color:var(--ink);white-space:nowrap}
.chip.t{background:var(--soft);box-shadow:none}
.c3 .chip{font-size:6cqw;line-height:1;padding:.9cqw 3cqw .3cqw;font-weight:700}
/* c1: the cover's mini strip rides along as the step tracker */
.trk{flex:none;margin-top:3cqw;background:var(--paper);border-radius:2.6cqw;padding:1.3cqw;display:flex;gap:1.1cqw;transform:rotate(-1.4deg);box-shadow:0 2cqw 4cqw #c2587a26,0 .4cqw 1cqw #6b2d4512}
.trk u{text-decoration:none;flex:1;display:flex;align-items:center;justify-content:center;gap:.8cqw;border-radius:1.6cqw;font:400 3.7cqw/1 var(--tf);padding:2cqw 0;color:var(--sub);background:#fff;box-shadow:inset 0 0 0 .4cqw #f0d3df;white-space:nowrap}
.trk u.dn{color:var(--ink);box-shadow:none}
.trk u.dn:nth-child(1){background:var(--t1)}.trk u.dn:nth-child(2){background:var(--t2)}.trk u.dn:nth-child(3){background:var(--t3)}.trk u.dn:nth-child(4){background:var(--t4)}
.trk u.on{background:var(--deep);color:#fff;box-shadow:none;animation:bob 1.2s ease-in-out infinite alternate}
.trk u svg{width:3cqw;height:2.8cqw;fill:var(--deep)}
@keyframes bob{to{transform:translateY(-.8cqw) scale(1.05)}}
/* c2: washi tapes */
.c2 .top .chip{border-radius:0;background:#ffd3e2cc;box-shadow:none;transform:rotate(-2deg);clip-path:polygon(0 0,100% 0,97% 25%,100% 50%,97% 75%,100% 100%,0 100%,3% 75%,0 50%,3% 25%);font-weight:700;padding:.6cqw 3.6cqw}
.c2 .top .chip.t{background:#cdeeddcc;transform:rotate(2deg)}
.tapes{flex:none;margin-top:3cqw;display:flex;gap:1.4cqw}
.tapes u{text-decoration:none;flex:1;text-align:center;font:700 4.4cqw/1 var(--tf);padding:1.8cqw 0 1.4cqw;color:var(--sub);border:.45cqw dashed #b9a99a;border-radius:.8cqw;background:#ffffffb0}
.tapes u.dn,.tapes u.on{border:0;color:var(--ink);clip-path:polygon(0 0,100% 0,97% 20%,100% 40%,97% 60%,100% 80%,97% 100%,0 100%,3% 80%,0 60%,3% 40%,0 20%);border-radius:0}
.tapes u.dn{background:repeating-linear-gradient(135deg,#cdeedd 0 1.6cqw,#b8e4cd 1.6cqw 3.2cqw)}
.tapes u.dn:nth-child(even){transform:rotate(1.5deg)}.tapes u.dn:nth-child(odd){transform:rotate(-1.5deg)}
.tapes u.on{background:radial-gradient(circle,#fff6 .5cqw,transparent .6cqw) 0 0/2.4cqw 2.4cqw,#ffb3cb;transform:rotate(-3deg) scale(1.08);animation:tapeon 1.6s ease-in-out infinite alternate}
@keyframes tapeon{to{transform:rotate(2deg) scale(1.08)}}
/* c3: booth mascot + speech bubble */
.mhead{flex:none;display:flex;align-items:center;gap:2.4cqw;margin-top:.6cqw}
.mas{width:17cqw;height:18cqw;flex:none;animation:wob 2.4s ease-in-out infinite}
@keyframes wob{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg) translateY(-.6cqw)}}
.bub{flex:1;position:relative;background:#fff;border-radius:4cqw;padding:1.4cqw 3.4cqw 1.6cqw;box-shadow:0 1.2cqw 3cqw #6b3fc426;display:flex;align-items:center;justify-content:space-between;gap:2cqw}
.bub:before{content:"";position:absolute;left:-2cqw;top:50%;margin-top:-1.6cqw;border:1.6cqw solid transparent;border-right:2.4cqw solid #fff;border-left:0}
.bub b{font:700 8cqw/.9 var(--tf);color:var(--ink);padding-top:.6cqw}
.bub .dots{display:flex;gap:1.2cqw}
.bub .dots i{width:3.4cqw;height:3.4cqw;border-radius:50%;background:#e6dcff;box-shadow:inset 0 -.5cqw 0 #0000000f}
.bub .dots i.dn{background:#ff8fbd}
.bub .dots i.on{background:var(--deep);animation:pop 1s ease-in-out infinite alternate}
@keyframes pop{to{transform:scale(1.3)}}
.bub small{display:block;font:400 3.3cqw var(--bf);color:var(--sub);margin-top:.4cqw}

/* ===== cells, backgrounds, people ===== */
.cell{position:relative;overflow:hidden;width:100%;aspect-ratio:4/3;background:#eee;border-radius:var(--rad)}
.cell.t{aspect-ratio:3/4}
.bgA{background:linear-gradient(#f3d9b9 0 70%,#c9946a 70%)}
.bgA:before{content:"";position:absolute;left:12%;top:10%;width:30%;height:38%;background:linear-gradient(#cfe9ff,#9fd0f5);border:.8cqw solid #fff;box-shadow:0 0 0 .3cqw #c9a07a}
.bgB{background:linear-gradient(#c6dce8 0 74%,#8aa7b8 74%)}
.bgB:before{content:"";position:absolute;right:8%;top:22%;width:40%;height:3%;background:#6d5745;box-shadow:0 -1.4cqw 0 -.2cqw #e36f5b}
.bgB:after{content:"";position:absolute;left:6%;bottom:22%;width:16%;height:30%;background:radial-gradient(circle at 50% 30%,#4f9a5c 0 45%,transparent 46%),linear-gradient(transparent 60%,#b0643f 60%)}
.bgP{background:radial-gradient(circle at 50% 40%,#fff0f4,#ffd2de 60%,#f6b3c6)}
.bgS{background:radial-gradient(circle at 50% 40%,#f4f9ff,#d4e7ff 60%,#b9d4f5)}
.bgN{background:repeating-conic-gradient(#f3e6ec 0 25%,#fff 0 50%) 0 0/3cqw 3cqw}
.offlay{position:absolute;inset:0;z-index:1;opacity:0;background:repeating-conic-gradient(#f3e6ec 0 25%,#fff 0 50%) 0 0/3cqw 3cqw;animation:bgoff 4s steps(1) infinite}
@keyframes bgoff{0%,49%{opacity:0}50%,100%{opacity:1}}
.cell .pp{position:absolute;bottom:-7%;height:94%;width:auto;overflow:visible;z-index:2}
.cell.t .pp{height:70%;bottom:-5%}
.cell .pp.a{z-index:3}
.cell .L{transform:scaleX(-1)}
.cell .gh{position:absolute;bottom:-6%;height:88%;width:auto;z-index:2}
.cell.t .gh{height:66%}
.cut{filter:drop-shadow(1px 0 0 #fff) drop-shadow(-1px 0 0 #fff) drop-shadow(0 1px 0 #fff) drop-shadow(0 -1px 0 #fff) drop-shadow(0 1px 2px rgba(0,0,0,.35))}
.pn{position:absolute;left:1.2cqw;top:1.2cqw;z-index:6;min-width:6.4cqw;height:6.4cqw;border-radius:50%;background:var(--deep);color:#fff;display:grid;place-items:center;font:400 3.8cqw/1 var(--tf);box-shadow:0 .4cqw 1.2cqw #0004}
.c3 .pn{font-size:6cqw;font-weight:700;padding-top:.6cqw}
.c2 .pn{font-weight:700}
.cell .tg{display:none;position:absolute;bottom:1.4cqw;z-index:6;font:400 3.3cqw/1.3 var(--tf);padding:.2cqw 2cqw;font-style:normal;white-space:nowrap;border-radius:99px}
.showtg .cell .tg{display:block}
.cell .tg.me{background:var(--deep);color:#fff}
.cell .tg.fd{background:#fff;color:var(--ink)}
.c3 .cell .tg{font-size:5.4cqw;line-height:1;padding:.6cqw 2.2cqw .1cqw;font-weight:700}
.c2 .cell .tg{font-weight:700}
.cell .tg.l{left:1.6cqw}.cell .tg.r{right:1.6cqw}
.no8{position:absolute;right:1cqw;top:1cqw;z-index:6;background:#ffffffe6;color:var(--ink);font:700 2.6cqw 'Space Grotesk';padding:0 1.2cqw;border-radius:99px}

/* frame wrappers: the concept's photo holder */
.fw{position:relative}
.c1 .fw.bare,.c2 .fw.bare{background:none;padding:0;box-shadow:none}
.c3 .fw.bare .vstrip{box-shadow:none;border-radius:1.6cqw}
.c1 .fw{background:var(--paper);padding:1.6cqw;border-radius:3.4cqw;box-shadow:0 3cqw 6cqw #c2587a2e,0 .4cqw 1.2cqw #6b2d4512}
.c2 .fw{background:#fff;padding:1.8cqw;box-shadow:0 1.2cqw 2.4cqw #5a3c2030}
.c2 .fw:before,.c2 .fw:after{content:"";position:absolute;top:-1.2cqw;width:12cqw;height:4cqw;background:#ffd3e2c8;z-index:9;clip-path:polygon(0 0,100% 0,97% 25%,100% 50%,97% 75%,100% 100%,0 100%,3% 75%,0 50%,3% 25%)}
.c2 .fw:before{left:-2cqw;transform:rotate(-24deg)}
.c2 .fw:after{right:-2cqw;transform:rotate(24deg);background:#cdeeddd0}
.c3 .fw{background:#fff;padding:5.2cqw 1.8cqw 1.8cqw;border-radius:4.4cqw;box-shadow:0 1.2cqw 0 #d6c6f6,0 3cqw 5cqw #6b3fc42e}
.c3 .fw:before{content:"";position:absolute;left:1.8cqw;right:1.8cqw;top:1.4cqw;height:3.4cqw;border-radius:1.4cqw 1.4cqw 0 0;z-index:9;background:radial-gradient(circle at 50% 0,#ff8fbd 1.7cqw,transparent 1.8cqw) 0 0/3.4cqw 3.4cqw repeat-x,#ff8fbd;background:radial-gradient(circle at 50% 0,#ff8fbd 1.65cqw,transparent 1.75cqw) 0 1.6cqw/3.4cqw 1.8cqw repeat-x,linear-gradient(#ff8fbd 1.65cqw,transparent 1.65cqw)}

/* ===== landing covers ===== */
.stage{flex:1;position:relative;min-height:0}
/* c1: 착! 합체 */
.cv1 .half{position:absolute;top:50%;width:30cqw;margin-top:-22cqw;background:#fff;border-radius:3cqw;padding:1.6cqw;box-shadow:0 2cqw 4cqw #c2185b26;opacity:0}
.cv1 .half.l{left:calc(50% - 30cqw);animation:halfL 5s cubic-bezier(.3,1.2,.6,1) infinite}
.cv1 .half.r{left:50%;animation:halfR 5s cubic-bezier(.3,1.2,.6,1) infinite}
@keyframes halfL{0%{opacity:1;transform:translateX(-75cqw) rotate(-12deg)}20%{transform:translateX(1.8cqw) rotate(-3deg)}26%,46%{opacity:1;transform:none}56%,100%{opacity:0;transform:scale(.5)}}
@keyframes halfR{0%{opacity:1;transform:translateX(75cqw) rotate(12deg)}20%{transform:translateX(-1.8cqw) rotate(3deg)}26%,46%{opacity:1;transform:none}56%,100%{opacity:0;transform:scale(.5)}}
.cv1 .chipx{position:absolute;top:2cqw;font:400 4cqw var(--tf);background:#fff;border-radius:99px;padding:.6cqw 3cqw;box-shadow:0 .8cqw 2cqw #c2587a26;color:var(--ink)}
.cv1 .chipx.l{left:4cqw}.cv1 .chipx.r{right:4cqw}
.burst{position:absolute;left:50%;top:50%;width:56cqw;height:56cqw;margin:-28cqw;z-index:4;pointer-events:none;opacity:0;animation:burst 5s ease-out infinite}
@keyframes burst{0%,19%{transform:scale(0);opacity:0}21%{opacity:1}32%{transform:scale(1.1);opacity:1}44%,100%{transform:scale(1.5);opacity:0}}
.ms1{position:absolute;left:50%;top:50%;width:34cqw;margin-left:-17cqw;transform:translateY(-50%) rotate(-5deg);background:#fff;border-radius:2.4cqw;padding:2cqw 2cqw 0;display:flex;flex-direction:column;gap:1.4cqw;box-shadow:0 3cqw 7cqw #c2587a40;animation:msin 5s cubic-bezier(.34,1.56,.64,1) infinite}
@keyframes msin{0%,50%{opacity:0;transform:translateY(-45%) rotate(-5deg) scale(.7)}60%,92%{opacity:1;transform:translateY(-50%) rotate(-5deg)}100%{opacity:0;transform:translateY(-50%) rotate(-5deg) scale(.9)}}
.ms1 .cell{border-radius:1.2cqw}
.ms1 .cell:nth-child(1){background:var(--t1)}.ms1 .cell:nth-child(2){background:var(--t2)}.ms1 .cell:nth-child(3){background:var(--t3)}.ms1 .cell:nth-child(4){background:var(--t4)}
.mfoot{font:400 3.2cqw var(--tf);text-align:center;padding:1.4cqw 0 2cqw;color:var(--ink)}
.star{position:absolute;fill:#ffcf4d;pointer-events:none;animation:twinkle 2.4s ease-in-out infinite;z-index:5}
.star.h{fill:var(--acc)}
@keyframes twinkle{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.25) rotate(15deg)}}
/* c2: diary page, stickers stick on one by one */
.cv2 .page{position:absolute;inset:1cqw 0 1cqw 3cqw;background:#fff;border-radius:1cqw 3cqw 3cqw 1cqw;box-shadow:0 1.4cqw 3cqw #5a3c2026;padding:5cqw 4cqw 4cqw 9cqw;display:grid;grid-template-columns:1fr 1fr;gap:3.2cqw 3cqw;align-content:center}
.cv2 .page:before{content:"";position:absolute;left:-1.6cqw;top:3cqw;bottom:3cqw;width:6cqw;background:radial-gradient(circle at 50% 50%,#fff 1cqw,#8d7d70 1.1cqw 1.8cqw,transparent 1.9cqw) 0 0/6cqw 7cqw repeat-y}
.stk{background:#fff;padding:1.2cqw;box-shadow:0 .8cqw 1.6cqw #5a3c2033;transform:rotate(var(--r));position:relative;animation:stick 8s cubic-bezier(.3,1.4,.5,1) infinite both;animation-delay:calc(var(--i) * .55s)}
.stk:before{content:"";position:absolute;left:50%;top:-1.6cqw;width:9cqw;height:3cqw;margin-left:-4.5cqw;background:var(--tp,#ffd3e2c8);z-index:9;transform:rotate(-4deg)}
.stk .cell{border-radius:0}
@keyframes stick{0%{opacity:0;transform:translateY(-5cqw) rotate(calc(var(--r) + 10deg)) scale(1.25)}7%{opacity:1;transform:rotate(var(--r))}86%{opacity:1;transform:rotate(var(--r))}94%,100%{opacity:0;transform:rotate(var(--r)) scale(.9)}}
.doodle{position:absolute;z-index:6;font:700 7cqw var(--tf);color:var(--deep)}
/* c3: booth mascot */
.cv3{display:flex;align-items:flex-start;justify-content:center;padding-top:4.4cqw}
.booth{position:relative;width:60cqw;background:linear-gradient(#ffffff60,#ffffff00 30%),#ff9cc4;border-radius:9cqw 9cqw 6cqw 6cqw;box-shadow:inset 0 -2cqw 0 #e77aa9,0 2.4cqw 0 #d9578f,0 5cqw 7cqw #6b3fc433;padding:6cqw 5cqw 3.6cqw;display:flex;flex-direction:column;align-items:center;animation:wob 2.8s ease-in-out infinite}
.booth .lamp{position:absolute;top:-3.6cqw;left:50%;width:7cqw;height:7cqw;margin-left:-3.5cqw;border-radius:50%;background:#ffe27a;box-shadow:0 0 0 1cqw #fff,0 0 4cqw #ffe27a;animation:lamp 1.4s steps(1) infinite}
@keyframes lamp{50%{background:#fff}}
.booth .win{position:relative;width:100%;aspect-ratio:4/3;background:#fff;border-radius:3cqw;padding:1.4cqw;padding-top:4.6cqw;overflow:hidden}
.booth .win .cyc{position:relative;width:100%;height:100%}
.booth .win .cyc>.cell{position:absolute;inset:0;height:100%;opacity:0;animation:cyc 8s steps(1) infinite;animation-delay:calc(var(--i) * 1s - 8s)}
.booth .win .cyc>.cell:first-child{opacity:1}
@keyframes cyc{0%{opacity:1}12.5%,100%{opacity:0}}
.booth .win .flash{position:absolute;inset:0;z-index:8;background:#fff;opacity:0;animation:flash 1s infinite}
.booth .curtain{position:absolute;left:0;right:0;top:0;height:6cqw;z-index:9;background:radial-gradient(circle at 50% 0,#c45fd9 2.2cqw,transparent 2.3cqw) 0 3cqw/4.4cqw 2.4cqw repeat-x,linear-gradient(#c45fd9 3cqw,transparent 3cqw)}
.booth .face{width:26cqw;height:9.6cqw;margin-top:2.4cqw}
.booth .face svg{width:100%;height:100%}
.booth .slot{position:relative;width:36cqw;height:2.6cqw;border-radius:99px;background:#5b2a49;margin-top:1.8cqw;box-shadow:inset 0 .6cqw 0 #00000040}
.booth .out{position:absolute;left:50%;top:1.3cqw;width:15cqw;margin-left:-7.5cqw;background:#fff;padding:1cqw 1cqw 0;border-radius:0 0 1cqw 1cqw;display:flex;flex-direction:column;gap:.8cqw;z-index:3;animation:printo 4s cubic-bezier(.22,.9,.3,1) infinite;box-shadow:0 1.4cqw 3cqw #6b3fc433}
.booth .out .cell{border-radius:.6cqw}
.booth .out .mfoot{font-size:2.6cqw;padding:.6cqw 0 1cqw;line-height:1;font-weight:700}
@keyframes printo{0%,8%{transform:translateY(-40%);clip-path:inset(40% 0 0 0)}45%,100%{transform:none;clip-path:inset(0)}}

/* ===== mode pick ===== */
.modes{display:grid;grid-template-columns:1fr 1fr;gap:3cqw;flex:1;min-height:0}
.mode{border-radius:4cqw;padding:3cqw;display:flex;flex-direction:column;align-items:center;gap:2cqw;text-align:center;background:var(--paper);box-shadow:0 1cqw 3cqw #c2587a1f}
.mode.on{box-shadow:0 0 0 .9cqw var(--deep),0 2cqw 4cqw #c2587a33}
.mode b{font:400 6cqw var(--tf)}
.c3 .mode b{font-size:9cqw;line-height:.9;font-weight:700}
.c2 .mode{border-radius:1cqw}.c2 .mode b{font-weight:700}
.mode small{font-size:3.3cqw;color:var(--sub);line-height:1.35}
.mode .dia{flex:1;display:grid;place-items:center;min-height:0;width:100%}
.mstrip{background:#fff;padding:1.4cqw;display:grid;gap:1cqw;border-radius:1.6cqw;box-shadow:0 1.4cqw 3cqw #c2587a33}
.mstrip .cell{border-radius:1cqw}
.mstrip .cell:nth-child(4n+1){background:var(--t1)}.mstrip .cell:nth-child(4n+2){background:var(--t2)}.mstrip .cell:nth-child(4n+3){background:var(--t3)}.mstrip .cell:nth-child(4n+4){background:var(--t4)}
.mstrip.tall{width:22cqw;grid-template-rows:repeat(4,auto);transform:rotate(-4deg)}
.mstrip.wide{width:36cqw;grid-template-columns:repeat(4,1fr);transform:rotate(3deg)}
.mstrip .cell .pp{height:90%}

/* ===== camera (light, booth backdrop) ===== */
.camtop{flex:none;display:flex;justify-content:space-between;align-items:center;margin-top:2.6cqw}
.camtop .cnt{background:var(--soft);color:var(--ink);padding:.6cqw 3.4cqw;font:400 5cqw var(--tf);border-radius:99px}
.c3 .camtop .cnt{font-size:8cqw;line-height:1;padding:.8cqw 3.4cqw .2cqw;font-weight:700}
.c2 .camtop .cnt{font-weight:700;border-radius:1cqw}
.camtop .snd{display:flex;align-items:center;gap:1.2cqw;background:var(--paper);padding:1cqw 3cqw 1cqw 2.2cqw;font-size:3.4cqw;border-radius:99px;box-shadow:0 .8cqw 2.4cqw #c2587a24}
.camtop .snd svg{width:4.6cqw;height:4.6cqw}
.vfwrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative}
.vfwrap>.fw{width:100%}
.vf{position:relative;width:100%}
.cd{position:absolute;inset:0;z-index:7;display:grid;place-items:center;font:400 34cqw/1 var(--tf);color:#fff;text-shadow:0 1cqw 5cqw #c22d6c99,0 .4cqw 1.4cqw #0008;animation:countIn 1s infinite}
.c3 .cd{font-size:52cqw;font-weight:700;text-shadow:0 1cqw 5cqw #6b3fc499,0 .4cqw 1.4cqw #0008}
.c2 .cd{font-weight:700}
@keyframes countIn{0%{transform:scale(1.5);opacity:0}18%{transform:scale(.94);opacity:1}32%,80%{transform:scale(1);opacity:1}100%{transform:scale(.8);opacity:0}}
.flash{position:absolute;inset:0;z-index:8;background:#fff8fb;opacity:0;animation:flash 3s infinite;border-radius:var(--rad)}
@keyframes flash{0%,86%{opacity:0}88%{opacity:.95}100%{opacity:0}}
.pips{flex:none;display:flex;justify-content:center;gap:2.2cqw;margin-top:3.4cqw;height:4cqw;align-items:center}
.pips i{width:2.8cqw;height:2.8cqw;border-radius:50%;background:#ead3dd}
.pips i.on{background:var(--acc)}
.pips i.now{background:var(--deep);transform:scale(1.4);animation:pop .6s ease-in-out infinite alternate}
.c2 .pips i{border-radius:0;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);width:4cqw;height:4cqw;background:#e6dccf}
.c2 .pips i.on{background:#ffc93a}.c2 .pips i.now{background:var(--deep)}
.c3 .pips i{background:#ddd0fb;box-shadow:inset 0 -.5cqw 0 #0000000f}.c3 .pips i.on{background:#ff8fbd}.c3 .pips i.now{background:var(--deep)}
.ctl{flex:none;display:flex;justify-content:space-between;align-items:flex-start;margin-top:3.6cqw;padding:0 2cqw}
.tool{display:flex;flex-direction:column;align-items:center;gap:1.2cqw;font-size:3.3cqw;color:var(--ink);width:20cqw}
.tool i{width:13cqw;height:13cqw;border-radius:50%;background:var(--paper);display:grid;place-items:center;box-shadow:0 1.2cqw 3cqw #c2587a26}
.tool i svg{width:6.4cqw;height:6.4cqw;color:var(--ink)}
.tool.on i{background:var(--soft)}
.c2 .tool i{border-radius:2.4cqw;box-shadow:0 0 0 .8cqw #fff,0 1cqw 2cqw .6cqw #5a3c2026}
.c2 .tool.on i{background:#ffd3e2}
.shutter{width:21cqw;height:21cqw;border-radius:50%;border:1.6cqw solid #fff;background:var(--acc);box-shadow:0 0 0 .8cqw var(--acc),0 2.4cqw 6cqw #ff7eb666;display:grid;place-items:center;position:relative}
.shutter b{font:400 8cqw var(--tf);color:var(--acc-ink)}
.c3 .shutter b{font-size:12cqw;font-weight:700;line-height:1;padding-top:1cqw}
.c2 .shutter{background:#ffd54a;box-shadow:0 0 0 .8cqw #ffd54a,0 2cqw 4cqw #5a3c2033}
.c2 .shutter b{font-weight:700}
.c3 .shutter{box-shadow:0 0 0 .8cqw var(--acc),0 1.2cqw 0 .8cqw #d9578f}
.shutter:after{content:"";position:absolute;inset:-2.6cqw;border-radius:50%;border:.9cqw solid var(--deep);clip-path:polygon(50% 50%,50% 0,100% 0,100% 100%,0 100%,0 60%);animation:ringgo 1s linear infinite}
@keyframes ringgo{to{transform:rotate(360deg)}}
.stagebg{background:radial-gradient(circle at 1px 1px,#f3bfd3 1px,transparent 1.6px) 0 0/3cqw 3cqw,linear-gradient(#fdebf2,#f6d3e2);border-radius:var(--rad)}

/* ===== progress ===== */
.dev>div{animation:develop 4s ease-out infinite;animation-delay:calc(var(--i)*.4s)}
@keyframes develop{0%{transform:scale(.6);opacity:0}12%{transform:scale(1.06);opacity:1}20%,100%{transform:none;opacity:1}}
.bar{flex:none;height:4cqw;border-radius:99px;background:var(--soft);margin-top:3.4cqw;overflow:hidden}
.bar i{display:block;height:100%;width:62%;border-radius:99px;background:repeating-linear-gradient(115deg,#ffffff50 0 2.4cqw,transparent 2.4cqw 4.8cqw),linear-gradient(90deg,#ff9cc7,var(--acc));animation:bar 4s linear infinite}
.c2 .bar{border-radius:0;background:#fff;box-shadow:inset 0 0 0 .4cqw #e6dccf}
.c2 .bar i{border-radius:0;background:repeating-linear-gradient(135deg,#ffd3e2 0 1.6cqw,#ffb3cb 1.6cqw 3.2cqw)}
.c3 .bar{height:5cqw;background:#fff;box-shadow:inset 0 .6cqw 0 #6b3fc41a}
.c3 .bar i{background:repeating-linear-gradient(115deg,#fff 0 2cqw,#ff8fbd 2cqw 4.4cqw)}
@keyframes bar{from{width:5%}to{width:100%}}

/* ===== pick ===== */
.seg{flex:none;display:flex;align-items:center;font-size:3.5cqw;margin-bottom:2.6cqw;gap:2cqw}
.seg span{font:400 4cqw var(--tf)}
.c3 .seg span{font-size:6.4cqw;font-weight:700;line-height:1}
.c2 .seg span{font-weight:700}
.seg .pl{flex:1;display:flex;background:var(--soft);border-radius:99px;padding:.8cqw;gap:.8cqw}
.c2 .seg .pl{border-radius:1.2cqw}
.seg u{text-decoration:none;flex:1;text-align:center;border-radius:99px;padding:1.4cqw .4cqw;color:var(--ink);white-space:nowrap;font:400 3.6cqw var(--tf)}
.c3 .seg u{font-size:5.6cqw;line-height:1;padding:1.6cqw .4cqw .9cqw;font-weight:700}
.c2 .seg u{border-radius:.8cqw;font-weight:700;font-size:4.2cqw;padding:1cqw .4cqw}
.seg u.on{background:#fff;color:var(--deep);box-shadow:0 .6cqw 1.6cqw #c2587a26}
.seg.flip u:nth-of-type(1){animation:segon 4s steps(1) infinite}
.seg.flip u:nth-of-type(2){animation:segon 4s steps(1) infinite reverse}
@keyframes segon{0%,49%{background:#fff;color:var(--deep);box-shadow:0 .6cqw 1.6cqw #c2587a26}50%,100%{background:transparent;color:var(--ink);box-shadow:none}}
.body>.fw,.hero>.fw{height:100%;align-self:center;max-width:100%}
.g8{height:100%;aspect-ratio:1/1.56;max-width:100%;display:grid;grid-template-columns:1fr 1fr;gap:1.8cqw;align-content:center;margin:0 auto}
.g8 .cell.pk{box-shadow:0 0 0 .9cqw var(--deep)}
.c3 .g8 .cell.pk{box-shadow:0 0 0 .9cqw #ff6aa8}
.hs{height:100%;aspect-ratio:1/3.25;grid-template-rows:repeat(4,1fr)}
.hs.ft{aspect-ratio:1/3.5;grid-template-rows:repeat(4,1fr) auto}

/* ===== retouch / zoom ===== */
.zoombox{position:relative;overflow:hidden;flex:none;border-radius:var(--rad)}
.zoombox .zin{transform:scale(var(--z,2));transform-origin:var(--ox,30%) var(--oy,40%);animation:pinch 5s ease-in-out infinite}
@keyframes pinch{0%,12%{transform:scale(1)}40%,80%{transform:scale(var(--z,2))}100%{transform:scale(1)}}
.zchip{position:absolute;right:1.6cqw;top:1.6cqw;z-index:9;background:#2e2230d9;color:#fff;font:700 3cqw 'Space Grotesk';padding:.4cqw 2cqw;border-radius:99px}
.fing{position:absolute;z-index:9;width:9cqw;height:9cqw;border-radius:50%;background:rgba(255,255,255,.5);border:.5cqw solid rgba(46,34,48,.45);animation:f1 5s ease-in-out infinite}
.fing.f2{animation-name:f2}
@keyframes f1{0%,12%{left:36%;top:44%}40%,80%{left:18%;top:26%}100%{left:36%;top:44%}}
@keyframes f2{0%,12%{left:50%;top:56%}40%,80%{left:66%;top:70%}100%{left:50%;top:56%}}
.thumbs{flex:none;display:grid;grid-template-columns:repeat(4,1fr);gap:2cqw;margin-top:2.8cqw}
.thumbs .cell.on{box-shadow:0 0 0 .8cqw var(--deep)}
.sliders{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:3.4cqw;margin-top:2cqw}
.sl{display:grid;grid-template-columns:19cqw 1fr 8cqw;align-items:center;gap:2.4cqw;font:400 4cqw var(--tf)}
.c3 .sl{font-size:6.4cqw;font-weight:700;line-height:1}
.c2 .sl{font-weight:700;font-size:4.6cqw}
.sl em{font:700 3.4cqw 'Space Grotesk';font-style:normal;text-align:right;color:var(--ink)}
.sl i{height:2.2cqw;background:var(--soft);position:relative;border-radius:99px}
.sl i:before{content:"";position:absolute;left:0;top:0;bottom:0;width:var(--v);background:var(--acc);border-radius:99px}
.sl i:after{content:"";position:absolute;left:var(--v);top:50%;width:6cqw;height:6cqw;background:#fff;border-radius:50%;box-shadow:0 .6cqw 1.8cqw #2e223040,inset 0 0 0 .5cqw var(--acc);transform:translate(-50%,-50%)}
.c2 .sl i:after{border-radius:1.2cqw;transform:translate(-50%,-50%) rotate(8deg)}

/* ===== share / strips ===== */
.vstrip{background:#fff;padding:1.8cqw 1.8cqw 0;display:grid;gap:1.4cqw;border-radius:2.4cqw;box-shadow:0 3cqw 7cqw #c2587a33}
.vstrip>.cell{border-radius:1.2cqw}
.vstrip .foot{display:flex;justify-content:space-between;white-space:nowrap;overflow:hidden;gap:1cqw;color:var(--ink);font:400 3.2cqw var(--tf);padding:.6cqw .6cqw 1.6cqw}
.hs .foot{font-size:2.8cqw;justify-content:center}.hs .foot span+span{display:none}
.c3 .vstrip .foot{font-size:5cqw;line-height:1;font-weight:700}.c3 .hs .foot{font-size:4.4cqw}
.c2 .vstrip .foot{font-weight:700}
.c1 .vstrip{transform:rotate(-3deg);background:var(--soft)}
.c2 .vstrip{border-radius:0;box-shadow:0 1.4cqw 3cqw #5a3c2033;transform:rotate(2deg)}
.c2 .vstrip>.cell{border-radius:0}
.c3 .vstrip{background:#fff;box-shadow:0 1.2cqw 0 #d6c6f6,0 3cqw 6cqw #6b3fc433}
.hero{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative;padding:2cqw 0}
.wait .cell .pp.a{opacity:.4}
.stamp{position:absolute;right:3cqw;top:30%;z-index:8;width:26cqw;height:26cqw;display:grid;place-items:center;animation:stampin 3.6s cubic-bezier(.3,1.6,.5,1) infinite}
.stamp svg{position:absolute;inset:0;width:100%;height:100%}
.stamp b{position:relative;font:400 8cqw var(--tf);color:var(--acc-ink);transform:rotate(-10deg)}
.c3 .stamp b{font-size:12cqw;font-weight:700}
.c2 .stamp b{font-weight:700}
@keyframes stampin{0%,10%{transform:scale(0) rotate(-40deg)}26%,100%{transform:none}}

/* ===== in-app bar ===== */
.iab{flex:none;margin:-4.6cqw -5cqw 4cqw;background:#f2f2f2;border-bottom:.3cqw solid #ccc;display:flex;align-items:center;gap:3cqw;padding:3cqw 4cqw;font-size:3.2cqw;color:#333;font-family:'Noto Sans KR',sans-serif}
.iab b{font-size:4.4cqw;font-weight:400}
.iab span{flex:1;font-family:'Space Grotesk',sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ldots{display:flex;gap:2.4cqw;justify-content:center}
.ldots i{width:3.6cqw;height:3.6cqw;border-radius:50%;background:var(--acc);animation:dot 1s ease-in-out infinite}
.ldots i:nth-child(2){animation-delay:.15s}.ldots i:nth-child(3){animation-delay:.3s}
@keyframes dot{50%{transform:translateY(-3cqw)}}

/* ===== decorate ===== */
.fw.full{width:100%;height:100%;display:flex;flex-direction:column}
.c1 .fw.full{padding:0;background:none;box-shadow:none}
.deco{flex:1;min-height:0;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;background:var(--soft);border-radius:var(--rad)}
.c2 .deco{background:repeating-linear-gradient(90deg,transparent 0 3.6cqw,#e3eef9 3.6cqw 3.8cqw),#fbfbf6}
.c3 .deco{background:#efe8ff}
.deco .zin{height:100%;display:flex;align-items:center;justify-content:center}
.deco .vstrip{transform:none}
.tabs{flex:none;display:grid;grid-template-columns:repeat(8,1fr);gap:.6cqw;margin-top:2.8cqw;background:var(--soft);border-radius:99px;padding:.8cqw}
.tabs u{text-decoration:none;text-align:center;font:400 3.4cqw/1 var(--tf);padding:1.8cqw 0;color:var(--ink);white-space:nowrap;border-radius:99px}
.tabs u.on{background:#fff;color:var(--deep);box-shadow:0 .6cqw 1.6cqw #c2587a26}
.c3 .tabs u{font-size:5.2cqw;font-weight:700;padding:1.6cqw 0 .8cqw}
.c2 .tabs{border-radius:1cqw;background:#fff4c9}
.c2 .tabs u{font-weight:700;font-size:3.9cqw;border-radius:.8cqw;padding:1.4cqw 0}
.opts{flex:none;display:flex;gap:2.6cqw;margin-top:2.6cqw}
.opts .tile{flex:1;display:flex;flex-direction:column;align-items:center;gap:1cqw;font-size:3.3cqw;color:var(--ink)}
.opts .tile i{width:100%;height:11cqw;border-radius:2cqw;display:block;box-shadow:0 .8cqw 2cqw #c2587a26}
.opts .tile.on i{box-shadow:0 0 0 .8cqw var(--deep),0 .8cqw 2cqw #c2587a26}
.opts .tile.on{color:var(--deep);font-weight:700}
.c2 .opts .tile i{border-radius:.6cqw}

/* ===== save sheet ===== */
.dim{position:absolute;inset:0;background:#2e223073;z-index:20}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:21;background:var(--bg);padding:5cqw 5cqw 6cqw;border-radius:7cqw 7cqw 0 0;animation:sheetup 3.6s cubic-bezier(.3,1.3,.5,1) infinite}
.c2 .sheet{border-radius:2cqw 2cqw 0 0;background:#fffdf4}
@keyframes sheetup{0%{transform:translateY(100%)}18%,100%{transform:none}}
.sheet:before{content:"";display:block;width:12cqw;height:1.2cqw;border-radius:99px;background:#d9c4cf;margin:-1.6cqw auto 3cqw}
.sheet h3{font:400 7cqw var(--tf)}
.c3 .sheet h3{font-size:11cqw;line-height:.9;font-weight:700}
.c2 .sheet h3{font-weight:700}
.warn{margin-top:3.4cqw;background:var(--paper);border-radius:3cqw;padding:2.6cqw 3.2cqw;font-size:3.4cqw;line-height:1.5;color:var(--ink);box-shadow:inset 0 0 0 .5cqw var(--soft)}
.c2 .warn{border-radius:.6cqw;background:#fff4c9;box-shadow:none;transform:rotate(-.6deg)}

/* ===== theme picker (drawn once) ===== */
