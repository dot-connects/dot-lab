<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>찍기 화면 고르기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&family=Space+Grotesk:wght@500;700&family=Dongle:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
/* 따로 같이 네컷 — camera (shoot) screen, 3 layouts x 2 themes. Frames are real 430x932 px (CSS zoom shrinks them on
   narrower screens). The preview box (.cell) shows only what lands in the strip cell: 가로 552:382, 세로 426:568. */
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:#ecebef;color:#1d1b22;font:15px/1.55 'Noto Sans KR',system-ui,sans-serif;overflow-x:hidden}
.wrap{max-width:1880px;margin:0 auto;padding:22px 16px 60px}
h1{font:900 26px/1.25 'Noto Sans KR';letter-spacing:-.03em}
.lead{color:#3d3a45;margin-top:6px;max-width:780px}
.nowt{border-collapse:collapse;margin-top:12px;font-size:14px;background:#fff;max-width:100%}
.nowt :is(td,th){border:1px solid #cfccd6;padding:4px 8px;text-align:left;white-space:nowrap}
.nowt th{background:#f4f3f7}
.nowt td[colspan]{white-space:normal;min-width:300px}
.tw{overflow-x:auto;max-width:100%}
section{margin-top:40px}
h2{font:900 22px/1.3 'Noto Sans KR';display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;letter-spacing:-.02em}
h2 .no{font:700 14px 'Space Grotesk';background:#1d1b22;color:#fff;padding:1px 10px;border-radius:99px}
.desc{max-width:780px;margin-top:4px;color:#3d3a45}
.desc b{color:#1d1b22}
.th{font:900 17px 'Noto Sans KR';margin-top:18px}
.row{display:flex;flex-wrap:wrap;gap:22px;margin-top:10px}
figure{width:calc(430px * var(--z,1))}
.slot{width:430px;height:932px;zoom:var(--z,1)}
figcaption{margin-top:6px;font-size:14px;line-height:1.45}
figcaption b{font-weight:900}
figcaption .m{display:block;color:#4a4652;font-family:'Space Grotesk','Noto Sans KR';font-weight:500}

/* ---------------- phone frame ---------------- */
.fr{width:430px;height:932px;position:relative;overflow:hidden;border-radius:26px;box-shadow:0 0 0 1px #0000001f,0 10px 28px #00000022}
.fr.land{width:932px;height:430px;transform:translateX(430px) rotate(90deg);transform-origin:0 0}
.fr{word-break:keep-all}
.fr *{position:absolute}
.fr .fl{position:static}
.ab{position:absolute}
svg.sc{display:block}

/* film: black booth, lime, sprocket holes */
.fr.film{background:#000;color:#fff;font-family:'Noto Sans KR',sans-serif}
.film .spr{height:14px;background:#000 repeating-linear-gradient(90deg,#000 0 5px,#fff 5px 14px,#000 14px 19px) 0 3px/100% 8px no-repeat}
.film .sprv{width:14px;background:#000 repeating-linear-gradient(#000 0 5px,#fff 5px 14px,#000 14px 19px) 3px 0/8px 100% no-repeat}
.film .step{font:700 20px/1 'Space Grotesk';background:#d6ff3d;color:#000;padding:6px 11px 5px}
.film .pose{font:900 23px/1.2 'Noto Sans KR';letter-spacing:-.04em;color:#fff;white-space:nowrap}
.film .sound{display:flex;align-items:center;gap:4px;border:2px solid #fff;background:#000;color:#fff;font:700 14px 'Noto Sans KR';padding:6px 10px 6px 8px;white-space:nowrap}
.fr .sound svg{position:static;width:20px;height:20px}
.fr .sound .off{display:none}
.film .pips{display:flex;gap:6px;justify-content:center}
.film .pips i{position:static;flex:1;max-width:58px;height:10px;background:#555}
.film .pips i.has{background:#d6ff3d}
.film .pips i.now{background:#fff}
.film .tool{display:flex;flex-direction:column;align-items:center;gap:5px;width:84px;font:700 14px 'Noto Sans KR';color:#fff}
.film .tool i{position:static;width:56px;height:56px;border:3px solid #fff;display:grid;place-items:center;color:#fff}
.film .tool.on i{background:#d6ff3d;border-color:#d6ff3d;color:#000}
.fr .tool svg{position:static;width:26px;height:26px}
.film .shutter{width:84px;height:84px;border-radius:50%;background:#d6ff3d;border:5px solid #000;box-shadow:0 0 0 4px #fff}
.film .shutter.busy{background:conic-gradient(#d6ff3d 0 25%,#222 0)}
.film .pill{font:700 15px 'Noto Sans KR';padding:9px 14px;background:#000;color:#fff;box-shadow:inset 0 0 0 2px #fff;white-space:nowrap}
.film .pill.on{background:#d6ff3d;color:#000;box-shadow:inset 0 0 0 3px #d6ff3d}
.film .hint{font:700 15px/1.35 'Noto Sans KR';color:#fff;text-align:center}
.film .chip{background:#000000a6;color:#fff;font:700 15px/1.35 'Noto Sans KR';padding:6px 8px 6px 12px;display:flex;gap:8px;align-items:center;white-space:nowrap}
.film .chip i{position:static;font-style:normal;width:22px;height:22px;display:grid;place-items:center;background:#d6ff3d;color:#000;font-size:12px}
.film .hintbox{background:#fff;color:#000;border:2px solid #000;font:700 15px/1.35 'Noto Sans KR';padding:6px 6px 6px 12px;display:flex;gap:8px;align-items:center;white-space:nowrap}
.film .hintbox i{position:static;font-style:normal;width:22px;height:22px;display:grid;place-items:center;background:#d6ff3d;color:#000;font-size:12px}
.film .count{font:700 150px/1 'Space Grotesk';color:#d6ff3d;text-shadow:5px 5px 0 #000,-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000}
.film .rec{background:#b3001b;color:#fff;font:700 14px 'Noto Sans KR';padding:3px 10px}
.film .last{border:3px solid #fff;outline:2px solid #000}
.film .crn{--g:linear-gradient(#d6ff3d,#d6ff3d);background:var(--g) left top/26px 4px,var(--g) left top/4px 26px,var(--g) right top/26px 4px,var(--g) right top/4px 26px,var(--g) left bottom/26px 4px,var(--g) left bottom/4px 26px,var(--g) right bottom/26px 4px,var(--g) right bottom/4px 26px;background-repeat:no-repeat;inset:0;pointer-events:none}
.film .ov{background:#000000a6}
.film .sheet{background:#000;border-top:2px solid #fff}
.film .thumb{background:#262626;outline:2px solid #555;outline-offset:-2px}
.film .thumb.now{outline:3px solid #fff;outline-offset:-3px}

/* cute: lavender dotted paper, pink curtain, mascot, Dongle + Gowun Dodum */
.fr.cute{background:radial-gradient(circle at 1px 1px,#d9ccfb 1px,transparent 1.6px) 0 0/17px 17px,linear-gradient(#f6f1ff,#efe6ff);color:#2a2140;font-family:'Gowun Dodum',sans-serif}
.cute .cur{height:22px;background:radial-gradient(circle at 50% 0,#ff8fbd 7px,transparent 7.5px) 0 13px/14.6px 8px repeat-x,linear-gradient(#ff8fbd,#ff8fbd) 0 6px/100% 7.2px no-repeat,#fff}
.cute .mas{width:42px;height:45px}
.cute .bub{background:#fff;border-radius:16px;box-shadow:0 4px 12px #6b3fc426;display:flex;align-items:center;gap:10px;padding:0 10px}
.cute .bub::before{content:"";position:absolute;left:-9px;top:50%;margin-top:-7px;border:7px solid transparent;border-right:10px solid #fff;border-left:0}
.cute .step{font:700 30px/1 'Dongle';background:#e6dcff;color:#2a2140;border-radius:99px;padding:5px 13px 0;white-space:nowrap}
.cute .pose{font:700 34px/.9 'Dongle';color:#2a2140;padding-top:4px;white-space:nowrap}
.cute .sound{display:flex;align-items:center;gap:4px;border-radius:99px;background:#fff;color:#2a2140;font:400 14px 'Gowun Dodum';padding:7px 12px 7px 9px;box-shadow:0 3px 10px #6b3fc424;white-space:nowrap}
.cute .pips{display:flex;gap:11px;justify-content:center;align-items:center}
.cute .pips i{position:static;width:13px;height:13px;border-radius:50%;background:#ddd0fb}
.cute .pips i.has{background:#ff8fbd}
.cute .pips i.now{background:#5a31ab;transform:scale(1.35)}
.cute .tool{display:flex;flex-direction:column;align-items:center;gap:5px;width:84px;font:400 14px 'Gowun Dodum';color:#2a2140}
.cute .tool i{position:static;width:58px;height:58px;border-radius:50%;background:#fff;box-shadow:0 5px 13px #6b3fc426;display:grid;place-items:center;color:#2a2140}
.cute .tool.on i{background:#e6dcff}
.cute .shutter{width:88px;height:88px;border-radius:50%;border:7px solid #fff;background:radial-gradient(circle at 50% 30%,#ffc3dc,#ff8fbd 70%);box-shadow:0 0 0 3px #ff8fbd,0 6px 0 3px #d9578f,0 12px 22px #6b3fc433}
.cute .shutter.busy{background:#ece6fb}
.cute .pill{font:400 15px 'Gowun Dodum';padding:9px 15px;border-radius:99px;background:#fff;color:#2a2140;box-shadow:0 3px 0 #d6c6f6;white-space:nowrap}
.cute .pill.on{background:#5a31ab;color:#fff;box-shadow:0 3px 0 #3d1f7c}
.cute .hint{font:400 15px/1.35 'Gowun Dodum';color:#2a2140;text-align:center}
.cute .chip{background:#2a2140bd;color:#fff;font:400 15px/1.35 'Gowun Dodum';padding:6px 7px 6px 13px;border-radius:99px;display:flex;gap:8px;align-items:center;white-space:nowrap}
.cute .chip i{position:static;font-style:normal;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:#2a2140;color:#fff;font-size:12px}
/* Dongle's glyph box is tall: on the camera the counter / pose chip grows to hold it, so no glyph sits on the bare picture */
.cute .cc{padding:4px 0!important;align-items:center}
.cute .cc .step{line-height:1.45;padding:1px 13px 0;margin-left:4px;font-size:28px}
.cute .cc .pose{line-height:1.45;font-size:32px;padding-top:0}
.cute .hintbox{background:#fff;color:#2a2140;border-radius:99px;box-shadow:0 3px 10px #6b3fc433;font:400 15px/1.35 'Gowun Dodum';padding:6px 7px 6px 13px;display:flex;gap:8px;align-items:center;white-space:nowrap}
.cute .hintbox i{position:static;font-style:normal;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:#e6dcff;color:#2a2140;font-size:12px}
.cute .count{font:700 230px/1 'Dongle';color:#fff;-webkit-text-stroke:5px #5a31ab;paint-order:stroke fill;text-shadow:0 4px 22px #6b3fc499}
.cute .rec{background:#fff;color:#2a2140;border-radius:99px;font:400 14px 'Gowun Dodum';padding:4px 12px;box-shadow:0 3px 10px #6b3fc433}
.cute .last{border:4px solid #fff;border-radius:9px;box-shadow:0 4px 12px #6b3fc444;overflow:hidden}
.cute .ov{background:#2a2140bd}
.cute .sheet{background:#fff;border-radius:26px 26px 0 0;box-shadow:0 -5px 0 #e6dcff,0 -10px 24px #6b3fc426}
.cute .thumb{background:#fff;border-radius:9px;box-shadow:0 3px 0 #d6c6f6;overflow:hidden}
.cute .thumb.now{box-shadow:0 0 0 3px #5a31ab}
.cute .cell.rnd{border-radius:0 0 16px 16px}
.cell{overflow:hidden}
.cell > svg,.thumb > svg,.last > svg{width:100%;height:100%}
.row-c{display:flex;justify-content:center;align-items:flex-start;gap:22px}
.scrimT{background:linear-gradient(#000000a6,#00000000)}
.scrimB{background:linear-gradient(#00000000,#000000b3 45%)}
.cute .scrimT{background:linear-gradient(#2a2140b0,#2a214000)}
.cute .scrimB{background:linear-gradient(#2a214000,#2a2140c0 45%)}
.ovlab .tool{color:#fff;text-shadow:0 1px 3px #000}
.film .ovlab .tool i{background:#000000a6}
.film .ovlab .tool.on i{background:#d6ff3d}
.cute .ovlab .tool{color:#fff;text-shadow:0 1px 3px #2a2140}
/* other screen sizes: short screens fold the header and shrink the buttons; text on chips wraps instead of running off */
.cmp .row-c{gap:14px}
.cmp .tool{width:74px;font-size:13px}
.cmp .tool i{width:48px!important;height:48px!important}
.cmp .tool svg{width:22px;height:22px}
.cmp .shutter{width:72px!important;height:72px!important}
.tiny .sound .fl,.tiny .snd,.sound.ico .fl{display:none}
.fr .chip,.fr .hintbox{width:max-content;max-width:calc(100% - 24px);white-space:normal;text-wrap:balance}
.fr .cc{white-space:nowrap}
.row-c.col{flex-direction:column;align-items:stretch}
.row-c.col .pill{text-align:center;padding:7px 6px!important;font-size:13px!important}
.rail{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.cute .cell.rland{border-radius:0 18px 18px 0}
.rule{max-width:780px;margin-top:6px;font-size:14px;background:#fff;border-left:4px solid #1d1b22;padding:6px 10px}
.bad{display:block;color:#b3001b;font-weight:700}
.tgl{position:sticky;top:0;z-index:5;display:flex;gap:8px;background:#ecebef;padding:10px 0;margin-top:14px}
.tgl button{flex:1;max-width:220px;font:700 15px 'Noto Sans KR';padding:9px;border:2px solid #1d1b22;background:#fff;color:#1d1b22;cursor:pointer}
.tgl button[aria-pressed=true]{background:#1d1b22;color:#fff}
body[data-th=film] .tc-cute,body[data-th=cute] .tc-film{display:none}
/* pick page: the three layouts side by side, one scene at a time */
.wrap{max-width:1500px}
.bar{position:sticky;top:0;z-index:5;background:#ecebef;padding:10px 0;margin-top:12px;display:flex;flex-direction:column;gap:8px}
.tgl{position:static;margin:0;padding:0}
.three{display:flex;gap:16px;margin-top:8px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:10px}
.three > div{flex:none;scroll-snap-align:center;display:flex;flex-direction:column;gap:8px}
.three h2{font-size:20px}
.three .one{font-size:14px;color:#3d3a45;max-width:var(--fw)}
.three figcaption .m{font-size:13px}
.swipe{font-size:13px;color:#4a4652;margin-top:6px}
@media (min-width:900px){.swipe{display:none}}
</style>
</head>
<body data-th="film" data-k="A가로">
<div class="wrap">
  <h1>찍기 화면 — 셋 중 하나만 골라 주세요</h1>
  <div class="bar">
    <div class="tgl" role="group" aria-label="테마"><button type="button" data-th="film">필름 레일</button><button type="button" data-th="cute">말랑 부스</button></div>
    <div class="tgl" role="group" aria-label="장면"><button type="button" data-k="A가로">가로 네컷</button><button type="button" data-k="A세로">세로 네컷</button><button type="button" data-k="B가로">친구(B) 차례</button></div>
  </div>
  <p class="swipe">옆으로 밀면 2·3번이 나와요</p>
  <div class="three" id="out"></div>
</div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-mirror" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18" stroke-dasharray="2 3"/><path d="M9 7 3 17h6z"/><path d="M15 7l6 10h-6z" fill="currentColor"/></g></symbol>
  <symbol id="i-flip" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><path d="M9.5 13a2.8 2.8 0 0 1 4.8-1.8M14.5 13a2.8 2.8 0 0 1-4.8 1.8"/><path d="M14.6 9.6v1.8h-1.8M9.4 16.4v-1.8h1.8"/></g></symbol>
  <symbol id="i-sound" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></g></symbol>
  <symbol id="mas" viewBox="0 0 60 64"><circle cx="30" cy="6" r="4" fill="#ffe27a" stroke="#2a2140" stroke-width="2"/><rect x="4" y="10" width="52" height="50" rx="15" fill="#ff9cc4" stroke="#2a2140" stroke-width="2.4"/><path d="M9 18h42v5q-5.25 5-10.5 0q-5.25 5-10.5 0q-5.25 5-10.5 0q-5.25 5-10.5 0z" fill="#c45fd9" stroke="#2a2140" stroke-width="2" stroke-linejoin="round"/><path d="M18 39q4-5 8 0M34 39q4-5 8 0" stroke="#2a2140" stroke-width="2.4" fill="none" stroke-linecap="round"/><ellipse cx="15" cy="45" rx="4" ry="2.6" fill="#ff5f9e" opacity=".6"/><ellipse cx="45" cy="45" rx="4" ry="2.6" fill="#ff5f9e" opacity=".6"/><path d="M25 46q5 5 10 0" stroke="#2a2140" stroke-width="2.4" fill="none" stroke-linecap="round"/><rect x="18" y="53" width="24" height="3" rx="1.5" fill="#5b2a49"/></symbol>
</svg>

<script>
(function(){
var W=430,H=932,C=false,TINY=false;   // the screen being drawn (CSS px); C = short screen (< 700 px): folded header, smaller buttons
var AW=552/382, AT=426/568;            // cell aspect: 가로, 세로
var POSES=["브이!","반쪽 하트","꽃받침","깜짝 놀란 척","윙크 한 번","볼 빵빵"];
var HINT_A="친구 자리를 생각해서 한쪽으로 비켜서 찍어 줘", HINT_SHOOT="셔터 한 번이면 6장을 이어서 찍어 · 한 장에 5초";
var uid=0;
function P(x,y,w,h){return 'left:'+x+'px;top:'+y+'px;'+(w!=null?'width:'+w+'px;':'')+(h!=null?'height:'+h+'px;':'');}

// ---- fake camera pictures: a room + people (A dark hair / black top, B brown hair / white top) ----
function person(w,h,cx,s,o){
  var k=s/120, x=cx*w-50*k, y=h-108*k, hair=o.b?'#8a5a3b':'#3b2a33', shirt=o.b?'#f4f4f4':'#151515';
  var body='<path d="M8 124C8 94 28 84 50 84C72 84 92 94 92 124Z"/><ellipse cx="50" cy="50" rx="22" ry="26"/>';
  var g='<g transform="translate('+x.toFixed(1)+' '+y.toFixed(1)+') scale('+k.toFixed(3)+')">';
  if(o.cut) g+='<g fill="#fff" stroke="#fff" stroke-width="'+(9).toFixed(1)+'" stroke-linejoin="round">'+body+'<path d="M27 46c-3-30 49-30 46 0-7-12-24-15-46 0z"/></g>';
  g+='<path d="M8 124C8 94 28 84 50 84C72 84 92 94 92 124Z" fill="'+shirt+'"'+(o.b?' stroke="#c9c9c9" stroke-width="1.5"':'')+'/>'+
     '<rect x="42" y="70" width="16" height="18" fill="#f1cdb6"/><ellipse cx="50" cy="50" rx="22" ry="26" fill="#ffe1cf"/>'+
     (o.b?'<path d="M27 52c-5-34 51-34 46 0l-4-11c-10 3-26 3-38-6z" fill="'+hair+'"/>':'<path d="M27 46c-3-30 49-30 46 0-7-12-24-15-46 0z" fill="'+hair+'"/>')+
     '<circle cx="42" cy="52" r="2.6" fill="#3b2a33"/><circle cx="58" cy="52" r="2.6" fill="#3b2a33"/>'+
     '<path d="M43 61q7 6 14 0" stroke="#3b2a33" stroke-width="2.6" fill="none" stroke-linecap="round"/>'+
     '<circle cx="36" cy="59" r="4" fill="#ff9a8a" opacity=".45"/><circle cx="64" cy="59" r="4" fill="#ff9a8a" opacity=".45"/>';
  if(o.v) g+='<g transform="translate(70 70) rotate(-12)"><rect x="-6" y="0" width="12" height="24" rx="6" fill="#ffe1cf"/><rect x="-7" y="-20" width="5" height="24" rx="2.5" fill="#ffe1cf" transform="rotate(-14)"/><rect x="2" y="-20" width="5" height="24" rx="2.5" fill="#ffe1cf" transform="rotate(14)"/></g>';
  return g+'</g>';
}
function scene(w,h,kind){
  var id='s'+(uid++), dark=kind==='dark', s='<svg class="sc" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg"><defs>'+
    '<linearGradient id="'+id+'w" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+(dark?'#2b2634':'#f8f6f1')+'"/><stop offset="1" stop-color="'+(dark?'#17141d':'#e6e0d4')+'"/></linearGradient>'+
    '<radialGradient id="'+id+'l"><stop offset="0" stop-color="#ffd58a" stop-opacity=".75"/><stop offset="1" stop-color="#ffd58a" stop-opacity="0"/></radialGradient></defs>'+
    '<rect width="'+w+'" height="'+h+'" fill="url(#'+id+'w)"/>';
  if(dark){
    s+='<circle cx="'+(w*.82)+'" cy="'+(h*.24)+'" r="'+(h*.34)+'" fill="url(#'+id+'l)"/>'+
       '<path d="M'+(w*.77)+' '+(h*.14)+'h'+(w*.1)+'l'+(w*.03)+' '+(h*.09)+'h'+(-w*.16)+'z" fill="#f2c477"/>'+
       '<rect x="'+(w*.06)+'" y="'+(h*.1)+'" width="'+(w*.2)+'" height="'+(h*.26)+'" fill="#3d3549"/>'+
       '<rect x="'+(w*.09)+'" y="'+(h*.14)+'" width="'+(w*.14)+'" height="'+(h*.18)+'" fill="#4d4060"/>';
  }else{
    s+='<rect x="'+(w*.58)+'" y="'+(h*.05)+'" width="'+(w*.38)+'" height="'+(h*.5)+'" fill="#ffffff" stroke="#d9d2c4" stroke-width="5"/>'+
       '<path d="M'+(w*.77)+' '+(h*.05)+'v'+(h*.5)+'M'+(w*.58)+' '+(h*.3)+'h'+(w*.38)+'" stroke="#d9d2c4" stroke-width="5"/>'+
       '<rect x="'+(w*.06)+'" y="'+(h*.12)+'" width="'+(w*.18)+'" height="'+(h*.22)+'" fill="#f0c9b8" stroke="#c9b9a6" stroke-width="4"/>'+
       '<path d="M'+(w*.03)+' '+h+'v'+(-h*.2)+'q'+(w*.05)+' '+(-h*.12)+' '+(w*.1)+' 0v'+(h*.2)+'z" fill="#9ccf8f"/>';
  }
  var big=Math.min(h*.86,w*.6);
  if(kind==='bv'){                                   // A's room, B live behind, A's still cut-out in front
    s+=person(w,h,.66,big*.9,{b:1,v:1})+person(w,h,.34,big,{cut:1});
  }else if(kind==='pose'){ s+=person(w,h,.36,big,{v:1}); }
  else s+=person(w,h,.34,big,{});
  return s+'</svg>';
}
function thumbScene(w,h){return scene(w,h,'light');}

// ---- shared bits ----
function fit(a,mw,mh){var w=Math.floor(Math.min(mw,mh*a));return {w:w,h:Math.round(w/a)};}
function pips(now){var s='';for(var i=0;i<6;i++)s+='<i class="'+(i<now?'has':i===now?'now':'')+'"></i>';return s;}
function tool(kind,on){return '<div class="tool fl k'+(on?' on':'')+'" data-n="'+(kind==='mirror'?'좌우반전':'앞/뒤')+'"><i><svg><use href="#i-'+kind+'"/></svg></i><span class="fl">'+(kind==='mirror'?'좌우반전':'앞/뒤 카메라')+'</span></div>';}
function shutter(busy){return '<div class="shutter fl k'+(busy?' busy':'')+'" data-n="셔터" aria-label="6장 이어서 찍기"></div>';}
function ctrlRow(x,y,w,busy,cls){return '<div class="row-c '+(cls||'')+'" style="'+P(x,y,w)+'">'+tool('mirror',1)+shutter(busy)+tool('flip',0)+'</div>';}
function sound(st,cls){return '<div class="sound k'+(cls||'')+'" data-n="소리" style="'+st+'"><svg><use href="#i-sound"/></svg><span class="fl">소리 켬</span></div>';}
function pills(x,y,w,col){return '<div class="row-c'+(col?' col':'')+'" style="'+P(x,y,w)+';gap:8px"><div class="pill fl k" data-n="보기1">내 카메라 배경</div><div class="pill fl on k" data-n="보기2">친구 배경에 같이</div></div>';}
function mascot(x,y,sz){return '<svg class="mas k" data-n="마스코트" style="'+P(x,y,sz,Math.round(sz*64/60))+'"><use href="#mas"/></svg>';}
function hintbox(y){return '<div class="hintbox k" data-n="힌트" style="left:50%;transform:translateX(-50%);top:'+y+'px">'+HINT_A+'<i>✕</i></div>';}
function camChips(o){        // counter + pose, sound: on the camera, top
  return '<div class="scrimT" style="left:0;top:0;width:100%;height:64px"></div>'+
    '<div class="ov chip cc k" data-n="숫자칩" style="'+P(12,12)+';padding:0"><span class="step fl">'+(o.idx+1)+' / 6</span><span class="pose fl" style="padding:0 14px 0 10px;color:#fff">'+o.pose+'</span></div>'+
    '<div class="ov chip k" data-n="소리칩" style="right:12px;top:14px;padding:7px 11px 7px 8px"><svg style="position:static;width:20px;height:20px"><use href="#i-sound"/></svg><span class="fl snd">소리 켬</span></div>';
}
var CTRL=function(){return C?80:94;};          // the button row: tool icon + label, or the shutter (+ cute 3D edge)
var HA=function(){return W<400?60:40;};         // HINT_A box: 2 lines under 400 px
var HS=function(){return W<400?42:22;};         // 셔터 한 번이면… : 2 lines under 400 px
var GAP=function(){return C?12:22;};            // bottom inset under the buttons (gesture bar)

function K(kind){
  var o={kind:kind, wide:kind!=='A세로'&&kind!=='카운트다운', idx:0, scene:'light', b:kind==='B가로', count:kind==='카운트다운'};
  if(kind==='A세로')o.scene='dark';
  if(kind==='B가로')o.scene='bv';
  if(o.count){o.idx=2;o.scene='pose';}
  o.pose=POSES[o.idx]; o.a=kind==='A가로'||kind==='A세로';
  return o;
}
function onCam(o,t,cw,ch,opt){
  var s='';
  if(o.count){
    s+='<div class="count" style="'+P(0,0,cw,ch)+';display:grid;place-items:center">2</div>';
    s+='<div class="rec k" data-n="녹화" style="left:50%;transform:translateX(-50%);top:'+((opt&&opt.recY)||12)+'px">2초 녹화</div>';
    if(!(opt&&opt.noLast)) s+='<div class="last k" data-n="방금" style="'+P(12,ch-12-(opt&&opt.lastB||0)-88,66,88)+'">'+thumbScene(66,88)+'</div>';
  }
  if(t==='film') s+='<div class="crn"></div>';
  return s;
}
function cellDiv(x,y,c,inner,cls){return '<div class="cell k'+(cls||'')+'" data-n="미리보기" style="'+P(x,y,c.w,c.h)+'">'+inner+'</div>';}
function bands(t,x,y,c,bottom){       // film: holes above (and below) the picture; cute: the curtain above it
  if(t==='film') return '<div class="spr" style="'+P(0,y-14,W)+'"></div>'+(bottom?'<div class="spr" style="'+P(0,y+c.h,W)+'"></div>':'');
  return '<div class="cur" style="'+P(x,y-22,c.w)+'"></div>';
}

// =================== layout 1: one-line header + bottom panel, nothing on the camera but the countdown ===================
function L1(t,o){
  var s='', film=t==='film', a=o.wide?AW:AT, head=C?46:58;
  if(film){
    s+='<div class="step k" data-n="숫자" style="'+P(16,Math.round((head-31)/2))+'">'+(o.idx+1)+' / 6</div><div class="pose k" data-n="포즈" style="'+P(90,Math.round((head-28)/2))+'">'+o.pose+'</div>'+
       sound('right:14px;top:'+Math.round((head-36)/2)+'px');
  }else{
    var ms=C?34:42, bw=W-(ms+24)-(TINY?58:124);
    s+=mascot(12,Math.round((head-ms*64/60)/2),ms)+'<div class="bub k" data-n="말풍선" style="'+P(ms+24,Math.round((head-(C?40:46))/2),bw,C?40:46)+'"><span class="step fl">'+(o.idx+1)+' / 6</span><span class="pose fl">'+o.pose+'</span></div>'+
       sound('right:14px;top:'+Math.round((head-36)/2)+'px');
  }
  var bT=film?14:22, bB=film?14:0;
  var sh=16+14+14+(o.a?HA()+10:0)+(o.b?54:0)+CTRL()+GAP(), sy=H-sh;   // the panel is as tall as what it holds
  var room=sy-head-bT-bB, c=fit(a,W,room), x=Math.round((W-c.w)/2), y=head+bT+Math.round((room-c.h)/2);
  s+=bands(t,x,y,c,true)+cellDiv(x,y,c,scene(c.w,c.h,o.scene)+onCam(o,t,c.w,c.h),film?'':' rnd');
  if(o.a&&o.wide&&y-bT-head>=HS()+16) s+='<div class="hint k" data-n="안내" style="'+P(16,head+Math.round((y-bT-head-HS())/2),W-32)+'">'+HINT_SHOOT+'</div>';
  s+='<div class="sheet" style="'+P(0,sy,W,sh+30)+'"></div>';
  var py=sy+16;
  s+='<div class="pips k" data-n="점" style="'+P(24,py,W-48,14)+'">'+pips(o.idx)+'</div>'; py+=28;
  if(o.a) s+=hintbox(py), py+=HA()+10;
  if(o.b) s+=pills(0,py,W), py+=54;
  s+=ctrlRow(0,H-CTRL()-GAP(),W,o.count);
  return s;
}

// =================== layout 2: counter, pose, sound, dots inside the camera picture ===================
function L2(t,o){
  var s='', film=t==='film', a=o.wide?AW:AT, m=film?8:10, bT=film?14:22, bB=film?14:0, cy0=H-CTRL()-GAP();
  var below=(o.a?HS()+14:0)+(o.b?54:0)+14;
  var room=cy0-below-m-bT-bB, c=fit(a,W,room), x=Math.round((W-c.w)/2), y=m+bT+Math.round((room-c.h)/2);
  s+=bands(t,x,y,c,true);
  if(!film&&y-bT>=52) s+=mascot(10,y-22-44,42);        // the mascot only when there is height to spare
  var cam=scene(c.w,c.h,o.scene)+camChips(o)+'<div class="scrimB" style="'+P(0,c.h-40,c.w,40)+'"></div><div class="pips k" data-n="점" style="'+P(60,c.h-24,c.w-120,14)+'">'+pips(o.idx)+'</div>';
  var ty=t==='cute'?74:62;
  if(o.a) cam+=hintbox(ty);
  cam+=onCam(o,t,c.w,c.h,{recY:ty,lastB:30});
  s+=cellDiv(x,y,c,cam,film?'':' rnd');
  var py=y+c.h+bB+14;
  if(o.a) s+='<div class="hint k" data-n="안내" style="'+P(16,py,W-32)+'">'+HINT_SHOOT+'</div>', py+=HS()+14;
  if(o.b) s+=pills(0,py,W);
  s+=ctrlRow(0,cy0,W,o.count);
  return s;
}

// =================== layout 3: camera-app — buttons float on the picture, the 6 shots fill a strip ===================
function strip(x,y,w,o,cols){
  var s='', n=6, gap=8, c=cols||6, rows=Math.ceil(n/c), asp=o.wide?AW:AT, tw=Math.floor((w-gap*(c-1))/c), th=Math.round(tw/asp);
  for(var i=0;i<n;i++) s+='<div class="thumb k'+(i===o.idx?' now':'')+'" data-n="칸'+(i+1)+'" style="'+P(x+(i%c)*(tw+gap),y+Math.floor(i/c)*(th+gap),tw,th)+'">'+(i<o.idx?thumbScene(tw,th):'')+'</div>';
  return {html:s,h:rows*th+(rows-1)*gap};
}
function L3(t,o){
  if(o.wide) return L3land(t,o);
  var s='', film=t==='film', bB=film?14:0;
  var sx=film?16:64, sw=film?W-32:W-80, th=strip(0,0,sw,o).h, block=film?18+th+4+14:th+14+22;
  var c=fit(AT,W,H-bB-block-8), x=Math.round((W-c.w)/2), y=H-bB-c.h, sy=film?y-14-4-th:y-22-14-th;
  if(film) s+='<div class="spr" style="'+P(0,sy-18,W)+'"></div>'+strip(sx,sy,sw,o).html+'<div class="spr" style="'+P(0,y-14,W)+'"></div><div class="spr" style="'+P(0,y+c.h,W)+'"></div>';
  else s+=mascot(10,sy+Math.round(th/2)-22,42)+strip(sx,sy,sw,o).html+bands(t,x,y,c);
  var cam=scene(c.w,c.h,o.scene)+camChips(o)+'<div class="scrimB" style="'+P(0,c.h-CTRL()-70,c.w,CTRL()+70)+'"></div>'+ctrlRow(0,c.h-CTRL()-(C?18:34),c.w,o.count,'ovlab');
  var ty=t==='cute'?74:62;
  if(o.a) cam+=hintbox(ty);
  cam+=onCam(o,t,c.w,c.h,{recY:ty,noLast:1});
  s+=cellDiv(x,y,c,cam,film?'':' rnd');
  var top=(film?sy-18:sy)-8;
  if(o.a&&top>=HS()+16) s+='<div class="hint k" data-n="안내" style="'+P(16,Math.round((top-HS())/2),W-32)+'">'+HINT_SHOOT+'</div>';
  return s;
}
// 가로 = the phone on its side: an H x W screen, the cell on the left, a rail of buttons on the right edge (thumb)
function L3land(t,o){
  var s='', film=t==='film', LG=H, SH=W, RAIL=92, COLMIN=216;
  var c=fit(AW,LG-COLMIN-(film?14:0),SH), y=Math.round((SH-c.h)/2), colX=c.w+(film?14:0);
  var cam=scene(c.w,c.h,o.scene);
  if(o.a) cam+=hintbox(12);
  cam+=onCam(o,t,c.w,c.h,{recY:12,noLast:1});
  s+=cellDiv(0,y,c,cam,film?'':' rland');
  if(film) s+='<div class="sprv" style="'+P(c.w,0,14,SH)+'"></div>';
  var x0=colX+12, ws=LG-RAIL-x0-4, py=12;
  // counter + pose: one line when the column is wide, two when narrow
  var two=ws<200;
  if(film) s+='<div class="step k" data-n="숫자" style="'+P(x0,py)+'">'+(o.idx+1)+' / 6</div><div class="pose k" data-n="포즈" style="'+(two?P(x0,py+38):P(x0+72,py+1))+'">'+o.pose+'</div>';
  else s+='<div class="bub k" data-n="말풍선" style="'+P(x0,py,ws,two?80:44)+';'+(two?'flex-direction:column;align-items:flex-start;justify-content:center;gap:2px;padding:4px 10px':'gap:8px;padding:0 8px')+'"><span class="step fl" style="font-size:26px;padding:4px 10px 0">'+(o.idx+1)+' / 6</span><span class="pose fl" style="font-size:30px">'+o.pose+'</span></div>';
  py+=two?84:52;
  var st=strip(x0,py,ws,o,ws<200?2:3); s+=st.html; py+=st.h+12;
  if(o.b) s+=pills(x0,py,ws,ws<260);
  else s+='<div class="hint k" data-n="안내" style="'+P(x0,py,ws)+';font-size:13px;text-wrap:balance">'+HINT_SHOOT+'</div>';
  // the rail: sound on top, the mascot (cute), then mirror / shutter / flip centred
  var rx=LG-RAIL;
  s+=sound('left:'+(rx+(RAIL-44)/2)+'px;top:10px;padding:7px 9px',' ico');
  if(!film) s+=mascot(rx+(RAIL-32)/2,58,32);
  s+='<div class="rail" style="'+P(rx,film?56:100,RAIL,SH-(film?56:100)-8)+'">'+tool('mirror',1)+shutter(o.count)+tool('flip',0)+'</div>';
  return s;
}

// ---- checks: every .k inside the screen (and inside the picture if it sits on it), no two overlapping ----
function check(fr){
  var R=fr.getBoundingClientRect(), bad=[], ks=[].slice.call(fr.querySelectorAll('.k'));
  function inside(r,B){return r.left>=B.left-1&&r.top>=B.top-1&&r.right<=B.right+1&&r.bottom<=B.bottom+1;}
  ks.forEach(function(e){
    var r=e.getBoundingClientRect(), cell=e.parentElement.closest('.cell');
    if(!inside(r,R)) bad.push('잘림 '+e.dataset.n);
    else if(cell&&!inside(r,cell.getBoundingClientRect())) bad.push('사진 밖 '+e.dataset.n);
    if(e.scrollWidth>e.clientWidth+1&&!e.matches('.cell,.mas')) bad.push('글자 넘침 '+e.dataset.n);
  });
  for(var i=0;i<ks.length;i++)for(var j=i+1;j<ks.length;j++){
    var a=ks[i], b=ks[j];
    if(a.contains(b)||b.contains(a)) continue;
    if(a.parentElement.closest('.cell')!==b.parentElement.closest('.cell')) continue;   // the picture's own layer
    var p=a.getBoundingClientRect(), q=b.getBoundingClientRect();
    var ox=Math.min(p.right,q.right)-Math.max(p.left,q.left), oy=Math.min(p.bottom,q.bottom)-Math.max(p.top,q.top);
    if(ox>1&&oy>1) bad.push('겹침 '+a.dataset.n+'/'+b.dataset.n);
  }
  var sh=fr.querySelector('.shutter').getBoundingClientRect(), land=fr.classList.contains('land');
  var pos=Math.round(((sh.top+sh.bottom)/2-R.top)/R.height*100);
  return {bad:bad,pos:pos,land:land};
}

// ---- page ----
var LAY=[
  {f:L1,no:'1',name:'한 줄 머리 + 아래 판',desc:'위는 숫자·포즈·소리 <b>한 줄</b>, 미리보기는 <b>화면 가로 끝까지</b>, 진행 점·보기 버튼·셔터는 <b>아래 판</b>에. 카메라 위에는 카운트다운만 얹어서 글씨가 안 묻힘. 4단계 표시는 찍는 동안 접음(필름 구멍은 미리보기 위아래로, 말랑은 커튼 + 마스코트가 포즈를 말함).',
   rule:'미리보기 = min(100vw, (100dvh − 헤더 − 아래 판) × 칸 비율) · 아래 판은 담긴 것만큼(점·힌트·보기 버튼·버튼 줄) · 100dvh < 700px이면 헤더 58→46px, 셔터 84→72px.'},
  {f:L2,no:'2',name:'숫자·포즈를 사진 안에',desc:'숫자·포즈·소리·진행 점을 <b>미리보기 안</b>에 반투명 띠로 얹고, 밖에는 셔터 줄만. 머리 줄이 통째로 빠져서 미리보기가 위로 붙고 셔터는 엄지 자리. 글씨 뒤에는 어두운 띠를 깔아 밝은 방에서도 읽힘.',
   rule:'미리보기 = min(100vw, (100dvh − 버튼 줄 − 안내·보기 버튼) × 칸 비율) · 사진 위 띠는 높이 고정 · 마스코트는 미리보기 위로 52px 이상 남을 때만 · 100dvh < 700px이면 버튼 줄 94→80px.'},
  {f:L3,no:'3',name:'카메라 앱처럼 + 가로는 눕혀서',desc:'세로: 미리보기를 <b>화면 아래에 붙이고</b> 좌우반전·셔터·앞/뒤가 <b>그 위에 떠 있음</b>(엄지 자리), 바로 위에 찍힌 사진이 <b>6칸에 쌓임</b>(진행 점 대신). 가로: <b>폰을 옆으로 눕혀서</b> 찍음 → 미리보기가 화면 높이를 다 씀(그림은 폰을 눕힌 모습 그대로, 폰을 돌려 보면 실제 크기). 가로를 고르면 "폰을 옆으로 눕혀 줘" 안내 한 장이 새로 필요하고, 자동 회전이 잠긴 폰에서는 안 돌아감.',
   rule:'세로: 미리보기 = 아래에 붙인 min(100vw, (100dvh − 6칸 줄) × 3/4), 버튼은 미리보기 아래 띠에 떠서 늘 엄지 자리 · 가로(눕힘): 미리보기 = min(100dvh, (100vw − 216px) ÷ 칸 비율) 높이, 오른쪽 끝 92px 세로 줄에 버튼 · 좁은 쪽 칸이 200px 아래면 숫자·포즈 두 줄, 6칸은 2열.'}
];
var ONE={'1':'위 한 줄 + 아래 판. 사진 위엔 아무것도 안 얹음.','2':'숫자·포즈를 사진 안에 얹음. 사진이 제일 위로 붙음.','3':'카메라 앱처럼 버튼이 사진 위에 뜸. 가로는 폰을 눕혀서 찍음.'};
var SIZE=[430,932];
function frame(L,t,k){
  W=SIZE[0];H=SIZE[1];C=false;TINY=false;
  var o=K(k), land=L.f===L3&&o.wide;
  if(land) C=true;
  var fw=land?H:W, fh=land?W:H;
  return '<figure data-w="'+W+'"><div class="slot"><div class="fr '+t+(land?' land':'')+(C?' cmp':'')+'" style="width:'+fw+'px;height:'+fh+'px'+(land?';transform:translateX('+W+'px) rotate(90deg)':'')+'">'+L.f(t,o)+
    '</div></div><figcaption><span class="m"></span></figcaption></figure>';
}
var out=document.getElementById('out');
function draw(){
  var t=document.body.dataset.th, k=document.body.dataset.k, s='';
  LAY.forEach(function(L){s+='<div><h2><span class="no">'+L.no+'</span>'+L.name+'</h2>'+frame(L,t,k)+'<p class="one">'+ONE[L.no]+'</p></div>';});
  out.innerHTML=s;
  var top=out.getBoundingClientRect().top+scrollY, zh=(innerHeight-Math.min(top,innerHeight*.35)-110)/932;
  var z=Math.min(1,zh,innerWidth>=900?(Math.min(innerWidth,1500)-64)/(3*430):(innerWidth-56)/430);
  [].forEach.call(out.querySelectorAll('figure'),function(f){
    f.style.width=(430*z)+'px'; f.parentElement.style.setProperty('--fw',(430*z)+'px'); f.querySelector('.slot').style.zoom=z;
    var fr=f.querySelector('.fr'), c=fr.querySelector('.cell'), w=c.offsetWidth, h=c.offsetHeight;
    f.querySelector('.m').textContent='미리보기 '+w+'×'+h+' · 화면의 '+(w*h/(fr.offsetWidth*fr.offsetHeight)*100).toFixed(0)+'%';
  });
}
function bind(attr){
  [].forEach.call(document.querySelectorAll('.tgl button[data-'+attr+']'),function(b){
    b.onclick=function(){document.body.dataset[attr]=b.dataset[attr];sync();draw();};
  });
}
function sync(){[].forEach.call(document.querySelectorAll('.tgl button'),function(b){
  var a=b.dataset.th?'th':'k'; b.setAttribute('aria-pressed',b.dataset[a]===document.body.dataset[a]);});}
bind('th');bind('k');sync();draw();addEventListener('resize',draw);
})();
