<!doctype html><html lang="ko"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
/* layout: one column of rows; each row = 3-4 mockups side by side (swipe on a phone). Single light look, colours explicit. */
:root{
  --bg:#ecebef; --ink:#1d1b22; --sub:#4a4652; --pink:#ff7eb6; --deep:#c2276a; --paper:#fff7f4; --kakao:#b2c7da;
  --jua:'Jua','Noto Sans KR',system-ui,sans-serif; --hand:'Gaegu','Jua',system-ui,sans-serif; --body:'Noto Sans KR',system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--body)}
.wrap{max-width:1500px;margin:0 auto;padding-block:22px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font:900 24px/1.3 var(--body);letter-spacing:-.03em;text-wrap:balance}
h2{font:900 19px/1.3 var(--body);margin-top:34px;letter-spacing:-.02em;text-wrap:balance}
.lead{color:var(--sub);margin-top:6px;max-width:62ch}
.row{display:flex;gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;padding:12px 2px 12px}
.row > figure{flex:none;width:min-content;scroll-snap-align:center;display:flex;flex-direction:column;gap:8px}
figcaption{font:500 13px/1.5 var(--body);color:var(--sub);max-width:var(--fw)}
figcaption b{color:var(--ink);font-weight:900;font-size:14px;display:block}
.swipe{font-size:13px;color:var(--sub)}
@media (min-width:1100px){.swipe{display:none}}

/* ---------- KakaoTalk chat bubble with a link preview ---------- */
.chat{--fw:300px;width:300px;background:var(--kakao);border-radius:14px;padding:14px 12px 16px;display:flex;flex-direction:column;gap:6px}
.chat .who{font:500 12px var(--body);color:#3b4a5a}
.card{background:#fff;border-radius:10px;overflow:hidden;width:250px;box-shadow:0 1px 0 #0000000f}
.card .t{font:700 13.5px/1.35 var(--body);padding:9px 11px 2px}
.card .d{font:400 12px/1.4 var(--body);color:#6d6a73;padding:0 11px}
.card .u{font:400 11px var(--body);color:#9a97a0;padding:5px 11px 10px}
.msg{background:#fff;border-radius:10px;padding:7px 10px;font:400 13.5px/1.4 var(--body);max-width:250px}

/* ---------- 1200x630 thumbnails drawn in container units (100cqw = 1200px) ---------- */
.og{position:relative;width:100%;aspect-ratio:1200/630;container-type:inline-size;overflow:hidden}
.og img.full{width:100%;height:100%;object-fit:cover;display:block}
.og .h{position:absolute;font-family:var(--jua);line-height:1.08;letter-spacing:-.01em}
.og .pill{position:absolute;font:400 2.6cqw/1 var(--jua);border-radius:99px;padding:1.6cqw 3cqw}

/* T1: the send thumbnail, filled in */
.t1{background:linear-gradient(115deg,#fff7f4 0%,#ffe9ef 100%)}
.t1 .h{left:7cqw;top:12cqw;font-size:8.2cqw;color:var(--ink)}
.t1 .h em{font-style:normal;color:var(--deep)}
.t1 .s{position:absolute;left:7.2cqw;top:33cqw;font:400 2.9cqw var(--body);color:#5a5060}
.t1 .pill{left:7cqw;top:40.5cqw;background:var(--pink);color:#2a1a24}
.t1 .strip{position:absolute;right:8cqw;top:-2cqw;width:19cqw;transform:rotate(5deg);background:#fff;padding:1.3cqw;display:flex;flex-direction:column;gap:1.2cqw;box-shadow:0 2cqw 4cqw #c2276a22}
.t1 .cell{aspect-ratio:4/3;border-radius:.6cqw;background:linear-gradient(180deg,#ffd0e2,#f7a9c8);position:relative;overflow:hidden}
.t1 .cell svg{position:absolute;bottom:0;width:48%}
.t1 .cell svg.l{left:4%} .t1 .cell svg.r{right:4%}
.t1 .spark{position:absolute;color:#ffc93c;font-size:5cqw}
.t1 .ok{position:absolute;right:23cqw;top:30cqw;width:11cqw;aspect-ratio:1;border-radius:50%;background:var(--deep);color:#fff;font:400 3.1cqw/1 var(--jua);display:grid;place-items:center;transform:rotate(-12deg);box-shadow:0 0 0 .5cqw #fff}

/* T2: printed out of the booth slot */
.t2{background:#2a2230}
.t2 .slot{position:absolute;left:52cqw;right:6cqw;top:6cqw;height:4.2cqw;border-radius:2cqw;background:#120d16;box-shadow:inset 0 .6cqw 0 #000,0 .4cqw 0 #ffffff1a}
.t2 .strip{position:absolute;left:62cqw;width:22cqw;top:8cqw;background:#fff;padding:1.2cqw;display:flex;flex-direction:column;gap:1.1cqw}
.t2 .strip img{width:100%;display:block}
.t2 .h{left:7cqw;top:14cqw;font-size:8cqw;color:#fff}
.t2 .h em{font-style:normal;color:var(--pink)}
.t2 .s{position:absolute;left:7.2cqw;top:35cqw;font:400 2.9cqw var(--body);color:#d9d0de}
.t2 .pill{left:7cqw;top:42cqw;background:#fff;color:#2a2230}
.t2 .stamp{position:absolute;left:73cqw;top:30cqw;font:400 4.4cqw/1 var(--jua);color:#fff;background:var(--deep);padding:1.2cqw 2.2cqw;transform:rotate(-8deg);border:.4cqw solid #fff}

/* T3: the real strip */
.t3{background:linear-gradient(115deg,#fff7f4,#ffe3ec)}
.t3 .ph{position:absolute;right:9cqw;top:-6cqw;width:24cqw;transform:rotate(4deg);box-shadow:0 2cqw 4cqw #0000002a;border:1cqw solid #fff}
.t3 .ph img{display:block;width:100%}
.t3 .h{left:7cqw;top:12cqw;font-size:8.2cqw;color:var(--ink)}
.t3 .h em{font-style:normal;color:var(--deep)}
.t3 .s{position:absolute;left:7.2cqw;top:33cqw;font:400 2.9cqw var(--body);color:#5a5060}
.t3 .pill{left:7cqw;top:40.5cqw;background:var(--pink);color:#2a1a24}

/* ---------- 9:16 story frames (100cqw = 1080px), 6 s loop like the real export ---------- */
.st{--fw:270px;position:relative;width:270px;aspect-ratio:9/16;container-type:inline-size;overflow:hidden;border-radius:14px;box-shadow:0 8px 22px #00000026}
.st img{display:block}
.st .brand{position:absolute;left:0;right:0;text-align:center;font:400 4.6cqw var(--jua)}
.st .cta{position:absolute;left:50%;transform:translateX(-50%);white-space:nowrap;font:400 4.8cqw/1 var(--jua);padding:3cqw 5.5cqw;border-radius:99px}
/* the Instagram link sticker the user adds on top (not baked into the video) */
.igs{position:absolute;left:50%;transform:translateX(-50%);bottom:7%;background:#fff;color:#1d1b22;font:700 3.9cqw/1 var(--body);padding:2.6cqw 4.4cqw;border-radius:2.4cqw;box-shadow:0 1cqw 3cqw #0000003a;display:flex;gap:1.6cqw;align-items:center;white-space:nowrap;outline:.5cqw dashed #ffffffcc;outline-offset:1.2cqw}
.igs i{font-style:normal;color:#3b82f6}

/* S0: today's export */
.s0{background:linear-gradient(#fbe4ec,#f6cddd)}
.s0 .p{position:absolute;left:50%;top:5%;width:52%;transform:translateX(-50%);box-shadow:0 2cqw 4cqw #0000003a}
.s0 .p img{width:100%}
.s0 .brand{bottom:6%;color:#8a6475;font-size:3.6cqw}

/* S1: apart -> together */
.s1{background:#fff3f7}
.s1 .half{position:absolute;left:0;right:0;height:50%;overflow:hidden;animation:s1half 6s infinite both}
.s1 .half img{position:absolute;bottom:0;height:78%;left:50%;transform:translateX(-50%)}
.s1 .ha{top:0;background:linear-gradient(#ffd6e6,#ffb8d2)}
.s1 .hb{bottom:0;background:linear-gradient(#cfe6ff,#a9d1ff);animation-name:s1halfb}
.s1 .tag{position:absolute;left:5cqw;top:5cqw;font:400 6cqw/1 var(--jua);background:#fff;padding:2cqw 3.6cqw;border-radius:99px}
.s1 .split{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;font:400 7.6cqw/1.1 var(--jua);color:#fff;text-shadow:0 .6cqw 0 #c2276a,0 0 4cqw #c2276a88;animation:s1split 6s infinite both}
.s1 .p{position:absolute;left:50%;top:15%;width:46%;transform:translateX(-50%);border:1.4cqw solid #fff;box-shadow:0 2cqw 5cqw #c2276a33;animation:s1strip 6s infinite both}
.s1 .p img{width:100%}
.s1 .top{position:absolute;left:0;right:0;top:4.5%;text-align:center;font:400 7.4cqw/1.15 var(--jua);color:var(--ink);animation:s1top 6s infinite both}
.s1 .top em{font-style:normal;color:var(--deep)}
.s1 .cta{bottom:19%;background:var(--ink);color:#fff;animation:s1top 6s infinite both}
@keyframes s1half{0%,24%{transform:none;opacity:1}36%,100%{transform:translateY(-100%);opacity:0}}
@keyframes s1halfb{0%,24%{transform:none;opacity:1}36%,100%{transform:translateY(100%);opacity:0}}
@keyframes s1split{0%,22%{opacity:1;transform:translateY(-50%) scale(1)}30%,100%{opacity:0;transform:translateY(-50%) scale(1.3)}}
@keyframes s1strip{0%,28%{opacity:0;transform:translateX(-50%) scale(.6)}40%{opacity:1;transform:translateX(-50%) scale(1.04)}46%,100%{opacity:1;transform:translateX(-50%) scale(1)}}
@keyframes s1top{0%,38%{opacity:0;transform:translateY(3cqw)}48%,100%{opacity:1;transform:none}}
.s1 .cta{animation-name:s1cta}
@keyframes s1cta{0%,40%{opacity:0}52%,100%{opacity:1}}

/* S2: big handwritten hook + swinging strip */
.s2{background:#ffe8f0}
.s2 .hook{position:absolute;left:6cqw;right:6cqw;top:5%;font:700 11cqw/1.02 var(--hand);color:var(--ink);transform:rotate(-3deg)}
.s2 .hook em{font-style:normal;background:linear-gradient(transparent 58%,#ffd84d 58%)}
.s2 .p{position:absolute;left:50%;top:25%;width:34%;margin-left:-17%;border:1.3cqw solid #fff;box-shadow:0 2.4cqw 5cqw #0000002e;transform-origin:50% -6%;animation:swing 3s ease-in-out infinite}
.s2 .p img{width:100%}
.s2 .pin{position:absolute;left:50%;top:-4.5cqw;width:5cqw;height:5cqw;margin-left:-2.5cqw;border-radius:50%;background:var(--deep);box-shadow:0 .6cqw 0 #8a1748}
.s2 .note{position:absolute;right:5cqw;top:48%;font:700 6.4cqw/1.05 var(--hand);color:var(--deep);transform:rotate(8deg);text-align:center}
.s2 .brand{bottom:1.5%;color:#8a6475;font-size:4cqw}
@keyframes swing{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}

/* S3: the booth prints it */
.s3{background:#2a2230}
.s3 .mach{position:absolute;left:0;right:0;top:0;height:13%;background:#3a3040;box-shadow:0 1cqw 0 #120d16}
.s3 .mach b{position:absolute;left:0;right:0;top:3.4cqw;text-align:center;font:400 5.6cqw/1 var(--jua);color:#fff;letter-spacing:.06em}
.s3 .mach i{position:absolute;left:22%;right:22%;bottom:2cqw;height:2.6cqw;border-radius:2cqw;background:#0b070e}
.s3 .clip{position:absolute;left:0;right:0;top:12%;bottom:0;overflow:hidden}
.s3 .p{position:absolute;left:50%;width:46%;margin-left:-23%;top:0;background:#fff;padding:1.4cqw;animation:print 6s cubic-bezier(.3,.7,.3,1) infinite both}
.s3 .p img{width:100%}
.s3 .flash{position:absolute;inset:0;background:#fff;opacity:0;animation:fl 6s infinite}
.s3 .stamp{position:absolute;right:7cqw;top:60%;font:400 6cqw/1 var(--jua);color:#fff;background:var(--deep);padding:2cqw 3.4cqw;border:.6cqw solid #fff;transform:rotate(-10deg);animation:stp 6s infinite both}
.s3 .brand{bottom:20%;color:#d9d0de;font-size:4.2cqw}
@keyframes print{0%{transform:translateY(-100%)}38%,100%{transform:translateY(2cqw)}}
@keyframes fl{0%,38%{opacity:0}40%{opacity:.85}48%,100%{opacity:0}}
@keyframes stp{0%,42%{opacity:0;transform:rotate(-10deg) scale(1.8)}48%,100%{opacity:1;transform:rotate(-10deg) scale(1)}}

@media (prefers-reduced-motion:reduce){*{animation:none!important}}

/* ---------- save sheet buttons ---------- */
.sheet{--fw:320px;width:320px;background:#fff;border-radius:20px 20px 0 0;padding:16px 16px 18px;box-shadow:0 -2px 0 #0000000d;display:flex;flex-direction:column;gap:10px}
.btn{font:700 15px/1.25 var(--body);border:2px solid var(--ink);background:#fff;padding:12px 14px;border-radius:12px;text-align:left;display:flex;flex-direction:column;gap:3px}
.btn small{font:400 12.5px/1.4 var(--body);color:var(--sub)}
.btn.hot{background:var(--pink);border-color:var(--ink)}
.btn.hot small{color:#3a2030}
.toast{align-self:center;background:var(--ink);color:#fff;font:400 13px/1.4 var(--body);padding:8px 14px;border-radius:99px}

html,body{margin:0;background:#fff} .og{width:1200px}
</style></head><body>
<div class="og t1">
          <div class="h">우리 네컷<br><em>나왔어!</em></div>
          <div class="s">열어서 꾸미고 저장해</div>
          <div class="pill">7일 동안만 · 따로 같이 네컷</div>
          <div class="strip">
            <div class="cell"><svg class="l" viewBox="0 0 60 60"><circle cx="30" cy="22" r="13" fill="#ffd9c2"/><path d="M17 20a13 13 0 0 1 26 0c-5-6-21-6-26 0z" fill="#2e2230"/><path d="M8 60c2-16 12-22 22-22s20 6 22 22z" fill="#ff7eb6"/></svg><svg class="r" viewBox="0 0 60 60"><circle cx="30" cy="22" r="13" fill="#ffd9c2"/><path d="M16 24c0-13 28-13 28 0-3-8-25-8-28 0z" fill="#5a3a22"/><path d="M8 60c2-16 12-22 22-22s20 6 22 22z" fill="#5aa9ff"/></svg></div>
            <div class="cell"><svg class="l" viewBox="0 0 60 60"><circle cx="30" cy="22" r="13" fill="#ffd9c2"/><path d="M17 20a13 13 0 0 1 26 0c-5-6-21-6-26 0z" fill="#2e2230"/><path d="M8 60c2-16 12-22 22-22s20 6 22 22z" fill="#ff7eb6"/></svg><svg class="r" viewBox="0 0 60 60"><circle cx="30" cy="22" r="13" fill="#ffd9c2"/><path d="M16 24c0-13 28-13 28 0-3-8-25-8-28 0z" fill="#5a3a22"/><path d="M8 60c2-16 12-22 22-22s20 6 22 22z" fill="#5aa9ff"/></svg></div>
            <div class="cell"><svg class="l" viewBox="0 0 60 60"><circle cx="30" cy="22" r="13" fill="#ffd9c2"/><path d="M17 20a13 13 0 0 1 26 0c-5-6-21-6-26 0z" fill="#2e2230"/><path d="M8 60c2-16 12-22 22-22s20 6 22 22z" fill="#ff7eb6"/></svg><svg class="r" viewBox="0 0 60 60"><circle cx="30" cy="22" r="13" fill="#ffd9c2"/><path d="M16 24c0-13 28-13 28 0-3-8-25-8-28 0z" fill="#5a3a22"/><path d="M8 60c2-16 12-22 22-22s20 6 22 22z" fill="#5aa9ff"/></svg></div>
            <div class="cell"><svg class="l" viewBox="0 0 60 60"><circle cx="30" cy="22" r="13" fill="#ffd9c2"/><path d="M17 20a13 13 0 0 1 26 0c-5-6-21-6-26 0z" fill="#2e2230"/><path d="M8 60c2-16 12-22 22-22s20 6 22 22z" fill="#ff7eb6"/></svg><svg class="r" viewBox="0 0 60 60"><circle cx="30" cy="22" r="13" fill="#ffd9c2"/><path d="M16 24c0-13 28-13 28 0-3-8-25-8-28 0z" fill="#5a3a22"/><path d="M8 60c2-16 12-22 22-22s20 6 22 22z" fill="#5aa9ff"/></svg></div>
          </div>
          <span class="spark" style="left:60cqw;top:8cqw">✦</span><span class="spark" style="left:91cqw;top:44cqw">✦</span>
          <div class="ok">완성</div>
        </div>
</body></html>
