<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Still matting bench</title>
<style>body{margin:0;background:#f3f1ee;font:12px system-ui}pre{white-space:pre-wrap}canvas{max-width:100%;display:block}</style>
</head>
<body>
<pre id="log"></pre>
<div id="out"></div>
<script type="module">
// ?m=mc,selfie,modnet,...&ep=webgpu|wasm&reps=3&refine=0|1  -> window.out = { rows, files: {name: base64 png} }, window.done
import { createRefiner } from "../../site/js/refine.js";
const Q = new URLSearchParams(location.search);
const HF = "https://huggingface.co/";
const SPECS = {   // pinned commits (2026-10-27)
  modnet:   { url: HF + "Xenova/modnet/resolve/fa2fa546052fba4c08921230a26cc69a333fca12/onnx/model.onnx", size: { short: 512, div: 32 }, mean: [.5, .5, .5], std: [.5, .5, .5], out: "alpha" },
  modnet16: { url: HF + "Xenova/modnet/resolve/fa2fa546052fba4c08921230a26cc69a333fca12/onnx/model_fp16.onnx", size: { short: 512, div: 32 }, mean: [.5, .5, .5], std: [.5, .5, .5], out: "alpha" },
  modnetq:  { url: HF + "Xenova/modnet/resolve/fa2fa546052fba4c08921230a26cc69a333fca12/onnx/model_quantized.onnx", size: { short: 512, div: 32 }, mean: [.5, .5, .5], std: [.5, .5, .5], out: "alpha" },
  u2net:    { url: HF + "BritishWerewolf/U-2-Net-Human-Seg/resolve/e6d4c494535f62778e47f3676a5a3674de96b844/onnx/model.onnx", size: { w: 320, h: 320 }, mean: [.485, .456, .406], std: [.229, .224, .225], out: "minmax" },
  pphs:     { url: HF + "opencv/human_segmentation_pphumanseg/resolve/e876e63603f6c65c1a22576bfd5fc7c07ecf9eb9/human_segmentation_pphumanseg_2023mar.onnx", size: { w: 192, h: 192 }, mean: [.5, .5, .5], std: [.5, .5, .5], out: "softmax2" },
  birefnet: { url: HF + "studioludens/birefnet-lite-512/resolve/962e67969ec6acec9c19fab76acee4f5e22e990c/onnx/model_fp16.onnx", size: { w: 512, h: 512 }, mean: [.485, .456, .406], std: [.229, .224, .225], out: "sigmoid" },
};
const MP = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";
const MPM = "https://storage.googleapis.com/mediapipe-models/image_segmenter/";
const IMGS = [   // 4:3 source crop (x, y, w, h) -> 960x720 still; hair crop in still px (shown 3x)
  { n: "person-a", src: "media/person-a-2s.jpg", c: [0, 0, 640, 480], hair: [270, 260, 107, 80] },
  { n: "person-b", src: "media/person-b-2s.jpg", c: [0, 0, 640, 480], hair: [215, 420, 107, 80] },
  { n: "hair1",    src: "media/hair1.jpg",       c: [0, 60, 1280, 960], hair: [520, 20, 107, 80] },
  { n: "hair2",    src: "media/hair2.jpg",       c: [0, 100, 1280, 960], hair: [300, 60, 107, 80] },
];
const W = 960, H = 720, reps = +(Q.get("reps") || 3), ep = Q.get("ep") || "webgpu", doRef = Q.get("refine") === "1";
const log = s => { document.getElementById("log").textContent += s + "\n"; };
const mk = (w, h) => Object.assign(document.createElement("canvas"), { width: w, height: h });

const stills = [];
for (const im of IMGS) {
  const i = new Image(); i.src = im.src; await i.decode();
  const c = mk(W, H); c.getContext("2d").drawImage(i, ...im.c, 0, 0, W, H);
  stills.push({ ...im, canvas: c });
}

// one runner per model: { info, run(canvas) -> {data,width,height} }
let wid = 0;
async function onnxRunner(key) {
  const w = new Worker("../../site/js/matting-worker.js", { type: "module" }), cb = new Map();
  w.onmessage = ({ data }) => { cb.get(data.id)?.(data); cb.delete(data.id); };
  w.onerror = e => { for (const f of cb.values()) f({ error: "worker " + e.message }); };
  const call = (m, tr = []) => new Promise((res, rej) => { const id = ++wid; cb.set(id, d => d.error ? rej(new Error(d.error)) : res(d)); w.postMessage({ ...m, id }, tr); });
  const info = await call({ load: SPECS[key], eps: ep === "wasm" ? ["wasm"] : ["webgpu", "wasm"] });
  return { info, run: async c => { const b = await createImageBitmap(c); return call({ img: b }, [b]); }, close: () => w.terminate() };
}
async function mpRunner(key) {
  const { FilesetResolver, ImageSegmenter } = await import(MP + "/vision_bundle.mjs");
  const files = await FilesetResolver.forVisionTasks(MP + "/wasm");
  const url = key === "mc" ? MPM + "selfie_multiclass_256x256/float32/1/selfie_multiclass_256x256.tflite" : MPM + "selfie_segmenter/float16/1/selfie_segmenter.tflite";
  const t0 = performance.now();
  const seg = await ImageSegmenter.createFromOptions(files, { baseOptions: { modelAssetPath: url, delegate: ep === "wasm" ? "CPU" : "GPU" },
    runningMode: "IMAGE", outputConfidenceMasks: true, outputCategoryMask: false });
  const info = { ep: ep === "wasm" ? "CPU" : "GPU", createMs: Math.round(performance.now() - t0) };
  return { info, close: () => seg.close(), run: async c => {
    let out; const t = performance.now();
    seg.segment(c, r => { const m = r.confidenceMasks[0], a = m.getAsFloat32Array(), u = new Uint8Array(a.length);
      for (let i = 0; i < a.length; i++) u[i] = (key === "mc" ? 1 - a[i] : a[i]) * 255 + 0.5;
      out = { data: u, width: m.width, height: m.height }; });
    out.ms = Math.round(performance.now() - t); return out; } };
}

let ref = null;
function cutout(still, m, refine, matte) {
  const o = mk(W, H), x = o.getContext("2d");
  if (refine) { ref ||= createRefiner(); x.drawImage(ref.refine(still, m, matte ? { temporal: 0, guide: 0, lo: +(Q.get("lo") || 0.05), hi: +(Q.get("hi") || 0.95) } : { temporal: 0 }), 0, 0); return o; }
  const a = mk(m.width, m.height), ax = a.getContext("2d"), id = ax.createImageData(m.width, m.height);
  for (let i = 0; i < m.data.length; i++) { id.data[i * 4] = id.data[i * 4 + 1] = id.data[i * 4 + 2] = 255; id.data[i * 4 + 3] = m.data[i]; }
  ax.putImageData(id, 0, 0);
  x.drawImage(still, 0, 0); x.globalCompositeOperation = "destination-in"; x.imageSmoothingQuality = "high"; x.drawImage(a, 0, 0, W, H);
  return o;
}

const BG = {
  white: x => { x.fillStyle = "#fff"; x.fillRect(0, 0, W, H); },
  purple: x => { x.fillStyle = "#2a1640"; x.fillRect(0, 0, W, H); },
  busy: x => {
    const cs = ["#ff5a8a", "#ffd23f", "#3bceac", "#0ead69", "#540d6e", "#ee4266"];
    for (let i = 0; i < 24; i++) { x.fillStyle = cs[i % 6]; x.fillRect(i * 40, 0, 40, H); }
    for (let i = 0; i < 40; i++) { x.fillStyle = cs[(i * 7) % 6]; x.beginPath(); x.arc((i * 137) % W, (i * 89) % H, 30 + (i % 5) * 12, 0, 7); x.fill(); }
    x.fillStyle = "#111"; x.font = "bold 64px sans-serif"; for (let y = 80; y < H; y += 140) x.fillText("BUSY 배경 ABC 123", 20, y);
  },
};
const TW = 320, TH = 240, LBL = 150;
function sheet(still, rows) {   // rows: [{label, cut}] -> canvas: label | white | purple | busy | 3x hair crop on purple
  const s = mk(LBL + 4 * TW, rows.length * TH), x = s.getContext("2d");
  x.fillStyle = "#fff"; x.fillRect(0, 0, s.width, s.height);
  rows.forEach((r, k) => {
    const y = k * TH;
    x.fillStyle = "#111"; x.font = "15px sans-serif";
    r.label.split("\n").forEach((l, j) => x.fillText(l, 6, y + 22 + j * 18));
    ["white", "purple", "busy"].forEach((b, j) => {
      const t = mk(W, H), tx = t.getContext("2d"); BG[b](tx); tx.drawImage(r.cut, 0, 0);
      x.drawImage(t, LBL + j * TW, y, TW, TH);
    });
    const [hx, hy, hw, hh] = still.hair, t = mk(W, H), tx = t.getContext("2d"); BG.purple(tx); tx.drawImage(r.cut, 0, 0);
    x.imageSmoothingEnabled = false; x.drawImage(t, hx, hy, hw, hh, LBL + 3 * TW, y, TW, TH); x.imageSmoothingEnabled = true;
    x.strokeStyle = "#999"; x.strokeRect(LBL, y, 4 * TW, TH);
  });
  return s;
}

const out = window.out = { ep, rows: [], files: {} };
const per = stills.map(() => []);
for (const key of (Q.get("m") || "mc,modnet").split(",")) {
  try {
    const t0 = performance.now();
    const R = SPECS[key] ? await onnxRunner(key) : await mpRunner(key);
    const loadMs = Math.round(performance.now() - t0);
    const row = { key, ...R.info, loadMs, firstMs: 0, ms: {} };
    for (const [i, st] of stills.entries()) {
      const times = []; let m;
      for (let r = 0; r < reps; r++) { const t = performance.now(); m = await R.run(st.canvas); times.push(Math.round(performance.now() - t)); }
      if (i === 0) row.firstMs = times[0];
      row.ms[st.n] = times; row.mask = `${m.width}x${m.height}`;
      per[i].push({ label: `${key} ${row.ep}\n${times.at(-1)} ms`, cut: cutout(st.canvas, m, false) });
      if (doRef) per[i].push({ label: `${key} +${SPECS[key] ? "decontam" : "guided"}`, cut: cutout(st.canvas, m, true, !!SPECS[key]) });
    }
    R.close(); out.rows.push(row); log(JSON.stringify(row));
  } catch (e) { out.rows.push({ key, error: String(e?.message || e) }); log(key + " ERR " + (e?.message || e)); }
}
for (const [i, st] of stills.entries()) {
  const s = sheet(st, per[i]); document.getElementById("out").append(s);
  out.files[`${Q.get("tag") || ep}-${st.n}.png`] = s.toDataURL("image/png").split(",")[1];
}
window.done = true;
</script>
</body>
</html>
