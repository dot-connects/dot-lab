<!doctype html>
<meta charset="utf-8">
<title>light match + filter bench</title>
<!-- media/<side><i>-raw|cut (dumped by the A->B walk). Before = site/js/*-head.js (HEAD copies, not committed). -> window.result -->
<body>
<script type="module">
import * as C from "../../site/js/compose.js";
import * as C0 from "../../site/js/compose-head.js";
import { createFilter } from "../../site/js/filters.js";
import { createFilter as createFilter0 } from "../../site/js/filters-head.js";
const img = async n => { const i = new Image(); i.src = URL.createObjectURL(await (await fetch(`media/${new URLSearchParams(location.search).get("dir") || "walk"}/${n}`)).blob()); await i.decode(); return i; };
const side = async s => ({ cuts: await Promise.all([0, 1, 2, 3].map(async i => ({ raw: await img(`${s}${i}-raw`), cut: await img(`${s}${i}-cut`), clip: null }))) });
const a = await side("a"), b = await side("b"), W = 552, H = 382, R = { x: 0, y: 0, w: W, h: H };
const cell = (M, i, bg = "booth-pink") => { const c = Object.assign(document.createElement("canvas"), { width: W, height: H }); M.drawCell(c.getContext("2d"), R, i, { a, b, bg }); return c; };
const px = c => c.getContext("2d", { willReadFrequently: true }).getImageData(0, 0, c.width, c.height).data;
const copy = c => { const o = Object.assign(document.createElement("canvas"), { width: c.width, height: c.height }); o.getContext("2d").drawImage(c, 0, 0); return o; };
// face numbers straight from the cut-outs (same box as compose.js cutStats: rows 15-55 %, middle third, alpha > 0.5)
function face(cut) {
  const w = 64, h = 48, c = Object.assign(document.createElement("canvas"), { width: w, height: h }), x = c.getContext("2d", { willReadFrequently: true });
  x.drawImage(cut, 0, 0, w, h); const d = x.getImageData(0, 0, w, h).data;
  let x0 = w, x1 = -1, y0 = h, y1 = -1;
  for (let y = 0; y < h; y++) for (let k = 0; k < w; k++) if (d[(y * w + k) * 4 + 3] > 128) { x0 = Math.min(x0, k); x1 = Math.max(x1, k); y0 = Math.min(y0, y); y1 = Math.max(y1, y); }
  const s = [0, 0, 0]; let n = 0; const bw = x1 - x0 + 1, bh = y1 - y0 + 1;
  for (let y = Math.floor(y0 + 0.15 * bh); y <= y0 + 0.55 * bh; y++) for (let k = Math.floor(x0 + bw / 3); k <= x0 + 2 * bw / 3; k++) {
    const i = (y * w + k) * 4; if (d[i + 3] > 128) { for (let j = 0; j < 3; j++) s[j] += d[i + j]; n++; } }
  return s.map(v => v / n);
}
const stat = rgb => ({ L: +(0.299 * rgb[0] + 0.587 * rgb[1] + 0.114 * rgb[2]).toFixed(1), rg: +(rgb[0] / rgb[1]).toFixed(3), bg: +(rgb[2] / rgb[1]).toFixed(3) });
const mean = arr => [0, 1, 2].map(j => arr.reduce((s, v) => s + v[j], 0) / arr.length);
const out = { light: {}, filters: {}, sheets: {} };
// ---- light match ----
const fa = mean(a.cuts.map(c => face(c.cut))), fb = mean(b.cuts.map(c => face(c.cut)));
for (const fixed of [null, "a", "b"]) {
  const [ga, gb] = C.matchLight(a, b, fixed), g3 = g => g.map(v => +v.toFixed(3));
  out.light[fixed || "preset"] = { gainA: g3(ga), gainB: g3(gb),
    before: { a: stat(fa), b: stat(fb) }, after: { a: stat(fa.map((v, j) => Math.min(255, v * ga[j]))), b: stat(fb.map((v, j) => Math.min(255, v * gb[j]))) } };
}
const sheet = (rows, label) => {
  const s = Object.assign(document.createElement("canvas"), { width: W * rows[0].length, height: H * rows.length }), x = s.getContext("2d");
  rows.forEach((r, y) => r.forEach(([c, t], k) => { x.drawImage(c, k * W, y * H); x.fillStyle = "#000a"; x.fillRect(k * W, y * H, 210, 24); x.fillStyle = "#fff"; x.font = "15px sans-serif"; x.fillText(t, k * W + 6, y * H + 17); }));
  out.sheets[label] = s.toDataURL("image/png");
};
sheet([0, 1, 2, 3].map(i => [[cell(C0, i), `cell ${i} before (per-cell luma)`], [cell(C, i), `cell ${i} after (light match)`]]), "light-match");
// ---- filters on cell 0 (after the light match): skin = YCbCr skin box on the unfiltered cell; backdrop = top 12 % rows ----
const base = cell(C, 0), P0 = px(base), mask = new Uint8Array(W * H);
for (let i = 0; i < W * H; i++) { const r = P0[i * 4] / 255, g = P0[i * 4 + 1] / 255, bl = P0[i * 4 + 2] / 255, cb = -0.1687 * r - 0.3313 * g + 0.5 * bl + 0.5, cr = 0.5 * r - 0.4187 * g - 0.0813 * bl + 0.5;
  const l = 0.2126 * r + 0.7152 * g + 0.0722 * bl; mask[i] = cr > 0.53 && cr < 0.66 && cb > 0.3 && cb < 0.5 && l > 0.08 && g >= bl ? 1 : Math.floor(i / W) < H * 0.12 ? 2 : 0; }
const meas = c => { const d = px(c), m = { skin: [0, 0, 0], back: [0, 0] }, n = [0, 0], dark = [0, 0, 0], nd = [0];
  for (let i = 0; i < W * H; i++) { const r = d[i * 4] / 255, g = d[i * 4 + 1] / 255, bl = d[i * 4 + 2] / 255, l = 0.2126 * r + 0.7152 * g + 0.0722 * bl, ch = Math.hypot(-0.1687 * r - 0.3313 * g + 0.5 * bl, 0.5 * r - 0.4187 * g - 0.0813 * bl);
    if (mask[i] === 1) { m.skin[0] += l; m.skin[1] += ch; n[0]++; const l0 = (0.2126 * P0[i * 4] + 0.7152 * P0[i * 4 + 1] + 0.0722 * P0[i * 4 + 2]) / 255; if (l0 < 0.3) { dark[0] += l; dark[1] += ch; nd[0]++; } }
    if (mask[i] === 2) { const mx = Math.max(r, g, bl), mn = Math.min(r, g, bl); m.back[0] += mx ? (mx - mn) / mx : 0; m.back[1] += l; n[1]++; } }
  return { skinL: +(m.skin[0] / n[0]).toFixed(3), skinChroma: +(m.skin[1] / n[0]).toFixed(4), darkSkinL: +(dark[0] / nd[0]).toFixed(3), darkSkinChroma: +(dark[1] / nd[0]).toFixed(4), darkPx: nd[0],
    backSat: +(m.back[0] / n[1]).toFixed(3), backL: +(m.back[1] / n[1]).toFixed(3) }; };
const f1 = createFilter(), f0 = createFilter0(), rows = [[], []];
out.filters.original = meas(base);
for (const [lab, F, id] of [["bbosasi before", f0, "bbosasi"], ["bbosasi after (강)", f1, "bbosasi"], ["bbosasi 중", f1, "bbosasi:1"], ["bbosasi 약", f1, "bbosasi:0"],
  ["mono before", f0, "mono"], ["흑백 after", f1, "mono"], ["그레이 (new)", f1, "gray"], ["film", f1, "film"]]) {
  const c = copy(F.apply(base, id, 1, 1)); out.filters[lab] = meas(c); (rows[0].length < 4 ? rows[0] : rows[1]).push([c, lab]);
}
sheet(rows, "filters-cell0");
// the filter must not care whether a cell is a still or a video frame: same input -> same output
const s1 = px(copy(f1.apply(base, "bbosasi:1", 1, 1))), s2 = px(copy(f1.apply(base, "bbosasi:1", 1, 1)));
let dd = 0; for (let i = 0; i < s1.length; i++) dd = Math.max(dd, Math.abs(s1[i] - s2[i]));
out.filters.repeatMaxDiff = dd;
const cpu = px(copy(createFilter({ cpu: true }).apply(base, "bbosasi:1", 1, 1)));
let cd = 0; for (let i = 0; i < s1.length; i += 4) cd += Math.abs(s1[i] - cpu[i]) + Math.abs(s1[i + 1] - cpu[i + 1]) + Math.abs(s1[i + 2] - cpu[i + 2]);
out.filters.gpuVsCpuMeanAbs = +(cd / (W * H * 3)).toFixed(2);
window.result = out;
</script>
