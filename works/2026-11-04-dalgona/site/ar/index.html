<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>달고나 AR</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;600&display=swap">
<style>
:root{--ink:#f4f1ea;--mute:#b4c4bd;--gold:#ffc23d;--candy:#e9a64a;--bad:#ff8a9b;--good:#7ee2a8}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0b0e0d;color:var(--ink);font-family:"IBM Plex Sans KR",system-ui,sans-serif;overscroll-behavior:none}
[hidden]{display:none!important}
#app{position:fixed;inset:0;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
video{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.hud{position:absolute;inset:0;pointer-events:none}
.ts{text-shadow:0 1px 6px rgba(0,0,0,.85)}
#hint{position:absolute;top:calc(env(safe-area-inset-top) + 158px);left:16px;right:16px;text-align:center;font-family:"Do Hyeon",sans-serif;font-size:22px;color:#fff;transition:color .2s}
#sub{position:absolute;top:calc(env(safe-area-inset-top) + 188px);left:16px;right:16px;text-align:center;font-size:13px;color:#e3eee9}
#stat{position:absolute;top:calc(env(safe-area-inset-top) + 12px);left:12px;font-size:11px;color:rgba(255,255,255,.75);font-variant-numeric:tabular-nums;line-height:1.4}
.tools{position:absolute;top:calc(env(safe-area-inset-top) + 10px);right:10px;display:flex;gap:6px;pointer-events:auto}
.tools button{width:38px;height:38px;border-radius:50%;border:0;background:rgba(8,12,10,.5);color:#fff;font-size:17px;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);cursor:pointer}
.tools button[aria-pressed="true"]{background:var(--candy);color:#2a1406}
#tray{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top) + 58px);display:flex;justify-content:center;gap:22px;pointer-events:auto}
#tray button{position:relative;display:flex;flex-direction:column;align-items:center;gap:5px;background:none;border:0;padding:0;color:#fff;font:inherit;font-family:"Do Hyeon",sans-serif;font-size:14px;cursor:pointer}
#tray .ic{display:grid;place-items:center;width:62px;height:62px;border-radius:50%;background:rgba(10,14,16,.55);border:1.5px solid rgba(255,255,255,.3);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);transition:transform .15s,border-color .15s}
#tray button.on .ic{border:2.5px solid var(--gold)}
#tray button.on{color:var(--gold)}
#tray button.hover .ic{transform:scale(1.12)}
#tray button.ready .ic{animation:ready 1s ease-in-out infinite}
@keyframes ready{50%{border-color:var(--gold);transform:scale(1.12)}}
#tray svg.ring{position:absolute;top:-6px;left:50%;margin-left:-37px;width:74px;height:74px;transform:rotate(-90deg);pointer-events:none}
#cursor{position:absolute;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 2px rgba(0,0,0,.35),0 0 12px rgba(255,255,255,.7);transition:opacity .15s}
#ring{position:absolute;width:52px;height:52px;margin:-26px 0 0 -26px;transform:rotate(-90deg)}
#toast{position:absolute;left:16px;right:16px;bottom:58%;text-align:center;text-wrap:balance;line-height:1.2;font-family:"Do Hyeon",sans-serif;font-size:30px;color:#fff;opacity:0;transition:opacity .25s,transform .25s;transform:translateY(8px)}
#toast.show{opacity:1;transform:none}
#timer{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 14px);min-width:132px;padding:4px 20px 6px;border-radius:16px;background:rgba(8,10,9,.62);border:1.5px solid rgba(255,255,255,.22);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);text-align:center;font-family:"Do Hyeon",sans-serif;font-size:46px;line-height:1.1;color:#fff;font-variant-numeric:tabular-nums;letter-spacing:.04em}
#timer small{display:block;font-size:13px;letter-spacing:0;color:#e3eee9;margin-top:-2px}
#timer.low{border-color:var(--bad)}
#timer.low{color:var(--bad)}
#doom{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:radial-gradient(ellipse at 50% 55%,rgba(0,0,0,0) 35%,rgba(0,0,0,.72));pointer-events:none}
#doom b{font-family:"Do Hyeon",sans-serif;font-weight:400;font-size:30px;color:#fff;letter-spacing:.04em;background:rgba(0,0,0,.55);border-radius:14px;padding:8px 20px;animation:doomIn 1.2s ease-out both}
@keyframes doomIn{from{opacity:0}to{opacity:1}}
#warn{position:absolute;inset:0;pointer-events:none;opacity:0;box-shadow:inset 0 0 0 4px rgba(255,60,50,.9),inset 0 0 70px 18px rgba(200,20,10,.55)}
#warn.on{animation:warn 1.1s ease-out}
@keyframes warn{0%,40%{opacity:1}100%{opacity:0}}
#flash{position:absolute;inset:0;pointer-events:none;opacity:0;background:radial-gradient(circle at 50% 40%,#fff6e0,#b3120a 70%)}
#dead{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:calc(env(safe-area-inset-bottom) + 150px);box-sizing:border-box;gap:8px;background:linear-gradient(transparent 45%,rgba(0,0,0,.7));pointer-events:none}
#dead b{font-family:"Do Hyeon",sans-serif;font-weight:400;font-size:56px;color:#ff4d3d;letter-spacing:.1em;text-shadow:0 3px 18px #000}
#dead span{font-size:17px;color:#f3d6d2}
#dead.win{background:linear-gradient(transparent 45%,rgba(0,0,0,.55))}
#dead.win b{color:var(--gold)}
#dead.win span{color:#fff}
@media (prefers-reduced-motion:reduce){#doom b,#tray button.ready .ic{animation:none}}
#again{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom) + 70px);transform:translateX(-50%);pointer-events:auto;font-family:"Do Hyeon",sans-serif;font-size:20px;background:linear-gradient(#f2b866,#d68c36);color:#2a1406;border:0;border-radius:12px;padding:11px 28px}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px 22px calc(env(safe-area-inset-bottom) + 24px);background:radial-gradient(120% 70% at 50% 35%,#3a3029 0%,#171311 60%,#0b0908 100%)}
.ov h1{font-family:"Do Hyeon",sans-serif;font-weight:400;font-size:44px;margin:0}
.ov h1 em{font-style:normal;color:var(--candy)}
.ov h1 .logo{display:block;width:230px;max-width:70vw;height:auto}
.ov .tag{font-size:12px;letter-spacing:.12em;color:var(--gold)}
.ov p{margin:0;max-width:320px;line-height:1.6;color:#e3eee9;font-size:15px}
.ov p.mute{color:var(--mute);font-size:13px}
.go{font-family:"Do Hyeon",sans-serif;font-size:22px;background:linear-gradient(#f2b866,#d68c36);color:#2a1406;border:0;border-radius:12px;padding:13px 32px;cursor:pointer}
.sub{font:inherit;font-size:14px;background:transparent;color:var(--mute);border:1px solid #ffffff44;border-radius:12px;padding:9px 16px;cursor:pointer}
#msg{color:var(--bad)}
.steps{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;text-align:left;font-size:14px;max-width:320px;color:#e3eee9}
.ov .goal{font-family:"Do Hyeon",sans-serif;font-size:22px;line-height:1.35;color:#fff;margin:0}
.goal em{font-style:normal;color:var(--candy)}
.steps b{font-family:"Do Hyeon",sans-serif;font-weight:400;color:var(--candy);font-size:16px}
</style>
</head>
<body>
<div id="app">
  <video id="video" playsinline muted></video>
  <canvas id="gl"></canvas>
  <div class="hud">
    <div id="stat"></div>
    <div class="tools">
      <button id="shCircle" aria-pressed="true" aria-label="동그라미">○</button>
      <button id="shTri" aria-pressed="false" aria-label="세모">△</button>
      <button id="shStar" aria-pressed="false" aria-label="별">☆</button>
      <button id="center" aria-label="달고나를 앞으로">◎</button>
    </div>
    <div id="hint" class="ts"></div>
    <div id="sub" class="ts"></div>
    <div id="cursor" hidden></div>
    <svg id="ring" viewBox="0 0 52 52" hidden><circle cx="26" cy="26" r="22" fill="none" stroke="rgba(0,0,0,.35)" stroke-width="5"/><circle id="ringArc" cx="26" cy="26" r="22" fill="none" stroke="#7ee2a8" stroke-width="3.5" stroke-linecap="round" pathLength="100" stroke-dasharray="0 100"/></svg>
    <div id="toast" class="ts"></div>
    <div id="timer" hidden>2:00</div>
    <div id="doom" hidden><b>고개를 들어 보세요</b></div>
    <div id="warn"></div>
    <div id="flash"></div>
    <div id="dead" hidden><b>탈락</b><span id="deadWhy"></span></div>
    <button id="again" hidden>새 달고나</button>
    <div id="tray"></div>
  </div>

  <section class="ov" id="start">
    <div class="tag">뒤 카메라 · AR</div>
    <h1><img class="logo" src="../logo.svg" alt="달고나" width="230" height="87"></h1>
    <p class="goal">2분 안에 모양만 떼어 내요.<br>깨지면 <em>감시자</em>가 쏴요.</p>
    <div class="steps">
      <b>바늘</b><span>엄지·검지를 모아 선을 따라 긁어요</span>
      <b>망치</b><span>엄지·검지를 붙이면 혼자 톡톡, 바깥에 대요</span>
      <b>면봉</b><span>금이 가면 문질러 붙여요</span>
    </div>
    <p class="mute">도구는 위에서 손가락으로 가리켜 골라요</p>
    <button class="go" id="go">카메라로 하기</button>
    <button class="sub" id="touch">화면 터치로 하기</button>
    <p class="mute">영상은 폰 밖으로 나가지 않아요</p>
    <p id="msg" hidden></p>
  </section>
</div>
<script type="module" src="ar.js"></script>
</body>
</html>
