<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>허공 달고나 — 그냥 시켜봄</title>
<meta name="description" content="카메라 앞에서 손가락으로 바늘을 집고 허공의 달고나를 긁어 보세요. 서두르면 금이 갑니다.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Orbit&family=IBM+Plex+Sans+KR:wght@400;600&display=swap">
<style>
:root{--bg:#0e1311;--pink:#ff2e7e;--green:#1e8a5e;--ink:#f4f1ea;--mute:#b4c4bd;--candy:#e9a64a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans KR",system-ui,sans-serif;overscroll-behavior:none}
[hidden]{display:none!important}
#app{position:fixed;inset:0;touch-action:none;user-select:none;-webkit-user-select:none;overflow:hidden}
video,#freeze{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
video{transform:scaleX(-1)}
#nocam{position:absolute;inset:0;background:radial-gradient(120% 70% at 50% 38%,#4a4038 0%,#2a241f 55%,#141110 100%)}
canvas#cv{position:absolute;inset:0;width:100%;height:100%}
.hud{position:absolute;inset:0;pointer-events:none}
.num{font-family:"Orbit",ui-monospace,monospace;font-variant-numeric:tabular-nums}
#timer{position:absolute;top:calc(env(safe-area-inset-top) + 12px);left:0;right:0;text-align:center;font-size:40px;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.7)}
#timer.hurry{color:var(--pink)}
#badge{position:absolute;top:calc(env(safe-area-inset-top) + 22px);left:14px;font-size:12px;color:#fff;background:var(--green);border-radius:6px;padding:.15em .5em;letter-spacing:.06em}
#quit{position:absolute;top:calc(env(safe-area-inset-top) + 14px);right:12px;pointer-events:auto;width:40px;height:40px;border-radius:50%;border:0;background:rgba(8,12,10,.5);color:#fff;font-size:18px;cursor:pointer;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
#hint{position:absolute;top:calc(env(safe-area-inset-top) + 74px);left:16px;right:16px;text-align:center;font-family:"Do Hyeon",sans-serif;font-size:20px;color:#fff;text-shadow:0 1px 6px #000}
#pc{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 64px);text-align:center;font-size:15px;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.8)}
#status{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 22px);text-align:center}
#sw{display:inline-block;font-family:"Do Hyeon",sans-serif;font-size:18px;color:#fff;padding:6px 14px;border-radius:999px;background:rgba(8,12,10,.55);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);transition:background .2s}
#sw.bad{background:rgba(200,20,50,.75)}
#sw.good{background:rgba(30,138,94,.85)}
#lick{position:absolute;right:14px;bottom:calc(env(safe-area-inset-bottom) + 100px);pointer-events:auto;font:inherit;font-size:14px;padding:10px 14px;border-radius:999px;border:1px solid #ffffff66;background:rgba(8,12,10,.55);color:#fff;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
#lick[aria-pressed="true"]{background:#ff7a9a;border-color:#ff7a9a}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px 20px calc(env(safe-area-inset-bottom) + 24px);background:rgba(10,14,12,.86);overflow:auto}
#result{background:rgba(10,14,12,.62)}
#result.win{background:radial-gradient(90% 60% at 50% 40%,rgba(233,166,74,.22),rgba(10,14,12,.7))}
.ov h1{font-family:"Do Hyeon",sans-serif;font-weight:400;font-size:46px;margin:0;color:#fff;letter-spacing:.02em}
.ov h1 em{font-style:normal;color:var(--candy)}
.ov h2{font-family:"Do Hyeon",sans-serif;font-weight:400;font-size:36px;margin:0;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.6)}
.ov p{margin:0;line-height:1.6;max-width:320px;color:#e3eee9}
.how{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;text-align:left;font-size:15px;max-width:320px}
.how b{font-family:"Do Hyeon",sans-serif;font-weight:400;font-size:18px;color:var(--candy)}
.go{font-family:"Do Hyeon",sans-serif;font-size:22px;background:var(--pink);color:#fff;border:0;border-radius:12px;padding:13px 34px;cursor:pointer}
.sub{font:inherit;font-size:14px;background:transparent;color:var(--mute);border:1px solid #ffffff44;border-radius:12px;padding:9px 16px;cursor:pointer}
.link{color:var(--mute);font-size:14px;text-decoration:none}
.picks{display:flex;gap:12px}
.picks button{display:flex;flex-direction:column;align-items:center;gap:8px;background:none;border:0;padding:0;color:var(--ink);cursor:pointer;font:inherit}
.picks .ic{display:grid;place-items:center;width:68px;height:68px;border-radius:50%;font-size:30px;background:radial-gradient(circle at 38% 34%,#f2c071,#d68c36 60%,#9a5418);box-shadow:0 6px 16px rgba(0,0,0,.45),inset 0 -3px 6px rgba(80,30,5,.4);color:#6b3410}
.picks small{font-size:12px;color:#FFC23D;letter-spacing:.05em;min-height:1.2em}
.res-card{width:min(74vw,300px);aspect-ratio:4/5;border-radius:14px;box-shadow:0 12px 30px rgba(0,0,0,.6);background:#1a1d1b;object-fit:cover}
.res-line{font-size:26px;color:#FFC23D;letter-spacing:.02em}
#result:not(.win) .res-line{color:#ff8a9b}
.res-sub{font-size:14px;color:#d7e2dd!important}
.res-best{font-size:13px;color:var(--mute)!important;min-height:1em}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.foot{gap:18px}
.foot .link{background:none;border:0;font:inherit;font-size:14px;cursor:pointer;padding:6px}
.ov h2{font-size:32px}
#back{position:absolute;top:calc(env(safe-area-inset-top) + 12px);left:12px;font-size:13px;color:var(--mute);text-decoration:none;border:1px solid #ffffff33;border-radius:999px;padding:6px 12px}
button:focus-visible,a:focus-visible{outline:2px solid #fff;outline-offset:2px}
</style>
</head>
<body>
<div id="app">
  <div id="nocam"></div>
  <video id="video" playsinline muted hidden></video>
  <canvas id="freeze" hidden></canvas>
  <canvas id="cv"></canvas>
  <div class="hud" id="hud" hidden>
    <div id="timer" class="num">01:30</div>
    <div id="badge" class="num">456</div>
    <button id="quit" aria-label="모양 다시 고르기">✕</button>
    <div id="hint"></div>
    <div id="pc" class="num">0%</div>
    <div id="status"><span id="sw">선을 따라 긁어 보세요</span></div>
    <button id="lick" aria-pressed="false" hidden>혀로 핥기</button>
  </div>

  <section class="ov" id="start">
    <a id="back" href="../../../">‹ 시켜본 것들</a>
    <h1>허공 <em>달고나</em></h1>
    <p>내 카메라 화면 위에 달고나가 떠요.<br>금 가기 전에 모양을 떼어 내세요.</p>
    <div class="how">
      <b>🤏</b><span>엄지·검지를 모으면 바늘</span>
      <b>〰</b><span>선을 따라 천천히 긁기</span>
      <b>👅</b><span>입 벌려 핥으면 말랑, 오래 핥으면 녹음</span>
    </div>
    <button class="go" id="camGo">카메라로 하기</button>
    <button class="sub" id="touchGo">화면 터치로 하기</button>
    <p id="camMsg" hidden></p>
  </section>

  <section class="ov" id="pick" hidden>
    <h2>모양을 고르세요</h2>
    <p>무엇을 할지는 고른 다음에 알려 드립니다.</p>
    <div class="picks" id="picks"></div>
  </section>

  <section class="ov" id="result" hidden></section>
</div>
<script type="module" src="js/app.js"></script>
</body>
</html>
