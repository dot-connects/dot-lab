<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>달고나 — 그냥 시켜봄</title>
<meta name="description" content="카메라 앞에서 손가락으로 바늘을 집고 허공의 달고나를 긁어 보세요. 서두르면 금이 갑니다.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Orbit&family=IBM+Plex+Sans+KR:wght@400;600&display=swap">
<style>
:root{--bg:#0e1311;--pink:#ff2e7e;--green:#1e8a5e;--ink:#f4f1ea;--mute:#b4c4bd;--candy:#e9a64a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans KR",system-ui,sans-serif;overscroll-behavior:none}
[hidden]{display:none!important}
#app{position:fixed;top:0;left:0;right:0;bottom:0;inset:0;touch-action:none;user-select:none;-webkit-user-select:none;overflow:hidden}
video,#freeze{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
video{transform:scaleX(-1)}
#nocam{position:absolute;inset:0;background:radial-gradient(120% 70% at 50% 38%,#4a4038 0%,#2a241f 55%,#141110 100%)}
canvas#cv{position:absolute;inset:0;width:100%;height:100%}
.hud{position:absolute;inset:0;pointer-events:none}
.num{font-family:"Orbit",ui-monospace,monospace;font-variant-numeric:tabular-nums}
#timer{position:absolute;top:calc(env(safe-area-inset-top) + 12px);left:0;right:0;text-align:center;font-size:40px;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.7)}
#timer.hurry{color:var(--pink)}
#badge{position:absolute;top:calc(env(safe-area-inset-top) + 24px);left:14px;font-size:12px;color:rgba(255,255,255,.85);background:none;border:0;padding:0;letter-spacing:.06em;text-shadow:0 1px 4px #000}
#quit{position:absolute;top:calc(env(safe-area-inset-top) + 14px);right:12px;pointer-events:auto;width:40px;height:40px;border-radius:50%;border:0;background:rgba(8,12,10,.5);color:#fff;font-size:18px;cursor:pointer;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
#hint{position:absolute;top:calc(env(safe-area-inset-top) + 74px);left:16px;right:16px;text-align:center;font-family:"Do Hyeon",sans-serif;font-size:20px;color:#fff;text-shadow:0 1px 6px #000}
#pc{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 68px);text-align:center;font-size:22px;color:var(--candy);text-shadow:0 2px 8px #000}
#status{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 22px);text-align:center}
#sw{display:inline-block;font-family:"Do Hyeon",sans-serif;font-size:18px;color:#fff;padding:6px 14px;border-radius:999px;background:rgba(8,12,10,.55);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);transition:background .2s}
#sw.bad{background:rgba(200,20,50,.75)}
#sw.good{background:rgba(18,104,68,.92)}
#sw.warn{background:rgba(190,100,10,.9)}
#lick{position:absolute;right:14px;bottom:calc(env(safe-area-inset-bottom) + 100px);pointer-events:auto;font:inherit;font-size:14px;padding:10px 14px;border-radius:999px;border:1px solid #ffffff66;background:rgba(8,12,10,.55);color:#fff;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
#lick[aria-pressed="true"]{background:#f2b866;border-color:#f2b866;color:#2a1406}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px 20px calc(env(safe-area-inset-bottom) + 24px);background:rgba(10,14,12,.86);overflow:auto}
#result{background:rgba(10,14,12,.62)}
#result.win{background:radial-gradient(90% 60% at 50% 40%,rgba(233,166,74,.22),rgba(10,14,12,.7))}
.ov h1{font-family:"Do Hyeon",sans-serif;font-weight:400;font-size:46px;margin:0;color:#fff;letter-spacing:.02em}
.ov h1 em{font-style:normal;color:var(--candy)}
.ov .goal{font-family:"Do Hyeon",sans-serif;font-size:22px;line-height:1.35;color:#fff}
.ov .goal em{font-style:normal;color:var(--candy)}
.ov h1 .logo{display:block;width:240px;max-width:70vw;height:auto}
.ov h2{font-family:"Do Hyeon",sans-serif;font-weight:400;font-size:36px;margin:0;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.6)}
.ov p{margin:0;line-height:1.6;max-width:320px;color:#e3eee9}
.how{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;text-align:left;font-size:15px;max-width:320px}
.how b{font-family:"Do Hyeon",sans-serif;font-weight:400;font-size:18px;color:var(--candy)}
.go{font-family:"Do Hyeon",sans-serif;font-size:22px;background:linear-gradient(#f2b866,#d68c36);color:#2a1406;border:0;border-radius:12px;padding:13px 34px;cursor:pointer;box-shadow:0 4px 14px rgba(214,140,54,.35)}
.sub{font:inherit;font-size:14px;background:transparent;color:var(--mute);border:1px solid #ffffff44;border-radius:12px;padding:9px 16px;cursor:pointer}
.link{color:var(--mute);font-size:14px;text-decoration:none}
.picks{display:flex;gap:12px}
.picks button{display:flex;flex-direction:column;align-items:center;gap:8px;background:none;border:0;padding:0;color:var(--ink);cursor:pointer;font:inherit}
.picks .ic{display:grid;place-items:center;width:min(76px,calc((100vw - 76px)/4));height:auto;aspect-ratio:1;border-radius:50%;font-size:30px;background:radial-gradient(circle at 38% 34%,#f2c071,#d68c36 60%,#9a5418);box-shadow:0 6px 16px rgba(0,0,0,.45),inset 0 -3px 6px rgba(80,30,5,.4);color:#6b3410}
.picks small{font-size:12px;color:var(--ink);letter-spacing:.03em;line-height:1.4;min-height:2.8em}
.picks small b{font-weight:400;color:#FFC23D;letter-spacing:.08em}
.res-card{width:min(84vw,340px,calc((100vh - 320px)*.8));width:min(84vw,340px,calc((100dvh - 320px)*.8));aspect-ratio:4/5;border-radius:14px;box-shadow:0 12px 30px rgba(0,0,0,.6);background:#1a1d1b;object-fit:cover}
.res-line{font-size:26px;color:#FFC23D;letter-spacing:.02em}
#result:not(.win) .res-line{color:#ff8a9b}
.res-sub{font-size:14px;color:#d7e2dd!important}
.res-best{font-size:13px;color:var(--mute)!important}
.res-best:not(:empty){color:var(--candy)!important;font-family:"Do Hyeon",sans-serif;font-size:16px}
.res-sub:empty,.res-best:empty{display:none}
.cam-note{font-size:13px;color:var(--mute)!important;margin-top:-6px!important}
.res-face{font-size:13px;color:var(--mute);display:flex;align-items:center;gap:6px}
#demo{width:210px;height:210px;margin-bottom:-6px;flex-shrink:0}
.modes{display:inline-flex;padding:4px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid #ffffff22}
.modes button{font:inherit;font-size:15px;border:0;border-radius:999px;padding:9px 18px;background:none;color:var(--mute);cursor:pointer}
.modes button[aria-pressed="true"]{background:var(--candy);color:#2a1406}
.modes button:disabled{opacity:.6}
.mode-hint{font-size:14px;color:#FFC23D!important;text-wrap:balance;max-width:300px}
@media (max-height:700px){#demo{width:150px;height:150px}}
@media (min-height:820px){#demo{width:250px;height:250px}}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;width:100%;max-width:400px}
.row .go,.row .sub{flex:1 1 0;min-width:0;max-width:200px}
.foot{gap:18px}
.foot .link{background:none;border:0;font:inherit;font-size:14px;cursor:pointer;padding:6px}
.ov h2{font-size:32px}
#back{position:absolute;top:calc(env(safe-area-inset-top) + 12px);left:12px;font-size:13px;color:var(--mute);text-decoration:none;border:1px solid #ffffff33;border-radius:999px;padding:6px 12px}
button:focus-visible,a:focus-visible{outline:2px solid #fff;outline-offset:2px}
/* result entrance: the card drops in with a little overshoot, the rest rises after it (juice r6) */
@keyframes cardIn{0%{transform:translateY(24px) scale(.86) rotate(-3deg);opacity:0}60%{transform:translateY(-4px) scale(1.03) rotate(.6deg);opacity:1}100%{transform:none}}
@keyframes rise{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
#result:not([hidden]) .res-card{animation:cardIn .45s cubic-bezier(.2,.9,.3,1.2) both}
#result:not([hidden]) > :not(.res-card){animation:rise .3s ease-out both}
#result > :nth-child(2){animation-delay:.25s}#result > :nth-child(3){animation-delay:.32s}#result > :nth-child(4){animation-delay:.39s}
#result > :nth-child(5){animation-delay:.46s}#result > :nth-child(6){animation-delay:.53s}#result > :nth-child(7){animation-delay:.6s}
@media (prefers-reduced-motion:reduce){#result *{animation:none!important}}
</style>
</head>
<body>
<div id="app">
  <div id="nocam"></div>
  <video id="video" playsinline muted hidden></video>
  <canvas id="freeze" hidden></canvas>
  <canvas id="cv"></canvas>
  <div class="hud" id="hud" hidden>
    <div id="timer" class="num">01:30</div>
    <button id="quit" aria-label="모양 다시 고르기">✕</button>
    <div id="hint"></div>
    <div id="pc" class="num">0%</div>
    <div id="status"><span id="sw">선을 따라 긁어 보세요</span></div>
    <button id="lick" aria-pressed="false" hidden>혀로 핥기</button>
  </div>

  <section class="ov" id="start">
    <a id="back" href="../../../">‹ 시켜본 것들</a>
    <canvas id="demo" aria-hidden="true"></canvas>
    <h1><img class="logo" src="logo.svg" alt="달고나" width="240" height="91"></h1>
    <p class="goal">금 가기 전에 모양만 떼어 내요.</p>
    <div class="how">
      <b>바늘</b><span>엄지·검지를 모아 선을 따라 긁어요</span>
      <b>모서리</b><span>콕 찌르면 한 번에 파여요</span>
      <b>핥기</b><span>입 벌려 핥으면 말랑, 오래 핥으면 녹아요</span>
    </div>
    <button class="go" id="camGo">카메라로 하기</button>
    <button class="sub" id="touchGo">화면 터치로 하기</button>
    <p class="cam-note">영상은 폰 밖으로 나가지 않아요</p>
    <p id="camMsg" hidden></p>
  </section>

  <section class="ov" id="pick" hidden>
    <h2>모양을 고르세요</h2>
    <p>동그라미가 제일 쉽고, 우산이 제일 어려워요</p>
    <div class="modes" role="group" aria-label="조작 방법">
      <button id="mTouch" aria-pressed="false">화면 터치</button>
      <button id="mCam" aria-pressed="false">카메라</button>
    </div>
    <p id="modeHint" class="mode-hint"></p>
    <p id="pickMsg" class="mode-hint" hidden></p>
    <div class="picks" id="picks"></div>
  </section>

  <section class="ov" id="result" hidden></section>
</div>
<script type="module" src="js/app.js"></script>
</body>
</html>
