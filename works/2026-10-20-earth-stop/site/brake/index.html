<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>지구 브레이크</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&family=IBM+Plex+Mono:wght@500;700&family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap">
<style>
/* layout: feel prototype — header (level, clock, speed), scene canvas (globe + street), g meter, brake lever on the right.
   Lab-notebook palette kept from the chosen mockup B, shapes only. */
:root{--paper:#f6f4ee;--grid:#dde2e7;--ink:#1d2733;--red:#e0482f;--blue:#2b59c3;--green:#2f8a5b;--muted:#5a6572;
  --hand:"Nanum Pen Script",cursive;--mono:"IBM Plex Mono",ui-monospace,monospace;--ui:"IBM Plex Sans KR","Malgun Gothic",sans-serif}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--ui);overflow:hidden;touch-action:none;user-select:none}
.app{height:100%;max-width:520px;margin:0 auto;display:grid;grid-template-rows:auto 1fr auto;gap:6px;box-sizing:border-box;
  padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));padding-block:10px 12px}
.head{display:grid;grid-template-columns:1fr auto;align-items:end;gap:0 10px}
.lv{font-family:var(--hand);font-size:clamp(26px,7vw,34px);line-height:1}
.left{font-family:var(--mono);font-size:14px;text-align:right}
.left b{font-size:clamp(20px,5.6vw,26px);color:var(--red);font-variant-numeric:tabular-nums}
.speed{grid-column:1/-1;font-family:var(--mono);font-size:clamp(28px,8.6vw,40px);font-weight:700;font-variant-numeric:tabular-nums}
.speed small{font-size:.45em;font-weight:500;color:var(--muted)}
.speed.rev{color:var(--red)}
.mid{display:grid;grid-template-columns:1fr 74px;gap:10px;min-height:0}
.stage{position:relative;min-height:0}
canvas{position:absolute;inset:0;width:100%;height:100%}
.lever{position:relative;border:2px solid var(--ink);border-radius:8px;background:repeating-linear-gradient(to top,transparent 0 23px,var(--grid) 23px 24px);touch-action:none;cursor:ns-resize}
.lever .fill{position:absolute;left:0;right:0;bottom:0;background:var(--red);opacity:.25;border-radius:0 0 6px 6px}
.lever .knob{position:absolute;left:-6px;right:-6px;height:30px;margin-bottom:-15px;background:var(--ink);border-radius:6px;box-shadow:3px 3px 0 var(--red)}
.lever .lab{position:absolute;left:0;right:0;top:6px;text-align:center;font-size:12px;color:var(--muted)}
.lever .pct{position:absolute;left:0;right:0;bottom:6px;text-align:center;font-family:var(--mono);font-size:13px}
.meter{display:grid;gap:3px}
.meter .bar{position:relative;height:22px;border:2px solid var(--ink);border-radius:4px;overflow:visible}
.meter .needle{position:absolute;top:-6px;bottom:-6px;width:4px;margin-left:-2px;background:var(--red);border-radius:2px}
.meter .tick{position:absolute;top:0;bottom:0;border-left:1.5px dashed var(--ink);opacity:.55}
.meter .min{position:absolute;top:0;bottom:0;background:var(--green);opacity:.22}
.meter .names{position:relative;height:30px;font-size:11px;color:var(--muted)}
.meter .names span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.meter .gval{font-family:var(--mono);font-size:14px}
.overlay{position:fixed;inset:0;background:rgba(246,244,238,.94);display:grid;place-items:center;z-index:5;padding:20px}
.overlay[hidden]{display:none!important}
.box{max-width:400px;width:100%;display:grid;gap:12px;text-align:center}
.box h2{margin:0;font-family:var(--hand);font-weight:400;font-size:clamp(38px,11vw,52px);line-height:1}
.box p{margin:0;font-size:15px;line-height:1.55}
.stars{font-size:34px;letter-spacing:6px;color:var(--red)}
.checks{display:grid;gap:4px;text-align:left;font-size:14px;border:1.5px solid var(--ink);border-radius:4px;padding:10px 12px;background:#fffdf8}
.levels{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.levels button,.btn{font:inherit;border:1.5px solid var(--ink);border-radius:4px;background:none;color:var(--ink);padding:8px 0;cursor:pointer}
.levels button small{display:block;font-size:11px;color:var(--muted)}
.levels button.on{background:var(--ink);color:var(--paper)}
.levels button.on small{color:var(--paper)}
.btn.main{font-family:var(--hand);font-size:34px;padding:4px;background:var(--ink);color:var(--paper);border:0;box-shadow:4px 4px 0 var(--red)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button:focus-visible,.lever:focus-visible{outline:3px solid var(--red);outline-offset:2px}
</style>
</head>
<body>


<div class="app">
  <div class="head">
    <div class="lv" id="lv">레벨 1 · 하루 안에 멈춰라</div>
    <div class="left">남은 시간<br><b id="left">24:00:00</b></div>
    <div class="speed" id="speed">1,327 <small>km/h · 서울의 땅</small></div>
  </div>
  <div class="mid">
    <div class="stage"><canvas id="cv" aria-hidden="true"></canvas></div>
    <div class="lever" id="lever" tabindex="0" role="slider" aria-label="브레이크" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <div class="fill" id="fill"></div><div class="lab">브레이크</div><div class="knob" id="knob"></div><div class="pct" id="pct">0%</div>
    </div>
  </div>
  <div class="meter">
    <div class="bar" id="bar"><div class="min" id="minzone"></div><div class="needle" id="needle"></div></div>
    <div class="names" id="names"></div>
    <div class="gval" id="gval">0 g · 몸이 받는 가속도</div>
  </div>
</div>

<div class="overlay" id="menu">
  <div class="box">
    <h2>지구 브레이크</h2>
    <p>서울의 땅은 시속 1,327km로 돈다. 레버로 브레이크를 걸어 <b>제한 시간 안에 딱 0</b>에 세워라.<br>세게 밟을수록 사람들이 고생한다. <b>0을 지나치면 지구가 거꾸로 돈다.</b></p>
    <div class="levels" id="levels"></div>
    <button class="btn main" id="start" type="button">시작</button>
    <p style="font-size:12px;color:var(--muted)">레버는 위로 끌수록 세다. 손을 떼도 그 자리에 남는다. 브레이크는 0.4초 늦게 반응한다.</p>
  </div>
</div>
<div class="overlay" id="result" hidden>
  <div class="box">
    <h2 id="rTitle"></h2>
    <div class="stars" id="rStars"></div>
    <p id="rBody"></p>
    <div class="checks" id="rChecks"></div>
    <div class="row2"><button class="btn" id="again" type="button">다시</button><button class="btn main" id="next" type="button">다음 레벨</button></div>
  </div>
</div>

<script>
const V0 = 368.7, G = 9.80665;                       // Seoul ground speed m/s (465.1 * cos 37.57)
const LEVELS = [
  { name: "하루", T: 86400 }, { name: "1시간", T: 3600 }, { name: "1분", T: 60 }, { name: "10초", T: 10 }, { name: "1초", T: 1 },
];
const REAL = 22;                                      // every level plays in ~22 real seconds
const MAXK = 4;                                       // full lever = 4x the gentlest constant brake
const LAG = 0.4;                                      // seconds for the brake to follow the lever
const MARKS = [ { g: 0.05, name: "커피 쏟아짐" }, { g: 0.3, name: "사람 넘어짐" }, { g: 0.7, name: "차 미끄러짐" }, { g: 10, name: "사람 날아감" } ];
const LOG0 = -4, LOG1 = 2;                            // meter range 1e-4 .. 100 g
const $ = id => document.getElementById(id);
const cv = $("cv"), ctx = cv.getContext("2d");
let W = 0, H = 0, dpr = 1;
new ResizeObserver(() => { const r = cv.getBoundingClientRect(); dpr = Math.min(2, devicePixelRatio || 1); W = cv.width = Math.round(r.width * dpr); H = cv.height = Math.round(r.height * dpr); }).observe(cv);

let lv = 0, st = null;
const pos = g => Math.min(1, Math.max(0, (Math.log10(Math.max(g, 1e-6)) - LOG0) / (LOG1 - LOG0)));
function buildMeter() {
  const bar = $("bar"), names = $("names"); bar.querySelectorAll(".tick").forEach(e => e.remove()); names.innerHTML = "";
  for (const m of MARKS) { const t = document.createElement("div"); t.className = "tick"; t.style.left = pos(m.g) * 100 + "%"; bar.append(t);
    const n = document.createElement("span"); n.textContent = m.name; n.style.left = pos(m.g) * 100 + "%"; n.style.top = (MARKS.indexOf(m) % 2) * 14 + "px"; names.append(n); }
  const gmin = V0 / LEVELS[lv].T / G; $("minzone").style.left = 0; $("minzone").style.width = pos(gmin * 1.6) * 100 + "%";
}
LEVELS.forEach((l, i) => { const b = document.createElement("button"); b.type = "button"; b.innerHTML = `${i + 1}<small>${l.name}</small>`; b.onclick = () => { lv = i; pickLevel(); }; $("levels").append(b); });
function pickLevel() { [...$("levels").children].forEach((b, i) => b.classList.toggle("on", i === lv)); $("lv").textContent = `레벨 ${lv + 1} · ${LEVELS[lv].name} 안에 멈춰라`; buildMeter(); }
pickLevel();

function fmtLeft(s) { s = Math.max(0, s);
  if (s >= 3600) { const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = Math.floor(s % 60); return `${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}:${String(x).padStart(2, "0")}`; }
  if (s >= 60) return `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
  return s >= 10 ? s.toFixed(1) + "초" : s.toFixed(2) + "초"; }

function start() {
  const T = LEVELS[lv].T;
  st = { T, t: 0, v: V0, lever: 0, b: 0, amax: MAXK * V0 / T, peak: 0, hit: MARKS.map(() => false), spin: 0, done: false, last: performance.now() };
  setLever(0); $("menu").hidden = true; $("result").hidden = true; buildMeter();
}
$("start").onclick = start;
$("again").onclick = start;
$("next").onclick = () => { lv = Math.min(LEVELS.length - 1, lv + 1); pickLevel(); start(); };

// lever: drag anywhere on it; stays where released; keyboard arrows too
const lever = $("lever");
function setLever(x) { x = Math.min(1, Math.max(0, x)); if (st) st.lever = x; $("knob").style.bottom = x * 100 + "%"; $("fill").style.height = x * 100 + "%"; $("pct").textContent = Math.round(x * 100) + "%"; lever.setAttribute("aria-valuenow", Math.round(x * 100)); }
function fromPointer(e) { const r = lever.getBoundingClientRect(); setLever(1 - (e.clientY - r.top) / r.height); }
lever.addEventListener("pointerdown", e => { lever.setPointerCapture(e.pointerId); fromPointer(e); });
lever.addEventListener("pointermove", e => { if (lever.hasPointerCapture(e.pointerId)) fromPointer(e); });
lever.addEventListener("keydown", e => { if (!st) return; if (e.key === "ArrowUp") setLever(st.lever + 0.05); if (e.key === "ArrowDown") setLever(st.lever - 0.05); if (e.key === "0") setLever(0); });

function finish() {
  st.done = true; const tol = 0.02 * V0, vEnd = st.v, T = st.T, gmin = V0 / T / G;
  const stopped = Math.abs(vEnd) <= tol, smooth = st.peak <= gmin * 1.6, exact = Math.abs(vEnd) <= 0.004 * V0;
  const stars = stopped ? 1 + (smooth ? 1 : 0) + (exact ? 1 : 0) : 0;
  $("rTitle").textContent = stopped ? "멈췄다!" : vEnd < 0 ? "해가 서쪽에서 뜬다" : "시간 초과";
  $("rStars").textContent = "★".repeat(stars) + "☆".repeat(3 - stars);
  $("rBody").textContent = stopped ? `남은 속도 ${Math.abs(vEnd * 3.6).toFixed(1)} km/h · 최고 ${st.peak.toPrecision(2)} g (가장 부드러우면 ${gmin.toPrecision(2)} g)`
    : vEnd < 0 ? `브레이크를 너무 오래 밟았다. 지구가 거꾸로 시속 ${Math.abs(vEnd * 3.6).toFixed(0)}km로 돈다.` : `아직 시속 ${(vEnd * 3.6).toFixed(0)}km로 돌고 있다.`;
  $("rChecks").innerHTML = MARKS.map((m, i) => `<div>${st.hit[i] ? "✗" : "✓"} ${m.name}${st.hit[i] ? "" : " 없음"} <small style="color:var(--muted)">(${m.g} g)</small></div>`).join("");
  $("next").hidden = lv === LEVELS.length - 1; $("result").hidden = false;
}

// ---- scene drawing ----------------------------------------------------------------------------------------
function draw(g) {
  ctx.fillStyle = "#f6f4ee"; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = "#dde2e7"; ctx.lineWidth = dpr; const gs = 22 * dpr; ctx.beginPath();
  for (let x = 0; x < W; x += gs) { ctx.moveTo(x, 0); ctx.lineTo(x, H); } for (let y = 0; y < H; y += gs) { ctx.moveTo(0, y); ctx.lineTo(W, y); } ctx.stroke();
  // globe with meridians turning at the current speed
  const R = Math.min(W * 0.34, H * 0.2), cx = W / 2, cy = R + 24 * dpr;
  ctx.fillStyle = "#cfdcf3"; ctx.beginPath(); ctx.arc(cx, cy, R, 0, 7); ctx.fill();
  ctx.strokeStyle = "#1d2733"; ctx.lineWidth = 2 * dpr; ctx.stroke();
  ctx.lineWidth = 1.5 * dpr;
  for (let k = 0; k < 12; k++) { const a = (st ? st.spin : 0) + k * Math.PI / 6, x = Math.sin(a); if (Math.cos(a) < 0) continue;
    ctx.beginPath(); ctx.ellipse(cx, cy, Math.abs(x) * R, R, 0, 0, 7); ctx.globalAlpha = .45; ctx.stroke(); ctx.globalAlpha = 1; }
  const rev = st && st.v < 0;
  ctx.font = `${13 * dpr}px "IBM Plex Sans KR", sans-serif`; ctx.fillStyle = rev ? "#e0482f" : "#5a6572";
  ctx.fillText(rev ? "← 거꾸로 돈다" : "자전 →", cx - 32 * dpr, cy + R + 18 * dpr);
  // street: cup, person, car, flyer react to g
  const gy = H * 0.84, lean = Math.min(1, g / 0.3);
  ctx.strokeStyle = "#1d2733"; ctx.lineWidth = 3 * dpr; ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(W, gy); ctx.stroke();
  const s = 16 * dpr;
  // cup: liquid tilts, spills past 0.05 g
  const cupX = W * 0.14; ctx.lineWidth = 2 * dpr; ctx.strokeRect(cupX - s, gy - s * 2.6, s * 2, s * 2.6);
  const tilt = Math.min(0.9, g / 0.05 * 0.5); ctx.fillStyle = "#7a4a2a"; ctx.beginPath();
  ctx.moveTo(cupX - s, gy - s * 1.3 + tilt * s); ctx.lineTo(cupX + s, gy - s * 1.3 - tilt * s); ctx.lineTo(cupX + s, gy); ctx.lineTo(cupX - s, gy); ctx.fill();
  if (g > 0.05) { ctx.beginPath(); ctx.arc(cupX + s * 2.2, gy - s * .3, s * Math.min(1.4, g / 0.05 * .3), 0, 7); ctx.fill(); }
  // person: leans, falls past 0.3 g
  const px = W * 0.4; ctx.save(); ctx.translate(px, gy); ctx.rotate(g > 0.3 ? 1.45 : lean * 0.6);
  ctx.strokeStyle = "#1d2733"; ctx.beginPath(); ctx.arc(0, -s * 3.6, s * .6, 0, 7); ctx.moveTo(0, -s * 3); ctx.lineTo(0, -s * 1.4); ctx.moveTo(0, -s * 1.4); ctx.lineTo(-s * .7, 0); ctx.moveTo(0, -s * 1.4); ctx.lineTo(s * .7, 0);
  ctx.moveTo(-s, -s * 2.4); ctx.lineTo(s, -s * 2.2); ctx.stroke(); ctx.restore();
  // car: slides past 0.7 g
  const slide = g > 0.7 ? ((performance.now() / 6) % (W * 0.5)) : 0, carX = W * 0.62 + slide; ctx.fillStyle = "#1d2733";
  ctx.fillRect(carX - s * 2, gy - s * 1.5, s * 4, s * 1.1); ctx.fillRect(carX - s, gy - s * 2.3, s * 2, s * .9);
  ctx.fillStyle = "#f6f4ee"; ctx.beginPath(); ctx.arc(carX - s * 1.2, gy - s * .35, s * .45, 0, 7); ctx.arc(carX + s * 1.2, gy - s * .35, s * .45, 0, 7); ctx.fill();
  // flyer past 10 g
  if (g > 10) { const fx = (performance.now() / 2) % W; ctx.fillStyle = "#e0482f"; ctx.beginPath(); ctx.arc(fx, gy - s * 6, s * .6, 0, 7); ctx.fill(); ctx.fillRect(fx - W * .2, gy - s * 6, W * .18, 2 * dpr); }
  ctx.fillStyle = "#e0482f"; ctx.font = `${12 * dpr}px "IBM Plex Sans KR", sans-serif`; ctx.fillText("서울 거리", 8 * dpr, gy + 16 * dpr);
}

function frame(now) {
  let g = 0;
  if (st && !st.done) {
    const dtr = Math.min(0.05, (now - st.last) / 1000); st.last = now;
    const dt = dtr * st.T / REAL;
    st.b += (st.lever - st.b) * (1 - Math.exp(-dtr / LAG));
    const a = st.b * st.amax; g = a / G;                      // brake always pushes the spin toward the west
    st.v -= a * dt; st.t += dt; st.peak = Math.max(st.peak, g);
    MARKS.forEach((m, i) => { if (g > m.g) st.hit[i] = true; });
    st.spin += (st.v / V0) * dtr * 2.2;
    $("left").textContent = fmtLeft(st.T - st.t);
    $("speed").innerHTML = `${st.v < 0 ? "-" : ""}${Math.round(Math.abs(st.v) * 3.6).toLocaleString("ko-KR")} <small>km/h · ${st.v < 0 ? "거꾸로!" : "서울의 땅"}</small>`;
    $("speed").classList.toggle("rev", st.v < 0);
    st.calm = Math.abs(st.v) <= 0.002 * V0 && st.b < 0.02 ? (st.calm || 0) + dtr : 0;   // held at zero for 1 s = done early
    if (st.t >= st.T || st.calm > 1) finish();
  } else if (st) { st.last = now; }
  $("needle").style.left = pos(g) * 100 + "%";
  $("gval").textContent = `${g < 0.001 ? g.toExponential(1) : g.toPrecision(2)} g · 몸이 받는 가속도`;
  if (W) draw(g);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>

</body>
</html>
