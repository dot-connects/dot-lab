@keyframes shake{0%,100%{transform:translate(0)}20%{transform:translate(-7px,2px)}40%{transform:translate(6px,-3px)}60%{transform:translate(-4px,1px)}80%{transform:translate(3px,0)}}

    <p class="lead">세 시안은 구성이 같고 그림체·색만 다르다. 폰에서 [멈추기]를 눌러 보면 1초 정지 결과가 나온다. 다시 누르면 처음으로 돌아간다.</p>

  <p class="note">대륙: Natural Earth 110m(공개 도메인)을 1° 격자로 줄여 페이지에 넣었다. 남극 테두리의 줄무늬는 시안용 변환의 흔적이고 구현 때 고친다.</p>

  let c = Math.floor((lon + 180) / 360 * MASK_W), r = Math.floor((90 - lat) / 180 * MASK_H);
  c = ((c % MASK_W) + MASK_W) % MASK_W; r = Math.min(MASK_H - 1, Math.max(0, r));
  const k = r * MASK_W + c; return (MASK[k >> 3] >> (k & 7)) & 1;

const D = Math.PI / 180, SEOUL = { lat: 37.57, lon: 126.98 }, TILT = 23.4 * D;
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const STYLES = {
  dots:   { ocean: "#1b2547", land: "#ffd23f", rim: "#2a3560", grid: null,      dot: true,  seoul: "#ff5d73", obj: "#e9eefc", label: "#e9eefc" },

// Orthographic globe: screen point -> (lat, lon) given the rotation (spin around the axis, then axial tilt).
function sample(x, y, spin) {
  const z = Math.sqrt(1 - x * x - y * y);
  // undo tilt (rotation around the screen x axis)
  const y1 = y * Math.cos(TILT) - z * Math.sin(TILT), z1 = y * Math.sin(TILT) + z * Math.cos(TILT);
  const lat = Math.asin(-y1) / D, lon = Math.atan2(x, z1) / D + spin;
  return [lat, ((lon + 540) % 360) - 180];
}
function project(lat, lon, spin) {
  const p = lat * D, l = (lon - spin) * D;
  const x = Math.cos(p) * Math.sin(l), y = -Math.sin(p), z = Math.cos(p) * Math.cos(l);
  const y2 = y * Math.cos(TILT) + z * Math.sin(TILT), z2 = -y * Math.sin(TILT) + z * Math.cos(TILT);
  return [x, y2, z2];

function mount(phone) {
  phone.append(document.getElementById("tpl").content.cloneNode(true));
  const st = STYLES[phone.dataset.style], cv = phone.querySelector("canvas"), ctx = cv.getContext("2d");
  const card = phone.querySelector(".card"), stamp = phone.querySelector(".stamp"), slider = phone.querySelector(".slider");
  const nGround = phone.querySelector('[data-n="ground"]'), btn = phone.querySelector("button.stop");
  let W = 0, H = 0, dpr = 1, spin = SEOUL.lon - 40, speed = 6, stopped = false, t0 = 0, objs = [], globe = null;
  function resize() {
    const r = phone.getBoundingClientRect(); dpr = Math.min(2, devicePixelRatio || 1);

          const i = ((py + oy) * size + px + ox) * 4; if (i >= d.length) continue;

  }

    stopped = false; objs = []; nGround.textContent = "1,327 km/h"; card.classList.remove("on"); stamp.classList.remove("on");

  }

document.querySelectorAll(".phone").forEach(mount);
</script>
