<title>기본 테마 다듬기</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@300;400;500;700;800&family=Sofia+Sans+Extra+Condensed:wght@400;600;700&family=Instrument+Serif:ital@1&family=Source+Serif+4:opsz,wght@8..60,600&family=Inter:wght@500;800&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* Layout: one row per theme — name + pick chips on top, then 지금 / 다듬기 / 과감하게 boards side by side (stacked on phones); picks summary at the end. */
:root {
  --bg: #eeeef0; --fg: #17181c; --muted: #5b5e66; --line: #d6d7db; --chip: #ffffff; --accent: #2f6fd6;
  --ui: "Gothic A1", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0b0c0e; --fg: #ececee; --muted: #a0a2a8; --line: #26282d; --chip: #17181c; --accent: #76a6f3; color-scheme: dark } }
:root[data-theme="dark"] { --bg: #0b0c0e; --fg: #ececee; --muted: #a0a2a8; --line: #26282d; --chip: #17181c; --accent: #76a6f3; color-scheme: dark }
body { background: var(--bg); color: var(--fg); font-family: var(--ui); }
.wrap { max-width: 1240px; margin: 0 auto; padding-block: 28px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 30px; }
h1 { font: 800 1.55rem/1.3 var(--ui); margin: 0; }
.lede { margin: 8px 0 0; color: var(--muted); line-height: 1.65; max-width: 72ch; }
.theme { display: grid; gap: 10px; border-top: 1px solid var(--line); padding-top: 18px; }
.th-h { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; }
.th-h h2 { font: 700 1.1rem var(--ui); margin: 0; }
.th-h p { margin: 0; color: var(--muted); font-size: .88rem; line-height: 1.5; flex: 1 1 320px; min-width: 0; }
.row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 820px) { .row { grid-template-columns: minmax(0, 1fr); } }
.opt { display: grid; gap: 7px; background: none; border: 0; padding: 0; color: inherit; font: inherit; text-align: left; cursor: pointer; min-width: 0; }
.opt .cap { display: flex; gap: 8px; align-items: baseline; font-size: .86rem; }
.opt .cap b { font-weight: 700; }
.opt .cap span { color: var(--muted); font-size: .78rem; font-variant-numeric: tabular-nums; margin-left: auto; }
.opt .note { color: var(--muted); font-size: .8rem; line-height: 1.5; }
.opt[aria-pressed="true"] .board { outline-color: var(--accent); }
.opt:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; border-radius: 12px; }
.board { position: relative; aspect-ratio: 2.05 / 1; border-radius: 16px; overflow: hidden; display: grid; grid-template-columns: 1.15fr 1fr; gap: 3.5%; padding: 4.5%; box-sizing: border-box; outline: 3px solid transparent; outline-offset: 3px; box-shadow: 0 10px 26px rgba(0,0,0,.22); max-width: 100%; }
.board .bgl { position: absolute; inset: 0; }
.clock { position: relative; display: grid; align-content: center; gap: 6%; min-width: 0; }
.time { font-size: clamp(42px, 7vw, 80px); line-height: 1; letter-spacing: -.01em; font-variant-numeric: tabular-nums; white-space: nowrap; }
.time.flip { display: flex; gap: 4%; }
.time.flip i { font-style: normal; padding: 2% 5%; border-radius: 6px; position: relative; }
.time.flip i::after { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: rgba(0,0,0,.55); }
.date { font-size: clamp(10px, 1.25vw, 14px); }
.cards { position: relative; display: grid; gap: 6%; align-content: center; min-width: 0; }
.card { position: relative; padding: 6% 8%; display: grid; gap: 3px; min-width: 0; font-size: clamp(10px, 1.2vw, 13px); }
.card .k { opacity: .62; }
.card .m { font-size: 1.35em; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .bar { height: 4px; border-radius: 2px; margin-top: 4px; overflow: hidden; }
.card .bar i { display: block; height: 100%; width: 62%; border-radius: 2px; }
.dot { display: inline-block; width: .6em; height: .6em; border-radius: 50%; margin-right: .35em; vertical-align: .05em; }
.sum { display: grid; gap: 10px; border-top: 1px solid var(--line); padding-top: 18px; }
.sum pre { margin: 0; white-space: pre-wrap; background: var(--chip); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; font: 500 .9rem/1.6 var(--ui); }
.sum button { justify-self: start; font: 600 .88rem var(--ui); color: var(--fg); background: var(--chip); border: 1px solid var(--line); border-radius: 999px; padding: 8px 16px; cursor: pointer; }
.bulk { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.bulk button { font: 600 .85rem var(--ui); color: var(--fg); background: var(--chip); border: 1px solid var(--line); border-radius: 999px; padding: 7px 14px; cursor: pointer; }
</style>

<div class="wrap">
  <header>
    <h1>기본 테마 다듬기</h1>
    <p class="lede">10개 테마를 색 위주로 다시 봤습니다. 줄마다 <b>지금</b> · <b>다듬기</b>(같은 성격, 색을 정리) · <b>과감하게</b>(성격을 한 걸음 더)를 나란히 놓았습니다. 마음에 드는 칸을 누르면 아래 '고른 안'에 모입니다. 오른쪽 위 숫자는 카드 위 글자 대비(4.5 이상이면 잘 읽힘)와 강조색 대비입니다.</p>
  </header>
  <div class="bulk"><span style="color:var(--muted);font-size:.85rem">한 번에 고르기</span><button type="button" data-all="0">전부 지금</button><button type="button" data-all="1">전부 다듬기</button><button type="button" data-all="2">전부 과감하게</button></div>
  <div id="list" style="display:grid;gap:30px"></div>
  <section class="sum" aria-labelledby="sum-h">
    <h2 id="sum-h" style="font:700 1.1rem var(--ui);margin:0">고른 안</h2>
    <pre id="sum"></pre>
    <button type="button" id="copy">복사</button>
  </section>
</div>

<script>
(() => {
  // fonts close to each theme's digit font
  const F = { sofia: '"Sofia Sans Extra Condensed", sans-serif', serifIt: '"Instrument Serif", serif', light: '"Gothic A1", sans-serif', serif: '"Source Serif 4", serif', bold: '"Inter", sans-serif', mono: '"IBM Plex Mono", monospace' };
  // v: bg (string or list = gradient stops), glows [[color, alpha, x, y, size]], ink, ink2 (alpha), accent, plate [color, alpha], plate2, style (fill/glass/rule/outline), r (radius px), roles
  const T = [
    { name: '기본', why: '지금은 카드가 갈색 기운이라 검정 배경에서 탁해 보여요. 다듬기는 아이폰 StandBy처럼 중립 회색 카드에 맑은 주황.', font: F.sofia, w: 600,
      v: [
        { bg: '#000000', ink: '#F6EFE6', accent: '#FFAD5C', plate: ['#1C1A18', 1], style: 'fill', r: 14, note: '갈색 카드 · 살구 강조' },
        { bg: '#000000', ink: '#F5F5F7', accent: '#FF9F0A', plate: ['#1C1C1E', 1], style: 'fill', r: 16, note: '중립 회색 카드 · 맑은 주황' },
        { bg: '#000000', ink: '#FFFFFF', accent: '#FF6B4A', plate: ['#17171A', 1], style: 'fill', r: 18, glows: [['#2B2B40', .55, .2, .1, .9]], note: '더 깊은 검정, 산호 강조, 위쪽에 아주 옅은 남색 빛' },
      ] },
    { name: '신문 1면', why: '어두운 신문 바탕에 금색 강조. 금색이 조금 탁해서 또렷하게, 과감하게는 신문 제호처럼 빨강.', font: F.serifIt, w: 400,
      v: [
        { bg: '#0E0D0B', ink: '#ECE4D4', accent: '#D8B46A', style: 'rule', r: 0, note: '금색 · 구분선' },
        { bg: '#11100D', ink: '#F2EADA', accent: '#E8BE62', style: 'rule', r: 0, note: '잉크를 조금 밝게, 금색을 맑게' },
        { bg: '#14120E', ink: '#F3EBDA', accent: '#E5503C', style: 'rule', r: 0, note: '제호 빨강 강조' },
      ] },
    { name: '무드등', why: '불빛이 작고 옅어서 무드등보다 갈색 화면처럼 보여요. 불빛을 크고 따뜻하게, 카드는 불빛이 비치게.', font: F.light, w: 300,
      v: [
        { bg: '#14100C', glows: [['#FFAA5A', .18, .3, .4, .7]], ink: '#FFF2E2', accent: '#FFB36B', plate: ['#2B2119', 1], style: 'fill', r: 18, note: '작은 주황 불빛' },
        { bg: '#120D0A', glows: [['#FF9A4D', .30, .3, .38, 1.0]], ink: '#FFF3E4', accent: '#FFC27A', plate: ['#2A1E16', .72], style: 'fill', r: 20, note: '큰 호박색 불빛 · 반쯤 비치는 카드' },
        { bg: '#0E0A12', glows: [['#FF8A5B', .30, .25, .35, .95], ['#9D6BFF', .20, .85, .8, .8]], ink: '#FFF1EA', accent: '#FFB088', plate: ['#241B22', .7], style: 'glass', r: 22, note: '주황 + 보라 두 불빛, 해 질 녘 방' },
      ] },
    { name: '촛불', why: '아래 불빛이 붉은 갈색이라 촛불보다 난로 같아요. 불꽃 노랑에 가깝게.', font: F.light, w: 200,
      v: [
        { bg: '#0C0805', glows: [['#FFA050', .28, .5, 1.15, .8]], ink: '#EAD9C2', accent: '#E3A35B', plate: ['#FFCD96', .06], style: 'fill', r: 16, note: '붉은 갈색 불빛' },
        { bg: '#0B0705', glows: [['#FFA347', .36, .5, 1.1, .95]], ink: '#F2E2CB', accent: '#F0B266', plate: ['#FFCD96', .07], style: 'fill', r: 16, note: '불꽃 주황, 조금 더 높이' },
        { bg: '#080504', glows: [['#FF7A2E', .34, .5, 1.12, 1.05], ['#FFD27A', .22, .5, 1.0, .45]], ink: '#F7E6CF', accent: '#FFC070', plate: ['#FFCD96', .08], style: 'fill', r: 16, note: '바깥 주황 + 안쪽 노란 심지' },
      ] },
    { name: '플립 시계', why: '검정에 검정이라 넘김 판이 잘 안 보여요. 판을 조금 밝게, 과감하게는 거실 탁상시계처럼 노랑.', font: F.sofia, w: 700, flip: true,
      v: [
        { bg: '#0C0C0C', ink: '#F2F2F2', accent: '#FF9F0A', plate: ['#1F1F1F', 1], style: 'fill', r: 10, note: '거의 검정 판' },
        { bg: '#0E0E0F', ink: '#EDEDED', accent: '#FFB224', plate: ['#232326', 1], style: 'fill', r: 10, note: '판을 한 단계 밝게' },
        { bg: '#1A1A1A', ink: '#F5F1E8', accent: '#F5C400', plate: ['#2E2E2E', 1], style: 'fill', r: 10, note: '진회색 바탕 · 노랑' },
      ] },
    { name: '하늘', why: '맨 아래 색이 밤색이라 노을이 아니라 탁해요. 저녁 하늘처럼 남색 → 보라 → 복숭아.', font: F.light, w: 200,
      v: [
        { bg: ['#1B2A4A', '#31355A', '#552D32'], ink: '#FFFFFF', accent: '#FFD29A', plate: ['#FFFFFF', .14], style: 'glass', r: 16, note: '남색 → 밤색' },
        { bg: ['#142650', '#3A3C78', '#7A3E58'], ink: '#FFFFFF', accent: '#FFD8A8', plate: ['#FFFFFF', .13], style: 'glass', r: 18, note: '남색 → 보라 → 자두' },
        { bg: ['#0E1E46', '#4B3F86', '#B3605E'], ink: '#FFFFFF', accent: '#FFE1B0', plate: ['#0E1030', .30], style: 'glass', r: 20, note: '복숭아 지평선, 카드는 어두운 유리' },
      ] },
    { name: '종이', why: '지금도 괜찮지만 카드와 바탕이 거의 같아요. 카드를 살짝 구분하고, 과감하게는 흰 카드에 잉크 파랑.', font: F.serif, w: 600, light: true,
      v: [
        { bg: '#F3EEE4', ink: '#1D1A16', accent: '#A6360A', plate: ['#E8E1D3', 1], style: 'fill', r: 10, note: '크림 · 벽돌색' },
        { bg: '#F5F0E6', ink: '#1E1B17', accent: '#B5390C', plate: ['#EAE2D2', 1], style: 'fill', r: 12, note: '카드를 조금 더 진하게 · 주홍' },
        { bg: '#EEE7D8', ink: '#1B1A17', accent: '#2C55C8', plate: ['#FBF8F2', 1], style: 'fill', r: 12, note: '흰 카드 · 만년필 파랑' },
      ] },
    { name: '브라운 라디오', why: '회색 바탕이 살짝 누렇게 떠요. 브라운 제품처럼 더 맑은 회색과 주황, 초록 표시등.', font: F.bold, w: 500, light: true,
      v: [
        { bg: '#D9D3C7', ink: '#2A2723', accent: '#9C3D0D', plate: ['#EBE6DC', 1], style: 'fill', r: 12, note: '누런 회색 · 주황' },
        { bg: '#D6D3CD', ink: '#26241F', accent: '#B5410C', plate: ['#EDEBE6', 1], style: 'fill', r: 12, note: '맑은 회색 · 진한 주황' },
        { bg: '#CDC9C1', ink: '#22201C', accent: '#C2470A', plate: ['#F3F1ED', 1], style: 'fill', r: 14, roleGreen: '#2F7D4F', note: '흰 패널 · 주황 + 초록 표시등' },
      ] },
    { name: '네온', why: '순검정이라 네온관이 떠 있는 느낌이 덜해요. 밤 골목처럼 아주 옅은 보랏빛을 깔기.', font: F.sofia, w: 400, neon: true,
      v: [
        { bg: '#000000', ink: '#7DF9FF', accent: '#FF4FD8', style: 'outline', r: 14, note: '청록 · 분홍' },
        { bg: '#05040C', glows: [['#3A1E6E', .55, .25, .4, .9]], ink: '#7DF9FF', accent: '#FF5EDB', style: 'outline', r: 14, note: '보랏빛 어둠' },
        { bg: '#070512', glows: [['#FF2FB9', .16, .2, .3, .8], ['#2FD8FF', .12, .85, .85, .8]], ink: '#8AFBFF', accent: '#FFE14F', style: 'outline', r: 16, note: '분홍·하늘 번짐 · 노란 두 번째 관' },
      ] },
    { name: '터미널', why: '초록이 형광펜처럼 날카로워요. 옛 모니터 인광처럼 살짝 부드럽게, 과감하게는 호박색 터미널.', font: F.mono, w: 500, neon: true, soft: true,
      v: [
        { bg: '#050805', ink: '#59FF7A', accent: '#FFB000', style: 'outline', r: 3, note: '형광 초록' },
        { bg: '#04100A', glows: [['#0F3A1E', .6, .5, .5, 1.1]], ink: '#5CF28A', accent: '#FFB000', style: 'outline', r: 3, note: '인광 초록 · 가운데 옅은 빛' },
        { bg: '#0D0803', glows: [['#3A2206', .6, .5, .5, 1.1]], ink: '#FFB547', accent: '#FFE6A8', style: 'outline', r: 3, note: '호박색 터미널' },
      ] },
  ];

  // ---- contrast ----
  const rgb = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
  const lum = ([r, g, b]) => { const f = (v) => { v /= 255; return v <= .03928 ? v / 12.92 : ((v + .055) / 1.055) ** 2.4; }; return .2126 * f(r) + .7152 * f(g) + .0722 * f(b); };
  const ratio = (a, b) => { const x = lum(a), y = lum(b); return (Math.max(x, y) + .05) / (Math.min(x, y) + .05); };
  const over = (top, a, base) => top.map((c, i) => Math.round(c * a + base[i] * (1 - a)));
  const rgba = (h, a) => `rgba(${rgb(h).join(',')},${a})`;
  // the page colour under the cards: the right half, lower middle of the gradient
  function pageUnderCards(v) {
    let base = rgb(Array.isArray(v.bg) ? v.bg[1] : v.bg);
    if (Array.isArray(v.bg)) base = rgb(v.bg[1]).map((c, i) => Math.round((c + rgb(v.bg[2])[i]) / 2));
    for (const [c, a, x, y, s] of v.glows || []) { const d = Math.hypot(.78 - x, .55 - y) / (s * .7); if (d < 1) base = over(rgb(c), a * (1 - d), base); }
    return base;
  }

  function board(t, v) {
    const b = document.createElement('div'); b.className = 'board';
    const layers = (v.glows || []).map(([c, a, x, y, s]) => `radial-gradient(${s * 70}% ${s * 90}% at ${x * 100}% ${y * 100}%, ${rgba(c, a)}, transparent 70%)`);
    const base = Array.isArray(v.bg) ? `linear-gradient(180deg, ${v.bg[0]}, ${v.bg[1]} 55%, ${v.bg[2]})` : v.bg;
    b.innerHTML = `<div class="bgl" style="background:${[...layers, base].join(',')}"></div>`;
    const glowTxt = t.neon && !t.soft ? `0 0 6px ${rgba(v.ink, .8)}, 0 0 18px ${rgba(v.ink, .45)}` : t.soft ? `0 0 5px ${rgba(v.ink, .45)}` : 'none';
    const digits = t.flip ? `<div class="time flip">${['1', '0', '0', '9'].map((d, i) => `${i === 2 ? '<span style="opacity:.5">:</span>' : ''}<i style="background:${v.plate[0]}">${d}</i>`).join('')}</div>` : `<div class="time">10:09</div>`;
    b.insertAdjacentHTML('beforeend', `<div class="clock" style="font-family:${t.font};font-weight:${t.w};color:${v.ink};text-shadow:${glowTxt}">${digits}<div class="date" style="font-family:'Gothic A1',sans-serif;font-weight:500;opacity:.7;text-shadow:none">11월 15일 일요일</div></div>`);
    const plate = (() => {
      if (v.style === 'rule') return `border-top:1px solid ${rgba(v.ink, .3)};border-radius:0;background:transparent`;
      if (v.style === 'outline') return `border:1.5px solid ${rgba(v.ink, t.neon && !t.soft ? .9 : .5)};box-shadow:${t.neon && !t.soft ? `0 0 10px ${rgba(v.ink, .35)}, inset 0 0 8px ${rgba(v.ink, .15)}` : 'none'};border-radius:${v.r}px;background:transparent`;
      const glass = v.style === 'glass' ? ';backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.12)' : '';
      return `background:${rgba(v.plate[0], v.plate[1])};border-radius:${v.r}px${glass}`;
    })();
    const red = t.light ? '#C2362B' : '#FF5A50', yellow = t.light ? '#9A6A00' : '#FFD60A', green = v.roleGreen || (t.light ? '#2F7D4F' : '#30D158');
    const mono = t.neon;
    b.insertAdjacentHTML('beforeend', `<div class="cards" style="color:${v.ink};font-family:'Gothic A1',sans-serif">
      <div class="card" style="${plate}"><div class="k">날씨</div><div class="m"><span style="color:${mono ? v.accent : yellow}">☀</span> 맑음 12°</div><div class="k">최고 15° · 최저 6°</div></div>
      <div class="card" style="${plate}"><div class="k"><span class="dot" style="background:${mono ? v.accent : red}"></span>오늘 일정</div><div class="m"><span style="color:${v.accent}">오후 3:00</span> 치과</div>
        <div class="bar" style="background:${rgba(v.ink, .15)}"><i style="background:${mono ? v.accent : green}"></i></div></div>
    </div>`);
    // contrast numbers: ink and accent on the card surface
    const page = pageUnderCards(v);
    const surf = v.style === 'fill' || v.style === 'glass' ? over(rgb(v.plate[0]), v.plate[1], page) : page;
    return { el: b, ink: ratio(rgb(v.ink), surf), acc: ratio(rgb(v.accent), surf) };
  }

  const LBL = ['지금', '다듬기', '과감하게'];
  const pick = T.map(() => 1);
  const list = document.getElementById('list');
  T.forEach((t, ti) => {
    const sec = document.createElement('section'); sec.className = 'theme'; sec.setAttribute('aria-label', t.name);
    sec.innerHTML = `<div class="th-h"><h2>${t.name}</h2><p>${t.why}</p></div><div class="row"></div>`;
    const row = sec.querySelector('.row');
    t.v.forEach((v, vi) => {
      const o = document.createElement('button'); o.type = 'button'; o.className = 'opt'; o.dataset.t = ti; o.dataset.v = vi;
      const r = board(t, v);
      o.innerHTML = `<div class="cap"><b>${LBL[vi]}</b><span>글자 ${r.ink.toFixed(1)} · 강조 ${r.acc.toFixed(1)}</span></div>`;
      o.append(r.el);
      o.insertAdjacentHTML('beforeend', `<div class="note">${v.note}</div>`);
      o.onclick = () => { pick[ti] = vi; sync(); };
      row.append(o);
    });
    list.append(sec);
  });
  function sync() {
    document.querySelectorAll('.opt').forEach((o) => o.setAttribute('aria-pressed', pick[+o.dataset.t] === +o.dataset.v));
    document.getElementById('sum').textContent = T.map((t, i) => `${t.name}: ${LBL[pick[i]]}`).join('\n');
  }
  document.querySelectorAll('[data-all]').forEach((b) => (b.onclick = () => { pick.fill(+b.dataset.all); sync(); }));
  document.getElementById('copy').onclick = async () => {
    const txt = document.getElementById('sum').textContent;
    try { await navigator.clipboard.writeText(txt); document.getElementById('copy').textContent = '복사했어요'; }
    catch { const r = document.createRange(); r.selectNodeContents(document.getElementById('sum')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
  };
  sync();
})();
</script>
