:root[data-theme="dark"] { --bg: #0d0d0f; --fg: #ececec; --muted: #a3a4a9; --line: #2a2b2f; --chip: #18191c; --accent: #8fb0ff; --bezel: #000000; color-scheme: dark }

.wrap { max-width: 1400px; margin: 0 auto; padding-block: 36px 72px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 44px; }

.lede { margin: 12px 0 0; color: var(--muted); max-width: 66ch; }
.bulk { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 18px; color: var(--muted); font-size: .88rem; }
.btn { font: 500 .88rem var(--ui); color: var(--fg); background: var(--chip); border: 1px solid var(--line); border-radius: 999px; padding: 7px 15px; cursor: pointer; }

.opt { display: grid; gap: 9px; align-content: start; background: none; border: 0; padding: 0; color: inherit; font: inherit; text-align: left; min-width: 0; border-radius: 10px; }
button.opt { cursor: pointer; }
.cap { display: flex; gap: 8px; align-items: center; font-size: .9rem; min-width: 0; }
.cap b { font-weight: 600; white-space: nowrap; }
.cap .n { color: var(--muted); font-size: .78rem; font-variant-numeric: tabular-nums; margin-left: auto; white-space: nowrap; }

.port .scr { --u: 2.05cqw; grid-template-columns: minmax(0, 1fr); align-content: center; gap: calc(var(--u) * 6); padding: calc(var(--u) * 6) calc(var(--u) * 2.7); }

.card { position: relative; display: grid; gap: calc(var(--u) * .45); padding: calc(var(--u) * 1.5) calc(var(--u) * 2.2); border-radius: var(--r); min-width: 0; font-family: var(--cf); text-shadow: var(--cg); box-sizing: border-box; }
.card::before { content: ""; position: absolute; inset: 0; border-radius: inherit; background-image: var(--ctex); background-size: calc(var(--u) * 40); opacity: var(--ctexa); pointer-events: none; }

.p-fill, .p-glass { background: var(--pl); border: var(--bw) solid var(--bc); }
.p-glass { -webkit-backdrop-filter: blur(calc(var(--u) * 2.4)) saturate(1.25); backdrop-filter: blur(calc(var(--u) * 2.4)) saturate(1.25); }
.p-outline { background: var(--pl); border: var(--bw) solid var(--bc); box-shadow: var(--tube); }

.m em { font-style: normal; color: var(--acct); }
.bar { height: max(2px, calc(var(--u) * .55)); border-radius: var(--br); background: var(--track); overflow: hidden; margin-top: calc(var(--u) * .5); }
.bar i { display: block; height: 100%; width: 41%; border-radius: var(--br); }

.port-fig { display: grid; gap: 9px; margin: 0; min-width: 0; }
.port-fig figcaption { font-size: .9rem; color: var(--muted); white-space: nowrap; }
.sum { display: grid; gap: 12px; border-top: 1px solid var(--line); padding-top: 22px; }

@media (max-width: 900px) {

// ---- colour maths ----
const rgb = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
const lum = ([r, g, b]) => { const f = (v) => { v /= 255; return v <= .03928 ? v / 12.92 : ((v + .055) / 1.055) ** 2.4; }; return .2126 * f(r) + .7152 * f(g) + .0722 * f(b); };

const over = (top, a, base) => top.map((c, i) => Math.round(c * a + base[i] * (1 - a)));
const rgba = (h, a) => `rgba(${rgb(h).join(',')},${a})`;
const mix = (a, b, t) => a.map((c, i) => Math.round(c + (b[i] - c) * t));
// the card surface at a point of the screen: page (gradient + glows, as drawn below) under the plate
function surface(v, x, y) {
  let c = Array.isArray(v.bg) ? (y < .55 ? mix(rgb(v.bg[0]), rgb(v.bg[1]), y / .55) : mix(rgb(v.bg[1]), rgb(v.bg[2]), (y - .55) / .45)) : rgb(v.bg);
  for (const [g, a, gx, gy, s] of [...(v.glows || [])].reverse()) { const d = Math.hypot((x - gx) / (s * .7), (y - gy) / (s * .9)); if (d < .7) c = over(rgb(g), a * (1 - d / .7), c); }

}
// worst case over the three card positions on the right
function contrast(v) {
  const pts = [.2, .5, .85].map((y) => surface(v, .76, y)), min = (h, a = 1) => Math.min(...pts.map((s) => ratio(over(rgb(h), a, s), s)));
  return { ink: min(v.ink), ink2: min(v.ink, v.ink2), acc: min(v.accentText || v.accent), role: Math.min(...Object.values(v.roles).map((h) => min(h))) };
}
const hex = (v) => (Array.isArray(v) ? v.join(' → ') : v);
function specText(v) {
  const d = F[v.digit[0]], out = ['배경 ' + hex(v.bg)];

  out.push(`글자 ${v.ink}`, `강조 ${v.accent}${v.accentText ? ' (글자 ' + v.accentText + ')' : ''}`);
  out.push(`${{ fill: '판', glass: '유리', outline: '테두리선', rule: '구분선' }[v.style]}${v.plate && v.plate[1] ? ` ${v.plate[0]} ${v.plate[1]}` : ''}${v.cardTex ? ` + ${TEXN[v.cardTex[0]]} ${v.cardTex[1]}` : ''}`);
  if (v.border) out.push(`선 ${v.border[2] === 'thick' ? '굵게' : '가늘게'} ${v.border[0]} ${v.border[1]}`);
  out.push(`모서리 ${v.r}`, `${d.n} ${v.digit[1]}`, `카드 ${CF[v.card].n}`);
  if (v.extra) out.push(`앱에 새로 필요: ${v.extra}`);
  return out.join(' · ');
}
const TEXN = { paper: '종이결', metal: '헤어라인 금속', frost: '서리 유리', scan: '스캔라인' };

// ---- textures: drawn once into tiles (same recipes as custom-theme.html) ----
const TEXURL = {};
function makeTex(kind) {
  const c = document.createElement('canvas'), N = 160; c.width = c.height = N; const x = c.getContext('2d');
  let s = kind.length * 977 + 13; const r = () => (s = (s * 16807) % 2147483647) / 2147483647;

  if (kind === 'paper') { px(28); for (let i = 0; i < 160; i++) { const al = (.06 + r() * .1).toFixed(3); x.strokeStyle = r() > .5 ? `rgba(255,255,255,${al})` : `rgba(0,0,0,${al})`; x.lineWidth = .6; x.beginPath(); const a = r() * 6.28, l = 4 + r() * 12, sx = r() * N, sy = r() * N; x.moveTo(sx, sy); x.lineTo(sx + Math.cos(a) * l, sy + Math.sin(a) * l); x.stroke(); } }

  else if (kind === 'scan') { for (let y = 0; y < N; y += 4) { x.fillStyle = 'rgba(0,0,0,.45)'; x.fillRect(0, y, N, 2); } }
  else if (kind === 'frost') { x.filter = 'blur(3px)'; for (let i = 0; i < 90; i++) { x.fillStyle = `rgba(255,255,255,${r() * .16})`; x.beginPath(); x.arc(r() * N, r() * N, 3 + r() * 9, 0, 6.29); x.fill(); } x.filter = 'none'; px(20); }

}
Object.keys(TEXN).forEach((k) => (TEXURL[k] = makeTex(k)));

const ICON = {
  sun: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.7" fill="currentColor"/><path d="M12 1.8v2.8M12 19.4v2.8M1.8 12h2.8M19.4 12h2.8M4.8 4.8l2 2M17.2 17.2l2 2M4.8 19.2l2-2M17.2 6.8l2-2" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" fill="none"/></svg>',

const textGlow = (g) => !g ? 'none' : g[0] === 'tube' ? `0 0 .05em ${rgba(g[1], .95)}, 0 0 .2em ${rgba(g[1], .55)}, 0 0 .5em ${rgba(g[1], .25)}` : `0 0 .09em ${rgba(g[1], .5)}, 0 0 .32em ${rgba(g[1], .22)}`;

function board(v, port) {
  const b = document.createElement('div'); b.className = 'board' + (port ? ' port' : '');
  const glows = (v.glows || []).map(([c, a, x, y, s]) => `radial-gradient(${s * 70}% ${s * 90}% at ${x * 100}% ${y * 100}%, ${rgba(c, a)}, transparent 70%)`);

  const card = (k, col, label, side, main, bar) => `<div class="card p-${v.style}"><div class="k"><b>${ic(k, col)}${label}</b><span>${side}</span></div><div class="m">${main}</div>${bar || ''}</div>`;
  const date = `<div class="date${v.dateTop ? ' top' : ''}">11월 15일 일요일</div>`;
  b.innerHTML = `<div class="bgl" style="background:${[...glows, base].join(',')}"></div>
    ${v.tex ? `<div class="tex" style="background-image:url(${TEXURL[v.tex[0]]});opacity:${v.tex[1]}"></div>` : ''}
    <div class="scr" style="${Object.entries(vars).map(([k, x]) => `${k}:${x}`).join(';')}">
      <div class="clock">${v.dateTop ? date : ''}<div class="time" style="font-family:${d.css};font-weight:${v.digit[1]};font-style:${d.it ? 'italic;font-variant-numeric:lining-nums;font-feature-settings:normal' : 'normal'};letter-spacing:${v.track || 0}em;text-shadow:${textGlow(v.dglow)}"><span>10<i style="color:${v.colon || 'inherit'};margin-right:${d.it ? '-.09em' : 0}">:</i>09</span></div>${v.dateTop ? '' : date}</div>
      <div class="cards${v.colRule ? ' colrule' : ''}">
        ${card('sun', R.sun, '날씨', '최고 15° · 최저 6°', '맑음 12°')}
        ${card('dot', R.red, '오늘 일정', '내일 · 엄마 생신', '<em>오후 3:00</em> 치과')}
        ${card('play', R.green, '음악', '1:42 / 4:13', '밤편지', `<div class="bar"><i style="background:${R.green}"></i></div>`)}
      </div>
    </div>`;
  return b;
}
// size the digits to their column: measured once per screen, kept in cqw so it follows any resize
function fit(root) {
  (root || document).querySelectorAll('.time').forEach((t) => {
    const bd = t.closest('.board'), W = bd.clientWidth; if (!W) return;

    const w = t.firstElementChild.getBoundingClientRect().width, col = t.parentElement.clientWidth, port = bd.classList.contains('port');

const LBL = ['지금', '다듬기', '과감하게'];

      if (it.p.bg || it.p.glows) o.insertAdjacentHTML('beforeend', `<div class="spec">${it.p.bg ? hex(it.p.bg) : it.p.glows.map((g) => g.join(' ')).join(' + ')}${it.p.plate ? ` · 유리 ${it.p.plate[0]} ${it.p.plate[1]}` : ''}</div>`);

    const key = String(pick[ti]), fig = ports[ti]; if (fig.dataset.key === key) return;
    fig.dataset.key = key; fig.firstElementChild.textContent = `세로 · ${LBL[pick[ti]]}`;
    fig.lastElementChild.replaceWith(board(t.v[pick[ti]], true)); fit(fig);
  });
  document.getElementById('sum').textContent = T.map((t, i) => `${t.name}: ${LBL[pick[i]]}${xpick[i] != null ? `\n${t.name} ${t.x.label}: ${t.x.items[xpick[i]].name}` : ''}`).join('\n');
  document.getElementById('copy').textContent = '복사';
}
document.querySelectorAll('[data-all]').forEach((b) => (b.onclick = () => { pick.fill(+b.dataset.all); sync(); }));
document.getElementById('copy').onclick = async () => {
  const pre = document.getElementById('sum');
  try { await navigator.clipboard.writeText(pre.textContent); document.getElementById('copy').textContent = '복사했어요'; }
  catch { const r = document.createRange(); r.selectNodeContents(pre); const s = getSelection(); s.removeAllRanges(); s.addRange(r); document.getElementById('copy').textContent = '선택했어요. 길게 눌러 복사'; }
};
