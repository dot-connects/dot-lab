<title>김치볶음밥 3D 시안</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gowun+Dodum&display=swap">
<style>
  :root { --ink: #1F2A33; --paper: #fbf6ea; --accent: #E8481C; --mute: #5b6670; color-scheme: light; }
  html, body { height: 100%; }
  body { margin: 0; background: #20262c; color: var(--ink); overflow: hidden; font-family: "Gowun Dodum", system-ui, sans-serif; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .bar { position: fixed; left: 0; right: 0; display: flex; justify-content: center; gap: 6px; flex-wrap: wrap;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  #top { top: calc(env(safe-area-inset-top, 0px) + 12px); }
  #bot { bottom: calc(env(safe-area-inset-bottom, 0px) + 14px); }
  button { font: 15px "Black Han Sans", system-ui, sans-serif; letter-spacing: .02em; border: 0; border-radius: 999px; padding: 9px 14px;
    background: rgba(255,255,255,.88); color: var(--ink); box-shadow: 0 2px 8px rgba(0,0,0,.18); cursor: pointer; }
  button[aria-pressed="true"] { background: var(--accent); color: #fff; }
  #note { position: fixed; left: 0; right: 0; top: calc(env(safe-area-inset-top, 0px) + 62px); text-align: center; font-size: 14px;
    color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.6); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  #fps { position: fixed; right: 8px; bottom: 62px; font: 11px monospace; color: rgba(255,255,255,.55); }
</style>
<canvas id="c"></canvas>
<div class="bar" id="top">
  <button data-style="A">A 맛있는 일러스트</button><button data-style="B">B 실사풍</button><button data-style="C">C 장난감풍</button>
</div>
<div id="note"></div>
<div class="bar" id="bot">
  <button data-scene="rice">볶음밥 웍질</button><button data-scene="egg">계란 뒤집기</button><button id="slow">느리게</button>
</div>
<div id="fps"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
"use strict";
/* 3D mockup: one scene (wok, burner, fried rice toss, fried egg flip), three looks. Units: wok radius = 1 (≈18 cm).
   Axes: x right, y up, z toward the cook (handle side). Far rim = -z. */
const T = THREE, TAU = Math.PI * 2, DEG = Math.PI / 180;
const lin = (h) => new T.Color(h).convertSRGBToLinear();
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v), smooth = (k) => { k = clamp(k, 0, 1); return k * k * (3 - 2 * k); };
const surf = (r2) => 0.35 * r2;          // wok floor height at radius² (shallow bowl, rim at r = 1, h = .35)
const rnd = (a, b) => a + Math.random() * (b - a);

const STYLES = {
  A: { name: "A 맛있는 일러스트", note: "지브리 음식처럼: 과장한 윤기·하이라이트, 따뜻한 빛, 외곽선", bg: "#f3e3c6", counter: "tile",
       toon: true, outline: true, exposure: 1.0, grain: [0.055, 0.024], grainN: 1500 },
  B: { name: "B 실사풍", note: "음식 사진처럼: 기름 반사, 강철 웍, 화구 불빛", bg: "#1b1f24", counter: "steel",
       toon: false, outline: false, exposure: 1.05, grain: [0.048, 0.02], grainN: 2000, phys: true },
  C: { name: "C 장난감풍", note: "닌텐도 미니게임처럼: 둥글고 큼직, 밝은 색, 부드러운 그림자", bg: "#bfe7dc", counter: "pastel",
       toon: false, outline: false, exposure: 1.0, grain: [0.07, 0.034], grainN: 1100, chunky: true },
};

/* ---------- renderer / camera ---------- */
const canvas = document.getElementById("c");
const renderer = new T.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
renderer.outputEncoding = T.sRGBEncoding;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = T.PCFSoftShadowMap;
const camera = new T.PerspectiveCamera(30, 1, 0.1, 60);
function fit() {
  const w = innerWidth, h = innerHeight, asp = w / h;
  renderer.setSize(w, h, false); camera.aspect = asp;
  // the wok (Ø2 + handle) fills ~88% of the width on a phone, never more than ~55% of the height
  const half = Math.tan((camera.fov / 2) * DEG), needW = 1.32 / (half * asp), needH = 1.75 / half;
  const d = Math.max(needW, needH), a = 35 * DEG; // 35° away from straight down, from the cook's side
  camera.position.set(0, d * Math.cos(a), d * Math.sin(a) + 0.35);
  camera.lookAt(0, -0.05, 0.35); camera.updateProjectionMatrix();
}
addEventListener("resize", fit);

/* ---------- canvas textures ---------- */
function canvasTex(w, h, draw, repeat) {
  const cv = document.createElement("canvas"); cv.width = w; cv.height = h; draw(cv.getContext("2d"), w, h);
  const t = new T.CanvasTexture(cv); t.encoding = T.sRGBEncoding; t.anisotropy = 4;
  if (repeat) { t.wrapS = t.wrapT = T.RepeatWrapping; t.repeat.set(repeat, repeat); }
  return t;
}
const flameTex = canvasTex(64, 128, (c, w, h) => { // teardrop tongue: blue root, orange body, tip fades out
  const g = c.createLinearGradient(0, h, 0, 0);
  g.addColorStop(0, "rgba(90,150,255,0)"); g.addColorStop(0.1, "rgba(90,150,255,.9)"); g.addColorStop(0.25, "rgba(255,190,90,.95)");
  g.addColorStop(0.55, "rgba(255,120,30,.7)"); g.addColorStop(1, "rgba(255,70,0,0)");
  c.fillStyle = g; c.filter = "blur(3px)"; c.beginPath(); c.moveTo(w / 2, 4);
  c.bezierCurveTo(w * 0.62, h * 0.35, w * 0.9, h * 0.7, w / 2, h - 4); c.bezierCurveTo(w * 0.1, h * 0.7, w * 0.38, h * 0.35, w / 2, 4); c.fill();
});
const puffTex = canvasTex(64, 64, (c, w) => {
  const g = c.createRadialGradient(w / 2, w / 2, 0, w / 2, w / 2, w / 2);
  g.addColorStop(0, "rgba(255,255,255,.9)"); g.addColorStop(0.5, "rgba(255,255,255,.35)"); g.addColorStop(1, "rgba(255,255,255,0)");
  c.fillStyle = g; c.fillRect(0, 0, w, w);
});
function counterTex(kind) {
  if (kind === "steel") return canvasTex(512, 512, (c, w, h) => {
    c.fillStyle = "#6f777e"; c.fillRect(0, 0, w, h);
    for (let i = 0; i < 2600; i++) { const y = Math.random() * h, v = 90 + Math.random() * 70; c.strokeStyle = `rgba(${v},${v + 6},${v + 10},.25)`; c.lineWidth = Math.random() * 1.4; c.beginPath(); c.moveTo(0, y); c.lineTo(w, y + rnd(-2, 2)); c.stroke(); }
  }, 3);
  if (kind === "tile") return canvasTex(512, 512, (c, w, h) => {
    c.fillStyle = "#b98a5c"; c.fillRect(0, 0, w, h); // warm wooden counter: planks with grain
    for (let y = 0; y < 8; y++) { c.fillStyle = y % 2 ? "#c39467" : "#b2825a"; c.fillRect(0, y * 64 + 1, w, 62); }
    for (let i = 0; i < 260; i++) { const y = Math.random() * h; c.strokeStyle = `rgba(90,55,30,${0.08 + Math.random() * 0.1})`; c.lineWidth = 1 + Math.random(); c.beginPath(); c.moveTo(0, y); c.bezierCurveTo(w * 0.3, y + rnd(-6, 6), w * 0.6, y + rnd(-6, 6), w, y + rnd(-4, 4)); c.stroke(); }
  }, 2);
  return canvasTex(256, 256, (c, w, h) => { c.fillStyle = "#9fd6c6"; c.fillRect(0, 0, w, h); c.fillStyle = "#93cdbc"; for (let i = 0; i < 8; i++) c.fillRect(0, i * 32, w, 16); }, 3);
}
function patinaTex() { // carbon-steel wok: blue-bronze heat tint in the middle, seasoned black toward the rim
  return canvasTex(512, 512, (c, w, h) => {
    const g = c.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2);
    g.addColorStop(0, "#5a4a3c"); g.addColorStop(0.28, "#3d4654"); g.addColorStop(0.55, "#262b31"); g.addColorStop(1, "#16191c");
    c.fillStyle = g; c.fillRect(0, 0, w, h);
    for (let i = 0; i < 90; i++) { const r = 30 + i * 2.6; c.strokeStyle = `rgba(255,255,255,${0.012 + Math.random() * 0.02})`; c.lineWidth = 1; c.beginPath(); c.arc(w / 2, h / 2, r, 0, TAU); c.stroke(); }
  });
}

/* ---------- build a look ---------- */
let S, scene, wokPivot, wok, rice, kimchi, pa, bed, egg, flames = [], fireLight, puffs = [], world;
function mat(style, hex, o = {}) {
  const color = lin(hex);
  if (style.toon) {
    const gm = new T.DataTexture(new Uint8Array([70, 150, 230, 255]), 4, 1, T.LuminanceFormat); gm.magFilter = gm.minFilter = T.NearestFilter; gm.needsUpdate = true;
    return new T.MeshToonMaterial(Object.assign({ color, gradientMap: gm }, o.toon || {}));
  }
  if (style.phys && o.phys) return new T.MeshPhysicalMaterial(Object.assign({ color }, o.phys));
  return new T.MeshStandardMaterial(Object.assign({ color, roughness: 0.55, metalness: 0 }, o.std || {}));
}
function outline(mesh, s, col) {
  if (!S.outline) return;
  const o = new T.Mesh(mesh.geometry, new T.MeshBasicMaterial({ color: lin(col || "#3a2414"), side: T.BackSide }));
  o.scale.setScalar(s); mesh.add(o);
}
function polarDisc(R, rings, segs, height, colorAt, flip) { // a disc whose edge follows R(θ); y = height(t, θ)
  const pos = [], col = [], idx = [];
  for (let i = 0; i <= rings; i++) for (let j = 0; j < segs; j++) {
    const t = i / rings, th = (j / segs) * TAU, r = t * R(th), x = Math.cos(th) * r, z = Math.sin(th) * r;
    pos.push(x, height(t, th, r), z); const c = colorAt(t, th); col.push(c.r, c.g, c.b);
  }
  for (let i = 0; i < rings; i++) for (let j = 0; j < segs; j++) {
    const a = i * segs + j, b = i * segs + ((j + 1) % segs), c2 = a + segs, d = b + segs;
    if (flip) idx.push(a, c2, b, b, c2, d); else idx.push(a, b, c2, b, d, c2);
  }
  const g = new T.BufferGeometry(); g.setAttribute("position", new T.Float32BufferAttribute(pos, 3));
  g.setAttribute("color", new T.Float32BufferAttribute(col, 3)); g.setIndex(idx); g.computeVertexNormals(); return g;
}

function build(key) {
  S = STYLES[key];
  if (scene) scene.traverse((o) => { if (o.geometry) o.geometry.dispose(); });
  scene = new T.Scene(); scene.background = lin(S.bg);
  renderer.toneMapping = S.phys ? T.ACESFilmicToneMapping : T.NoToneMapping; renderer.toneMappingExposure = S.exposure;
  // environment for reflections: a dim room with two soft windows
  const envScene = new T.Scene(); envScene.background = lin(S.phys ? "#262a2e" : S.bg);
  const win = (x, y, z, w, h, c) => { const m = new T.Mesh(new T.PlaneGeometry(w, h), new T.MeshBasicMaterial({ color: lin(c), side: T.DoubleSide })); m.position.set(x, y, z); m.lookAt(0, 0, 0); envScene.add(m); };
  win(-3, 4, 2, 4, 2, "#fff6e6"); win(4, 3, -2, 3, 3, "#ffd7a8"); win(0, -3, 0, 6, 6, "#ff7a2a");
  const pm = new T.PMREMGenerator(renderer); scene.environment = pm.fromScene(envScene, 0.04).texture; pm.dispose();

  // lights
  scene.add(new T.HemisphereLight(lin(S.toon ? "#fff4e0" : "#e8eef5"), lin("#6a4a30"), S.phys ? 0.35 : 0.5));
  const keyL = new T.DirectionalLight(lin("#fff1dc"), S.phys ? 1.6 : 0.85); keyL.position.set(-2.2, 5, 1.5);
  keyL.castShadow = true; keyL.shadow.mapSize.set(1024, 1024); keyL.shadow.bias = -0.0008; keyL.shadow.radius = 4;
  Object.assign(keyL.shadow.camera, { left: -2.4, right: 2.4, top: 2.4, bottom: -2.4, near: 1, far: 12 }); scene.add(keyL);
  fireLight = new T.PointLight(lin("#ff8a2a"), 2.2, 4.5, 2); fireLight.position.set(0, -0.35, 0); scene.add(fireLight);

  // counter + burner
  const counter = new T.Mesh(new T.PlaneGeometry(14, 14), new T.MeshStandardMaterial({ map: counterTex(S.counter), roughness: S.counter === "steel" ? 0.35 : 0.8, metalness: S.counter === "steel" ? 0.6 : 0 }));
  counter.rotation.x = -Math.PI / 2; counter.position.y = -0.62; counter.receiveShadow = true; scene.add(counter);
  const ring = new T.Mesh(new T.TorusGeometry(0.62, 0.07, 10, 48), mat(S, "#2a2c2e", { std: { metalness: 0.6, roughness: 0.4 } }));
  ring.rotation.x = Math.PI / 2; ring.position.y = -0.56; scene.add(ring);
  const hole = new T.Mesh(new T.CircleGeometry(0.58, 40), new T.MeshBasicMaterial({ color: lin("#120b08") })); hole.rotation.x = -Math.PI / 2; hole.position.y = -0.6; scene.add(hole);

  // wok: lathe profile (inner bowl, rolled lip, outer skin), long wooden handle toward the cook, small ear at the far side
  world = new T.Group(); scene.add(world);
  wokPivot = new T.Group(); world.add(wokPivot);
  wok = new T.Group(); wokPivot.add(wok);
  const prof = [];
  for (let i = 0; i <= 40; i++) { const r = i / 40; prof.push(new T.Vector2(Math.max(0.001, r), surf(r * r))); }
  prof.push(new T.Vector2(1.03, 0.365), new T.Vector2(1.055, 0.35), new T.Vector2(1.04, 0.33));
  for (let i = 40; i >= 0; i--) { const r = (i / 40) * 1.02; prof.push(new T.Vector2(Math.max(0.001, r), surf(r * r) - 0.03)); }
  const wokMat = S.toon ? mat(S, "#2e3742") : S.phys
    ? new T.MeshPhysicalMaterial({ color: lin("#3a4048"), metalness: 0.85, roughness: 0.3, clearcoat: 0.5, clearcoatRoughness: 0.2, envMapIntensity: 1.3 })
    : new T.MeshStandardMaterial({ color: lin("#4a5d78"), roughness: 0.42, metalness: 0.25 });
  wokMat.side = T.DoubleSide;
  const bowl = new T.Mesh(new T.LatheGeometry(prof, 96), wokMat); bowl.castShadow = true; bowl.receiveShadow = true; wok.add(bowl);
  if (S.outline) { const o = new T.Mesh(new T.TorusGeometry(1.045, 0.022, 8, 96), new T.MeshBasicMaterial({ color: lin("#2a1a10") })); o.rotation.x = Math.PI / 2; o.position.y = 0.355; wok.add(o); }
  const steel = mat(S, "#9aa3ab", { std: { metalness: 0.9, roughness: 0.3 }, phys: { metalness: 1, roughness: 0.28 } });
  const sock = new T.Mesh(new T.CylinderGeometry(0.04, 0.05, 0.42, 16), steel); sock.rotation.x = Math.PI / 2 - 12 * DEG; sock.position.set(0, 0.36, 1.2); wok.add(sock);
  const wood = mat(S, S.chunky ? "#c9773a" : "#7b4a2a", { std: { roughness: 0.6 }, phys: { roughness: 0.55, clearcoat: 0.3 } });
  const handle = new T.Mesh(new T.CylinderGeometry(0.06, 0.07, 1.0, 20), wood); handle.rotation.x = Math.PI / 2 - 12 * DEG; handle.position.set(0, 0.5, 1.88); handle.castShadow = true; wok.add(handle);
  outline(handle, 1.06);
  const ear = new T.Mesh(new T.TorusGeometry(0.09, 0.022, 8, 20, Math.PI), steel); ear.position.set(0, 0.36, -1.06); ear.rotation.set(-Math.PI / 2, 0, 0); wok.add(ear);

  // sauce bed under the pile (keeps metal from showing between grains)
  const sauce = S.chunky ? "#e96a32" : "#c9542a";
  bed = new T.Mesh(polarDisc((th) => 0.68 + 0.04 * Math.sin(5 * th), 10, 64, (t, th, r) => surf(r * r) + 0.006 + 0.05 * Math.pow(1 - t * t, 0.8),
    (t) => lin(t > 0.85 ? "#a8401c" : sauce)), mat(S, "#ffffff", { std: { vertexColors: true, roughness: 0.6 }, phys: { vertexColors: true, roughness: 0.4, clearcoat: 0.8, clearcoatRoughness: 0.3 }, toon: { vertexColors: true } }));
  bed.material.vertexColors = true; bed.receiveShadow = true; wok.add(bed);

  // food: instanced rice grains, kimchi leaves, scallion rings
  const [gl, gw] = S.grain;
  const grainGeo = new T.SphereGeometry(1, S.chunky ? 10 : 7, S.chunky ? 8 : 5); grainGeo.scale(gl, gw, gw);
  const riceMat = mat(S, "#ffffff", { std: { roughness: S.chunky ? 0.45 : 0.5 }, phys: { roughness: 0.42, clearcoat: 0.9, clearcoatRoughness: 0.18, sheen: 0 } });
  rice = makeFood(new T.InstancedMesh(grainGeo, riceMat, S.grainN), S.grainN, 0, (i) => {
    const k = Math.random(); // orange-red sauced rice, some caramelised, some pale
    return lin(k < 0.12 ? "#f2c08a" : k < 0.3 ? "#b4542a" : k < 0.65 ? "#e0743c" : "#d8622f");
  });
  const leaf = new T.Shape(); { const n = 7; for (let i = 0; i < n; i++) { const a = (i / n) * TAU, r = rnd(0.6, 1); i ? leaf.lineTo(Math.cos(a) * r, Math.sin(a) * r * 0.7) : leaf.moveTo(Math.cos(a) * r, Math.sin(a) * r * 0.7); } }
  const leafGeo = new T.ShapeGeometry(leaf); leafGeo.rotateX(-Math.PI / 2); leafGeo.scale(S.chunky ? 0.07 : 0.055, 1, S.chunky ? 0.07 : 0.055);
  const kimMat = mat(S, "#ffffff", { std: { side: T.DoubleSide, roughness: 0.35 }, phys: { side: T.DoubleSide, roughness: 0.3, clearcoat: 1, transmission: 0.0 }, toon: { side: T.DoubleSide } });
  kimchi = makeFood(new T.InstancedMesh(leafGeo, kimMat, 140), 140, 1, () => lin(Math.random() < 0.3 ? "#f0a088" : Math.random() < 0.5 ? "#c4231c" : "#a81c18"));
  const paGeo = new T.TorusGeometry(S.chunky ? 0.03 : 0.022, S.chunky ? 0.012 : 0.008, 6, 12); paGeo.rotateX(Math.PI / 2);
  pa = makeFood(new T.InstancedMesh(paGeo, mat(S, "#ffffff", { std: { roughness: 0.4 } }), 70), 70, 2, () => lin(Math.random() < 0.3 ? "#d8efb0" : "#4fa83a"));
  for (const f of [rice, kimchi, pa]) wok.add(f.mesh);

  // fried egg: white (puffed, lacy golden edge) + golden underside + glossy yolk; lives in world space for the flip
  egg = new T.Group(); world.add(egg);
  const ER = (th) => 0.5 * (1 + 0.07 * Math.sin(3 * th + 1) + 0.05 * Math.sin(7 * th) + 0.035 * Math.sin(13 * th + 2));
  const white = lin("#fbfaf4"), gold = lin("#e2a65a"), brown = lin("#9c5a26");
  const topGeo = polarDisc(ER, 18, 128, (t, th) => 0.012 + 0.05 * Math.pow(Math.max(0, 1 - t * t), 0.6) + (t < 0.4 ? 0.025 * (1 - t / 0.4) : 0),
    (t) => { const n = Math.random(); return t < 0.8 ? white : white.clone().lerp(t > 0.95 && n > 0.4 ? brown : gold, clamp((t - 0.8) / 0.16 + n * 0.35 - 0.1, 0, 1)); });
  const eggMat = mat(S, "#ffffff", { std: { vertexColors: true, roughness: 0.38 }, phys: { vertexColors: true, roughness: 0.3, clearcoat: 0.7, clearcoatRoughness: 0.2 }, toon: { vertexColors: true } });
  eggMat.vertexColors = true;
  const top = new T.Mesh(topGeo, eggMat); top.castShadow = true; egg.add(top); outline(top, 1.03, "#c89a62");
  const botGeo = polarDisc(ER, 12, 128, () => 0.004, (t) => gold.clone().lerp(brown, clamp(t * t * 0.9 + Math.random() * 0.3 - 0.1, 0, 1)), true);
  egg.add(new T.Mesh(botGeo, eggMat));
  const yolk = new T.Mesh(new T.SphereGeometry(0.16, 32, 16), mat(S, "#ffb31a", { std: { roughness: 0.22 }, phys: { roughness: 0.15, clearcoat: 1, clearcoatRoughness: 0.05 } }));
  yolk.scale.set(1, 0.62, 1); yolk.position.set(0.04, 0.075, -0.03); yolk.castShadow = true; egg.add(yolk); egg.userData.yolk = yolk; outline(yolk, 1.04, "#b86e10");

  // fire: additive flame sprites licking up around the wok's outer wall + glow light
  flames = [];
  for (let i = 0; i < 46; i++) {
    const sp = new T.Sprite(new T.SpriteMaterial({ map: flameTex, blending: T.AdditiveBlending, depthWrite: false, transparent: true, color: lin(S.phys ? "#ff9a50" : "#ffc890") }));
    sp.userData = { a: (i / 46) * TAU + rnd(-0.05, 0.05), r: rnd(0.9, 1.06), ph: Math.random() * TAU, s: rnd(0.7, 1.2) };
    scene.add(sp); flames.push(sp);
  }
  puffs = [];
  for (let i = 0; i < 14; i++) { const sp = new T.Sprite(new T.SpriteMaterial({ map: puffTex, transparent: true, depthWrite: false, opacity: 0 })); sp.userData = { t: Math.random() * 2 }; scene.add(sp); puffs.push(sp); }

  document.getElementById("note").textContent = S.note;
  for (const b of document.querySelectorAll("[data-style]")) b.setAttribute("aria-pressed", b.dataset.style === key);
  fit(); resetFood();
}

/* ---------- food state: wok-local home on the mound, or flying in world space ---------- */
function makeFood(mesh, n, kind, colorFn) {
  mesh.instanceMatrix.setUsage(T.DynamicDrawUsage); mesh.castShadow = kind === 0 && !S.chunky ? false : true; mesh.receiveShadow = true;
  const f = { mesh, n, kind, st: new Uint8Array(n), home: new Float32Array(n * 3), p: new Float32Array(n * 3), v: new Float32Array(n * 3),
    q: [], spin: new Float32Array(n * 3), rank: new Float32Array(n), dl: new Float32Array(n), depth: new Float32Array(n) };
  for (let i = 0; i < n; i++) {
    mesh.setColorAt(i, colorFn(i));
    f.q.push(new T.Euler(Math.random() * TAU, Math.random() * TAU, Math.random() * TAU));
  }
  mesh.instanceColor.needsUpdate = true;
  return f;
}
function homeOf(f, i) {
  const a = Math.random() * TAU, r = 0.66 * Math.sqrt(Math.random()), x = Math.cos(a) * r, z = Math.sin(a) * r, rr = r / 0.66;
  const d = f.kind === 2 ? rnd(0.75, 1) : f.kind === 1 ? rnd(0.3, 1) : Math.random();
  f.depth[i] = d;
  f.home[i * 3] = x; f.home[i * 3 + 1] = surf(r * r) + 0.02 + 0.085 * (1 - rr * rr) * (0.35 + 0.65 * d); f.home[i * 3 + 2] = z;
}
function resetFood() {
  for (const f of [rice, kimchi, pa]) for (let i = 0; i < f.n; i++) {
    homeOf(f, i); f.st[i] = 0; for (let k = 0; k < 3; k++) f.p[i * 3 + k] = f.home[i * 3 + k];
  }
}

/* ---------- wok pose: chef timeline (Ko & Hu 2020 cycle ≈ .3 s, slowed for reading) ---------- */
let tossT0 = -9, eggT0 = -9, scn = "rice", slow = 1;
const pose = { x: 0, y: 0, z: 0, pitch: 0, roll: 0 };
function wokPose(t) {
  const k = t - tossT0, s = 1;
  let z = 0, y = 0, pitch = -4 * DEG, roll = 0;
  // idle: the cook's hand never stops — a slow small sway
  pitch += Math.sin(t * 1.3) * 1.2 * DEG; roll = Math.sin(t * 0.9) * 1.5 * DEG;
  if (k >= 0 && k < 1.2) {
    const back = k < 0.07 ? Math.sin((k / 0.07) * Math.PI) * 0.05 : 0;                        // wind-up: pull toward the cook
    const fwd = 0.42 * s * (smooth((k - 0.06) / 0.11) - smooth((k - 0.22) / 0.16));            // push away
    const bump = smooth((k - 0.14) / 0.07) - smooth((k - 0.23) / 0.14);                        // lip snap: far lip flicks up
    const cushion = k > 0.5 && k < 0.78 ? -0.035 * Math.sin(((k - 0.5) / 0.28) * Math.PI) : 0; // give a little as the food lands
    z += back - fwd; y += 0.07 * bump + cushion;
    pitch += (4 + 12 * s) * DEG * bump - 3 * DEG * Math.max(0, Math.sin(Math.PI * clamp((k - 0.3) / 0.3, 0, 1)));
  }
  pose.x = 0; pose.y = y; pose.z = z; pose.pitch = pitch; pose.roll = roll;
}
function applyPose() {
  // pitch about the near (handle-side) rim: the far lip rises, the hand end barely moves
  wokPivot.position.set(pose.x, pose.y, pose.z + 0.95); wok.position.set(0, 0, -0.95);
  wokPivot.rotation.set(pose.pitch, 0, pose.roll); world.updateMatrixWorld(true);
}

/* ---------- toss physics ---------- */
const G = 26, m4 = new T.Matrix4(), inv = new T.Matrix4(), v3 = new T.Vector3(), dummy = new T.Object3D();
function launch(t) {
  // grains in the far half ride up and leave the lip in order (lip first); the near ones slosh
  for (const f of [rice, kimchi, pa]) {
    for (let i = 0; i < f.n; i++) {
      if (f.st[i] !== 0) continue;
      const along = -f.p[i * 3 + 2]; // toward the far lip
      if (along < -0.12) { f.home[i * 3 + 2] *= 0.75; continue; } // the near food slides toward the middle
      f.st[i] = 1; f.rank[i] = clamp((along + 0.12) / 0.8, 0, 1); f.dl[i] = (1 - f.rank[i]) * 0.13 * rnd(0.7, 1.3);
    }
  }
}
function release(f, i) {
  m4.copy(wok.matrixWorld); v3.set(f.p[i * 3], f.p[i * 3 + 1], f.p[i * 3 + 2]).applyMatrix4(m4);
  f.p[i * 3] = v3.x; f.p[i * 3 + 1] = v3.y; f.p[i * 3 + 2] = v3.z;
  const r = f.rank[i], kh = [1, 0.85, 1.15][f.kind];
  const rise = Math.max(0.12, 0.36 + 0.8 * kh * (0.3 + 0.9 * r) * rnd(0.75, 1.25) - v3.y);
  const vy = Math.sqrt(2 * G * rise), T0 = vy / G + Math.sqrt((2 * Math.max(0.05, v3.y + rise - 0.2)) / G);
  const zT = 0.1 + 0.3 * (r - 0.5) + rnd(-0.12, 0.12), xT = v3.x * rnd(0.5, 0.9) + rnd(-0.12, 0.12); // roll over: lip grains land nearest the cook
  f.v[i * 3] = (xT - v3.x) / T0; f.v[i * 3 + 1] = vy; f.v[i * 3 + 2] = (zT - v3.z) / T0;
  f.spin[i * 3] = rnd(-12, 12); f.spin[i * 3 + 1] = rnd(-6, 6); f.spin[i * 3 + 2] = rnd(-12, 12);
  f.st[i] = 2;
}
function stepFood(f, t, dt) {
  inv.copy(wok.matrixWorld).invert();
  let air = 0;
  for (let i = 0; i < f.n; i++) {
    const j = i * 3;
    if (f.st[i] === 0) { // settle toward home, wok-local
      for (let k = 0; k < 3; k++) f.p[j + k] += (f.home[j + k] - f.p[j + k]) * Math.min(1, dt * 6);
    } else if (f.st[i] === 1) { // riding up the far wall before the lip snap
      const k = smooth((t - tossT0 - 0.04) / 0.13), z = f.home[j + 2] + (-0.55 - 0.35 * f.rank[i] - f.home[j + 2]) * k;
      f.p[j + 2] = z; f.p[j] = f.home[j] * (1 - 0.3 * k); f.p[j + 1] = surf(z * z + f.p[j] * f.p[j]) + 0.03 + 0.04 * f.depth[i];
      if (t - tossT0 >= 0.17 + f.dl[i]) release(f, i);
    } else if (f.st[i] === 2) {
      air++;
      f.v[j + 1] -= (Math.abs(f.v[j + 1]) < 1 ? 0.75 : 1) * G * dt;
      for (let k = 0; k < 3; k++) f.p[j + k] += f.v[j + k] * dt;
      f.q[i].x += f.spin[j] * dt; f.q[i].y += f.spin[j + 1] * dt; f.q[i].z += f.spin[j + 2] * dt;
      if (f.v[j + 1] < 0) {
        v3.set(f.p[j], f.p[j + 1], f.p[j + 2]).applyMatrix4(inv);
        const r2 = v3.x * v3.x + v3.z * v3.z, top = surf(r2) + 0.03 + 0.08 * Math.max(0, 1 - r2 / 0.44);
        if (r2 < 1 && v3.y <= top) {
          f.st[i] = 0; f.p[j] = v3.x; f.p[j + 1] = v3.y; f.p[j + 2] = v3.z;
          // new home anywhere on the mound, a little toward the cook (the pile rolled over); bottom comes up
          { const a = Math.random() * TAU, r = 0.66 * Math.sqrt(Math.random()); f.home[j] = Math.cos(a) * r; f.home[j + 2] = Math.sin(a) * r * 0.85 + 0.08; }
          f.depth[i] = clamp(1 - f.depth[i] + rnd(-0.1, 0.1), 0, 1);
          const rr = Math.min(1, (f.home[j] ** 2 + f.home[j + 2] ** 2) / 0.44);
          f.home[j + 1] = surf(f.home[j] ** 2 + f.home[j + 2] ** 2) + 0.02 + 0.085 * (1 - rr) * (0.35 + 0.65 * f.depth[i]);
        }
      }
    }
  }
  return air;
}
function drawFood(f) {
  const wm = wok.matrixWorld;
  inv.copy(wm).invert();
  for (let i = 0; i < f.n; i++) {
    const j = i * 3;
    dummy.position.set(f.p[j], f.p[j + 1], f.p[j + 2]);
    if (f.st[i] === 2) dummy.position.applyMatrix4(inv); // the instanced mesh lives in the wok; flying food is stored in world space
    dummy.rotation.copy(f.q[i]);
    if (f.kind === 0 && f.st[i] !== 2) { dummy.rotation.x = 0; dummy.rotation.z = 0.15 * Math.sin(f.q[i].x); } // resting grains lie flat
    if (f.kind === 1 && f.st[i] !== 2) { dummy.rotation.x = 0.2 * Math.sin(f.q[i].x); dummy.rotation.z = 0.2 * Math.sin(f.q[i].z); }
    dummy.scale.setScalar(1); dummy.updateMatrix(); f.mesh.setMatrixAt(i, dummy.matrix);
  }
  f.mesh.instanceMatrix.needsUpdate = true;
}

/* ---------- egg flip ---------- */
function eggPose(t) {
  const k = t - eggT0, wm = wok.matrixWorld;
  egg.userData.yolk.visible = !(k > 0.45 && k <= 2.3); // face down after the flip: the yolk is under the white
  // resting: rides the wok floor; flip: up 0.9, half turn about x, lands showing the golden side; then resets
  v3.set(0, 0, 0.05).applyMatrix4(wm);
  if (k < 0.17 || k > 2.3) { egg.position.copy(v3); egg.rotation.set(pose.pitch, 0, pose.roll); if (k > 2.3) egg.rotation.x += 0; return; }
  const f = clamp((k - 0.17) / 0.55, 0, 1), up = 0.95 * Math.sin(Math.PI * f);
  egg.position.set(v3.x, v3.y + up + (f > 0 ? 0.02 : 0), v3.z - 0.15 * Math.sin(Math.PI * f));
  egg.rotation.set(Math.PI * smooth(f) + pose.pitch, 0, pose.roll);
  if (f >= 1) { egg.rotation.x = Math.PI + pose.pitch; egg.position.y = v3.y + 0.07 + 0.03 * Math.max(0, Math.sin((k - 0.72) * 30) * Math.exp(-(k - 0.72) * 8)); }
}

/* ---------- loop ---------- */
let last = performance.now(), t = 0, fpsN = 0, fpsT = 0;
function frame(now) {
  const dt = Math.min(0.033, (now - last) / 1000) * slow; last = now; t += dt;
  fpsN++; fpsT += (now - fpsT ? 0 : 0); if (fpsN % 30 === 0) { document.getElementById("fps").textContent = Math.round(1000 / Math.max(1, (now - (frame.p || now)) / 30)) + " fps"; frame.p = now; }
  if (scn === "rice" && t - tossT0 > 2.1) { tossT0 = t; launch(t); }
  if (scn === "egg" && t - eggT0 > 3.4) { eggT0 = t; tossT0 = t; }
  wokPose(t); applyPose();
  let air = 0;
  const showRice = scn === "rice";
  for (const f of [rice, kimchi, pa]) { f.mesh.visible = showRice; if (showRice) { air += stepFood(f, t, dt); drawFood(f); } }
  bed.visible = showRice; { const k = clamp(air / (rice.n * 0.45), 0, 1); bed.scale.set(1 - 0.35 * k, 1 - 0.9 * k, 1 - 0.35 * k); } // the oily bed thins as the food leaves
  egg.visible = !showRice; if (!showRice) eggPose(t);
  // fire: flicker, flare on the lip snap
  const flare = Math.exp(-Math.max(0, t - tossT0 - 0.15) * 5) * (t - tossT0 > 0.12 ? 1 : 0);
  fireLight.intensity = (S.phys ? 3 : 2) * (0.85 + 0.15 * Math.sin(t * 31) * Math.sin(t * 17) + 0.9 * flare);
  for (const sp of flames) {
    const u = sp.userData, a = u.a + Math.sin(t * 2 + u.ph) * 0.05, h = (0.2 + 0.08 * Math.sin(t * 13 + u.ph) + 0.22 * flare) * u.s;
    const r = u.r + 0.08 * flare;
    sp.position.set(Math.cos(a) * r, -0.3 + h * 0.5 + surf(r * r) * 0.5, Math.sin(a) * r + pose.z * 0.5);
    sp.scale.set(0.2 * u.s, h, 1); sp.material.opacity = (S.phys ? 0.45 : 0.6) + 0.2 * Math.sin(t * 21 + u.ph);
  }
  // steam off the hot food
  for (const p of puffs) {
    const u = p.userData; u.t += dt; if (u.t > 2) { u.t = 0; u.x = rnd(-0.4, 0.4); u.z = rnd(-0.3, 0.3); }
    const k = u.t / 2; p.position.set((u.x || 0) + Math.sin(t + u.t * 3) * 0.05, 0.25 + k * 1.1, (u.z || 0)); p.scale.setScalar(0.25 + k * 0.6);
    p.material.opacity = (scn === "rice" ? 0.22 : 0.14) * Math.sin(Math.PI * k);
  }
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

for (const b of document.querySelectorAll("[data-style]")) b.onclick = () => build(b.dataset.style);
for (const b of document.querySelectorAll("[data-scene]")) b.onclick = () => { scn = b.dataset.scene; tossT0 = eggT0 = -9; resetFood(); for (const x of document.querySelectorAll("[data-scene]")) x.setAttribute("aria-pressed", x === b); };
document.getElementById("slow").onclick = (e) => { slow = slow === 1 ? 0.25 : 1; e.target.setAttribute("aria-pressed", slow !== 1); };
document.querySelector('[data-scene="rice"]').setAttribute("aria-pressed", "true");
build("B");
requestAnimationFrame(frame);
</script>
