<script>
/* core.js — shared constants, math, projection, colour ramps (see CONTRACT.md) */
"use strict";
(function () {
  const K = (window.KFR = window.KFR || {});
  const TAU = Math.PI * 2;
  K.TAU = TAU;
  K.G = 12;
  K.THETA = (35 * Math.PI) / 180; // view angle away from straight down (operator 10-23)
  K.RIM_H = 0.35;

  K.rnd = (a, b) => a + Math.random() * (b - a);
  K.clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  K.lerp = (a, b, k) => a + (b - a) * k;
  K.smooth = (k) => k * k * (3 - 2 * k);
  K.easeOutBack = (k) => 1 + 2.7 * Math.pow(k - 1, 3) + 1.7 * Math.pow(k - 1, 2);

  /* the wok floor: a shallow bowl, rim at r = 1 */
  K.surf = (u, v) => 0.35 * (u * u + v * v);
  /* slope of the floor at (u, v): what gravity pulls food along */
  K.slope = (u, v) => [0.7 * u, 0.7 * v];
  /* flame heat on the floor: hottest at the centre, cool at the rim */
  K.heat = (u, v) => Math.max(0.05, 1.18 - 0.65 * (u * u + v * v));

  K.view = function (W, H) {
    const R = W * 0.43, ct = Math.cos(K.THETA), st = Math.sin(K.THETA);
    return { W, H, R, ct, st, cx: W / 2, cy: H * 0.47, D: 0.35 * R * st };
  };
  K.restPose = () => ({ du: 0, dv: 0, lift: 0, lean: 0, t: 0 });

  /* world (u sideways, v depth, h height) -> screen px. The wok rim sits on the ellipse (cx, cy, R, R*ct).
     A point at height h is drawn (RIM_H - h) * R * st below the rim plane; above the rim, height reads
     a bit taller so tosses look generous. pose moves the whole wok. */
  K.proj = function (vw, pose, u, v, h) {
    const lean = 1 + (pose.lean || 0) * 0.12;
    const x = vw.cx + (u + (pose.du || 0)) * vw.R;
    let y = vw.cy - (v + (pose.dv || 0)) * vw.R * vw.ct * lean + (K.RIM_H - h - (pose.lift || 0)) * vw.R * vw.st;
    if (h > K.RIM_H) y -= (h - K.RIM_H) * vw.R * 0.15;
    return [x, y];
  };
  /* size multiplier for something at height h (closer to the camera = a touch bigger) */
  K.scaleAt = (h) => 1 + Math.max(0, h) * 0.55;

  /* ---------- colour ramps: raw -> glossy -> golden -> burnt ---------- */
  function ramp(stops) {
    return function (v) {
      if (v <= stops[0][0]) return stops[0][1];
      for (let i = 1; i < stops.length; i++)
        if (v <= stops[i][0]) {
          const [a, ca] = stops[i - 1], [b, cb] = stops[i], k = (v - a) / (b - a);
          return [ca[0] + (cb[0] - ca[0]) * k, ca[1] + (cb[1] - ca[1]) * k, ca[2] + (cb[2] - ca[2]) * k];
        }
      return stops[stops.length - 1][1];
    };
  }
  K.ramp = ramp;
  K.col = {
    /* art bible: raw #F4EEE2 -> sauced #E8743A -> glossy #F0552A -> golden #D98A2B -> burnt #5A2A14 -> char #231510 */
    rice: ramp([[0, [244, 238, 226]], [0.3, [232, 116, 58]], [0.75, [240, 85, 42]], [1.1, [217, 138, 43]], [1.3, [176, 98, 36]], [1.5, [90, 42, 20]], [1.75, [35, 21, 16]]]),
    kimchi: ramp([[0, [215, 38, 30]], [0.7, [200, 36, 28]], [1.1, [168, 35, 26]], [1.35, [120, 34, 22]], [1.55, [64, 28, 20]], [1.75, [35, 21, 16]]]),
    scallion: ramp([[0, [111, 191, 58]], [0.8, [92, 168, 52]], [1.3, [70, 112, 40]], [1.6, [48, 50, 30]], [1.8, [34, 30, 24]]]),
    eggWhite: ramp([[0, [236, 238, 232]], [0.7, [255, 255, 252]], [1.6, [252, 248, 238]], [2.4, [236, 226, 206]]]),
    eggEdge: ramp([[0, [255, 255, 255]], [0.8, [250, 244, 230]], [1.1, [238, 200, 132]], [1.5, [198, 130, 66]], [1.9, [112, 68, 42]], [2.4, [46, 37, 33]]]),
    eggUnder: ramp([[0, [252, 248, 240]], [0.6, [244, 216, 160]], [1.0, [228, 172, 98]], [1.4, [186, 118, 60]], [1.9, [98, 62, 42]], [2.4, [42, 34, 30]]]),
    yolk: ramp([[0, [255, 178, 28]], [1.2, [255, 170, 34]], [1.8, [240, 180, 80]], [2.4, [226, 186, 120]]]),
  };
  K.rgb = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
  K.gloss = (cook) => (cook < 0.4 || cook > 1.3 ? 0 : 0.6 * Math.sin((Math.PI * (cook - 0.4)) / 0.9));
  K.DPR = () => Math.min(1.5, window.devicePixelRatio || 1);   // 1.5 keeps a full-screen canvas at 60 fps on mid phones
  /* make an offscreen canvas of css size w x h at device pixel ratio, returns [canvas, ctx] */
  K.offscreen = function (w, h) {
    const cv = document.createElement("canvas"), d = K.DPR();
    cv.width = Math.max(1, Math.ceil(w * d)); cv.height = Math.max(1, Math.ceil(h * d));
    const c = cv.getContext("2d"); c.scale(d, d);
    return [cv, c];
  };

  /* scoring bands, shared by rice.js stats and the result slip */
  K.RICE_GOOD = [0.55, 1.3];
  K.EGG_GOOD = [0.6, 1.4];
})();

</script>
<script>
/* stage.js — counter, carbon-steel wok, handle, heat glow (art bible §2). Cached art, cheap per frame. */
"use strict";
(function () {
  const K = window.KFR, TAU = K.TAU;
  let counterCache = null, wokCache = null;

  function counter(W, H) {
    if (counterCache && counterCache.W === W && counterCache.H === H) return counterCache.cv;
    const [cv, c] = K.offscreen(W, H);
    const bg = c.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, "#E9EDF0"); bg.addColorStop(1, "#C3CBD2");
    c.fillStyle = bg; c.fillRect(0, 0, W, H);
    // subtle horizontal brushing
    for (let y = 0; y < H; y += 2) {
      c.fillStyle = `rgba(255,255,255,${0.05 + 0.1 * Math.abs(Math.sin(y * 12.9898) * 43758.5453 % 1)})`;
      c.fillRect(0, y, W, 1);
    }
    for (let i = 0; i < 40; i++) {
      c.fillStyle = "rgba(142,153,163,.08)";
      c.fillRect(0, Math.random() * H, W, 1);
    }
    // a vignette pulls the eye to the wok
    const vg = c.createRadialGradient(W / 2, H * 0.47, W * 0.3, W / 2, H * 0.47, H * 0.75);
    vg.addColorStop(0, "rgba(0,0,0,0)"); vg.addColorStop(1, "rgba(40,50,60,.22)");
    c.fillStyle = vg; c.fillRect(0, 0, W, H);
    counterCache = { W, H, cv };
    return cv;
  }

  /* the wok around its own rim centre; returns {cv, w, h, ox, oy} */
  function wokArt(vw) {
    if (wokCache && wokCache.R === vw.R) return wokCache;
    const R = vw.R, ct = vw.ct, D = vw.D, pad = 6;
    const w = R * 2.16 + pad * 2, top = R * 1.05 * ct + pad, h = top + R * ct * 1.25 + D * 1.7 + pad;
    const [cv, c] = K.offscreen(w, h);
    const cx = w / 2, cy = top;
    const wall = () => {
      c.beginPath(); c.moveTo(cx - R * 1.04, cy);
      c.bezierCurveTo(cx - R * 1.04, cy + R * ct * 1.25 + D * 1.6, cx + R * 1.04, cy + R * ct * 1.25 + D * 1.6, cx + R * 1.04, cy);
      c.closePath();
    };
    // outer wall: blue-black with a warm underglow from the fire
    const wg = c.createLinearGradient(cx - R, 0, cx + R, 0);
    wg.addColorStop(0, "#15181B"); wg.addColorStop(0.35, "#2A3440"); wg.addColorStop(0.7, "#1E2226"); wg.addColorStop(1, "#121416");
    c.fillStyle = wg; wall(); c.fill();
    const glow = c.createLinearGradient(0, cy, 0, cy + R * ct + D * 1.6);
    glow.addColorStop(0, "rgba(255,110,40,0)"); glow.addColorStop(0.6, "rgba(255,110,40,0)"); glow.addColorStop(1, "rgba(255,110,40,.15)");
    c.fillStyle = glow; wall(); c.fill();
    // rim ring
    c.fillStyle = "#3a434d"; c.beginPath(); c.ellipse(cx, cy, R * 1.045, R * 1.045 * ct, 0, 0, TAU); c.fill();
    c.strokeStyle = "#11141a"; c.lineWidth = 1; c.beginPath(); c.ellipse(cx, cy, R * 1.045, R * 1.045 * ct, 0, 0, TAU); c.stroke();
    c.strokeStyle = "rgba(201,211,220,.85)"; c.lineWidth = Math.max(1.2, R * 0.012);
    c.beginPath(); c.ellipse(cx, cy, R * 1.03, R * 1.03 * ct, 0, (200 / 180) * Math.PI, (340 / 180) * Math.PI); c.stroke();
    // interior: patina bowl
    const ig = c.createRadialGradient(cx - R * 0.05, cy + D * 0.55, R * 0.04, cx, cy + D * 0.3, R);
    ig.addColorStop(0, "#3A4350"); ig.addColorStop(0.6, "#2A3440"); ig.addColorStop(1, "#15181B");
    c.fillStyle = ig; c.beginPath(); c.ellipse(cx, cy, R * 0.98, R * 0.98 * ct, 0, 0, TAU); c.fill();
    c.save(); c.beginPath(); c.ellipse(cx, cy, R * 0.98, R * 0.98 * ct, 0, 0, TAU); c.clip();
    // straw/blue heat tint ring (seasoned carbon steel)
    const ht = c.createRadialGradient(cx, cy + D * 0.45, R * 0.5, cx, cy + D * 0.45, R * 0.85);
    ht.addColorStop(0, "rgba(59,74,107,0)"); ht.addColorStop(0.5, "rgba(59,74,107,.28)"); ht.addColorStop(0.8, "rgba(106,90,58,.22)"); ht.addColorStop(1, "rgba(106,90,58,0)");
    c.fillStyle = ht; c.fillRect(cx - R, cy - R, R * 2, R * 2);
    // faint seasoning rings
    c.strokeStyle = "rgba(255,255,255,.035)"; c.lineWidth = 1;
    for (const rr of [0.3, 0.55, 0.78]) { c.beginPath(); c.ellipse(cx, cy + D * (1 - rr) * 0.7, R * rr, R * rr * ct, 0, 0, TAU); c.stroke(); }
    // far inner wall catches the key light, plus a soft specular crescent upper-left
    const lw = c.createLinearGradient(0, cy - R * ct, 0, cy);
    lw.addColorStop(0, "rgba(255,255,255,.13)"); lw.addColorStop(1, "rgba(255,255,255,0)");
    c.fillStyle = lw; c.fillRect(cx - R, cy - R * ct, R * 2, R * ct);
    c.strokeStyle = "rgba(255,255,255,.12)"; c.lineWidth = R * 0.12; c.lineCap = "round";
    c.beginPath(); c.ellipse(cx, cy + D * 0.2, R * 0.78, R * 0.78 * ct, 0, Math.PI * 1.08, Math.PI * 1.32); c.stroke();
    c.restore();
    wokCache = { R, cv, w, h, ox: cx, oy: cy };
    return wokCache;
  }

  function handle(c, vw, x0, y0, H) {
    const R = vw.R, nw = R * 0.1;
    // steel neck + rivets
    c.fillStyle = "#4a5058";
    c.beginPath(); c.moveTo(x0 - nw * 0.5, y0); c.lineTo(x0 + nw * 0.5, y0); c.lineTo(x0 + nw * 0.62, y0 + R * 0.32); c.lineTo(x0 - nw * 0.62, y0 + R * 0.32); c.fill();
    c.fillStyle = "rgba(255,255,255,.18)"; c.fillRect(x0 - nw * 0.4, y0, nw * 0.18, R * 0.32);
    // wood grip, widening toward the viewer
    const y1 = y0 + R * 0.3, y2 = H + 12;
    const g = c.createLinearGradient(x0 - R * 0.2, 0, x0 + R * 0.2, 0);
    g.addColorStop(0, "#4a2a16"); g.addColorStop(0.4, "#A0673C"); g.addColorStop(0.62, "#8a5530"); g.addColorStop(1, "#3e2412");
    c.fillStyle = g; c.beginPath();
    c.moveTo(x0 - R * 0.09, y1); c.lineTo(x0 + R * 0.09, y1); c.lineTo(x0 + R * 0.17, y2); c.lineTo(x0 - R * 0.17, y2); c.closePath(); c.fill();
    c.strokeStyle = "rgba(60,30,12,.35)"; c.lineWidth = 1;
    for (let i = -2; i <= 2; i++) { c.beginPath(); c.moveTo(x0 + i * R * 0.025, y1 + 4); c.lineTo(x0 + i * R * 0.05, y2); c.stroke(); }
    c.fillStyle = "#c9ccd1";
    for (const yy of [y0 + R * 0.08, y0 + R * 0.24]) { c.beginPath(); c.arc(x0, yy, R * 0.022, 0, TAU); c.fill(); }
  }

  /* draws everything below the food: counter, burner glow, wok shadow, handle, wok body, live heat glow */
  K.Stage = {
    drawCounter(c, vw) { c.drawImage(counter(vw.W, vw.H), 0, 0, vw.W, vw.H); },
    drawUnderGlow(c, vw, flare) {
      const g = c.createRadialGradient(vw.cx, vw.cy + vw.D * 1.6, vw.R * 0.3, vw.cx, vw.cy + vw.D * 1.6, vw.R * 1.55);
      g.addColorStop(0, `rgba(255,120,40,${0.3 + 0.25 * Math.min(1, flare)})`); g.addColorStop(1, "rgba(255,120,40,0)");
      c.fillStyle = g; c.fillRect(0, 0, vw.W, vw.H);
    },
    drawWok(c, vw, pose, contact, fire) {
      const [cx, cy] = K.proj(vw, pose, 0, 0, K.RIM_H);
      // shadow stays on the burner; it shrinks when the wok lifts
      const sh = 1 - Math.min(0.25, (pose.lift || 0) * 2);
      c.fillStyle = "rgba(20,30,40,.2)"; c.beginPath();
      c.ellipse(vw.cx + vw.R * 0.05, vw.cy + vw.D * 2.1, vw.R * 0.95 * sh, vw.R * vw.ct * 0.9 * sh, 0, 0, TAU); c.fill();
      handle(c, vw, cx, cy + vw.R * vw.ct - 4, vw.H);
      const wa = wokArt(vw), lean = 1 + (pose.lean || 0) * 0.12;
      c.drawImage(wa.cv, cx - wa.ox, cy - wa.oy * lean, wa.w, wa.oy * lean + (wa.h - wa.oy));
      if (fire) { // the floor glows where food is on the metal
        c.save(); c.beginPath(); c.ellipse(cx, cy, vw.R * 0.97, vw.R * 0.97 * vw.ct * lean, 0, 0, TAU); c.clip();
        const g = c.createRadialGradient(cx, cy + vw.D * 0.5, vw.R * 0.05, cx, cy + vw.D * 0.5, vw.R * 0.8);
        g.addColorStop(0, `rgba(255,110,40,${0.05 + 0.15 * contact})`); g.addColorStop(1, "rgba(255,110,40,0)");
        c.fillStyle = g; c.fillRect(cx - vw.R, cy - vw.R, vw.R * 2, vw.R * 2); c.restore();
      }
    },
    /* rim highlight flash when food lands */
    flashRim(c, vw, pose, a) {
      if (a <= 0) return;
      const [cx, cy] = K.proj(vw, pose, 0, 0, K.RIM_H), lean = 1 + (pose.lean || 0) * 0.12;
      c.strokeStyle = `rgba(255,236,200,${a})`; c.lineWidth = 2;
      c.beginPath(); c.ellipse(cx, cy, vw.R * 1.03, vw.R * 1.03 * vw.ct * lean, 0, Math.PI, TAU); c.stroke();
    },
    reset() { counterCache = null; wokCache = null; },
  };
})();

</script>
<script>
/* fx.js — burner flames, rim flare, oil catch, steam, smoke, oil spatter, screen shake + KFR.Audio (see CONTRACT.md) */
"use strict";
(function () {
  const K = window.KFR, TAU = K.TAU, rnd = K.rnd, clamp = K.clamp;

  /* ---------- sprites: rendered once, only drawImage per frame ---------- */
  const FW = 48, FH = 128; // flame sprite css px; the base sits at the bottom centre
  let SPR = null;

  /* teardrop tongue with a hooked tip; curl < 0 hooks left, > 0 right */
  function flameSprite(curl, blue) {
    const [cv, c] = K.offscreen(FW, FH);
    const bx = FW / 2, by = FH - 3;
    const tongue = (w, h, lift, fill, alpha) => {
      const b = by - lift, tx = bx + curl * w * 0.95, ty = by - h;
      c.globalAlpha = alpha;
      c.beginPath(); c.moveTo(bx, b);
      c.bezierCurveTo(bx - w * 0.68, b + 1, bx - w * (0.5 - curl * 0.25), b - h * 0.5, tx, ty);
      c.bezierCurveTo(bx + w * (0.3 + curl * 0.35), b - h * 0.48, bx + w * 0.68, b + 1, bx, b);
      c.fillStyle = fill; c.fill();
    };
    const h = FH - 8, w = FW * 0.72;
    const g = c.createLinearGradient(0, by, 0, by - h);
    if (blue) { g.addColorStop(0, "rgba(47,107,255,.95)"); g.addColorStop(0.1, "rgba(127,180,255,.95)"); g.addColorStop(0.2, "#FF7A1A"); }
    else { g.addColorStop(0, "rgba(255,122,26,0)"); g.addColorStop(0.18, "#FF7A1A"); }
    g.addColorStop(0.75, "#FF8A24"); g.addColorStop(1, "rgba(255,110,20,.7)");
    c.shadowColor = "rgba(255,110,30,.6)"; c.shadowBlur = 9;
    tongue(w, h, 0, g, 1);
    c.shadowBlur = 0;
    tongue(w * 0.66, h * 0.7, h * 0.11, "#FFC24A", 1);
    c.globalCompositeOperation = "lighter";
    tongue(w * 0.36, h * 0.42, h * 0.15, "#FFF2C2", 0.75);
    return cv;
  }
  function softSprite(r, g, b, a0) {
    const [cv, c] = K.offscreen(64, 64);
    const gr = c.createRadialGradient(32, 32, 0, 32, 32, 32);
    gr.addColorStop(0, `rgba(${r},${g},${b},${a0})`); gr.addColorStop(0.3, `rgba(${r},${g},${b},${a0 * 0.7})`); gr.addColorStop(0.65, `rgba(${r},${g},${b},${a0 * 0.2})`); gr.addColorStop(1, `rgba(${r},${g},${b},0)`);
    c.fillStyle = gr; c.fillRect(0, 0, 64, 64);
    return cv;
  }
  /* smoke: a lumpy billow of overlapping blobs, so it reads as curling smoke, not a steam disc */
  function billowSprite(r, g, b) {
    const [cv, c] = K.offscreen(96, 96);
    const blobs = [[48, 52, 26], [34, 58, 18], [62, 60, 20], [42, 38, 17], [58, 36, 15], [50, 66, 16]];
    for (const [x, y, rr] of blobs) {
      const gr = c.createRadialGradient(x - rr * 0.25, y - rr * 0.3, 0, x, y, rr);
      gr.addColorStop(0, `rgba(${r + 22},${g + 20},${b + 18},.55)`); gr.addColorStop(0.7, `rgba(${r},${g},${b},.35)`); gr.addColorStop(1, `rgba(${r},${g},${b},0)`);
      c.fillStyle = gr; c.beginPath(); c.arc(x, y, rr, 0, TAU); c.fill();
    }
    return cv;
  }
  function sprites() {
    if (SPR) return SPR;
    // smoke shades: light warm grey (just burning) -> art bible #4A4440 -> #2A2624 (charcoal)
    const smoke = [[168, 160, 152], [138, 128, 120], [104, 96, 90], [74, 68, 64]].map((s) => billowSprite(s[0], s[1], s[2]));
    SPR = {
      burner: [-0.32, 0.12, 0.38].map((k) => flameSprite(k, true)),
      lick: [-0.3, 0.3].map((k) => flameSprite(k, false)),
      steam: softSprite(255, 255, 255, 1),
      glow: softSprite(255, 160, 60, 1),
      dot: softSprite(255, 236, 190, 1),
      smoke,
    };
    return SPR;
  }

  /* ---------- state ---------- */
  const N_TONGUE = 16, MAX_STEAM = 36, MAX_SMOKE = 56, MAX_SPAT = 48;
  // burner ring in units of R relative to the rim centre (cx, cy); tuned against stage.js wok silhouette
  const RING = { rx: 0.74, ry: 0.15, y: 0.84, ht: 0.7, wd: 0.27, lean: 0.68 };

  function create() {
    const tongues = [];
    for (let i = 0; i < N_TONGUE; i++) {
      const a = (TAU * (i + rnd(-0.3, 0.3))) / N_TONGUE;
      const side = Math.abs(Math.cos(a)); // side tongues are the visible ones: make them the big ones
      tongues.push({ a, size: rnd(0.75, 1.05) + 0.25 * side, spr: i % 3, flip: Math.random() < 0.5,
        f1: rnd(7, 10), f2: rnd(13, 19), p1: rnd(0, TAU), p2: rnd(0, TAU) });
    }
    tongues.sort((p, q) => Math.sin(p.a) - Math.sin(q.a)); // far first
    // near-wall tongues: spread along the lower arc of the wok's outer wall (bezier t), gap where the handle neck is
    const near = [];
    for (let i = 0; i < 16; i++) {
      let t = 0.1 + (0.8 * (i + rnd(0.15, 0.85))) / 16;
      if (Math.abs(t - 0.5) < 0.05) t += t < 0.5 ? -0.05 : 0.05;
      near.push({ t, size: rnd(0.65, 1.15), spr: i % 3, flip: Math.random() < 0.5,
        f1: rnd(8, 11), f2: rnd(14, 20), p1: rnd(0, TAU), p2: rnd(0, TAU) });
    }
    const licks = [];
    for (let i = 0; i < 6; i++) licks.push({ phi: Math.PI * (0.18 + (0.64 * i) / 5) + rnd(-0.1, 0.1), size: rnd(0.6, 1.25),
      spr: i % 2, f1: rnd(9, 13), p1: rnd(0, TAU), delay: rnd(0, 0.3), lean: rnd(-0.25, 0.25) });
    return { t: 0, flare: 0, flareLevel: 0, oil: null, tongues, near, licks, parts: [], spat: [],
      shake: { x: 0, y: 0 }, amp: 0, haze: 0, rimDrawn: false };
  }

  function kick(s, px) { s.amp = Math.min(4, Math.max(s.amp, px)); }

  function flare(s, strength) {
    const k = clamp((strength || 1) * 0.75, 0.2, 1);
    s.flare = Math.max(s.flare, k);
    kick(s, 1.6 + 0.9 * k);
  }
  function oilCatch(s, strength) {
    s.oil = { t: 0, dur: 0.35, k: clamp(strength || 1, 0.6, 1.4) };
    kick(s, 3);
  }
  /* hot oil pops where food lands; a landing also nudges the screen */
  function spatter(s, u, v, n) {
    n = Math.min(n || 6, 16);
    for (let i = 0; i < n && s.spat.length < MAX_SPAT; i++) {
      const a = rnd(0, TAU), sp = rnd(0.4, 1.4);
      s.spat.push({ u: u + rnd(-0.08, 0.08), v: v + rnd(-0.08, 0.08), h: K.surf(u, v) + 0.03,
        du: Math.cos(a) * sp, dv: Math.sin(a) * sp, dh: rnd(0.8, 2.2), age: rnd(-0.04, 0), life: 0.12, r: rnd(1, 1.5) });
    }
    if (n >= 6) kick(s, Math.min(2, n * 0.15));
  }

  function update(s, dt, ctx) {
    ctx = ctx || {};
    s.t += dt;
    if (ctx.flare > 0) s.flare = Math.max(s.flare, ctx.flare);
    s.flare = Math.max(0, s.flare - dt * 3.2); // ~0.3 s jump
    s.flareLevel = s.flare;
    if (s.oil && (s.oil.t += dt) > s.oil.dur) s.oil = null;
    s.rimDrawn = false;
    s.burner = false;
    // shake: decaying wobble, two incommensurate sines so it never looks like a loop
    s.amp *= Math.exp(-dt * 11);
    if (s.amp < 0.05) s.amp = 0;
    s.shake.x = s.amp * Math.sin(s.t * 71); s.shake.y = s.amp * Math.cos(s.t * 57);
    s.haze += (clamp(((ctx.burning || 0) - 0.08) * 1.6, 0, 1) - s.haze) * Math.min(1, dt * 1.5);

    // steam vs smoke from the hotspots. Emitters live in wok space; particles are handed off to the air at spawn.
    const hs = ctx.steam || [], pose = ctx.wokPose || K.restPose();
    let nSteam = 0, nSmoke = 0;
    for (const p of s.parts) p.smoke ? nSmoke++ : nSteam++;
    for (const h of hs) {
      const cook = h.cook || 0;
      if (cook < 0.95) {
        if (nSteam < MAX_STEAM && Math.random() < dt * (0.5 + 1.1 * Math.min(1, cook + 0.3))) {
          nSteam++; s.parts.push({ smoke: false, u: h.u, v: h.v, h: h.h || 0, pose, x: 0, y: 0, born: false,
            vx: rnd(-0.08, 0.08), vy: rnd(0.9, 1.2), r0: rnd(0.05, 0.07), r1: rnd(0.15, 0.21), age: 0, life: rnd(0.7, 0.85), ph: rnd(0, TAU), rot: 0 });
        }
      } else {
        const dark = clamp((cook - 0.95) / 0.8, 0, 1);
        if (nSmoke < MAX_SMOKE && Math.random() < dt * (0.8 + 4 * dark)) {
          nSmoke++; s.parts.push({ smoke: true, dark, u: h.u, v: h.v, h: h.h || 0, pose, x: 0, y: 0, born: false,
            vx: rnd(-0.05, 0.05), vy: rnd(0.4, 0.55), r0: rnd(0.1, 0.14), r1: rnd(0.45, 0.65), age: 0, life: rnd(1.7, 2.2),
            ph: rnd(0, TAU), rot: rnd(0, TAU), spin: rnd(-0.6, 0.6) });
        }
      }
    }
    for (let i = s.parts.length - 1; i >= 0; i--) {
      const p = s.parts[i];
      if ((p.age += dt) > p.life) { s.parts[i] = s.parts[s.parts.length - 1]; s.parts.pop(); }
    }
    for (let i = s.spat.length - 1; i >= 0; i--) {
      const p = s.spat[i];
      p.age += dt;
      if (p.age > p.life) { s.spat[i] = s.spat[s.spat.length - 1]; s.spat.pop(); continue; }
      if (p.age > 0) { p.u += p.du * dt; p.v += p.dv * dt; p.h += p.dh * dt; p.dh -= K.G * dt; }
    }
  }

  /* one tongue: base at (x, y), leaning by `lean` rad */
  function tongue(c, img, x, y, w, h, lean, flip, alpha) {
    c.save(); c.translate(x, y); c.rotate(lean); if (flip) c.scale(-1, 1);
    c.globalAlpha = alpha; c.drawImage(img, -w / 2, -h, w, h); c.restore();
  }

  /* burner ring under the wok: drawn before the wok body, so only what rises past its wall shows */
  function drawBehind(c, s, vw) {
    s.burner = true;
    const S = sprites(), R = vw.R, t = s.t, f = s.flare;
    const by = vw.cy + RING.y * R;
    for (const q of s.tongues) {
      const ca = Math.cos(q.a), sa = Math.sin(q.a);
      const flick = 0.8 + 0.13 * Math.sin(q.f1 * t + q.p1) + 0.08 * Math.sin(q.f2 * t + q.p2);
      const h = R * RING.ht * q.size * flick * (1 + 0.85 * f), w = R * RING.wd * q.size * (1 + 0.2 * f) * (1.1 - 0.15 * flick);
      const sway = 0.06 * Math.sin(q.f2 * 0.5 * t + q.p1);
      tongue(c, S.burner[q.spr], vw.cx + ca * RING.rx * R, by + sa * RING.ry * R, w, h, ca * RING.lean * (1 - 0.15 * f) + sway, q.flip, 1);
    }
    c.globalAlpha = 1;
  }

  /* tongues licking up the near wall from below: in front of the wall, under the rim line (the wall silhouette
     is stage.js's bezier: rim corners at x = +-1.04R, control depth B) */
  function drawNear(c, s, vw) {
    const S = sprites(), R = vw.R, t = s.t, f = s.flare, B = R * vw.ct * 1.25 + vw.D * 1.6;
    for (const q of s.near) {
      const k = q.t, m = 1 - k;
      const x = vw.cx + 1.04 * R * (-m * m * m - 3 * m * m * k + 3 * m * k * k + k * k * k);
      const y = vw.cy + 3 * B * k * m + R * 0.05;
      const flick = 0.8 + 0.13 * Math.sin(q.f1 * t + q.p1) + 0.08 * Math.sin(q.f2 * t + q.p2);
      const h = R * 0.3 * q.size * flick * (1 + 0.7 * f), w = R * 0.15 * q.size * (1 + 0.15 * f);
      tongue(c, S.burner[q.spr], x, y, w, h, ((x - vw.cx) / R) * 0.55, q.flip, 1);
    }
    c.globalAlpha = 1;
  }

  /* flare tongues licking up over the far rim; between the wok and the food if the game calls it, else in drawFront */
  function drawRim(c, s, vw, pose) {
    s.rimDrawn = true;
    if (s.flare < 0.05) return;
    const S = sprites(), R = vw.R;
    for (const q of s.licks) {
      const e = K.smooth(clamp(s.flare * 1.5 - q.delay, 0, 1));
      if (e <= 0) continue;
      const [x, y] = K.proj(vw, pose, Math.cos(q.phi) * 1.03, Math.sin(q.phi) * 1.03, K.RIM_H);
      const flick = 0.85 + 0.15 * Math.sin(q.f1 * s.t + q.p1);
      const h = R * 0.5 * q.size * flick * e, w = R * 0.27 * q.size * (0.6 + 0.4 * e);
      tongue(c, S.lick[q.spr], x, y + h * 0.15, w, h, -Math.cos(q.phi) * 0.5 + q.lean, false, Math.min(1, e * 1.3));
    }
    c.globalAlpha = 1;
  }

  /* rim flare (if not drawn yet), oil-catch fireball, steam, smoke, spatter: after the food */
  function drawFront(c, s, vw, pose) {
    const S = sprites(), R = vw.R;
    if (!s.rimDrawn) drawRim(c, s, vw, pose);
    if (s.burner !== false) drawNear(c, s, vw);
    if (s.oil) {
      const k = s.oil.t / s.oil.dur, e = (k < 0.2 ? K.smooth(k / 0.2) : 1 - K.smooth((k - 0.2) / 0.8)) * s.oil.k;
      const [x, y] = K.proj(vw, pose, 0, 0.05, 0.1);
      c.globalCompositeOperation = "lighter";
      const gr = R * 1.05 * e;
      c.globalAlpha = 0.7; c.drawImage(S.glow, x - gr, y - gr * 0.8, gr * 2, gr * 1.6);
      c.globalCompositeOperation = "source-over";
      for (let i = 0; i < 6; i++) { // outer tongues first, the tall centre one last
        const a = i * 2.4, rr = i === 5 ? 0 : 0.16 + 0.06 * (i % 2);
        const [tx, ty] = K.proj(vw, pose, Math.cos(a) * rr, Math.sin(a) * rr * 0.8 + 0.05, 0.12);
        const sz = (i === 5 ? 1.25 : 0.8) * (0.9 + 0.12 * Math.sin(i * 1.7 + s.oil.t * 30));
        tongue(c, S.lick[i % 2], tx, ty, R * 0.5 * e * sz, R * 0.8 * e * sz, Math.cos(a) * rr * 2.2, i % 2 === 0, Math.min(1, e * 1.4));
      }
      c.globalAlpha = 1;
    }
    // steam and smoke: spawn point projected once, then they drift in screen space
    for (const p of s.parts) {
      if (!p.born) { const [x, y] = K.proj(vw, p.pose, p.u, p.v, p.h + 0.05); p.x = x; p.y = y; p.born = true; p.pose = null; }
      const k = p.age / p.life, a = p.age;
      const x = p.x + (p.vx * a + (p.smoke ? Math.sin(a * 1.7 + p.ph) * 0.06 * (0.3 + k) : Math.sin(a * 5 + p.ph) * 0.015)) * R;
      const y = p.y - p.vy * R * a * (p.smoke ? 1 : 1 - 0.35 * k);
      const r = R * (p.r0 + (p.r1 - p.r0) * Math.sqrt(k));
      const fade = Math.min(1, p.age * (p.smoke ? 3 : 8)) * (1 - k);
      if (p.smoke) {
        c.globalAlpha = Math.min(0.35, (0.24 + 0.11 * p.dark) * fade * 1.6);
        c.save(); c.translate(x, y); c.rotate(p.rot + p.spin * a);
        c.drawImage(S.smoke[Math.min(3, (p.dark * 4) | 0)], -r, -r, r * 2, r * 2); c.restore();
      } else {
        c.globalAlpha = 0.34 * fade;
        c.drawImage(S.steam, x - r * 0.7, y - r * 1.1, r * 1.4, r * 2.2); // tall wisp
      }
    }
    // oil spatter: hot-white pops, 120 ms
    for (const p of s.spat) {
      if (p.age < 0) continue;
      const k = p.age / p.life, [x, y] = K.proj(vw, pose, p.u, p.v, p.h), r = p.r * (1 + 0.7 * k);
      c.globalAlpha = (1 - k * k) * 0.6; c.drawImage(S.dot, x - r * 3, y - r * 3, r * 6, r * 6);
      c.globalAlpha = 1 - k * k; c.fillStyle = "#FFFBF0"; c.fillRect(x - r, y - r, r * 2, r * 2);
    }
    c.globalAlpha = 1;
  }

  K.Fx = { create, update, flare, oilCatch, spatter, kick, drawBehind, drawRim, drawFront };

  /* ================= KFR.Audio: Web Audio, all procedural ================= */
  const A = { ctx: null, out: null, muted: false, noise: null, crackle: null, siz: null, warn: null };

  function makeBuffers(ac) {
    const sr = ac.sampleRate, mk = (sec) => ac.createBuffer(1, Math.floor(sr * sec), sr);
    A.noise = mk(2); const n = A.noise.getChannelData(0);
    for (let i = 0; i < n.length; i++) n[i] = Math.random() * 2 - 1;
    // sizzle bed: hiss with a slow random swell plus dense tiny pops
    A.sizz = mk(3); const z = A.sizz.getChannelData(0);
    let env = 0.5, tgt = 0.5, pop = 0, popA = 0;
    for (let i = 0; i < z.length; i++) {
      if (i % 600 === 0) tgt = rnd(0.25, 0.8);
      env += (tgt - env) * 0.002;
      if (Math.random() < 0.0016) { pop = 1; popA = rnd(0.4, 1); }
      pop *= 0.93;
      z[i] = (Math.random() * 2 - 1) * (env * 0.55 + pop * popA * 1.4);
    }
    // crackle: sparse sharp clicks only (burn warning, rice landing)
    A.crackle = mk(2); const k = A.crackle.getChannelData(0);
    let cl = 0, clA = 0;
    for (let i = 0; i < k.length; i++) {
      if (Math.random() < 0.0009) { cl = 1; clA = rnd(0.3, 1); }
      cl *= 0.9;
      k[i] = (Math.random() * 2 - 1) * cl * clA;
    }
  }

  /* a looping bed: src -> highpass -> lowpass -> gain(0) -> out */
  function bed(buf, hp, lp, rate) {
    const ac = A.ctx, src = ac.createBufferSource(), h = ac.createBiquadFilter(), l = ac.createBiquadFilter(), g = ac.createGain();
    src.buffer = buf; src.loop = true; src.playbackRate.value = rate;
    h.type = "highpass"; h.frequency.value = hp; l.type = "lowpass"; l.frequency.value = lp; g.gain.value = 0;
    src.connect(h); h.connect(l); l.connect(g); g.connect(A.out); src.start();
    return { g, l, level: 0 };
  }

  function unlock() {
    try {
      try { if (navigator.audioSession) navigator.audioSession.type = "playback"; } catch (e) {}
      if (!A.ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        const ac = (A.ctx = new AC());
        const comp = ac.createDynamicsCompressor();
        comp.threshold.value = -14; comp.ratio.value = 4;
        A.out = ac.createGain(); A.out.gain.value = A.muted ? 0 : 0.9;
        A.out.connect(comp); comp.connect(ac.destination);
        makeBuffers(ac);
        A.siz = bed(A.sizz, 1500, 6000, 1);
        A.warn = bed(A.crackle, 900, 4500, 0.8);
        // iOS: play something inside the gesture
        const s = ac.createBufferSource(); s.buffer = ac.createBuffer(1, 1, ac.sampleRate); s.connect(ac.destination); s.start();
      }
      if (A.ctx.state !== "running") A.ctx.resume();
    } catch (e) {}
  }

  /* everything below no-ops before unlock and swallows errors: sound must never break the game */
  const safe = (fn) => function () { if (!A.ctx) return; try { fn.apply(null, arguments); } catch (e) {} };
  const now = () => A.ctx.currentTime;

  /* filtered noise burst with a frequency sweep and an attack/decay envelope */
  function burst(o) {
    const ac = A.ctx, t = now() + (o.at || 0), d = o.dur;
    const src = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    src.buffer = o.buf || A.noise; src.playbackRate.value = o.rate || 1;
    f.type = o.type || "bandpass"; f.Q.value = o.q || 1;
    f.frequency.setValueAtTime(o.f0, t); f.frequency.exponentialRampToValueAtTime(o.f1 || o.f0, t + d);
    const at = o.attack || 0.004;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(o.gain, t + at); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    src.connect(f); f.connect(g); g.connect(A.out);
    src.start(t, Math.random() * (src.buffer.duration - d - 0.1)); src.stop(t + d + 0.05);
  }
  function tone(o) {
    const ac = A.ctx, t = now() + (o.at || 0), d = o.dur, osc = ac.createOscillator(), g = ac.createGain();
    osc.type = o.type || "sine";
    osc.frequency.setValueAtTime(o.f0, t); osc.frequency.exponentialRampToValueAtTime(o.f1 || o.f0, t + d);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(o.gain, t + (o.attack || 0.003)); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    osc.connect(g); g.connect(A.out); osc.start(t); osc.stop(t + d + 0.05);
  }

  K.Audio = {
    unlock,
    /* main heat cue: louder and brighter with food on the metal; drops fast when it all goes airborne */
    sizzle: safe((level) => {
      const l = clamp(+level || 0, 0, 1), b = A.siz;
      if (Math.abs(l - b.level) < 0.01) return;
      const tau = l < b.level ? 0.035 : 0.08;
      b.level = l;
      b.g.gain.setTargetAtTime(0.42 * Math.pow(l, 1.3), now(), tau);
      b.l.frequency.setTargetAtTime(2200 + 7500 * l, now(), tau);
    }),
    toss: safe((strength, snap) => {
      const s = clamp((strength || 1) / 1.6, 0.15, 1), p = clamp(snap || 0, 0, 1);
      burst({ f0: 320, f1: 1500 + 900 * s, q: 1.1, dur: 0.2 + 0.12 * s, gain: 0.4 * s, attack: 0.07 }); // whoosh
      burst({ f0: 2400, f1: 3900, q: 9, dur: 0.08 + 0.07 * p, gain: 0.16 + 0.22 * p, at: 0.01 }); // scrape on the burner ring
      tone({ f0: 1870, dur: 0.3, gain: 0.03 + 0.05 * p, type: "triangle", at: 0.01 }); // steel ring
      tone({ f0: 2950, dur: 0.18, gain: 0.02 + 0.03 * p, type: "sine", at: 0.01 });
    }),
    land: safe((kind) => {
      if (kind === "egg-soft") {
        tone({ f0: 190, f1: 85, dur: 0.13, gain: 0.35 });
        burst({ type: "lowpass", f0: 1000, f1: 280, dur: 0.12, gain: 0.3 });
        burst({ buf: A.sizz, type: "highpass", f0: 3000, dur: 0.35, gain: 0.25, at: 0.03, attack: 0.03 });
      } else if (kind === "egg-splat") {
        burst({ type: "lowpass", f0: 2000, f1: 240, q: 2, dur: 0.24, gain: 0.55, attack: 0.002 });
        tone({ f0: 120, f1: 55, dur: 0.16, gain: 0.4 });
        for (let i = 0; i < 3; i++) tone({ f0: rnd(650, 950), f1: rnd(260, 340), dur: 0.05, gain: 0.1, at: 0.03 + i * rnd(0.03, 0.06) });
      } else if (kind === "spill") {
        for (let i = 0; i < 9; i++) burst({ f0: rnd(2800, 5200), q: 5, dur: 0.025, gain: rnd(0.12, 0.28), at: rnd(0, 0.45), attack: 0.001 });
      } else { // rice: a crackling burst of contact
        burst({ buf: A.crackle, type: "highpass", f0: 2200, f1: 3800, dur: 0.4, gain: 0.9, rate: rnd(1.1, 1.4), attack: 0.003 });
        burst({ buf: A.sizz, type: "highpass", f0: 3500, dur: 0.3, gain: 0.3, attack: 0.01 });
        tone({ f0: 150, f1: 75, dur: 0.07, gain: 0.15 });
      }
    }),
    flare: safe(() => { // gas whoomph
      burst({ type: "lowpass", f0: 160, f1: 1100, q: 1.5, dur: 0.5, gain: 0.6, attack: 0.05 });
      tone({ f0: 75, f1: 42, dur: 0.45, gain: 0.3, attack: 0.03 });
    }),
    ding: safe(() => { // kitchen-timer bell: inharmonic partials
      [[1, 0.28], [2, 0.1], [2.76, 0.08], [5.4, 0.03]].forEach(([m, g]) => tone({ f0: 1320 * m, dur: 1.4 / Math.sqrt(m), gain: g }));
    }),
    stamp: safe(() => {
      tone({ f0: 115, f1: 45, dur: 0.22, gain: 0.6 });
      burst({ type: "lowpass", f0: 1400, f1: 200, dur: 0.08, gain: 0.5, attack: 0.001 });
    }),
    burnWarn: safe((level) => {
      const l = clamp(+level || 0, 0, 1), b = A.warn;
      if (Math.abs(l - b.level) < 0.01) return;
      b.level = l;
      b.g.gain.setTargetAtTime(0.5 * l, now(), 0.25);
    }),
    mute: (m) => {
      A.muted = !!m;
      try { if (A.ctx) A.out.gain.setTargetAtTime(A.muted ? 0 : 0.9, now(), 0.03); } catch (e) {}
    },
  };
})();

<script>
/* input.js — devicemotion flick + tilt, pointer fallback (input; spec: research/input.md, API: CONTRACT.md) */
"use strict";
(function () {
  const K = (window.KFR = window.KFR || {});
  const clamp01 = (x) => (x < 0 ? 0 : x > 1 ? 1 : x);
  const clamp1 = (x) => (x < -1 ? -1 : x > 1 ? 1 : x);

  /* motion constants (research/input.md §3, est — tune on a phone with ?debug + KFR.Input.debug) */
  const TAU_G = 0.2, A_ON_MIN = 6, A_OFF = 2, A_MAX = 25, W_ON = 200, PULSE_MAX = 250;
  const RISE_FAST = 40, RISE_SLOW = 180, K_ROT = 0.02, REFRACT = 300, CAL_MS = 1000, PROBE_MS = 1000;
  /* tilt (§4) */
  const DEAD = 0.035, FULL = 0.35, TILT_TAU = 80, FREEZE = 250;
  /* touch: speeds in screen heights per second */
  const T_ON = 0.8, T_MAX = 3.5, T_RISE_FAST = 30, T_RISE_SLOW = 220, T_MIN_TRAVEL = 0.03;
  const HINT = "Safari/Chrome에서 열면 폰을 흔들어서 할 수 있어요";

  const I = (K.Input = {
    mode: "touch", hint: "", debug: {}, onResultFlick: null,
    start, requestPermission, useTouch, demoTilt, armAfterRelease,
    _feed: (e) => { started = true; onMotion(e); },
  });

  let onFlickCb = null, appEl = null, started = false;

  /* ---------- tilt: targets set by motion / touch / demo, EMA applied when the game polls ---------- */
  const tilt = { u: 0, v: 0 };
  let tu = 0, tv = 0, tiltLast = 0;
  Object.defineProperty(I, "tilt", {
    get() {
      const now = performance.now(), dt = tiltLast ? now - tiltLast : 1000;
      tiltLast = now;
      const k = 1 - Math.exp(-dt / TILT_TAU);
      tilt.u += (tu - tilt.u) * k; tilt.v += (tv - tilt.v) * k;
      return tilt;
    },
  });
  function demoTilt(u, v) { if (!started) { tu = u; tv = v; } }

  /* ---------- flick out ---------- */
  function emit(f) {
    I.debug.last = f;
    try { navigator.vibrate && navigator.vibrate(15); } catch (e) {}
    const st = K.Game && K.Game.state;
    if (st && st.phase === "result") { I.onResultFlick && I.onResultFlick(); return; }
    onFlickCb && onFlickCb(f);
  }

  /* ---------- motion ---------- */
  let g = null, g0 = null, sgn = 1, lastT = 0, aOn = A_ON_MIN;
  let cal = null;            // {t0, n, gx, gy, gz, m, m2} while calibrating
  let pulse = null, quietT = 0, lastFlick = -1e9, frozenUntil = 0, quietUntil = 0;
  let gotMotion = false, probeDone = null;

  function onMotion(e) {
    const a = e.accelerationIncludingGravity;
    if (!a || a.x == null) return;
    if (!gotMotion) { gotMotion = true; I.mode = "motion"; probeDone && probeDone(); }
    const t = e.timeStamp;
    const dt = g ? Math.min(0.1, Math.max(0.001, (t - lastT) / 1000)) : 0;
    lastT = t;
    // device -> screen frame (layout may have auto-rotated). iOS reports aIG with the opposite sign to the spec on some
    // versions: face-up z must be +g, so take the sign from the first sample.
    const ang = ((screen.orientation && screen.orientation.angle) || window.orientation || 0) * Math.PI / 180;
    const ca = Math.cos(ang), sa = Math.sin(ang);
    const rot = (x, y) => [x * ca - y * sa, x * sa + y * ca];
    if (!g) sgn = a.z < -4 ? -1 : 1;
    const [ax, ay] = rot(a.x * sgn, a.y * sgn), az = a.z * sgn;
    if (!g) { g = [ax, ay, az]; g0 = g.slice(); cal = { t0: t, n: 0, gx: 0, gy: 0, gz: 0, m: 0, m2: 0 }; }
    const k = dt / (TAU_G + dt);
    g[0] += (ax - g[0]) * k; g[1] += (ay - g[1]) * k; g[2] += (az - g[2]) * k;
    const ac = e.acceleration;
    let lx, ly, lz;
    if (ac && ac.x != null) { [lx, ly] = rot(ac.x * sgn, ac.y * sgn); lz = ac.z * sgn; }
    else { lx = ax - g[0]; ly = ay - g[1]; lz = az - g[2]; }
    const m = Math.hypot(lx, ly, lz);
    const rr = e.rotationRate;
    const [pitch, roll] = rr && rr.beta != null ? rot(rr.beta, rr.gamma) : [0, 0]; // about screen x (far lip up +), y

    if (cal) {
      cal.n++; cal.gx += g[0]; cal.gy += g[1]; cal.gz += g[2]; cal.m += m; cal.m2 += m * m;
      if (t - cal.t0 >= CAL_MS) {
        const n = cal.n, mu = cal.m / n, sd = Math.sqrt(Math.max(0, cal.m2 / n - mu * mu));
        g0 = [cal.gx / n, cal.gy / n, cal.gz / n]; aOn = Math.max(A_ON_MIN, mu + 6 * sd);
        I.debug.cal = { mu: +mu.toFixed(3), sd: +sd.toFixed(3), aOn: +aOn.toFixed(2), g0: g0.map((x) => +x.toFixed(2)) };
        cal = null;
      }
    }

    // flick pulse (§3)
    if (!pulse && m < A_OFF) quietT = t;
    const gate = m > aOn || Math.abs(pitch) > W_ON;
    if (gate && t < quietUntil) quietUntil = t + 400; // armAfterRelease: wait for 400 ms of calm
    if (!pulse && gate && t - lastFlick > REFRACT) {
      pulse = { t0: t, tq: quietT, peak: m, tPeak: t, ix: 0, iy: 0, rx: 0, ry: 0 };
      frozenUntil = t + FREEZE;
    }
    if (pulse) {
      const p = pulse;
      if (m > p.peak) { p.peak = m; p.tPeak = t; }
      p.ix += lx * dt; p.iy += ly * dt; p.rx += pitch * dt; p.ry += roll * dt;
      const fell = m < A_OFF || (p.peak > aOn && m < 0.5 * p.peak);
      if ((t > p.t0 && fell && Math.abs(pitch) < W_ON) || t - p.t0 > PULSE_MAX) {
        pulse = null; lastFlick = t;
        const s01 = clamp01((p.peak - aOn) / (A_MAX - aOn));
        const rise = p.tPeak - p.tq; // from leaving the noise floor, not from the gate: a slow push crosses A_ON late
        const snap = clamp01(1 - (rise - RISE_FAST) / (RISE_SLOW - RISE_FAST));
        let dx = p.ix + K_ROT * p.ry, dy = p.iy + K_ROT * p.rx;
        const n = Math.hypot(dx, dy);
        if (n < 0.25) { dx = 0; dy = 1; } else { dx /= n; dy /= n; } // mostly vertical pop: forward
        I.debug.peak = +p.peak.toFixed(2); I.debug.rise = Math.round(rise); I.debug.dir = [+dx.toFixed(2), +dy.toFixed(2)];
        I.debug.rejected = s01 < 0.2 && snap < 0.1;
        if (!I.debug.rejected && started && t >= quietUntil)
          emit({ strength: 0.3 + 1.3 * s01, snap, dirU: dx, dirV: dy });
      }
    }

    // tilt from gravity delta (§4): + u = right side lower (g leans to -x), + v = far side lower (g leans to -y)
    if (t >= frozenUntil) {
      const zone = (x) => Math.sign(x) * clamp01((Math.abs(x) - DEAD) / (FULL - DEAD));
      tu = zone(-(g[0] - g0[0]) / 9.81); tv = zone(-(g[1] - g0[1]) / 9.81);
    }
  }

  /* ---------- touch / mouse ---------- */
  let ptr = null, blockUntilUp = false;
  function onDown(e) {
    if (I.mode !== "touch" || ptr) return;
    const r = appEl.getBoundingClientRect();
    ptr = { id: e.pointerId, x0: e.clientX, y0: e.clientY, W: r.width, H: r.height, s: [[e.timeStamp, e.clientX, e.clientY]],
      fast: null, fired: false, slowT: e.timeStamp, slowX: e.clientX, slowY: e.clientY };
  }
  function fire(p) {
    const f = p.fast;
    if ((f.y0 - f.y) / p.H < T_MIN_TRAVEL) { p.fast = null; return; } // a twitch, not a stroke
    p.fired = true;
    const s01 = clamp01((f.peak - T_ON) / (T_MAX - T_ON));
    const snap = clamp01(1 - (f.tPeak - f.t0 - T_RISE_FAST) / (T_RISE_SLOW - T_RISE_FAST));
    const dirU = clamp1((f.x - f.x0) / (f.y0 - f.y));
    I.debug.peak = +f.peak.toFixed(2); I.debug.rise = Math.round(f.tPeak - f.t0); I.debug.dir = [+dirU.toFixed(2), 1];
    if (started) emit({ strength: 0.3 + 1.3 * s01, snap, dirU, dirV: 1 });
  }
  function onMove(e) {
    const p = ptr;
    if (!p || e.pointerId !== p.id) return;
    const t = e.timeStamp, x = e.clientX, y = e.clientY;
    p.s.push([t, x, y]);
    while (p.s.length > 2 && t - p.s[0][0] > 50) p.s.shift();
    const a = p.s[0], vy = ((a[2] - y) / Math.max(8, t - a[0])) * 1000 / p.H; // upward speed, heights / s
    if (p.fired || blockUntilUp) return; // after a flick: tilt holds until the finger lifts
    if (p.fast) {
      if (vy > p.fast.peak) { p.fast.peak = vy; p.fast.tPeak = t; }
      p.fast.x = x; p.fast.y = y;
      if (vy < 0.5 * p.fast.peak) fire(p);
    } else if (vy > T_ON) {
      p.fast = { t0: p.slowT, x0: p.slowX, y0: p.slowY, peak: vy, tPeak: t, x, y };
    } else {
      p.slowT = t; p.slowX = x; p.slowY = y;
      tu = clamp1((x - p.x0) / (0.3 * p.W)); tv = clamp1((p.y0 - y) / (0.15 * p.H)); // drag down = toward the handle
    }
  }
  function onUp(e) {
    const p = ptr;
    if (!p || e.pointerId !== p.id) return;
    if (e.type === "pointerup" && p.fast && !p.fired && !blockUntilUp) fire(p);
    ptr = null; blockUntilUp = false;
    if (I.mode === "touch" && started) { tu = 0; tv = 0; }
  }

  /* ---------- API ---------- */
  function start(onFlick, el) {
    onFlickCb = onFlick; appEl = el;
    el.addEventListener("pointerdown", onDown);
    window.addEventListener("pointermove", onMove);
    window.addEventListener("pointerup", onUp);
    window.addEventListener("pointercancel", onUp);
  }
  function useTouch() {
    started = true; I.mode = "touch"; tu = 0; tv = 0;
    window.removeEventListener("devicemotion", onMotion);
  }
  // Must be called synchronously from a tap (iOS). Resolves once motion events flow, or after the 1 s probe in touch mode.
  function requestPermission() {
    started = true; tu = 0; tv = 0;
    const DM = window.DeviceMotionEvent;
    let ask;
    try {
      ask = DM && typeof DM.requestPermission === "function" ? DM.requestPermission() : Promise.resolve(DM ? "granted" : "denied");
    } catch (e) { ask = Promise.resolve("denied"); }
    return Promise.resolve(ask).catch(() => "denied").then((r) => new Promise((res) => {
      if (r !== "granted") { useTouch(); return res(); }
      const timer = setTimeout(() => {
        probeDone = null;
        if (!gotMotion) { useTouch(); I.hint = HINT; }
        res();
      }, PROBE_MS);
      probeDone = () => { probeDone = null; clearTimeout(timer); res(); };
      window.addEventListener("devicemotion", onMotion);
    }));
  }
  function armAfterRelease() {
    blockUntilUp = !!ptr;
    quietUntil = lastT + 400;
  }
})();

</script>
<script>
/* rice.js — rice + kimchi + scallion: heat, tilt slide, wok-toss wave, landing, draw (see CONTRACT.md, DESIGN.md) */
"use strict";
(function () {
  const K = window.KFR, TAU = K.TAU, clamp = K.clamp;

  /* ---------- tuning ---------- */
  const N_RICE = 220, N_KIMCHI = 26, N_PA = 13; // ~12% kimchi, ~6% scallion
  const PILE = 0.58;          // pile radius at rest (world units)
  const MOUND = 0.11;        // pile height at its centre
  const G = 14;              // anim §1
  const RATE = 0.34;         // cook per second for the contact layer at heat 1 (balance: see harness)
  const AIR = 0.05;           // flames lick the rice in the air (share of RATE): keeps doneness from hinging on rhythm alone
  const RAMP0 = 0.8;        // sear rate right after landing (rises to 1 over 0.4 s of contact): constant tossing stays pale
  const V = 3.1;             // toss speed scale (strength 1 lip grain lands near the handle side, 1.5 spills)
  const HEAT_C = K.heat(0, 0);
  const READY = [0.28, 0.45, 0.7]; // readiness: early < [0] <= 완벽 <= [1] < 좋음 <= [2] < late
  const SHEET = 0.8;               // airborne share a 완벽 needs
  const LABELS = {
    perfect: ["불맛!", "#E8481C"], good: ["좋아", "#2BB673"], early: ["덜 익었어", "#C98A3E"],
    late: ["탔다!", "#5A2A14"], weak: ["약해", "#6B7781"], spill: ["쏟았다!", "#C81E1E"],
  };
  const layer = (d) => 1.6 * (1 - d) * (1 - d) + 0.05; // bottom layer sears, top barely warms

  /* deterministic hash so the bowl and shapes don't flicker */
  const hash = (i) => { const s = Math.sin(i * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };

  /* ---------- colour LUT: no string building per frame ---------- */
  const Q = 0.02, NQ = 100;
  const LUT = [K.col.rice, K.col.kimchi, K.col.scallion].map((f) => {
    const base = [], shade = [], lit = [], gl = [];
    for (let q = 0; q < NQ; q++) {
      const ck = q * Q, c = f(ck);
      base.push(K.rgb(c)); shade.push(K.rgb([c[0] * 0.75, c[1] * 0.75, c[2] * 0.75]));
      lit.push(K.rgb([Math.min(255, c[0] * 1.15 + 8), Math.min(255, c[1] * 1.15 + 8), Math.min(255, c[2] * 1.15 + 8)]));
      gl.push(ck <= 1.2 ? K.gloss(ck) : 0); // art: spec only while glossy (.4–1.2)
    }
    return { base, shade, lit, gl };
  });
  const qi = (ck) => (ck <= 0 ? 0 : ck >= (NQ - 1) * Q ? NQ - 1 : (ck / Q) | 0);

  /* ---------- projection (same formula as KFR.proj, inlined so the hot loop allocates nothing) ---------- */
  let PX = 0, PY = 0;
  function P(vw, pose, u, v, h) {
    const lean = 1 + (pose.lean || 0) * 0.12;
    PX = vw.cx + (u + (pose.du || 0)) * vw.R;
    PY = vw.cy - (v + (pose.dv || 0)) * vw.R * vw.ct * lean + (K.RIM_H - h - (pose.lift || 0)) * vw.R * vw.st;
    if (h > K.RIM_H) PY -= (h - K.RIM_H) * vw.R * 0.15;
  }

  /* ---------- state ---------- */
  function create() {
    const units = [];
    // rice in clumps of 3–6 (art §2), kimchi and scallion as single pieces
    let left = N_RICE;
    while (left > 0) { const n = Math.min(left, 3 + ((Math.random() * 4) | 0)); units.push({ kind: 0, n }); left -= n; }
    for (let i = 0; i < N_KIMCHI; i++) units.push({ kind: 1, n: 1 });
    for (let i = 0; i < N_PA; i++) units.push({ kind: 2, n: 1 });
    const M = units.length, F = () => new Float32Array(M);
    const s = {
      M, kind: new Uint8Array(M), n: new Uint8Array(M), st: new Uint8Array(M), // st: 0 pile, 1 sliding to the lip, 2 air, 3 spilled
      u: F(), v: F(), h: F(), vu: F(), vv: F(), vh: F(), su: F(), sv: F(), hu: F(), hv: F(),
      depth: F(), cook: F(), rest: F(), tl: F(), lift: F(), rot: F(), spin: F(), key: F(), hop: new Uint8Array(M),
      toss: new Int32Array(M), shape: [], ord: new Uint16Array(M),
      pc: [0, 0], slU: 0, slV: 1, sl: F(), cur: null, tossN: 0, lastTossT: -9, combo: 0, maxCombo: 0, wokhei: 0, tosses: 0, readiness: 0, golden: false,
      lastToss: null, events: [], total: N_RICE + N_KIMCHI + N_PA, hot: [],
    };
    for (let i = 0; i < M; i++) {
      const un = units[i];
      s.kind[i] = un.kind; s.n[i] = un.n; s.ord[i] = i;
      const a = Math.random() * TAU, r = Math.sqrt(Math.random()) * PILE;
      s.hu[i] = Math.cos(a) * r; s.hv[i] = Math.sin(a) * r;
      s.u[i] = s.hu[i]; s.v[i] = s.hv[i]; s.depth[i] = Math.random(); s.h[i] = groundH(s, i);
      s.rot[i] = Math.random() * TAU; s.toss[i] = -1;
      // member layout (in R units): grains overlap ~60% inside a small blob
      const m = [];
      for (let k = 0; k < un.n; k++) {
        const ma = Math.random() * TAU, mr = un.n > 1 ? 0.006 + Math.random() * 0.016 : 0;
        m.push({ ox: Math.cos(ma) * mr, oy: Math.sin(ma) * mr * 0.8, rot: Math.random() * Math.PI, sz: 0.85 + Math.random() * 0.3, j: (Math.random() - 0.5) * 0.08 });
      }
      s.shape.push({ m, q: Math.random(), strip: un.kind === 2 && Math.random() < 0.35 });
    }
    return s;
  }
  function groundH(s, i) {
    const rh2 = (s.hu[i] * s.hu[i] + s.hv[i] * s.hv[i]) / (PILE * PILE);
    return K.surf(s.u[i], s.v[i]) + 0.012 + MOUND * s.depth[i] * Math.max(0.15, 1 - rh2);
  }

  /* ---------- toss: the sheet peels off the lip, lip grains highest, curls back over the pile ---------- */
  function toss(s, f, t) {
    if (s.cur) finish(s, t);
    const str = clamp(f.strength || 1, 0.2, 1.8), snap = clamp(f.snap == null ? 0.5 : f.snap, 0, 1);
    let du = 0.6 * clamp(f.dirU || 0, -1, 1), dv = 1;
    const dl = Math.hypot(du, dv); du /= dl; dv /= dl;
    const lipU = 0.92 * du, lipV = 0.92 * dv;
    const reach = 0.5 + 1.1 * str, vSlide = 3 + 3 * str;
    // readiness: heat the contact layer took since it last landed (centre-heat seconds)
    let rs = 0, rn = 0, avail = 0, dMin = 9;
    for (let i = 0; i < s.M; i++) {
      if (s.st[i] !== 0) continue;
      avail += s.n[i];
      if (s.depth[i] < 0.35) { rs += Math.min(1.6, s.rest[i]) * s.n[i]; rn += s.n[i]; }
      const d = dist(s.u[i], s.v[i], lipU, lipV, du, dv);
      if (d < dMin) dMin = d;
    }
    s.slU = du; s.slV = dv;
    const id = ++s.tossN;
    let launched = 0, mu = 0, mv = 0;
    for (let i = 0; i < s.M; i++) {
      if (s.st[i] !== 0) continue;
      const d = dist(s.u[i], s.v[i], lipU, lipV, du, dv);
      if (d > reach) { // slosh toward the lip; the layers stir a little
        s.su[i] += du * 0.5 * str; s.sv[i] += dv * 0.5 * str;
        s.depth[i] = 0.5 * s.depth[i] + 0.5 * Math.random(); s.rest[i] *= 0.5; continue;
      }
      s.st[i] = 1; s.toss[i] = id; launched += s.n[i]; mu += s.u[i] * s.n[i]; mv += s.v[i] * s.n[i];
      s.tl[i] = t + 0.07 + (d - dMin) / vSlide; // lip first, the rest peel off after it
      // the push carries every grain up onto the far wall (order kept, band compressed): nothing launches from the near side
      s.sl[i] = Math.max(0, d - (0.1 + 0.35 * (d - dMin))) / (s.tl[i] - t);
      const lift = Math.exp(-(d - dMin) / 0.25);

      const vUp = V * Math.pow(str, 0.6) * (0.5 + 1.3 * lift) * (0.7 + 0.5 * snap);

  /* distance from the lip measured along the throw (sideways counts half) */

  /* grains of an already graded toss that go over the rim late still make it a spill */
  function lateSpill(s, id, n) {

  }

  /* grade a toss once its grains are back (or the next toss starts) */
  function finish(s, t) {

    const spillF = c.launched ? c.spill / c.launched : 0;
    let g;

    else if (c.sheet < 0.4) g = "weak";
    // readiness = contact-layer seconds on the metal since landing. DESIGN's 0.6–1.0 s window is for a real 0.22 s
    // flight; ours is ~0.7 s, so the window sits where the rhythm that also gives the best doneness lands (~1.0–1.15 s)
    else if (c.readiness > READY[2]) g = "late";
    else if (c.readiness < READY[0]) g = "early";
    else if (c.readiness <= READY[1] && c.sheet >= SHEET) g = "perfect";
    else g = "good";

  /* ---------- update ---------- */

    let rs = 0, rn = 0;
    for (let i = 0; i < s.M; i++) if (s.st[i] === 0 && s.depth[i] < 0.35) { rs += Math.min(1.6, s.rest[i]) * s.n[i]; rn += s.n[i]; }

  /* ---------- queries ---------- */
  function stats(s) {

      if (s.st[i] === 3) spill += n;
      else if (c > K.RICE_GOOD[1]) burnt += n;
      else if (c < K.RICE_GOOD[0]) raw += n;
      else good += n;
    }

  }

  /* ---------- draw ---------- */
  function drawUnit(c, s, i, x, y, R, sc, lit, sAng, sStr) {
    const kind = s.kind[i], sh = s.shape[i], q = qi(s.cook[i]), L = LUT[kind];
    if (kind === 0) {
      const rx0 = 0.0225 * R * sc, ry0 = 0.011 * R * sc; // capsule 0.045R x 0.022R (art §2)
      c.lineCap = "round";
      const m = sh.m;
      for (let k = 0; k < m.length; k++) {
        const mm = m[k], ck = qi(s.cook[i] + mm.j);

      c.fillStyle = lit ? L.lit[q] : L.base[q]; c.beginPath();
      for (let k = 0; k < 6; k++) { const X = x + (px[k] * ca - py[k] * sa) * z, Y = y + (px[k] * sa + py[k] * ca) * z * 0.85; k ? c.lineTo(X, Y) : c.moveTo(X, Y); }
      c.closePath(); c.fill();
      c.strokeStyle = s.cook[i] < 1.2 ? "rgba(255,106,61,.9)" : "rgba(120,50,30,.6)"; c.lineWidth = 1;
      c.beginPath(); c.moveTo(x + (px[0] * ca - py[0] * sa) * z, y + (px[0] * sa + py[0] * ca) * z * 0.85);
      c.lineTo(x + (px[1] * ca - py[1] * sa) * z, y + (px[1] * sa + py[1] * ca) * z * 0.85); c.stroke();
      if (qq > 0.6) { c.strokeStyle = "rgba(247,201,168,.45)"; c.lineWidth = 1.1 * sc; c.beginPath(); c.moveTo(x - ca * z * 0.6, y - sa * z * 0.5); c.lineTo(x + ca * z * 0.6, y + sa * z * 0.5); c.stroke(); }
      const gl = L.gl[q];
      if (gl > 0.05) { c.fillStyle = `rgba(255,240,225,${(gl * 0.9).toFixed(2)})`; c.beginPath(); c.arc(x - z * 0.3, y - z * 0.3, z * 0.16, 0, TAU); c.fill(); }
    } else {
      const z = 0.018 * R * sc;

    }
  }

  function draw(c, s, vw, pose) {
    const R = vw.R, M = s.M, ord = s.ord, key = s.key, sn = Math.sin(K.THETA), cs = Math.cos(K.THETA);
    // sauce bed under the pile: one path, uniform alpha (clump shadow, kills the confetti read)
    c.fillStyle = "rgba(120,40,18,.12)"; c.beginPath();
    for (let i = 0; i < M; i++) {
      if (s.st[i] > 1 || s.kind[i]) continue; // one soft shadow per rice clump
      P(vw, pose, s.u[i], s.v[i], s.h[i] - 0.02 - 0.06 * s.depth[i]);
      const rr = 0.045 * R;
      c.moveTo(PX + rr + 2, PY + 2); c.ellipse(PX + 2, PY + 2, rr, rr * 0.7, 0, 0, TAU);
    }
    c.fill();

    c.fillStyle = "rgba(20,10,6,.1)"; c.beginPath();
    for (let i = 0; i < M; i++) {

      const fl = K.surf(s.u[i], s.v[i]), up = Math.max(0, s.h[i] - fl), k = Math.max(0.2, 1 - up * 0.8);
      P(vw, pose, s.u[i], s.v[i], fl);

    for (let i = 0; i < M; i++) key[i] = -sn * s.v[i] + cs * s.h[i];
    for (let i = 1; i < M; i++) {
      const o = ord[i], kv = key[o]; let j = i - 1;
      while (j >= 0 && key[ord[j]] > kv) { ord[j + 1] = ord[j]; j--; }
      ord[j + 1] = o;
    }
    for (let n = 0; n < M; n++) {
      const i = ord[n], st = s.st[i];
      if (st === 3 && s.h[i] <= -0.32) continue; // on the counter: drawSpilled
      P(vw, pose, s.u[i], s.v[i], s.h[i]);
      const sc = K.scaleAt(s.h[i] - K.surf(s.u[i], s.v[i]));
      let sAng = 0, sStr = 1;
      if (st >= 2) {

        P(vw, pose, s.u[i] + s.vu[i] * 0.03, s.v[i] + s.vv[i] * 0.03, s.h[i] + s.vh[i] * 0.03);
        const dx = PX - x0, dy = PY - y0, sp = Math.hypot(s.vu[i], s.vv[i], s.vh[i]);

      drawUnit(c, s, i, PX, PY, R, sc, st >= 2, sAng, sStr);
    }
  }

  function drawSpilled(c, s, vw, pose) {
    const R = vw.R, rest = K.restPose();
    for (let i = 0; i < s.M; i++) {
      if (s.st[i] !== 3 || s.h[i] > -0.32) continue;
      P(vw, rest, s.u[i], s.v[i], s.h[i]); // on the counter: it doesn't move with the wok
      c.fillStyle = "rgba(30,40,50,.18)"; c.beginPath(); c.ellipse(PX + 1.5, PY + 2, 0.05 * R, 0.025 * R, 0, 0, TAU); c.fill();
      drawUnit(c, s, i, PX, PY, R, 1, false, 0, 1);
    }
  }

  /* bowl on the result slip: a heaped mound of what was kept, tasty base, burnt grains as dark specks */
  function drawBowl(c, s, cx, cy, r, ct) {
    let kept = 0, sum = 0, sn = 0;
    for (let i = 0; i < s.M; i++) if (s.st[i] !== 3) { kept += s.n[i]; if (s.kind[i] === 0) { sum += clamp(s.cook[i], 0.65, 1.15) * s.n[i]; sn += s.n[i]; } }
    const share = kept / s.total, mh = r * (0.2 + 0.32 * share), mr = r * (0.55 + 0.37 * share);
    const base = K.col.rice(sn ? sum / sn : 0.9);

    g.addColorStop(0, K.rgb([Math.min(255, base[0] + 30), Math.min(255, base[1] + 30), Math.min(255, base[2] + 25)]));
    g.addColorStop(1, K.rgb([base[0] * 0.7, base[1] * 0.7, base[2] * 0.7]));

    c.bezierCurveTo(cx - mr, cy - mh * 1.45, cx + mr, cy - mh * 1.45, cx + mr, cy); c.fill();

    for (let i = 0; i < s.M; i++) {

<script>
/* game.js — flow, wok pose, HUD, scoring, result slip, attract demo (lead) */
"use strict";
(function () {

  /* ---------- the wok's own motion: a chef's toss (Ko & Hu: one cycle ~0.3 s; push + lift, far lip rises) ---------- */

  /* ---------- step ---------- */

    K.Fx.update(g.fx, dt, { flare: 0, burning, steam, wokPose: g.pose });

  /* ---------- scoring (DESIGN.md): rice 60 = doneness 40 + 불맛 20, egg 40 = flip 22 + yolk 12 + sear 6 ---------- */
  const GOOD_FLICKS = "12~16";
  const ORDERS = [
    { id: "half", label: "계란 반숙", win: [0.5, 0.9], fire: 1, done: 1 },
    { id: "full", label: "계란 완숙", win: [1.0, 1.4], fire: 1, done: 1 },

  function finish() {

      else if (o.flipped && d <= 12) flip = 22;
      else if (o.flipped) { flip = Math.round(22 - 0.25 * (d - 12)); eggLines.push([`뒤집기가 ${(o.angleErr || 0) > 0 ? "더 돎 · 살살" : "덜 돎 · 조금 세게"}`, flip - 22]); }
      else { flip = 6; eggLines.push([`안 뒤집힘 · ${o.rot > Math.PI ? "살살" : "조금 세게"}`, -16]); }

      else yolk = 12;
      if (o.cookBottom >= ord.win[0] && o.cookBottom <= ord.win[1]) sear = 6;
      else eggLines.push([o.cookBottom < ord.win[0] ? `일찍 던짐 · ${ord.label}엔 덜 익음` : `늦게 던짐 · ${ord.label}엔 너무 익음`, -6]);

  /* ---------- HUD ---------- */
  function pill(x, y, w, h, fill) { c.fillStyle = fill; c.beginPath(); c.roundRect(x - w / 2, y - h / 2, w, h, h / 2); c.fill(); }

      }

      c.font = '16px "Jua"'; c.fillStyle = "#4b5761"; c.textAlign = "center"; c.fillText(`2판 · 계란 뒤집기 · 주문: ${g.order.label}`, W / 2, top + 10);
      const e = g.egg, o = K.Egg.outcome(e);

      } else if (e.phase === "air" || e.phase === "splatFly") msg = (o.strength || 0) > 1.1 ? "어어…!" : "기울여서 받아!";

      else msg = o.caught ? (o.flipped && !o.burst ? "좋아!" : "앗…") : "아…";
      const k = clamp((g.t % 100) * 4, 0, 1);

    if (!g.demo && K.Input.mode === "touch" && K.Input.hint && g.phase === "rice" && !g.started) {
      c.font = '15px "Gowun Dodum"'; c.textAlign = "center"; c.fillStyle = "#4b5761"; c.fillText(K.Input.hint, W / 2, H * 0.97);
    }
    // spirit level (bottom-right): the bubble drifts to the high side
    if (g.phase !== "result" && !g.demo) {
      const lx = W * 0.86, ly = H * 0.9, lr = W * 0.07, t = K.Input.tilt;
      c.fillStyle = "rgba(31,42,51,.72)"; c.beginPath(); c.arc(lx, ly, lr, 0, TAU); c.fill();
      c.strokeStyle = "rgba(255,255,255,.35)"; c.lineWidth = 1; c.beginPath(); c.arc(lx, ly, lr * 0.35, 0, TAU); c.stroke();
      c.fillStyle = "#a3e635"; c.beginPath(); c.arc(lx - t.u * lr * 0.6, ly + t.v * lr * 0.6, lr * 0.28, 0, TAU); c.fill();
      c.font = '13px "Jua"'; c.textAlign = "center"; c.fillStyle = "#4b5761"; c.fillText("기울기", lx, ly - lr - 8);
    }
  }

  /* ---------- render ---------- */
  function render() {
    const fx = g.fx, sh = fx.shake || { x: 0, y: 0 };
    c.save(); c.translate(sh.x, sh.y);
    K.Stage.drawCounter(c, vw);
    const fire = g.phase !== "result";
    if (fire) { K.Stage.drawUnderGlow(c, vw, fx.flareLevel || 0); K.Fx.drawBehind(c, fx, vw, g.pose); }
    if (g.phase !== "egg") K.Rice.drawSpilled && K.Rice.drawSpilled(c, g.rice, vw, g.pose);
    K.Stage.drawWok(c, vw, g.pose, g.contact || 0, fire);
    if (fire && K.Fx.drawRim) K.Fx.drawRim(c, fx, vw, g.pose);   // far-rim flare sits under the food
    if (g.phase === "rice" || g.phase === "result") K.Rice.draw(c, g.rice, vw, g.pose);
    if (g.phase === "egg") K.Egg.draw(c, g.egg, vw, g.pose);
    K.Stage.flashRim(c, vw, g.pose, g.rimFlash);
    K.Fx.drawFront(c, fx, vw, g.pose);
    if (fx.haze > 0.01) { c.fillStyle = `rgba(52,48,46,${Math.min(0.45, fx.haze)})`; c.fillRect(-10, -10, W + 20, H + 20); }
    c.restore();
    hud();
  }

  /* ---------- result slip ---------- */
  function showResult() {
    const r = g.res, record = r.total > best && best > 0;
    if (r.total > best) { best = r.total; try { localStorage.setItem("kfr-best", best); } catch (e) {} }
    const angRecord = r.ang != null && r.ang > bestAng && bestAng > 0;
    if (r.ang != null && r.ang > bestAng && r.ang <= 180) { bestAng = r.ang; try { localStorage.setItem("kfr-best-angle", bestAng); } catch (e) {} }
    const near = r.toPerfect ? `완벽 뒤집기까지 ${r.toPerfect}°` : r.next ? `「${r.nextName}」까지 ${r.next}점` : "";
    const lines = r.lines.map(([k, v]) => `<li><span>${k}</span><span>${v}</span></li>`).join("");
    resEl.innerHTML = `<div class="slip" id="slip"><div class="shop">D:OT 반점</div><div class="meta">주문 #002 · 김치볶음밥 1 · ${g.order.label}</div>${record ? '<div class="stamp rec">신기록</div>' : ""}<canvas id="bowl"></canvas>
      <div class="total"><span class="stamp" id="stamp" style="visibility:hidden">${r.tag}</span><span class="big"><span id="score">0</span><small>점</small></span></div>
      ${near ? `<div class="near">${near}</div>` : ""}
      <ul><li><span>밥 볶기 ${r.rice}/60 · 계란 ${r.egg}/40</span><span>최고 ${best}</span></li>
      ${r.ang != null ? `<li><span>뒤집기 ${r.ang}°${angRecord ? " · 신기록" : ""}</span><span>최고 ${bestAng}°</span></li>` : ""}${lines}
</ul>
      <div class="formula">밥 = 맛있게 익은 비율 × 40 + 불맛 20 (노릇할 때 튕긴 만큼) · 계란 = 뒤집기 22 + 노른자 12 + 굽기 6</div></div>
      <div class="row"><button class="btn" id="again" type="button">한 번 더</button><button class="btn ghost" id="share" type="button">자랑하기</button></div><div class="hint">폰을 휙 튕겨도 다시 시작</div>`;
    resEl.hidden = false;
    const bowl = document.getElementById("bowl"), bw = bowl.clientWidth || 300, bh = bw * 0.75;
    const [bc, bx] = [bowl, bowl.getContext("2d")], d = K.DPR(); bc.width = bw * d; bc.height = bh * d; bx.scale(d, d);
    drawBowl(bx, bw, bh);
    // count up the score, then slam the stamp
    const el = document.getElementById("score"), t0 = performance.now();
    const tick = (now) => {
      const k = Math.min(1, (now - t0) / 700); el.textContent = Math.round(r.total * K.smooth(k));
      if (k < 1) requestAnimationFrame(tick);
      else { const s = document.getElementById("stamp"); s.style.visibility = "visible"; s.classList.add("pop"); K.Audio.stamp(); }
    };
    requestAnimationFrame(tick);
    document.getElementById("again").onclick = (e) => { e.stopPropagation(); restart(); };
    document.getElementById("share").onclick = (e) => { e.stopPropagation(); share(); };
  }

  /* ---------- share: the order slip as a 1080x1350 picture ---------- */
  function slipImage() {
    const W2 = 1080, H2 = 1350, cv2 = document.createElement("canvas"); cv2.width = W2; cv2.height = H2;
    const x = cv2.getContext("2d"), r = g.res;
    const bg = x.createLinearGradient(0, 0, W2, H2); bg.addColorStop(0, "#eef1f3"); bg.addColorStop(1, "#c9d1d8");
    x.fillStyle = bg; x.fillRect(0, 0, W2, H2);
    x.save(); x.translate(W2 / 2, H2 / 2); x.rotate(-0.02);
    const sw = 860, sh = 1150; x.shadowColor = "rgba(30,40,50,.3)"; x.shadowBlur = 40; x.shadowOffsetY = 18;
    x.fillStyle = "#fbf6ea"; x.fillRect(-sw / 2, -sh / 2, sw, sh); x.shadowColor = "transparent";
    x.textAlign = "center"; x.fillStyle = "#2a1a14";
    x.font = '64px "Song Myung"'; x.fillText("D:OT 반점", 0, -sh / 2 + 100);
    x.font = '26px "Nanum Gothic Coding"'; x.fillStyle = "#6b5d4f"; x.fillText(`주문 #002 · 김치볶음밥 1 · ${g.order.label}`, 0, -sh / 2 + 148);
    const bw = 760, bh = 570, [bc] = [document.createElement("canvas")]; bc.width = bw; bc.height = bh;
    const bx = bc.getContext("2d"); drawBowl(bx, bw, bh); x.drawImage(bc, -bw / 2, -sh / 2 + 170);
    x.textAlign = "right"; x.fillStyle = "#2a1a14"; x.font = 'bold 150px "Nanum Gothic Coding"'; x.fillText(String(r.total), sw / 2 - 150, sh / 2 - 190);
    x.font = '48px "Nanum Gothic Coding"'; x.fillText("점", sw / 2 - 90, sh / 2 - 190);
    x.save(); x.translate(-sw / 2 + 230, sh / 2 - 240); x.rotate(-0.12);
    x.font = '58px "Song Myung"'; const tw = x.measureText(r.tag).width + 50;
    x.strokeStyle = "#c81e1e"; x.lineWidth = 8; x.strokeRect(-tw / 2, -50, tw, 90); x.fillStyle = "#c81e1e"; x.textAlign = "center"; x.fillText(r.tag, 0, 18); x.restore();
    x.textAlign = "center"; x.fillStyle = "#6b5d4f"; x.font = '30px "Nanum Gothic Coding"';
    x.fillText(`밥 ${r.rice}/60 · 계란 ${r.egg}/40` + (r.ang != null ? ` · 뒤집기 ${r.ang}°` : ""), 0, sh / 2 - 110);
    x.fillText("너도 볶아 봐 → D:OT lab", 0, sh / 2 - 60);
    x.restore();
    return cv2;
  }
  function share() {
    const cv2 = slipImage();
    cv2.toBlob(async (blob) => {
      try {
        const file = new File([blob], "kimchi-fried-rice.png", { type: "image/png" });
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          await navigator.share({ files: [file], text: `김치볶음밥 한 그릇 ${g.res.total}점 「${g.res.tag}」 ${location.href.split("?")[0]}` });
          return;
        }
      } catch (e) { if (e && e.name === "AbortError") return; }
      // in-app browsers: show the picture to long-press and save
      const url = URL.createObjectURL(blob), ov = document.createElement("div");
      ov.className = "layer"; ov.style.background = "rgba(15,18,21,.92)"; ov.style.zIndex = 5;
      ov.innerHTML = `<img alt="결과 주문서" style="max-width:100%;max-height:72%;border-radius:8px" src="${url}"><p style="color:#fff;margin:0;font-size:18px">이미지를 길게 눌러 저장하세요</p><button class="btn" type="button">닫기</button>`;
      ov.querySelector("button").onclick = (e) => { e.stopPropagation(); ov.remove(); URL.revokeObjectURL(url); };
      app.appendChild(ov);
    }, "image/png");
  }
  function drawBowl(c2, w, h) {
    const ct = Math.cos(K.THETA), cx = w / 2, cy = h * 0.55, r = w * 0.36;
    c2.fillStyle = "#e6e1d6"; c2.beginPath(); c2.moveTo(cx - r, cy); c2.bezierCurveTo(cx - r * 0.9, cy + r * 0.95, cx + r * 0.9, cy + r * 0.95, cx + r, cy); c2.closePath(); c2.fill();
    c2.strokeStyle = "#2563eb"; c2.lineWidth = 2.5; c2.beginPath(); c2.moveTo(cx - r * 0.93, cy + r * 0.18); c2.bezierCurveTo(cx - r * 0.7, cy + r * 0.62, cx + r * 0.7, cy + r * 0.62, cx + r * 0.93, cy + r * 0.18); c2.stroke();
    c2.fillStyle = "#fffdf8"; c2.beginPath(); c2.ellipse(cx, cy, r, r * ct, 0, 0, TAU); c2.fill();
    const top = K.Rice.drawBowl(c2, g.rice, cx, cy, r, ct);
    const o = K.Egg.outcome(g.egg);
    if (!o.caught && !o.stuck) {
      c2.font = '13px "Gowun Dodum"'; c2.textAlign = "center"; const t = "(계란 없음)", tw = c2.measureText(t).width + 16;
      c2.fillStyle = "rgba(251,246,234,.92)"; c2.beginPath(); c2.roundRect(cx - tw / 2, (top || cy - r * 0.4) - 16, tw, 24, 12); c2.fill();
      c2.fillStyle = "#6b5d4f"; c2.fillText(t, cx, (top || cy - r * 0.4) + 1);
    } else K.Egg.drawOnRice(c2, g.egg, cx, top || cy - r * 0.4, r * 0.42, ct);
  }

  function restart() {
    resEl.hidden = true; g = newGame(false); K.Input.armAfterRelease && K.Input.armAfterRelease();
  }

  /* ---------- boot ---------- */
  let last = performance.now(), shown = false;
  function frame(now) {
    const dt = Math.min(0.033, (now - last) / 1000); last = now;
    step(dt);
    if (g.phase === "result" && !shown && !g.demo) { shown = true; showResult(); }
    if (g.phase !== "result") shown = false;
    render();
    requestAnimationFrame(frame);
  }
  function begin(useMotion) {
    K.Audio.unlock();
    const go = () => { intro.hidden = true; g = newGame(false); };
    if (useMotion) K.Input.requestPermission().then(go, go); else { K.Input.useTouch(); go(); }
  }
  document.getElementById("go").onclick = () => begin(true);
  document.getElementById("touchMode").onclick = () => begin(false);
  resEl.addEventListener("click", (e) => { if (e.target === resEl) {} });
  K.Input.start(onFlick, app);
  g = newGame(true);
  // a flick on the result slip restarts
  K.Input.onResultFlick = () => { if (g && g.phase === "result" && !g.demo) restart(); };
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(() => requestAnimationFrame(frame));
  K.Game = { get state() { return g; }, flick, newGame: (d) => (g = newGame(d)) };
})();

</script>
