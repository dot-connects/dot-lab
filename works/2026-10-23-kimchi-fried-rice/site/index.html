<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>김치볶음밥 한 그릇 · D:OT lab</title>
<meta name="description" content="폰이 웍이다. 휙 튕겨서 김치볶음밥을 볶고, 계란을 뒤집어 얹어 한 그릇 점수를 받는다.">
<meta property="og:title" content="김치볶음밥 한 그릇">
<meta property="og:description" content="폰을 웍처럼 튕겨서 볶아 봐. 불맛 장인 될 수 있어?">
<meta name="theme-color" content="#1b1f24">
<meta property="og:url" content="https://dot-connects.github.io/dot-lab/works/2026-10-23-kimchi-fried-rice/site/">
<meta property="og:type" content="website">
<meta property="og:image" content="https://dot-connects.github.io/dot-lab/works/2026-10-23-kimchi-fried-rice/site/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gowun+Dodum&family=Nanum+Gothic+Coding:wght@400;700&display=swap">
<style>
:root{--ink:#1f2a33;--paper:#fbf6ea;--accent:#E8481C;--mute:#5b6670;--red:#c81e1e}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#1b1f24;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
[hidden]{display:none!important}
#app{position:fixed;inset:0;touch-action:none;font-family:"Gowun Dodum",system-ui,sans-serif;color:var(--ink)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:18px "Black Han Sans",system-ui,sans-serif;letter-spacing:.02em;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.btn{border-radius:999px;padding:13px 26px;min-height:50px;background:var(--accent);color:#fff;box-shadow:0 5px 0 #9a3412,0 10px 18px rgba(0,0,0,.2);transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #9a3412}
.btn.ghost{background:transparent;box-shadow:none;color:var(--mute);font-size:15px;min-height:40px;padding:6px 12px;text-decoration:underline}
.btn:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
/* start screen */
#intro{position:absolute;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(92vw,380px);background:var(--paper);border-radius:20px;
  padding:20px 18px 12px;box-shadow:0 18px 50px rgba(0,0,0,.45);text-align:center;display:flex;flex-direction:column;gap:10px}
#intro h1{margin:0;font:42px/1.02 "Black Han Sans",system-ui,sans-serif;color:var(--accent);text-wrap:balance}
#intro h1.beat{animation:tBeat .18s ease-out}#intro h1.fever{animation:tFever .3s ease-out}
@keyframes tBeat{0%{transform:scale(1.07)}100%{transform:scale(1)}}@keyframes tFever{0%{transform:scale(1.12) rotate(-3deg)}100%{transform:scale(1) rotate(0)}}
#go{animation:goPulse .85s ease-in-out infinite;transition:box-shadow .2s}#go.glow{box-shadow:0 5px 0 #9a3412,0 0 18px 6px rgba(255,140,0,.75)}
@keyframes goPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
#intro .hook{margin:0;font-size:16px;color:var(--ink)}
#intro .how{margin:0;font-size:14.5px;line-height:1.55;color:var(--mute)}
#intro .how b{color:var(--ink)}
#intro .best{margin:0;font:15px "Black Han Sans",system-ui,sans-serif;color:var(--red)}#intro .best:empty{display:none}
#go:disabled{opacity:.7;animation:none}
#mute{position:absolute;right:max(10px,env(safe-area-inset-right));top:calc(env(safe-area-inset-top) + 16px);z-index:4;width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.35);color:#fff;font-size:18px;line-height:40px;padding:0}
#hud:not([hidden]) ~ #mute{top:auto;bottom:calc(env(safe-area-inset-bottom) + 12px)}
#home{position:absolute;right:calc(max(10px,env(safe-area-inset-right)) + 48px);top:calc(env(safe-area-inset-top) + 16px);z-index:4;width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.35);color:#fff;font-size:22px;line-height:40px;padding:0}
#back{position:absolute;left:max(10px,env(safe-area-inset-left));top:calc(env(safe-area-inset-top) + 16px);z-index:4;height:40px;padding:0 14px;border-radius:999px;background:rgba(0,0,0,.35);color:#fff;font:600 14px "Gowun Dodum",system-ui,sans-serif;line-height:40px;text-decoration:none}
#intro[hidden] ~ #back{display:none}
.slip .more{display:block;margin-top:8px;font-size:14px;color:var(--ink);text-align:center;text-underline-offset:3px}
#hud:not([hidden]) ~ #home{top:auto;bottom:calc(env(safe-area-inset-bottom) + 12px)}
#noGL{position:absolute;inset:0;z-index:9;background:#1b1f24;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-size:16px}#noGL b{font:24px "Black Han Sans",sans-serif}
.slip .vs{margin-top:6px;font:20px "Black Han Sans",system-ui,sans-serif;color:var(--ink);text-align:center}
.slip .credit{margin-top:8px;font-size:11px;color:var(--mute);text-align:center}.slip .open{margin-top:6px;font-size:13px;color:var(--accent);text-align:center}
/* HUD */
#hud{position:absolute;inset:0;pointer-events:none}
#hud.dim{opacity:.4}
#hud #beat,#hud #stats,#hud #gauge,#hud #combo,#hud #timer{transition:opacity .08s}
#hud.slow #beat,#hud.slow #stats,#hud.slow #combo,#hud.slow #timer{opacity:0}
#hud.final #stats,#hud.final #gauge,#hud.final #combo{opacity:0}
#hud.dark #beat,#hud.dark #stats,#hud.dark #gauge,#hud.dark #combo{opacity:0}#hud.dark #timer{opacity:.35}
#darkOv{position:absolute;inset:0;pointer-events:none;opacity:0;background:radial-gradient(ellipse 36% 14% at 50% 58%,rgba(0,0,0,.32) 0,rgba(0,0,0,.8) 45%,rgba(1,1,2,.982) 100%)}
.word.dark{color:#ffb347;-webkit-text-stroke:5px #2a1406}
#timer{position:absolute;left:50%;top:calc(env(safe-area-inset-top) + 14px);transform:translateX(-50%);font:38px "Black Han Sans",system-ui,sans-serif;white-space:nowrap;background:#fff;border-radius:999px;padding:2px 22px;box-shadow:0 3px 10px rgba(0,0,0,.2)}
#timer.warn{background:var(--accent);color:#fff}
#gauge{position:absolute;right:max(16px,env(safe-area-inset-right));top:calc(env(safe-area-inset-top) + 90px);width:16px;height:min(26vh,230px);border-radius:12px;background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.65);overflow:hidden}
#gauge::after{content:attr(data-label);position:absolute;right:0;left:auto;bottom:-24px;transform:none;text-align:right;font:13px "Black Han Sans",sans-serif;color:#fff;white-space:nowrap}
#gaugeFill{position:absolute;inset:0;transform-origin:bottom;transform:scaleY(0);background:linear-gradient(0deg,#ff6a00,#ffb000 60%,#fff1a8);transition:transform .25s cubic-bezier(.2,1.4,.4,1)}
#gauge.pulse{animation:gpulse .35s ease-out}
@keyframes gpulse{0%{transform:scale(1.25)}100%{transform:scale(1)}}
.ember{position:absolute;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:radial-gradient(circle,#fff8d0,#ffb000 45%,rgba(255,90,0,0) 70%);pointer-events:none;transition:left .35s cubic-bezier(.5,0,.8,.6),top .35s cubic-bezier(.2,.6,.4,1),opacity .35s}
#band{position:absolute;left:0;right:0;background:rgba(80,220,120,.55);border-top:2px solid #b6ffc9;border-bottom:2px solid #b6ffc9;display:none}
#gauge.egg #band{display:block}#gauge.egg #gaugeFill{background:linear-gradient(0deg,#8e4e20,#e7ac5c 45%,#fff3c4)}
#gauge{overflow:visible}#gaugeFill{border-radius:10px}
#stats{position:absolute;left:max(10px,env(safe-area-inset-left));top:calc(env(safe-area-inset-top) + 14px);display:flex;flex-direction:column;align-items:flex-start;gap:5px;font:19px "Black Han Sans","Malgun Gothic",system-ui,sans-serif;color:#fff}
#stats b{font-weight:400;background:rgba(14,16,19,.62);border-radius:9px;padding:2px 9px;letter-spacing:.02em}
#cookN.burnt{color:#ffb4a0}
#beat{position:absolute;left:50%;top:calc(env(safe-area-inset-top) + 70px);transform:translateX(-50%);width:min(62vw,260px);height:16px;border-radius:999px;background:rgba(255,255,255,.2);border:2px solid rgba(255,255,255,.7)}
#zone{position:absolute;top:0;bottom:0;background:#ffb000;border-radius:6px;transition:left .15s,width .15s,background .2s}
#beat.c3 #zone{background:#ff8a00}#beat.c5 #zone{background:#ff4d1a}
#needle{position:absolute;top:-6px;bottom:-6px;width:6px;margin-left:-3px;background:#fff;border-radius:3px;box-shadow:0 0 6px rgba(0,0,0,.6)}
#beat.in{box-shadow:0 0 16px 4px rgba(255,176,0,.9)}#beat.in #zone{background:#fff1a8}#beat.late #needle{background:#ff5a3c}
.num{position:absolute;font:30px "Black Han Sans",system-ui,sans-serif;pointer-events:none;-webkit-text-stroke:5px #fff;paint-order:stroke fill;animation:numUp .9s ease-out forwards}
.num.fire{right:40px;top:calc(env(safe-area-inset-top) + 120px);color:#E8481C}.num.rice{left:14px;top:calc(env(safe-area-inset-top) + 62px);color:#c81e1e;font-size:34px}
@keyframes numUp{0%{opacity:0;transform:scale(.5)}15%{opacity:1;transform:scale(1.3)}30%{transform:scale(1)}100%{opacity:0;transform:translateY(-30px)}}
.splat{position:absolute;pointer-events:none;transform:translate(-50%,-50%) rotate(var(--r));animation:splat .9s ease-in forwards}
.splat.rice{width:26px;height:11px;border-radius:50%;background:radial-gradient(ellipse at 40% 35%,#ffd2a8,#d9642a 70%);box-shadow:0 2px 4px rgba(0,0,0,.35)}
.splat.egg{border-radius:48% 52% 46% 54%/55% 50% 50% 45%;background:radial-gradient(circle at 36% 32%,#fff6 0 9%,#ffb21c 12%,#ff9a00 55%,#e07800 100%);box-shadow:0 3px 8px rgba(0,0,0,.25);animation:splatEgg 1.4s ease-in forwards}
@keyframes splat{0%{transform:translate(-50%,-50%) rotate(var(--r)) scale(1.8);opacity:0}12%{transform:translate(-50%,-50%) rotate(var(--r)) scale(1);opacity:1}70%{opacity:1}100%{transform:translate(-50%,calc(-50% + 40px)) rotate(var(--r));opacity:0}}
@keyframes splatEgg{0%{transform:translate(-50%,-50%) scale(1.4);opacity:0}6%{transform:translate(-50%,-50%) scale(1);opacity:1}40%{transform:translate(-50%,-50%) scale(1,1.05)}100%{transform:translate(-50%,calc(-50% + 50px)) scale(.92,1.25);opacity:0}}
#result .floor{margin:6px 0 0;font-size:15px;color:var(--red)}#result .floor b{font-size:20px}
#result .floor,#result .memo{text-wrap:balance;word-break:keep-all}
#result .memo{margin:8px 0 0;font:19px "Black Han Sans",system-ui,sans-serif;color:var(--red);transform:rotate(-2deg)}
#gauge.hot{box-shadow:0 0 18px 4px rgba(255,140,0,.85);border-color:#ffd27a}
.word{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom) + 14vh);transform:translateX(-50%);font:48px "Black Han Sans",system-ui,sans-serif;white-space:nowrap;-webkit-text-stroke:6px #fff;paint-order:stroke fill;opacity:0}
.word.great{color:#E8481C}.word.ok{color:#22995e}.word.meh{color:#1f2a33}.word.bad{color:#7a3b16}
.word.pop{animation:pop .95s ease-out forwards}
.word.great.pop{animation:popBig 1.05s ease-out forwards}
@keyframes pop{0%{opacity:0;transform:translateX(-50%) scale(.6)}14%{opacity:1;transform:translateX(-50%) scale(1.15)}26%{transform:translateX(-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translateX(-50%) translateY(-16px)}}
@keyframes popBig{0%{opacity:0;transform:translateX(-50%) scale(.5) rotate(-6deg)}12%{opacity:1;transform:translateX(-50%) scale(1.3) rotate(-4deg)}24%{transform:translateX(-50%) scale(1) rotate(-4deg)}82%{opacity:1}100%{opacity:0;transform:translateX(-50%) translateY(-20px) rotate(-4deg)}}
.sub{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom) + 21vh - 30px);transform:translateX(-50%);font:20px "Black Han Sans",system-ui,sans-serif;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.6);white-space:nowrap;opacity:0}
.sub.pop{animation:pop 1.1s ease-out forwards}
/* egg phase: the flipped wok and its handle reach down into the word line, so words sit in the empty space under the flip counter */
#hud[data-ph=egg] .word{bottom:auto;top:calc(env(safe-area-inset-top) + 15vh)}#hud[data-ph=egg] .sub{bottom:auto;top:calc(env(safe-area-inset-top) + 15vh + 62px)}
.combo{position:absolute;right:max(10px,env(safe-area-inset-right));top:calc(env(safe-area-inset-top) + 60px);font:18px "Black Han Sans",system-ui,sans-serif;color:#ffd27a;text-shadow:0 2px 6px rgba(0,0,0,.6)}
.combo.pop{animation:pulse .4s ease-out}
@keyframes pulse{0%{transform:scale(1.5)}100%{transform:scale(1)}}
#startCue{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top) + 13vh);display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.75);animation:scIn .3s ease-out}
#startCue b{font:34px "Black Han Sans",system-ui,sans-serif;background:rgba(20,16,12,.45);padding:4px 18px;border-radius:14px}
#startCue small{font:16px "Gowun Dodum",system-ui,sans-serif;opacity:.9}
#startCue .ico{display:block;width:30px;height:50px;border:4px solid #fff;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.5);animation:flickUp 1.2s ease-in-out infinite}
#startCue.touch .ico{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.85)}
#startCue.fast .ico{animation-duration:.6s}#startCue.intro .ico{display:none}
#startCue .lvl{display:none;position:relative;width:84px;height:84px;border-radius:50%;border:4px solid #fff;background:rgba(20,16,12,.45);transition:border-color .15s,background .15s}
#startCue.level .lvl{display:block}
#startCue .lvl::before{content:"";position:absolute;left:50%;top:50%;width:30px;height:30px;margin:-15px;border-radius:50%;border:2px dashed rgba(255,255,255,.7)}
#startCue .lvl i{position:absolute;left:50%;top:50%;width:22px;height:22px;margin:-11px;border-radius:50%;background:#ffd23a;box-shadow:0 0 8px rgba(0,0,0,.5)}
#startCue .lvl.ok{border-color:#5be37a;background:rgba(40,140,70,.45)}#startCue .lvl.ok i{background:#5be37a}
#startCue.level small{font-size:20px;font-family:"Black Han Sans",system-ui,sans-serif}#startCue.out{opacity:0;transition:opacity .15s}
@keyframes flickUp{0%,45%{transform:translateY(22px)}60%{transform:translateY(0)}75%,100%{transform:translateY(22px)}}
@keyframes scIn{from{opacity:0;transform:translateY(8px)}}
#tip{text-wrap:balance;font-size:clamp(15px,4.4vw,19px)!important;position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 62px);text-align:center;font:19px "Black Han Sans",system-ui,sans-serif;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.7);padding:0 16px;pointer-events:none}
/* receipt */
#result{position:absolute;left:50%;bottom:max(10px,env(safe-area-inset-bottom));transform:translate(-50%,110%);width:min(94vw,390px);transition:transform .5s cubic-bezier(.2,1.3,.4,1)}
#result.up{transform:translate(-50%,0)}
@media (max-height:740px){#result .slip{font-size:13px;padding:10px 14px 8px}#result .why,#result .credit{display:none}#result .slip ul{margin:4px 0}#result .tot .score b{font-size:54px}#result .btn{min-height:42px;padding:8px 20px}}
.slip{background:#fffdf6;border-radius:6px 6px 14px 14px;padding:14px 16px 12px;box-shadow:0 -6px 30px rgba(0,0,0,.35);position:relative;font-family:"Nanum Gothic Coding",monospace}
.slip .shop{font:26px "Black Han Sans",system-ui,sans-serif;text-align:center}
.slip .meta{text-align:center;font-size:12px;color:var(--mute);margin-bottom:6px}
.slip ul{list-style:none;margin:0;padding:6px 0;border-top:1.5px dashed #d8cbb0;border-bottom:1.5px dashed #d8cbb0;font-size:13.5px}
.slip li{display:flex;justify-content:space-between;padding:1.5px 0}
.slip .tot{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.slip .score{font:50px "Black Han Sans",system-ui,sans-serif;color:var(--accent)}.slip .score small{font-size:20px}
.stamp{font:20px "Black Han Sans",system-ui,sans-serif;color:var(--red);border:3px solid var(--red);border-radius:8px;padding:2px 8px;transform:rotate(-8deg);opacity:0}
.stamp.pop{animation:stamp .38s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes stamp{0%{transform:rotate(-8deg) scale(2.4);opacity:0}100%{transform:rotate(-8deg) scale(1);opacity:1}}
.slip .why{font-size:12px;color:var(--mute);margin-top:4px;min-height:1em}
.slip .near{font:16px "Black Han Sans",system-ui,sans-serif;color:var(--accent);text-align:right}
.slip .rec{position:absolute;right:14px;top:12px;font:16px "Black Han Sans",sans-serif;color:#fff;background:var(--red);border-radius:6px;padding:2px 8px;transform:rotate(8deg)}
.row{display:flex;gap:8px;justify-content:center;align-items:center;margin-top:8px}
#shareOv{position:absolute;inset:0;background:rgba(15,18,21,.96);z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#fff;font-size:15px;padding:20px}
#shareOv img{max-width:86vw;max-height:62vh;border-radius:8px}
#shareOv .link{display:flex;align-items:center;gap:8px;max-width:92vw}#shareOv #shareUrl{font-size:13px;word-break:break-all;-webkit-user-select:text;user-select:text;background:rgba(255,255,255,.1);padding:6px 8px;border-radius:6px}
#shareOv #shareCopy{font-size:15px;min-height:40px;padding:6px 14px;white-space:nowrap}#shareOv .close{opacity:.6;font-size:13px}
@media (prefers-reduced-motion:reduce){.word.pop,.word.great.pop,.sub.pop,.stamp.pop{animation-duration:.01s}}
</style>
</head>
<body>
<div id="app">
  <canvas id="cv" aria-label="웍 화면"></canvas>
  <div id="darkOv"></div>
  <div id="hud" hidden>
    <div id="timer">12.0</div>
    <div id="gauge" aria-label="불맛" data-label="불맛 0"><div id="gaugeFill"></div><div id="band"></div></div>
    <div id="stats"><b id="riceN">밥 100%</b><b id="cookN">익힘 0%</b></div>
    <div id="beat" hidden><i id="zone"></i><i id="needle"></i></div>
    <div id="combo" class="combo"></div>
    <div id="word" class="word"></div>
    <div id="sub" class="sub"></div>
  </div>
  <div id="tip" hidden></div>
  <div id="startCue" hidden><b id="scBig"></b><small id="scSmall"></small><div class="lvl"><i id="lvlDot"></i></div><i class="ico"></i></div>
  <div id="intro">
    <h1>김치볶음밥<br>한 그릇</h1>
    <p class="hook" id="hook"></p>
    <p class="best" id="best"></p>
    <p class="how" id="how"></p>
    <button id="go" class="btn" type="button" disabled></button>
    <button id="watch" class="btn ghost" type="button"></button>
  </div>
  <a id="back" href="../../../">‹ 시켜본 것들</a>
  <button id="home" type="button" aria-label="첫 화면" hidden>⌂</button>
  <button id="mute" type="button" aria-label="소리 끄기">🔊</button>
  <div id="noGL" hidden><b>이 브라우저에선 3D가 안 돼요</b><span>Safari나 Chrome에서 열어 주세요</span></div>
  <div id="result" hidden></div>
  <div id="shareOv" hidden><img alt="결과 이미지"><div>이 링크를 보내면 내 점수 영수증이 미리보기로 떠요</div><div class="link"><span id="shareUrl"></span><button id="shareCopy" class="btn" type="button">링크 복사</button></div><div class="close">빈 곳을 탭하면 닫혀요</div></div>
</div>
<script src="js/three.min.js"></script>
<script src="js/copy.js"></script>
<script src="js/scene.js"></script>
<script src="js/audio.js"></script>
<script src="js/input.js"></script>
<script src="js/food.js"></script>
<script src="js/egg.js"></script>
<script src="js/game.js"></script>
</body>
</html>
