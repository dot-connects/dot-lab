<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>김치볶음밥 한 그릇 · D:OT lab</title>
<meta name="description" content="폰이 웍이다. 휙 튕겨서 김치볶음밥을 볶고, 계란을 뒤집어 얹어 한 그릇 점수를 받는다.">
<meta property="og:title" content="김치볶음밥 한 그릇">
<meta property="og:description" content="폰을 웍처럼 튕겨서 볶아 봐. 불맛 장인 될 수 있어?">
<meta name="theme-color" content="#1b1f24">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gowun+Dodum&family=Nanum+Gothic+Coding:wght@400;700&display=swap">
<style>
:root{--ink:#1f2a33;--paper:#fbf6ea;--accent:#E8481C;--mute:#5b6670;--red:#c81e1e}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#1b1f24;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
[hidden]{display:none!important}
#app{position:fixed;inset:0;touch-action:none;font-family:"Gowun Dodum",system-ui,sans-serif;color:var(--ink)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:18px "Black Han Sans",system-ui,sans-serif;letter-spacing:.02em;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.btn{border-radius:999px;padding:13px 26px;min-height:50px;background:var(--accent);color:#fff;box-shadow:0 5px 0 #9a3412,0 10px 18px rgba(0,0,0,.2);transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #9a3412}
.btn.ghost{background:transparent;box-shadow:none;color:var(--mute);font-size:15px;min-height:40px;padding:6px 12px;text-decoration:underline}
.btn:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
/* start screen */
#intro{position:absolute;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(92vw,380px);background:var(--paper);border-radius:20px;
  padding:20px 18px 12px;box-shadow:0 18px 50px rgba(0,0,0,.45);text-align:center;display:flex;flex-direction:column;gap:10px}
#intro h1{margin:0;font:42px/1.02 "Black Han Sans",system-ui,sans-serif;color:var(--accent);text-wrap:balance}
#intro .hook{margin:0;font-size:16px;color:var(--ink)}
#intro .how{margin:0;font-size:14.5px;line-height:1.55;color:var(--mute)}
#intro .how b{color:var(--ink)}
.seg{display:flex;justify-content:center;gap:6px;align-items:center}
.seg span{font-size:13px;color:var(--mute);margin-right:2px}
.seg button{font-size:15px;padding:7px 14px;border-radius:999px;background:#ece4d2;color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
/* HUD */
#hud{position:absolute;inset:0;pointer-events:none}
#hud.dim{opacity:.4}
#timer{position:absolute;left:50%;top:calc(env(safe-area-inset-top) + 14px);transform:translateX(-50%);font:38px "Black Han Sans",system-ui,sans-serif;background:#fff;border-radius:999px;padding:2px 22px;box-shadow:0 3px 10px rgba(0,0,0,.2)}
#timer.warn{background:var(--accent);color:#fff}
#gauge{position:absolute;right:max(10px,env(safe-area-inset-right));top:calc(env(safe-area-inset-top) + 76px);width:16px;height:min(26vh,230px);border-radius:12px;background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.65);overflow:hidden}
#gauge::after{content:"불맛";position:absolute;left:50%;bottom:-24px;transform:translateX(-50%);font:13px "Black Han Sans",sans-serif;color:#fff;white-space:nowrap}
#gaugeFill{position:absolute;inset:0;transform-origin:bottom;transform:scaleY(0);background:linear-gradient(0deg,#ff6a00,#ffb000 60%,#fff1a8);transition:transform .25s cubic-bezier(.2,1.4,.4,1)}
#gauge.pulse{animation:gpulse .35s ease-out}
@keyframes gpulse{0%{transform:scale(1.25)}100%{transform:scale(1)}}
.ember{position:absolute;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:radial-gradient(circle,#fff8d0,#ffb000 45%,rgba(255,90,0,0) 70%);pointer-events:none;transition:left .35s cubic-bezier(.5,0,.8,.6),top .35s cubic-bezier(.2,.6,.4,1),opacity .35s}
#gauge.hot{box-shadow:0 0 18px 4px rgba(255,140,0,.85);border-color:#ffd27a}
.word{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom) + 21vh);transform:translateX(-50%);font:48px "Black Han Sans",system-ui,sans-serif;white-space:nowrap;-webkit-text-stroke:6px #fff;paint-order:stroke fill;opacity:0}
.word.great{color:#E8481C}.word.ok{color:#22995e}.word.meh{color:#1f2a33}.word.bad{color:#7a3b16}
.word.pop{animation:pop .95s ease-out forwards}
.word.great.pop{animation:popBig 1.05s ease-out forwards}
@keyframes pop{0%{opacity:0;transform:translateX(-50%) scale(.6)}14%{opacity:1;transform:translateX(-50%) scale(1.15)}26%{transform:translateX(-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translateX(-50%) translateY(-16px)}}
@keyframes popBig{0%{opacity:0;transform:translateX(-50%) scale(.5) rotate(-6deg)}12%{opacity:1;transform:translateX(-50%) scale(1.3) rotate(-4deg)}24%{transform:translateX(-50%) scale(1) rotate(-4deg)}82%{opacity:1}100%{opacity:0;transform:translateX(-50%) translateY(-20px) rotate(-4deg)}}
.sub{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom) + 21vh - 30px);transform:translateX(-50%);font:20px "Black Han Sans",system-ui,sans-serif;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.6);white-space:nowrap;opacity:0}
.sub.pop{animation:pop 1.1s ease-out forwards}
.combo{position:absolute;right:max(10px,env(safe-area-inset-right));top:calc(env(safe-area-inset-top) + 60px);font:18px "Black Han Sans",system-ui,sans-serif;color:#ffd27a;text-shadow:0 2px 6px rgba(0,0,0,.6)}
.combo.pop{animation:pulse .4s ease-out}
@keyframes pulse{0%{transform:scale(1.5)}100%{transform:scale(1)}}
#startCue{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top) + 13vh);display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.75);animation:scIn .3s ease-out}
#startCue b{font:34px "Black Han Sans",system-ui,sans-serif;background:rgba(20,16,12,.45);padding:4px 18px;border-radius:14px}
#startCue small{font:16px "Gowun Dodum",system-ui,sans-serif;opacity:.9}
#startCue .ico{display:block;width:30px;height:50px;border:4px solid #fff;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.5);animation:flickUp 1.2s ease-in-out infinite}
#startCue.touch .ico{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.85)}
#startCue.fast .ico{animation-duration:.6s}#startCue.out{opacity:0;transition:opacity .15s}
@keyframes flickUp{0%,45%{transform:translateY(22px)}60%{transform:translateY(0)}75%,100%{transform:translateY(22px)}}
@keyframes scIn{from{opacity:0;transform:translateY(8px)}}
#tip{position:absolute;left:0;right:0;bottom:max(22px,env(safe-area-inset-bottom));text-align:center;font:19px "Black Han Sans",system-ui,sans-serif;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.7);padding:0 16px;pointer-events:none}
/* receipt */
#result{position:absolute;left:50%;bottom:max(10px,env(safe-area-inset-bottom));transform:translate(-50%,110%);width:min(94vw,390px);transition:transform .5s cubic-bezier(.2,1.3,.4,1)}
#result.up{transform:translate(-50%,0)}
.slip{background:#fffdf6;border-radius:6px 6px 14px 14px;padding:14px 16px 12px;box-shadow:0 -6px 30px rgba(0,0,0,.35);position:relative;font-family:"Nanum Gothic Coding",monospace}
.slip .shop{font:26px "Black Han Sans",system-ui,sans-serif;text-align:center}
.slip .meta{text-align:center;font-size:12px;color:var(--mute);margin-bottom:6px}
.slip ul{list-style:none;margin:0;padding:6px 0;border-top:1.5px dashed #d8cbb0;border-bottom:1.5px dashed #d8cbb0;font-size:13.5px}
.slip li{display:flex;justify-content:space-between;padding:1.5px 0}
.slip .tot{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.slip .score{font:50px "Black Han Sans",system-ui,sans-serif;color:var(--accent)}.slip .score small{font-size:20px}
.stamp{font:20px "Black Han Sans",system-ui,sans-serif;color:var(--red);border:3px solid var(--red);border-radius:8px;padding:2px 8px;transform:rotate(-8deg);opacity:0}
.stamp.pop{animation:stamp .38s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes stamp{0%{transform:rotate(-8deg) scale(2.4);opacity:0}100%{transform:rotate(-8deg) scale(1);opacity:1}}
.slip .why{font-size:12px;color:var(--mute);margin-top:4px;min-height:1em}
.slip .near{font:16px "Black Han Sans",system-ui,sans-serif;color:var(--accent);text-align:right}
.slip .rec{position:absolute;right:14px;top:12px;font:16px "Black Han Sans",sans-serif;color:#fff;background:var(--red);border-radius:6px;padding:2px 8px;transform:rotate(8deg)}
.row{display:flex;gap:8px;justify-content:center;align-items:center;margin-top:8px}
#shareOv{position:absolute;inset:0;background:rgba(15,18,21,.96);z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#fff;font-size:15px;padding:20px}
#shareOv img{max-width:86vw;max-height:72vh;border-radius:8px}
@media (prefers-reduced-motion:reduce){.word.pop,.word.great.pop,.sub.pop,.stamp.pop{animation-duration:.01s}}
</style>
</head>
<body>
<div id="app">
  <canvas id="cv" aria-label="웍 화면"></canvas>
  <div id="hud" hidden>
    <div id="timer">12.0</div>
    <div id="gauge" aria-label="불맛"><div id="gaugeFill"></div></div>
    <div id="combo" class="combo"></div>
    <div id="word" class="word"></div>
    <div id="sub" class="sub"></div>
  </div>
  <div id="tip" hidden></div>
  <div id="startCue" hidden><b id="scBig"></b><small id="scSmall"></small><i class="ico"></i></div>
  <div id="intro">
    <h1>김치볶음밥<br>한 그릇</h1>
    <p class="hook" id="hook"></p>
    <p class="how" id="how"></p>
    <div class="seg"><span>그림</span><button data-style="real" aria-pressed="true">실사</button><button data-style="toy">장난감</button></div>
    <button id="go" class="btn" type="button"></button>
    <button id="watch" class="btn ghost" type="button"></button>
  </div>
  <div id="result" hidden></div>
  <div id="shareOv" hidden><img alt="결과 이미지"><div>이미지를 길게 눌러 저장하세요 · 탭하면 닫혀요</div></div>
</div>
<script src="js/three.min.js"></script>
<script src="js/copy.js"></script>
<script src="js/scene.js"></script>
<script src="js/audio.js"></script>
<script src="js/input.js"></script>
<script src="js/food.js"></script>
<script src="js/egg.js"></script>
<script src="js/game.js"></script>
</body>
</html>
